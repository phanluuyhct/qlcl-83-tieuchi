.4", "tm": "TM9", "muc": "Mức 3", "noidung": "Có xây dựng các tiêu chí cụ thể về tăng lương, khen thưởng, bổ nhiệm, kỷ luật… nhân viên và công bố công khai cho toàn thể nhân viên được biết.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B3.4_TM10", "tc": "TC29", "ma": "B3.4", "tm": "TM10", "muc": "Mức 4", "noidung": "Bệnh viện thực hiện bổ nhiệm cho nhân viên y tế theo đúng quy trình và dựa trên các tiêu chí của bệnh viện đã ban hành.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B3.4_TM11", "tc": "TC29", "ma": "B3.4", "tm": "TM11", "muc": "Mức 4", "noidung": "Có phòng thư viện lưu trữ các sách/tạp chí y học, văn bản, thư viện điện tử… và tạo điều kiện cho nhân viên y tế tiếp cận thường xuyên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B3.4_TM12", "tc": "TC29", "ma": "B3.4", "tm": "TM12", "muc": "Mức 4", "noidung": "Khảo sát ngẫu nhiên trên 7 người có ít nhất 5 người cho biết nhân viên y tế được làm việc trong môi trường thân thiện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B3.4_TM13", "tc": "TC29", "ma": "B3.4", "tm": "TM13", "muc": "Mức 4", "noidung": "Khảo sát ngẫu nhiên trên 7 người có ít nhất 5 người cho biết nhân viên được lãnh đạo trực tiếp quan tâm, tôn trọng và đối xử bình đẳng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B3.4_TM14", "tc": "TC29", "ma": "B3.4", "tm": "TM14", "muc": "Mức 4", "noidung": "Có tiến hành khảo sát sự hài lòng của nhân viên y tế về môi trường làm việc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B3.4_TM15", "tc": "TC29", "ma": "B3.4", "tm": "TM15", "muc": "Mức 5", "noidung": "Thực hiện khen thưởng, bổ nhiệm công bằng cho đúng các đối tượng hoạt động thực sự tích cực, hiệu quả (không dựa trên phân bổ chỉ tiêu khen thưởng, bổ nhiệm theo cơ cấu).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B3.4_TM16", "tc": "TC29", "ma": "B3.4", "tm": "TM16", "muc": "Mức 5", "noidung": "Kết quả khảo sát sự hài lòng nhân viên y tế chỉ ra được những vấn đề nhân viên y tế chưa hài lòng về môi trường làm việc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B3.4_TM17", "tc": "TC29", "ma": "B3.4", "tm": "TM17", "muc": "Mức 5", "noidung": "Xây dựng các giải pháp cải tiến môi trường làm việc tích cực và nâng cao trình độ chuyên môn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B3.4_TM18", "tc": "TC29", "ma": "B3.4", "tm": "TM18", "muc": "Mức 5", "noidung": "Áp dụng các kết quả khảo sát và triển khai các giải pháp can thiệp vào việc cải tiến, tạo dựng môi trường làm việc tích cực cho nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.1_TM1", "tc": "TC30", "ma": "B4.1", "tm": "TM1", "muc": "Mức 1", "noidung": "Không có bản kế hoạch phát triển bệnh viện trong giai đoạn 5 năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.1_TM2", "tc": "TC30", "ma": "B4.1", "tm": "TM2", "muc": "Mức 2", "noidung": "Đã xây dựng kế hoạch phát triển bệnh viện (trong đó có kế hoạch phát triển khoa, phòng) và được cấp có thẩm quyền phê duyệt.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.1_TM3", "tc": "TC30", "ma": "B4.1", "tm": "TM3", "muc": "Mức 2", "noidung": "Công bố công khai bản kế hoạch đã xây dựng cho nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.1_TM4", "tc": "TC30", "ma": "B4.1", "tm": "TM4", "muc": "Mức 3", "noidung": "Trong kế hoạch phát triển tổng thể có kế hoạch cụ thể theo từng giai đoạn (giai đoạn ngắn hạn 1, 2 năm, giai đoạn dài hạn 5 năm hoặc trên 5 năm).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.1_TM5", "tc": "TC30", "ma": "B4.1", "tm": "TM5", "muc": "Mức 3", "noidung": "Trong bản kế hoạch phát triển tổng thể có các chỉ số đích, mốc thời gian đạt được cụ thể và lộ trình thực hiện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.1_TM6", "tc": "TC30", "ma": "B4.1", "tm": "TM6", "muc": "Mức 3", "noidung": "Trong bản kế hoạch phát triển tổng thể có các giải pháp cụ thể và nguồn lực để đạt được mục tiêu đề ra.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.1_TM7", "tc": "TC30", "ma": "B4.1", "tm": "TM7", "muc": "Mức 3", "noidung": "Đã xây dựng kế hoạch hoạt động chi tiết hằng năm căn cứ vào kế hoạch.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.1_TM8", "tc": "TC30", "ma": "B4.1", "tm": "TM8", "muc": "Mức 3", "noidung": "Đã triển khai thực hiện theo các kế hoạch ngắn hạn và dài hạn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.1_TM9", "tc": "TC30", "ma": "B4.1", "tm": "TM9", "muc": "Mức 4", "noidung": "Tiến hành đo lường các chỉ số trong bản kế hoạch phát triển.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.1_TM10", "tc": "TC30", "ma": "B4.1", "tm": "TM10", "muc": "Mức 4", "noidung": "Có bản danh mục kết quả thực hiện các chỉ số trong bản kế hoạch theo năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.1_TM11", "tc": "TC30", "ma": "B4.1", "tm": "TM11", "muc": "Mức 4", "noidung": "Đã triển khai đầy đủ các nội dung trong kế hoạch ngắn hạn và dài hạn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.1_TM12", "tc": "TC30", "ma": "B4.1", "tm": "TM12", "muc": "Mức 4", "noidung": "Có sơ kết, đánh giá việc triển khai, thực hiện kế hoạch phát triển.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.1_TM13", "tc": "TC30", "ma": "B4.1", "tm": "TM13", "muc": "Mức 4", "noidung": "Có xác định những nội dung chưa thực hiện được theo đúng kế hoạch và xây dựng giải pháp khắc phục.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.1_TM14", "tc": "TC30", "ma": "B4.1", "tm": "TM14", "muc": "Mức 4", "noidung": "Có xác định những nội dung không khả thi và đề xuất điều chỉnh kế hoạch.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.1_TM15", "tc": "TC30", "ma": "B4.1", "tm": "TM15", "muc": "Mức 5", "noidung": "Triển khai các giải pháp khắc phục và huy động các nguồn lực để thực hiện những nội dung chưa hoàn thành theo đúng kế hoạch.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.1_TM16", "tc": "TC30", "ma": "B4.1", "tm": "TM16", "muc": "Mức 5", "noidung": "Điều chỉnh kế hoạch dựa trên kết quả đánh giá việc triển khai thực hiện, đặc biệt điều chỉnh những nội dung không hoặc ít tính khả thi.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.1_TM17", "tc": "TC30", "ma": "B4.1", "tm": "TM17", "muc": "Mức 5", "noidung": "Đã xây dựng chiến lược phát triển bệnh viện, trong đó xác định những vấn đề ưu tiên, xác định các lĩnh vực, chuyên khoa mũi nhọn, mở rộng quy mô, nâng cấp bệnh viện; thực hiện được các kỹ thuật cao, chuyên sâu; phát triển thành cơ sở đào tạo, trung tâm điều trị của vùng…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.1_TM18", "tc": "TC30", "ma": "B4.1", "tm": "TM18", "muc": "Mức 5", "noidung": "Công bố công khai chiến lược phát triển đã xây dựng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.1_TM19", "tc": "TC30", "ma": "B4.1", "tm": "TM19", "muc": "Mức 5", "noidung": "Huy động các nguồn lực và thực hiện đầu tư cho các lĩnh vực theo chiến lược phát triển bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Trần Thị Mỹ Trúc"}, {"id": "B4.2_TM1", "tc": "TC31", "ma": "B4.2", "tm": "TM1", "muc": "Mức 1", "noidung": "Không phân công cho một nhân viên đầu mối tiếp nhận và cập nhật các văn bản có liên quan đến hoạt động bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Kim Huệ"}, {"id": "B4.2_TM2", "tc": "TC31", "ma": "B4.2", "tm": "TM2", "muc": "Mức 1", "noidung": "Phát hiện thấy bệnh viện không cập nhật một hoặc nhiều văn bản chỉ đạo của Bộ Y tế mang tính bắt buộc thực hiện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Kim Huệ"}, {"id": "B4.2_TM3", "tc": "TC31", "ma": "B4.2", "tm": "TM3", "muc": "Mức 2", "noidung": "Có nhân viên đầu mối chịu trách nhiệm tiếp nhận và cập nhật các văn bản chỉ đạo có liên quan đến hoạt động bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Kim Huệ"}, {"id": "B4.2_TM4", "tc": "TC31", "ma": "B4.2", "tm": "TM4", "muc": "Mức 2", "noidung": "Có quy trình tiếp nhận, phân loại và phân công người xử lý văn bản, trong đó có quy định rõ thời gian, hình thức xử lý văn bản.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Kim Huệ"}, {"id": "B4.2_TM5", "tc": "TC31", "ma": "B4.2", "tm": "TM5", "muc": "Mức 2", "noidung": "Quy trình tiếp nhận, phân loại và phân công người xử lý văn bản đã được ban giám đốc phê duyệt.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Kim Huệ"}, {"id": "B4.2_TM6", "tc": "TC31", "ma": "B4.2", "tm": "TM6", "muc": "Mức 2", "noidung": "Đã triển khai thực hiện các văn bản chỉ đạo dành cho bệnh viện do các cấp quản lý có thẩm quyền ban hành đến lãnh đạo bệnh viện, lãnh đạo các phòng chức năng và lãnh đạo các khoa lâm sàng, cận lâm sàng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Kim Huệ"}, {"id": "B4.2_TM7", "tc": "TC31", "ma": "B4.2", "tm": "TM7", "muc": "Mức 3", "noidung": "Có bảng danh sách thống kê các văn bản chỉ đạo của Bộ Y tế, Cục Quản lý Khám, chữa bệnh, Sở Y tế và cơ quan chính quyền khác trong năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Kim Huệ"}, {"id": "B4.2_TM8", "tc": "TC31", "ma": "B4.2", "tm": "TM8", "muc": "Mức 3", "noidung": "Không có tình trạng có văn bản đến nhưng không được lãnh đạo xử lý.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Kim Huệ"}, {"id": "B4.2_TM9", "tc": "TC31", "ma": "B4.2", "tm": "TM9", "muc": "Mức 3", "noidung": "Đã phổ biến các văn bản chỉ đạo tới cán bộ, công chức, viên chức và người lao động có liên quan đến văn bản.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Kim Huệ"}, {"id": "B4.2_TM10", "tc": "TC31", "ma": "B4.2", "tm": "TM10", "muc": "Mức 3", "noidung": "Có xây dựng quy trình cụ thể triển khai thực hiện các văn bản chỉ đạo (quy trình triển khai gồm các bước: phổ biến văn bản, xây dựng kế hoạch thực hiện văn bản, kiểm tra nội bộ việc thực hiện văn bản).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Kim Huệ"}, {"id": "B4.2_TM11", "tc": "TC31", "ma": "B4.2", "tm": "TM11", "muc": "Mức 4", "noidung": "Đã triển khai thực hiện các hoạt động cụ thể đáp ứng yêu cầu của văn bản chỉ đạo (bệnh viện cung cấp bằng chứng cho một số văn bản ví dụ đã triển khai).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Kim Huệ"}, {"id": "B4.2_TM12", "tc": "TC31", "ma": "B4.2", "tm": "TM12", "muc": "Mức 4", "noidung": "Có tiến hành rà soát định kỳ tiến độ triển khai văn bản chỉ đạo.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Kim Huệ"}, {"id": "B4.2_TM13", "tc": "TC31", "ma": "B4.2", "tm": "TM13", "muc": "Mức 4", "noidung": "Áp dụng phần mềm tin học văn phòng (excel) hoặc phần mềm chuyên dụng để quản lý và triển khai văn bản.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Kim Huệ"}, {"id": "B4.2_TM14", "tc": "TC31", "ma": "B4.2", "tm": "TM14", "muc": "Mức 5", "noidung": "Áp dụng phần mềm chuyên dụng quản lý văn bản điện tử, văn bản được gửi tới ngay tất cả các đối tượng nhận văn bản để thực hiện thông qua hệ thống phần mềm sau khi văn bản được lãnh đạo bệnh viện tiếp nhận và xử lý.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Kim Huệ"}, {"id": "B4.2_TM15", "tc": "TC31", "ma": "B4.2", "tm": "TM15", "muc": "Mức 5", "noidung": "Có tiến hành rà soát việc phổ biến và triển khai thực hiện văn bản chỉ đạo.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Kim Huệ"}, {"id": "B4.2_TM16", "tc": "TC31", "ma": "B4.2", "tm": "TM16", "muc": "Mức 5", "noidung": "Áp dụng kết quả đánh giá để cải tiến chất lượng việc triển khai thực hiện văn bản chỉ đạo hoặc đề xuất sửa đổi bất cập của văn bản với cơ quan quản lý.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Kim Huệ"}, {"id": "B4.3_TM1", "tc": "TC32", "ma": "B4.3", "tm": "TM1", "muc": "Mức 1", "noidung": "Có đơn thư khiếu nại, tố cáo gửi tới các cơ quan quản lý về việc tuyển dụng, bổ nhiệm người quản lý bệnh viện, khoa/phòngvi phạm các quy định hiện hành (đã xác minh và phát hiện sai phạm).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.3_TM2", "tc": "TC32", "ma": "B4.3", "tm": "TM2", "muc": "Mức 1", "noidung": "Không có tiêu chuẩn, quy trình tuyển dụng, bổ nhiệm đội ngũ quản lý bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.3_TM3", "tc": "TC32", "ma": "B4.3", "tm": "TM3", "muc": "Mức 2", "noidung": "Xây dựng các tiêu chuẩn, tiêu chí (hoặc yêu cầu tối thiểu) cho các vị trí quản lý bệnh viện, khoa, phòng và công bố công khai cho nhân viên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.3_TM4", "tc": "TC32", "ma": "B4.3", "tm": "TM4", "muc": "Mức 2", "noidung": "Xây dựng các quy trình tuyển dụng, bổ nhiệm cho các vị trí quản lý bệnh viện, khoa, phòng và công bố công khai cho nhân viên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.3_TM5", "tc": "TC32", "ma": "B4.3", "tm": "TM5", "muc": "Mức 2", "noidung": "Tỷ lệ “người quản lý” đã tham gia khóa đào tạo liên tục và có chứng chỉ về quản lý bệnh viện chiếm từ 20% trở lên**(chứng chỉ bảo đảm quy định về đào tạo liên tục tại Thông tư 22/2013/TT-BYT).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.3_TM6", "tc": "TC32", "ma": "B4.3", "tm": "TM6", "muc": "Mức 3", "noidung": "Thực hiện tuyển dụng, bổ nhiệm các vị trí quản lý trong bệnh viện theo đúng tiêu chuẩn và quy trình đã đề ra.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.3_TM7", "tc": "TC32", "ma": "B4.3", "tm": "TM7", "muc": "Mức 3", "noidung": "Tỷ lệ “người quản lý” sử dụng thành thạo máy tính, các phần mềm tin học văn phòng, văn bản điện tử và thư điện tử đạt 100%.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.3_TM8", "tc": "TC32", "ma": "B4.3", "tm": "TM8", "muc": "Mức 3", "noidung": "Tỷ lệ “người quản lý” có thể giao tiếp thông thường bằng tiếng Anh (hoặc có chứng chỉ Anh văn B trở lên) chiếm ít nhất 50% tổng số “người quản lý” của bệnh viện (nếu giao tiếp được bằng tiếng dân tộc với đồng bào địa phương được tính như ngoại ngữ tiếng Anh hoặc có ngoại ngữ khác tương đương).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.3_TM9", "tc": "TC32", "ma": "B4.3", "tm": "TM9", "muc": "Mức 3", "noidung": "Tỷ lệ “người quản lý” đã tham gia khóa đào tạo liên tục và có chứng chỉ về quản lý bệnh viện chiếm từ 40% trở lên*.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.3_TM10", "tc": "TC32", "ma": "B4.3", "tm": "TM10", "muc": "Mức 4", "noidung": "Tỷ lệ “người quản lý” có thể giao tiếp thông thường bằng tiếng Anh (hoặc có chứng chỉ Anh văn B trở lên) chiếm ít nhất 70% tổng số “người quản lý” của bệnh viện (nếu giao tiếp được bằng tiếng dân tộc với đồng bào địa phương được tính như ngoại ngữ tiếng Anh hoặc có ngoại ngữ khác tương đương).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.3_TM11", "tc": "TC32", "ma": "B4.3", "tm": "TM11", "muc": "Mức 4", "noidung": "Tỷ lệ “người quản lý” đã tham gia khóa đào tạo liên tục và có chứng chỉ về quản lý bệnh viện chiếm từ 60% trở lên*.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.3_TM12", "tc": "TC32", "ma": "B4.3", "tm": "TM12", "muc": "Mức 4", "noidung": "Thí điểm hình thức thi tuyển (như trình bày kế hoạch phát triển) các vị trí lãnh đạo, quản lý của bệnh viện, có sự giám sát công khai của cơ quan quản lý, đại diện “người quản lý”,  ban thanh tra nhân dân, đại diện nhân viên …", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.4_TM1", "tc": "TC33", "ma": "B4.4", "tm": "TM1", "muc": "Mức 1", "noidung": "Không có quy hoạch cho vị trí lãnh đạo và quản lý.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.4_TM2", "tc": "TC33", "ma": "B4.4", "tm": "TM2", "muc": "Mức 2", "noidung": "Có quy hoạch vị trí lãnh đạo và quản lý.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.4_TM3", "tc": "TC33", "ma": "B4.4", "tm": "TM3", "muc": "Mức 2", "noidung": "Xây dựng kế hoạch đào tạo dựa trên quy hoạch cán bộ lãnh đạo, quản lý đã được phê duyệt.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.4_TM4", "tc": "TC33", "ma": "B4.4", "tm": "TM4", "muc": "Mức 3", "noidung": "Tiến hành bổ nhiệm vị trí lãnh đạo và quản lý theo đúng quy hoạch.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.4_TM5", "tc": "TC33", "ma": "B4.4", "tm": "TM5", "muc": "Mức 3", "noidung": "Có tổ chức bàn giao công việc giữa các vị trí lãnh đạo và những công việc chưa hoàn thành.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.4_TM6", "tc": "TC33", "ma": "B4.4", "tm": "TM6", "muc": "Mức 3", "noidung": "Giám đốc mới được bổ nhiệm trong vòng 1 năm sau khi giám đốc cũ nghỉ quản lý hoặc chuyển nhiệm vụ mới.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.4_TM7", "tc": "TC33", "ma": "B4.4", "tm": "TM7", "muc": "Mức 4", "noidung": "Xây dựng kế hoạch tuyển chọn, bồi dưỡng đội ngũ lãnh đạo kế cận.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.4_TM8", "tc": "TC33", "ma": "B4.4", "tm": "TM8", "muc": "Mức 4", "noidung": "Đã bổ nhiệm các vị trí lãnh đạo theo quy định và theo quy hoạch của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.4_TM9", "tc": "TC33", "ma": "B4.4", "tm": "TM9", "muc": "Mức 4", "noidung": "Có kế hoạch và cử viên chức, nhân viên trong diện quy hoạch đi đào tạo nâng cao năng lực quản lý bệnh viện, quản lý chất lượng, kinh tế y tế…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.4_TM10", "tc": "TC33", "ma": "B4.4", "tm": "TM10", "muc": "Mức 5", "noidung": "Các viên chức, nhân viên trong diện quy hoạch có trình độ quản lý, ngoại ngữ đáp ứng yêu cầu vị trí quản lý và có thể thay thế lãnh đạo, quản lý đương nhiệm ngay lập tức khi cần thiết hoặc trong tình huống khẩn cấp.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B4.4_TM11", "tc": "TC33", "ma": "B4.4", "tm": "TM11", "muc": "Mức 5", "noidung": "Vị trí giám đốc được phát triển từ nguồn nhân lực của bệnh viện, trong diện quy hoạch của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "C1.1_TM1", "tc": "TC34", "ma": "C1.1", "tm": "TM1", "muc": "Mức 1", "noidung": "Không có đủ bảo vệ trực 24/24 giờ theo phương án bảo vệ của bệnh viện (phát hiện thấy bảo vệ bỏ trực trong ca làm việc…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM2", "tc": "TC34", "ma": "C1.1", "tm": "TM2", "muc": "Mức 1", "noidung": "Có vụ việc bảo vệ bệnh viện xô xát người bệnh, người nhà người bệnh và nhân viên y tế, ảnh hưởng nghiêm trọng đến uy tín của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM3", "tc": "TC34", "ma": "C1.1", "tm": "TM3", "muc": "Mức 2", "noidung": "Có đủ bảo vệ trực 24/24 giờ theo phương án bảo vệ của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM4", "tc": "TC34", "ma": "C1.1", "tm": "TM4", "muc": "Mức 2", "noidung": "Bệnh viện có xây dựng phương án, kế hoạch bảo vệ, trong đó có nêu số lượng người, vị trí cần bảo vệ, tần suất đi tuần…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM5", "tc": "TC34", "ma": "C1.1", "tm": "TM5", "muc": "Mức 2", "noidung": "Khuôn viên bệnh viện có tường rào kín bao quanh; các cổng vào đều có người bảo vệ; không có lỗ hổng cho đi lại tự do.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM6", "tc": "TC34", "ma": "C1.1", "tm": "TM6", "muc": "Mức 2", "noidung": "Có quy định hạn chế người nhà người bệnh vào khu vực chuyên môn hoặc khoa/phòng điều trị trong các giờ quy định.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM7", "tc": "TC34", "ma": "C1.1", "tm": "TM7", "muc": "Mức 3", "noidung": "Lực lượng bảo vệ đã được đào tạo chuyên nghiệp hoặc tập huấn nghiệp vụ bảo vệ tại các đơn vị có trình độ và chức năng đào tạo nghiệp vụ bảo vệ (có chứng chỉ, giấy tham gia khóa tập huấn…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM8", "tc": "TC34", "ma": "C1.1", "tm": "TM8", "muc": "Mức 3", "noidung": "Có hình thức kiểm soát được người ra vào khoa/phòng điều trị.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM9", "tc": "TC34", "ma": "C1.1", "tm": "TM9", "muc": "Mức 3", "noidung": "Có văn bản phối hợp (hoặc ký biên bản cam kết) với cơ quan an ninh địa phương về việc hỗ trợ, bảo đảm giữ gìn an ninh, trật tự tại bệnh viện và khu vực quanh bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM10", "tc": "TC34", "ma": "C1.1", "tm": "TM10", "muc": "Mức 3", "noidung": "Có cảnh báo (hoặc hướng dẫn) chống mất trộm cho người bệnh, người nhà người bệnh tại các khu vực có nguy cơ xảy ra mất cắp cao.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM11", "tc": "TC34", "ma": "C1.1", "tm": "TM11", "muc": "Mức 3", "noidung": "Có biện pháp chủ động phát hiện, ngăn chặn trộm cắp như đi tuần tra theo định kỳ, lập danh sách các đối tượng đã trộm cắp, theo dõi đối tượng nghi vấn hoặc các biện pháp chủ động khác.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM12", "tc": "TC34", "ma": "C1.1", "tm": "TM12", "muc": "Mức 3", "noidung": "Lực lượng bảo vệ luôn thường trực và can thiệp kịp thời các vụ việc hành hung, gây rối hoặc đập phá tài sản, đồ đạc của người bệnh hoặc người nhà người bệnh/nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM13", "tc": "TC34", "ma": "C1.1", "tm": "TM13", "muc": "Mức 4", "noidung": "Có hệ thống camera an ninh tự động theo dõi toàn bệnh viện (CCTV);", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM14", "tc": "TC34", "ma": "C1.1", "tm": "TM14", "muc": "Mức 4", "noidung": "Có bộ phận thường trực theo dõi camera an ninh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM15", "tc": "TC34", "ma": "C1.1", "tm": "TM15", "muc": "Mức 4", "noidung": "Có đội an ninh phản ứng nhanh do bệnh viện thành lập hoặc thuê công ty bảo vệ túc trực 24/24 giờ để đối phó với các sự cố bất thường xảy ra, có diễn tập ít nhất 1 lần trong năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM16", "tc": "TC34", "ma": "C1.1", "tm": "TM16", "muc": "Mức 4", "noidung": "Lực lượng bảo vệ được trang bị các phương tiện liên lạc nội bộ như máy bộ đàm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM17", "tc": "TC34", "ma": "C1.1", "tm": "TM17", "muc": "Mức 4", "noidung": "Các khoa/phòng có nguy cơ mất an ninh trật tự cao như khoa cấp cứu (phòng, buồng cấp cứu) được trang bị hệ thống cửa chắc chắn và có hình thức kiểm soát, hạn chế người bệnh và người nhà người bệnh ra – vào tự do.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM18", "tc": "TC34", "ma": "C1.1", "tm": "TM18", "muc": "Mức 5", "noidung": "Các khoa, phòng, hành lang… được trang bị khóa từ (hoặc khóa số) luôn trong trạng thái đóng; chỉ được mở bằng thẻ từ hoặc mã số.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM19", "tc": "TC34", "ma": "C1.1", "tm": "TM19", "muc": "Mức 5", "noidung": "Nhân viên y tế được trang bị thẻ từ để mở khóa các khoa, phòng, hành lang. Thẻ có tên, ảnh, mã số nhân viên hoặc bằng vân tay.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM20", "tc": "TC34", "ma": "C1.1", "tm": "TM20", "muc": "Mức 5", "noidung": "Có nhân viên y tế (hoặc có hình thức khác như camera) kiểm soát người bệnh hoặc đóng, mở cửa cho người bệnh và người nhà người bệnh vào – ra các khoa/phòng, hạn chế người đi lại tự do.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.1_TM21", "tc": "TC34", "ma": "C1.1", "tm": "TM21", "muc": "Mức 5", "noidung": "Không có vụ việc mất trộm tài sản của người bệnh, người nhà người bệnh thông qua ghi chép hoặc phản ánh của người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM1", "tc": "TC35", "ma": "C1.2", "tm": "TM1", "muc": "Mức 1", "noidung": "Có xảy ra sự cố cháy, nổ nghiêm trọng, gây thiệt hại tài sản, trang thiết bị hoặc con người.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM2", "tc": "TC35", "ma": "C1.2", "tm": "TM2", "muc": "Mức 1", "noidung": "Có sự cố mất điện, gây ảnh hưởng đến hoạt động chuyên môn và hậu quả nghiêm trọng đối với người bệnh (có trường hợp người bệnh tử vong hoặc biến chứng do mất điện làm trang thiết bị y tế không hoạt động, hoặc mất điện không bảo đảm ánh sáng, gây nhầm thuốc, hóa chất…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM3", "tc": "TC35", "ma": "C1.2", "tm": "TM3", "muc": "Mức 1", "noidung": "Có hiện tượng câu, mắc và sử dụng điện tùy tiện, tự ý sửa chữa thay thế các thiết bị về điện, để chất dễ cháy gần cầu dao, át-tô-mát, bảng điện và đường dây dẫn điện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM4", "tc": "TC35", "ma": "C1.2", "tm": "TM4", "muc": "Mức 1", "noidung": "Có hiện tượng các bình ô-xy đang chứa ô-xy chưa sử dụng để ngoài sân, hành lang… có thể tiếp xúc trực tiếp với ánh nắng mặt trời.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM5", "tc": "TC35", "ma": "C1.2", "tm": "TM5", "muc": "Mức 1", "noidung": "Không có các họng nước cứu hỏa, bể nước dự phòng cho chữa cháy trong khuôn viên bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM6", "tc": "TC35", "ma": "C1.2", "tm": "TM6", "muc": "Mức 2", "noidung": "Có quy định, nội quy về an toàn phòng cháy chữa cháy và sẵn có tại các khoa/phòng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM7", "tc": "TC35", "ma": "C1.2", "tm": "TM7", "muc": "Mức 2", "noidung": "Có phân công một phòng đầu mối chịu trách nhiệm về công tác phòng cháy, chữa cháy.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM8", "tc": "TC35", "ma": "C1.2", "tm": "TM8", "muc": "Mức 2", "noidung": "Phòng đầu mối tiến hành thường xuyên hoặc định kỳ kiểm tra phát hiện các nhược điểm, thiếu sót về phòng cháy và có biện pháp khắc phục kịp thời.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM9", "tc": "TC35", "ma": "C1.2", "tm": "TM9", "muc": "Mức 2", "noidung": "Đã khắc phục hoàn toàn hoặc (và) không phát hiện thấy các nguy cơ cao mất an toàn về điện như có dây điện rách vỏ (hoặc dây không có vỏ) trong phòng, hành lang hoặc ổ điện đặt cạnh vòi nước...", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM10", "tc": "TC35", "ma": "C1.2", "tm": "TM10", "muc": "Mức 2", "noidung": "Các bình ô-xy và hóa chất có nguy cơ dễ cháy, nổ được bảo quản trong nhà kho thoáng, mát và có mái che tránh tiếp xúc trực tiếp với ánh nắng mặt trời.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM11", "tc": "TC35", "ma": "C1.2", "tm": "TM11", "muc": "Mức 2", "noidung": "Sẵn có bình chữa cháy tại các khoa, phòng, hành lang theo hướng dẫn, quy định của bệnh viện và cơ quan công an.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM12", "tc": "TC35", "ma": "C1.2", "tm": "TM12", "muc": "Mức 2", "noidung": "Các họng nước cứu hỏa và bể nước dự phòng cho chữa cháy trong khuôn viên bệnh viện bảo đảm luôn sẵn có nước.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM13", "tc": "TC35", "ma": "C1.2", "tm": "TM13", "muc": "Mức 2", "noidung": "Tách biệt giữa các đầu cắm ô-xy với các ổ cắm điện phòng tránh nguy cơ cháy nổ (khoảng cách tối thiểu từ 5 cm trở lên).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM14", "tc": "TC35", "ma": "C1.2", "tm": "TM14", "muc": "Mức 3", "noidung": "Có nhân viên chuyên trách phụ trách điện và an toàn điện, được đào tạo từ trình độ trung cấp trở lên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM15", "tc": "TC35", "ma": "C1.2", "tm": "TM15", "muc": "Mức 3", "noidung": "Có phân công ít nhất một nhân viên chịu trách nhiệm về công tác phòng cháy, chữa cháy và đã tham dự tập huấn phòng cháy, chữa cháy.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM16", "tc": "TC35", "ma": "C1.2", "tm": "TM16", "muc": "Mức 3", "noidung": "Bảo đảm có bình chữa cháy đặt đầy đủ tại các vị trí của khoa theo quy định và hướng dẫn của cơ quan công an (hoặc quy định của bệnh viện).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM17", "tc": "TC35", "ma": "C1.2", "tm": "TM17", "muc": "Mức 3", "noidung": "Có mời cơ quan công an, chuyên gia đến hướng dẫn, tư vấn, kiểm tra, diễn tập… về công tác phòng chống cháy nổ ít nhất 1 lần trong năm và có biên bản kiểm tra.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM18", "tc": "TC35", "ma": "C1.2", "tm": "TM18", "muc": "Mức 3", "noidung": "Có tổ chức huấn luyện phòng cháy, chữa cháy cho ít nhất 50% nhân viên bệnh viện 1 lần trong năm hoặc mời chuyên gia, cơ quan công an đến hướng dẫn, huấn luyện, kiểm tra công tác phòng chống cháy nổ ít nhất 1 lần trong năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM19", "tc": "TC35", "ma": "C1.2", "tm": "TM19", "muc": "Mức 3", "noidung": "Có phương án phòng chống cháy nổ, sơ tán thoát nạn, cứu người (đặc biệt đối với người bệnh không có khả năng tự thoát nạn), cứu trang thiết bị y tế, tài sản và chống cháy lan.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM20", "tc": "TC35", "ma": "C1.2", "tm": "TM20", "muc": "Mức 3", "noidung": "Có cảnh báo cháy nổ và cấm lửa tại các vị trí/khu vực có nguy cơ cao như bình/kho chứa ô-xy, nơi chứa nhiên liệu gas, xăng/dầu và các máy móc có nguy cơ cháy nổ cao khác.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM21", "tc": "TC35", "ma": "C1.2", "tm": "TM21", "muc": "Mức 3", "noidung": "Có chuông báo cháy, đèn khẩn cấp luôn trong tình trạng hoạt động. Các hệ thống được kiểm tra vận hành thử ít nhất 2 lần trong năm và hoạt động tốt.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM22", "tc": "TC35", "ma": "C1.2", "tm": "TM22", "muc": "Mức 4", "noidung": "Có chứng nhận về phòng cháy, chữa cháy do cơ quan có thẩm quyền cấp (đối với công trình mới xây, cải tạo cần có biên bản nghiệm thu hệ thống phòng cháy chữa cháy do cơ quan có thẩm quyền cấp).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM23", "tc": "TC35", "ma": "C1.2", "tm": "TM23", "muc": "Mức 4", "noidung": "Đã khắc phục toàn bộ các nhược điểm (nếu có) được nêu trong biên bản.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM24", "tc": "TC35", "ma": "C1.2", "tm": "TM24", "muc": "Mức 4", "noidung": "Có bản sơ đồ cửa và cầu thang thoát hiểm tại đầy đủ các hành lang.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM25", "tc": "TC35", "ma": "C1.2", "tm": "TM25", "muc": "Mức 4", "noidung": "Có bản danh sách số lượng bình chữa cháy chung của bệnh viện và số lượng bình tại các khoa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM26", "tc": "TC35", "ma": "C1.2", "tm": "TM26", "muc": "Mức 4", "noidung": "Các bình chữa cháy được đặt ở vị trí gần với nhân viên y tế, thuận tiện trong sử dụng (ví dụ đặt trong các hộp kính ở gần cửa phòng hành chính khoa).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM27", "tc": "TC35", "ma": "C1.2", "tm": "TM27", "muc": "Mức 4", "noidung": "Trang bị hệ thống cầu dao tự ngắt cho các máy móc thiết bị y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM28", "tc": "TC35", "ma": "C1.2", "tm": "TM28", "muc": "Mức 4", "noidung": "Có hệ thống báo cháy, chuông báo cháy tự động tại tất cả các khoa/phòng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM29", "tc": "TC35", "ma": "C1.2", "tm": "TM29", "muc": "Mức 4", "noidung": "Có hệ thống máy phát điện dự phòng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM30", "tc": "TC35", "ma": "C1.2", "tm": "TM30", "muc": "Mức 4", "noidung": "Có diễn tập phòng cháy chữa cháy ít nhất 1 lần trong năm trên quy mô toàn bệnh viện.Nhân viên sử dụng được các phương tiện chữa cháy sẵn có và biết được phương án sơ tán thoát nạn, cứu người.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM31", "tc": "TC35", "ma": "C1.2", "tm": "TM31", "muc": "Mức 4", "noidung": "Không có sự cố cháy, nổ trong năm cần dùng bình cứu hỏa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM32", "tc": "TC35", "ma": "C1.2", "tm": "TM32", "muc": "Mức 5", "noidung": "Trang bị hệ thống cầu dao tự ngắt cho toàn bộ hệ thống điện và riêng cho từng khối nhà, từng tầng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM33", "tc": "TC35", "ma": "C1.2", "tm": "TM33", "muc": "Mức 5", "noidung": "Không có sự cố chập điện trong năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM34", "tc": "TC35", "ma": "C1.2", "tm": "TM34", "muc": "Mức 5", "noidung": "Trang bị hệ thống phun nước chữa cháy tự động cùng hệ thống cảm biến khói cháy tại tất cả các khoa/phòng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM35", "tc": "TC35", "ma": "C1.2", "tm": "TM35", "muc": "Mức 5", "noidung": "Có hệ thống máy phát điện dự phòng và tự động kích hoạt trong vòng 1 phút nếu như điện lưới bị cắt hoặc gặp sự cố.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM36", "tc": "TC35", "ma": "C1.2", "tm": "TM36", "muc": "Mức 5", "noidung": "Thiết kế các khối nhà cao tầng có cửa thoát hiểm và cầu thang bộ thoát hiểm trong trường hợp khẩn cấp, cháy nổ (cầu thang thông thường chỉ được coi là tương đương với có cầu thang thoát hiểm nếu nằm ở vị trí đầu hồi và thông thoáng hoàn toàn với ngoài trời, bảo đảm không bị ngạt khói).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C1.2_TM37", "tc": "TC35", "ma": "C1.2", "tm": "TM37", "muc": "Mức 5", "noidung": "Có tham gia bảo hiểm cháy, nổ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Lê Văn Quân"}, {"id": "C2.1_TM1", "tc": "TC36", "ma": "C2.1", "tm": "TM1", "muc": "Mức 1", "noidung": "Có tình trạng hồ sơ bệnh án chưa được lập kịp thời sau khi người bệnh nhập viện (24 giờ với người bệnh cấp cứu và 36 giờ với bệnh thông thường).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM2", "tc": "TC36", "ma": "C2.1", "tm": "TM2", "muc": "Mức 1", "noidung": "Phát hiện thấy bệnh án có thông tin mâu thuẫn, không hợp lý.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM3", "tc": "TC36", "ma": "C2.1", "tm": "TM3", "muc": "Mức 1", "noidung": "Bệnh án có nội dung không đọc được chữ viết.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM4", "tc": "TC36", "ma": "C2.1", "tm": "TM4", "muc": "Mức 2", "noidung": "Hồ sơ bệnh án được lập sau khi vào viện trong vòng 36 giờ (hoặc 24 giờ với người bệnh cấp cứu), bảo đảm đầy đủ các thông tin cơ bản cần thiết và hoàn chỉnh hồ sơ bệnh án theo quy định.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM5", "tc": "TC36", "ma": "C2.1", "tm": "TM5", "muc": "Mức 2", "noidung": "Hồ sơ bệnh án bảo đảm được bác sỹ điều trị duyệt và chịu trách nhiệm về  mặt nội dung thông tin.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM6", "tc": "TC36", "ma": "C2.1", "tm": "TM6", "muc": "Mức 3", "noidung": "Bảo đảm ghi đầy đủ, rõ ràng các thông tin trong bệnh án theo quy định, đọc được chữ và nội dung. Bệnh án ngoại khoa có vẽ lược đồ phẫu thuật.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM7", "tc": "TC36", "ma": "C2.1", "tm": "TM7", "muc": "Mức 3", "noidung": "Các thông tin về chăm sóc và điều trị được ghi vào hồ sơ ngay sau khi thực hiện và theo các quy định về thời gian.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM8", "tc": "TC36", "ma": "C2.1", "tm": "TM8", "muc": "Mức 3", "noidung": "Bệnh án đầy đủ các thông tin theo quy định như hành chính, chỉ định điều trị, chăm sóc sau khi kết thúc điều trị.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM9", "tc": "TC36", "ma": "C2.1", "tm": "TM9", "muc": "Mức 3", "noidung": "Những thông tin cần điều chỉnh được gạch bỏ, ký tên người sửa và thời gian sửa (không tẩy xóa hoặc bôi đen để không đọc được nội dung cũ).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM10", "tc": "TC36", "ma": "C2.1", "tm": "TM10", "muc": "Mức 3", "noidung": "Sẵn có “Bảng phân loại thống kê quốc tế về bệnh tật và vấn đề sức khỏe có liên quan” phiên bản lần thứ 10 (ICD 10) phòng kế hoạch (hoặc nghiệp vụ).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM11", "tc": "TC36", "ma": "C2.1", "tm": "TM11", "muc": "Mức 3", "noidung": "Sẵn có bảng mã ICD10 cho các bệnh thường gặp của các khoa lâm sàng tại phòng hành chính của khoa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM12", "tc": "TC36", "ma": "C2.1", "tm": "TM12", "muc": "Mức 3", "noidung": "Bảng mã được in rõ ràng, lành lặn, dễ đọc, đặt ở vị trí dễ quan sát hoặc dễ lấy.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM13", "tc": "TC36", "ma": "C2.1", "tm": "TM13", "muc": "Mức 3", "noidung": "Có tập huấn cho bác sỹ, điều dưỡng về mã hóa bệnh tật theo ICD 10, cách ghi mã bệnh chính và bệnh kèm theo.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM14", "tc": "TC36", "ma": "C2.1", "tm": "TM14", "muc": "Mức 3", "noidung": "Các thông tin bệnh được mã hóa chính xác theo bảng ICD 10 khi chẩn đoán và sau khi có kết luận ra viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM15", "tc": "TC36", "ma": "C2.1", "tm": "TM15", "muc": "Mức 4", "noidung": "Có phân công nhân viên chịu trách nhiệm kiểm tra hồ sơ bệnh án thường quy, đánh giá việc ghi chép, chất lượng thông tin…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM16", "tc": "TC36", "ma": "C2.1", "tm": "TM16", "muc": "Mức 4", "noidung": "Có quy định và tiến hành kiểm tra ngẫu nhiên chất lượng hồ sơ bệnh án và nhập mã ICD 10.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM17", "tc": "TC36", "ma": "C2.1", "tm": "TM17", "muc": "Mức 4", "noidung": "Có tiến hành đánh giá (hoặc nghiên cứu) về chất lượng hồ sơ bệnh án và xác định tỷ lệ nhập sai mã ICD 10 (ví dụ có bảng kiểm đánh giá chất lượng bệnh án từ hình thức đến nội dung).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM18", "tc": "TC36", "ma": "C2.1", "tm": "TM18", "muc": "Mức 4", "noidung": "Có bản kết quả đánh giá, trong đó chỉ ra được những lỗi thường gặp của hồ sơ bệnh án, tỷ lệ nhập sai mã ICD 10, nguyên nhân chính và các giải pháp.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM19", "tc": "TC36", "ma": "C2.1", "tm": "TM19", "muc": "Mức 5", "noidung": "Áp dụng kết quả đánh giá, các giải pháp đã đề xuất vào việc cải tiến chất lượng lập hồ sơ bệnh án và nhập mã ICD 10.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM20", "tc": "TC36", "ma": "C2.1", "tm": "TM20", "muc": "Mức 5", "noidung": "Thí điểm lập bệnh án theo hình thức bệnh án điện tử (tại một số khoa).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM21", "tc": "TC36", "ma": "C2.1", "tm": "TM21", "muc": "Mức 5", "noidung": "Các thông tin về kết quả xét nghiệm, chẩn đoán, chăm sóc và điều trị được cập nhật vào hồ sơ ngay sau khi thực hiện hoặc sau khi có kết quả bằng hệ thống máy tính nối mạng nội bộ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM22", "tc": "TC36", "ma": "C2.1", "tm": "TM22", "muc": "Mức 5", "noidung": "Có đánh giá sơ bộ kết quả triển khai thí điểm bệnh án điện tử, xác định những khó khăn, bất cập cần khắc phục.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.1_TM23", "tc": "TC36", "ma": "C2.1", "tm": "TM23", "muc": "Mức 5", "noidung": "Áp dụng kết quả đánh giá vào việc triển khai bệnh án điện tử rộng rãi.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Lê Thị Cẩm Hồng"}, {"id": "C2.2_TM1", "tc": "TC37", "ma": "C2.2", "tm": "TM1", "muc": "Mức 1", "noidung": "Có tình trạng bệnh án để bừa bãi, lộn xộn, ẩm ướt...", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Minh Lý"}, {"id": "C2.2_TM2", "tc": "TC37", "ma": "C2.2", "tm": "TM2", "muc": "Mức 1", "noidung": "Không tìm được một bệnh án theo yêu cầu trong vòng 30 phút tại nơi lưu trữ trong khuôn viên bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Minh Lý"}, {"id": "C2.2_TM3", "tc": "TC37", "ma": "C2.2", "tm": "TM3", "muc": "Mức 2", "noidung": "Bệnh án được lưu trữ cẩn thận theo quy định trong một hoặc nhiều kho khác nhau.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Minh Lý"}, {"id": "C2.2_TM4", "tc": "TC37", "ma": "C2.2", "tm": "TM4", "muc": "Mức 2", "noidung": "Bệnh án được lưu trữ đủ thời gian quy định.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Minh Lý"}, {"id": "C2.2_TM5", "tc": "TC37", "ma": "C2.2", "tm": "TM5", "muc": "Mức 2", "noidung": "Kho lưu trữ bệnh án thông thoáng, ngăn nắp, bảo đảm chống ẩm, chống cháy, chống mưa, lụt.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Minh Lý"}, {"id": "C2.2_TM6", "tc": "TC37", "ma": "C2.2", "tm": "TM6", "muc": "Mức 2", "noidung": "Kho lưu trữ bệnh án bảo đảm chống chuột, mối xông và côn trùng khác.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Minh Lý"}, {"id": "C2.2_TM7", "tc": "TC37", "ma": "C2.2", "tm": "TM7", "muc": "Mức 2", "noidung": "Có sổ lưu trữ (hoặc phần mềm) để quản lý số lượng bệnh án nhập - xuất kho lưu trữ theo từng khoa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Minh Lý"}, {"id": "C2.2_TM8", "tc": "TC37", "ma": "C2.2", "tm": "TM8", "muc": "Mức 3", "noidung": "Kho lưu trữ bệnh án có giá, ngăn hoặc tủ sắp xếp bệnh án theo trình tự thống nhất (do bệnh viện tự quy định) có phân biệt theo khoa/phòng, theo thời gian hoặc theo các hình thức khác.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Minh Lý"}, {"id": "C2.2_TM9", "tc": "TC37", "ma": "C2.2", "tm": "TM9", "muc": "Mức 3", "noidung": "Có sổ lưu trữ (hoặc phần mềm như excel) để tra cứu và xác định một bệnh án bất kỳ đang nằm ở vị trí nào (ngăn, giá, tủ) trong kho (hoặc đang tạm thời được đem ra ngoài kho cho mục đích khác và tra được tên người đang sử dụng).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Minh Lý"}, {"id": "C2.2_TM10", "tc": "TC37", "ma": "C2.2", "tm": "TM10", "muc": "Mức 4", "noidung": "Mỗi người bệnh điều trị tại bệnh viện được cung cấp một mã xác định (do bệnh viện hoặc cơ quan quản lý quy định và thống nhất cách đặt mã).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Minh Lý"}, {"id": "C2.2_TM11", "tc": "TC37", "ma": "C2.2", "tm": "TM11", "muc": "Mức 4", "noidung": "Các thông tin hành chính và tóm tắt nội dung chuyên môn chính của bệnh án được nhập vào phần mềm máy tính để lưu trữ, quản lý.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Minh Lý"}, {"id": "C2.2_TM12", "tc": "TC37", "ma": "C2.2", "tm": "TM12", "muc": "Mức 4", "noidung": "Các thông tin về bệnh tật trong các lần điều trị trước có thể truy cập nhanh chóng trong các lần điều trị tiếp sau.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Minh Lý"}, {"id": "C2.2_TM13", "tc": "TC37", "ma": "C2.2", "tm": "TM13", "muc": "Mức 4", "noidung": "Có thể lấy một thông tin của một bệnh án bất kỳ theo: mã bệnh án, tên người bệnh, mã bệnh, ngày nhập/xuất viện (trong phạm vi 2 năm).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Minh Lý"}, {"id": "C2.2_TM14", "tc": "TC37", "ma": "C2.2", "tm": "TM14", "muc": "Mức 5", "noidung": "Toàn bộ nội dung thông tin bệnh án được lưu trữ trên phần mềm máy tính.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Minh Lý"}, {"id": "C2.2_TM15", "tc": "TC37", "ma": "C2.2", "tm": "TM15", "muc": "Mức 5", "noidung": "Trên hệ thống máy tính, bệnh viện có thể xuất thông tin chi tiết về bệnh án, chẩn đoán và điều trị của người bệnh theo: mã bệnh án, tên người bệnh, ngày nhập/xuất viện trong phạm vi 2 năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Minh Lý"}, {"id": "C2.2_TM16", "tc": "TC37", "ma": "C2.2", "tm": "TM16", "muc": "Mức 5", "noidung": "Tiến hành đánh giá thực trạng việc quản lý hồ sơ bệnh án của bệnh viện và chỉ ra được những khó khăn, nhược điểm cần giải quyết.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Minh Lý"}, {"id": "C2.2_TM17", "tc": "TC37", "ma": "C2.2", "tm": "TM17", "muc": "Mức 5", "noidung": "Áp dụng kết quả đánh giá vào việc cải tiến chất lượng quản lý hồ sơ bệnh án.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Minh Lý"}, {"id": "C3.1_TM1", "tc": "TC38", "ma": "C3.1", "tm": "TM1", "muc": "Mức 1", "noidung": "Không cung cấp được các thông tin cơ bản của hoạt động bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM2", "tc": "TC38", "ma": "C3.1", "tm": "TM2", "muc": "Mức 1", "noidung": "Không có một nhân viên phụ trách quản lý thông tin.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM3", "tc": "TC38", "ma": "C3.1", "tm": "TM3", "muc": "Mức 2", "noidung": "Có phân công nhân viên phụ trách quản lý thông tin bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM4", "tc": "TC38", "ma": "C3.1", "tm": "TM4", "muc": "Mức 2", "noidung": "Có hệ thống biểu mẫu chuẩn hóa và thống nhất toàn bộ bệnh viện dựa trên hệ thống biểu mẫu ghi chép, hồ sơ bệnh án của Bộ Y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM5", "tc": "TC38", "ma": "C3.1", "tm": "TM5", "muc": "Mức 2", "noidung": "Báo cáo cho các cơ quan quản lý (Bộ Y tế, Cục Quản lý Khám, chữa bệnh; Sở Y tế) đầy đủ các số liệu theo quy định.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM6", "tc": "TC38", "ma": "C3.1", "tm": "TM6", "muc": "Mức 2", "noidung": "Có các hệ thống quản lý bệnh viện trên sổ sách (hoặc phần mềm): quản lý người bệnh, quản lý cận lâm sàng, quản lý dược, quản lý vật tư tiêu hao, quản lý viện phí và thanh toán bảo hiểm y tế; quản lý hạ tầng kỹ thuật và trang thiết bị y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM7", "tc": "TC38", "ma": "C3.1", "tm": "TM7", "muc": "Mức 2", "noidung": "Triển khai áp dụng phần mềm báo cáo thống kê bệnh viện (theo quy định của Bộ Y tế và cơ quan quản lý).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM8", "tc": "TC38", "ma": "C3.1", "tm": "TM8", "muc": "Mức 3", "noidung": "Hoàn thành đầy đủ việc nhập thông tin, số liệu hoạt động bệnh viện theo quy định của Bộ Y tế định kỳ cuối năm trên hệ thống phần mềm trực tuyến.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM9", "tc": "TC38", "ma": "C3.1", "tm": "TM9", "muc": "Mức 3", "noidung": "Có hệ thống danh mục thống nhất toàn bệnh viện về giá dịch vụ kỹ thuật y tế theo phân loại của Bộ Y tế cho tất cả các đối tượng người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM10", "tc": "TC38", "ma": "C3.1", "tm": "TM10", "muc": "Mức 3", "noidung": "Có phần mềm thống kê hoặc phần mềm quản lý bệnh viện có khả năng kết xuất số liệu sang excel hoặc định dạng khác để phân tích số liệu.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM11", "tc": "TC38", "ma": "C3.1", "tm": "TM11", "muc": "Mức 3", "noidung": "Sử dụng số liệu và thông tin từ phần mềm chuyên môn nghiệp vụ, giúp cho lãnh đạo quản lý và điều hành.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM12", "tc": "TC38", "ma": "C3.1", "tm": "TM12", "muc": "Mức 3", "noidung": "Áp dụng hệ thống mã hóa lâm sàng theo quy định của Bộ Y tế bao gồm mã hóa bệnh tật, tử vong theo “Bảng phân loại thống kê quốc tế về bệnh tật và vấn đề sức khỏe có liên quan” phiên bản lần thứ 10 (ICD 10), “Bảng phân loại quốc tế phẫu thuật, thủ thuật” ICD9 - CM.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM13", "tc": "TC38", "ma": "C3.1", "tm": "TM13", "muc": "Mức 4", "noidung": "Xây dựng bảng danh sách các chỉ số thông tin bệnh viện, bao gồm các chỉ số về tổ chức, hoạt động, chuyên môn và các chỉ số khác (ví dụ số giường bệnh, nhân lực bao gồm bác sỹ, điều dưỡng, số lượt khám bệnh, nội trú…)", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM14", "tc": "TC38", "ma": "C3.1", "tm": "TM14", "muc": "Mức 4", "noidung": "Có theo dõi, đánh giá các chỉ số theo thời gian năm, quý và so sánh giữa các khoa/phòng, bộ phận.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM15", "tc": "TC38", "ma": "C3.1", "tm": "TM15", "muc": "Mức 4", "noidung": "Có hệ thống phân tích dữ liệu phục vụ công tác quản trị bệnh viện và công tác hoạt động chuyên môn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM16", "tc": "TC38", "ma": "C3.1", "tm": "TM16", "muc": "Mức 4", "noidung": "Có sử dụng các thông tin từ hệ thống công nghệ thông tin vào việc giám sát, nâng cao chất lượng khám, chữa bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM17", "tc": "TC38", "ma": "C3.1", "tm": "TM17", "muc": "Mức 4", "noidung": "Xây dựng các công cụ (như bảng kiểm, phần mềm tự động…) và phương pháp để tiến hành giám sát chất lượng số liệu theo định kỳ (hoặc đột xuất), bảo đảm độ tin cậy, trung thực của dữ liệu và giám sát chất lượng số liệu thường xuyên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM18", "tc": "TC38", "ma": "C3.1", "tm": "TM18", "muc": "Mức 5", "noidung": "Dữ liệu thông tin của bệnh viện được phân tích theo thời gian (một giai đoạn hoặc tại một thời điểm bất kỳ) và đưa ra kết quả dưới dạng bảng, hình vẽ, biểu đồ hoặc các dạng hình ảnh khác nhằm phục vụ cho công tác thống kê, dự báo và quản lý hoạt động bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM19", "tc": "TC38", "ma": "C3.1", "tm": "TM19", "muc": "Mức 5", "noidung": "Triển khai hệ thống thông tin cải thiện chất lượng bệnh viện: có đầy đủ các thông tin, dữ liệu về thời gian chờ đợi của người bệnh, thời gian cấp phát thuốc cho người bệnh, thời gian trả kết quả xét nghiệm…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Vật tư - TBYT", "cb": "Nguyễn Thị Kim Hoàng"}, {"id": "C3.1_TM20", "tc": "TC38", "ma": "C3.1", "tm": "TM20", "muc": "Mức 5", "noidung": "Có thể kết xuất các thông tin phục vụ báo cáo, nghiên cứu… trực tiếp từ phần mềm như mô hình bệnh tật khi nhập, xuất viện, cơ cấu tài chính,
