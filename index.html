"ma": "C10.1", "tm": "TM6", "muc": "Mức 3", "noidung": "Có tiến hành sinh hoạt khoa học định kỳ ít nhất 1 lần trong 1 tháng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.1_TM7", "tc": "TC67", "ma": "C10.1", "tm": "TM7", "muc": "Mức 3", "noidung": "Có buổi sinh hoạt hướng dẫn phương pháp nghiên cứu cho nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.1_TM8", "tc": "TC67", "ma": "C10.1", "tm": "TM8", "muc": "Mức 3", "noidung": "Có danh sách tổng hợp và chia nhóm các hoạt động nghiên cứu đã và đang thực hiện tại bệnh viện trong năm (chia theo cấp đề tài) bao gồm tối thiểu 4 nhóm: (1) nghiên cứu do bệnh viện chủ trì; (2) nghiên cứu phối hợp thực hiện; (3) tham gia cung cấp số liệu; (4) là địa điểm nghiên cứu cho đơn vị khác thực hiện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.1_TM9", "tc": "TC67", "ma": "C10.1", "tm": "TM9", "muc": "Mức 3", "noidung": "Hợp tác và cung cấp thông tin, số liệu, tài liệu đầy đủ cho các cơ quan quản lý và các đơn vị được giao tiến hành nghiên cứu khoa học phục vụ cho việc xây dựng chiến lược, chính sách y tế (khi được yêu cầu).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.1_TM10", "tc": "TC67", "ma": "C10.1", "tm": "TM10", "muc": "Mức 3", "noidung": "Bác sỹ, điều dưỡng và các nhân viên y tế có tham gia các hoạt động nghiên cứu khoa học như xây dựng câu hỏi, thu thập số liệu, viết báo cáo, viết luận văn, luận án tốt nghiệp, viết bài báo khoa học…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.1_TM11", "tc": "TC67", "ma": "C10.1", "tm": "TM11", "muc": "Mức 3", "noidung": "Trong năm bệnh viện chủ trì xây dựng và tự tiến hành ít nhất một nghiên cứu khoa học (như các đánh giá, nghiên cứu cải tiến chất lượng dịch vụ và chuyên môn bệnh viện), có báo cáo kết quả nghiên cứu và đã được hội đồng cấp bệnh viện hoặc cấp cao hơn nghiệm thu.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.1_TM12", "tc": "TC67", "ma": "C10.1", "tm": "TM12", "muc": "Mức 4", "noidung": "Tập thể, cá nhân bệnh viện chủ trì/chủ nhiệm thực hiện ít nhất 03 công trình nghiên cứu khoa học được nghiệm thu.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.1_TM13", "tc": "TC67", "ma": "C10.1", "tm": "TM13", "muc": "Mức 4", "noidung": "Có ít nhất 01 công trình được nghiệm thu ở cấp Bộ, tỉnh/thành phố trở lên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.1_TM14", "tc": "TC67", "ma": "C10.1", "tm": "TM14", "muc": "Mức 4", "noidung": "Bệnh viện có ít nhất 03 bài báo khoa học về các đề tài thực hiện tại bệnh viện, do nhân viên bệnh viện thực hiện đăng trên các tạp chí khoa học trong nước.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.1_TM15", "tc": "TC67", "ma": "C10.1", "tm": "TM15", "muc": "Mức 5", "noidung": "Có ít nhất 02 bài báo khoa học được đăng trên các tạp chí quốc tế có nhân viên của bệnh viện tham gia đồng tác giả.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.1_TM16", "tc": "TC67", "ma": "C10.1", "tm": "TM16", "muc": "Mức 5", "noidung": "Trong năm có ít nhất 01 bài báo khoa học đăng trên các tạp chí khoa học quốc tế, do nhân viên cơ hữu của bệnh viện đứng đầu trong số danh sách tên các tác giả.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.1_TM17", "tc": "TC67", "ma": "C10.1", "tm": "TM17", "muc": "Mức 5", "noidung": "Có công trình nghiên cứu do cá nhân/tập thể bệnh viện làm chủ nhiệm/chủ trì đạt các giải thưởng khoa học trong nước cấp quốc gia hoặc giải thưởng khoa học quốc tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.2_TM1", "tc": "TC68", "ma": "C10.2", "tm": "TM1", "muc": "Mức 1", "noidung": "Không áp dụng kết quả nghiên cứu khoa học (do bệnh viện thực hiện hoặc nghiên cứu trong nước, quốc tế) đã được công bố vào việc cải tiến chất lượng khám, chữa bệnh và nâng cao hoạt động bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.2_TM2", "tc": "TC68", "ma": "C10.2", "tm": "TM2", "muc": "Mức 2", "noidung": "Có tiến hành thu thập, tìm kiếm và tổng hợp kết quả các nghiên cứu hoặc sáng kiến, thành công của đơn vị khác (trong và người nước) phục vụ cho việc cải tiến chất lượng khám, chữa bệnh và nâng cao hoạt động bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.2_TM3", "tc": "TC68", "ma": "C10.2", "tm": "TM3", "muc": "Mức 2", "noidung": "Lập danh mục các kết quả nghiên cứu tiềm năng, khuyến nghị mang tính khả thi, có thể áp dụng tại bệnh viện để cải tiến chất lượng khám, chữa bệnh và nâng cao hoạt động bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.2_TM4", "tc": "TC68", "ma": "C10.2", "tm": "TM4", "muc": "Mức 2", "noidung": "Có xây dựng kế hoạch và lộ trình triển khai áp dụng các kết quả nghiên cứu/sáng kiến để cải tiến chất lượng khám, chữa bệnh và nâng cao hoạt động bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.2_TM5", "tc": "TC68", "ma": "C10.2", "tm": "TM5", "muc": "Mức 3", "noidung": "Có triển khai áp dụng ít nhất 03 kết quả nghiên cứu vào thực tiễn để cải tiến chất lượng khám, chữa bệnh và nâng cao hoạt động bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.2_TM6", "tc": "TC68", "ma": "C10.2", "tm": "TM6", "muc": "Mức 4", "noidung": "Có triển khai áp dụng ít nhất 04 kết quả nghiên cứu vào thực tiễn để cải tiến chất lượng khám, chữa bệnh và nâng cao hoạt động bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.2_TM7", "tc": "TC68", "ma": "C10.2", "tm": "TM7", "muc": "Mức 4", "noidung": "Có khảo sát, đánh giá hiệu quả việc áp dụng kết quả nghiên cứu vào thực tiễn, có so sánh trước – sau khi áp dụng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.2_TM8", "tc": "TC68", "ma": "C10.2", "tm": "TM8", "muc": "Mức 5", "noidung": "Có triển khai áp dụng ít nhất 05 kết quả nghiên cứu vào thực tiễn để cải tiến chất lượng khám, chữa bệnh và nâng cao hoạt động bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.2_TM9", "tc": "TC68", "ma": "C10.2", "tm": "TM9", "muc": "Mức 5", "noidung": "Có ít nhất 01 sáng kiến hoặc giải pháp mới về cải tiến chất lượng khám, chữa bệnh dựa trên nghiên cứu; được đăng ký bản quyền sở hữu trí tuệ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "C10.2_TM10", "tc": "TC68", "ma": "C10.2", "tm": "TM10", "muc": "Mức 5", "noidung": "Có báo cáo đánh giá hiệu quả việc áp dụng các sáng kiến hoặc giải pháp mới và khắc phục các nhược điểm (nếu có), liên tục cải tiến chất lượng dựa trên các bằng chứng khoa học.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Phan Thị Lưu"}, {"id": "D1.1_TM1", "tc": "TC69", "ma": "D1.1", "tm": "TM1", "muc": "Mức 1", "noidung": "Chưa thành lập hội đồng quản lý chất lượng bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D1.1_TM2", "tc": "TC69", "ma": "D1.1", "tm": "TM2", "muc": "Mức 1", "noidung": "Chưa thành lập phòng/tổ quản lý chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D1.1_TM3", "tc": "TC69", "ma": "D1.1", "tm": "TM3", "muc": "Mức 2", "noidung": "Đã thành lập hội đồng quản lý chất lượng bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D1.1_TM4", "tc": "TC69", "ma": "D1.1", "tm": "TM4", "muc": "Mức 2", "noidung": "Đã thành lập đầy đủ mạng lưới quản lý chất lượng bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D1.1_TM5", "tc": "TC69", "ma": "D1.1", "tm": "TM5", "muc": "Mức 2", "noidung": "Đã xây dựng đề án thành lập phòng/tổ quản lý chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D1.1_TM6", "tc": "TC69", "ma": "D1.1", "tm": "TM6", "muc": "Mức 2", "noidung": "Đề án thành lập phòng/tổ quản lý chất lượng có quy định rõ các vị trí việc làm quản lý chất lượng (hoặc xây dựng đề án vị trí việc làm riêng của phòng, hoặc lồng ghép trong đề án vị trí việc làm chung của bệnh viện).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D1.1_TM7", "tc": "TC69", "ma": "D1.1", "tm": "TM7", "muc": "Mức 2", "noidung": "Bệnh viện đa khoa hạng I và đặc biệt đã thành lập phòng quản lý chất lượng; các bệnh viện khác đã thành lập tổ (hoặc phòng) quản lý chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D1.1_TM8", "tc": "TC69", "ma": "D1.1", "tm": "TM8", "muc": "Mức 3", "noidung": "Đã xây dựng quy chế hoạt động của hội đồng quản lý chất lượng bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D1.1_TM9", "tc": "TC69", "ma": "D1.1", "tm": "TM9", "muc": "Mức 3", "noidung": "Phòng (hoặc tổ quản lý chất lượng) có ít nhất 3 nhân viên làm việc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D1.1_TM10", "tc": "TC69", "ma": "D1.1", "tm": "TM10", "muc": "Mức 3", "noidung": "Phòng (hoặc tổ quản lý chất lượng) có ít nhất một nhân viên chuyên trách về quản lý chất lượng (làm 100% thời gian, không kiêm nhiệm).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D1.1_TM11", "tc": "TC69", "ma": "D1.1", "tm": "TM11", "muc": "Mức 3", "noidung": "Đã tuyển được ít nhất 60% số lượng nhân viên của phòng/tổ quản lý chất lượng theo kế hoạch và vị trí việc làm, trong đó vị trí trưởng phòng/tổ trưởng tuyển dụng được đúng đối tượng như trong kế hoạch.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D1.1_TM12", "tc": "TC69", "ma": "D1.1", "tm": "TM12", "muc": "Mức 3", "noidung": "Hội đồng quản lý chất lượng tổ chức các cuộc họp định kỳ theo đúng kế hoạch.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D1.1_TM13", "tc": "TC69", "ma": "D1.1", "tm": "TM13", "muc": "Mức 3", "noidung": "Đã xây dựng và ban hành các văn bản về quản lý chất lượng trong bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D1.1_TM14", "tc": "TC69", "ma": "D1.1", "tm": "TM14", "muc": "Mức 4", "noidung": "Có ít nhất 01 lãnh đạo phòng (trưởng, phó phòng hoặc tổ trưởng, tổ phó) quản lý chất lượng là nhân viên chuyên trách, không kiêm nhiệm chức danh lãnh đạo bệnh viện hoặc lãnh đạo các khoa/phòng khác.", "minhchung": "", "dg2024": "", "dg2 Mức 5", "noidung": "Xác định nguyên nhân và giải pháp khắc phục các đề án cải tiến chất lượng chưa hoàn thành và xây dựng phương án, triển khai thực hiện đầy đủ các đề án cải tiến chất lượng đã xây dựng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D1.2_TM20", "tc": "TC70", "ma": "D1.2", "tm": "TM20", "muc": "Mức 5", "noidung": "Đề xuất và áp dụng các sáng kiến, giải pháp cải tiến chất lượng; có đánh giá tác động, so sánh trước-sau và có bằng chứng cải tiến chất lượng cụ thể sau khi áp dụng các sáng kiến, giải pháp.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D1.3_TM1", "tc": "TC71", "ma": "D1.3", "tm": "TM1", "muc": "Mức 1", "noidung": "Báo chí và cơ quan truyền thông khác phản ánh về tai biến/sự cố y khoa hoặc vi phạm y đức nghiêm trọng, gây ảnh hưởng đến hình ảnh của bệnh viện và ngành y (sau khi xác minh là đúng).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM2", "tc": "TC71", "ma": "D1.3", "tm": "TM2", "muc": "Mức 1", "noidung": "Báo chí và các cơ quan truyền thông có phản ánh về các biểu hiện mất đoàn kết, dân chủ của bệnh viện (sau khi xác minh là đúng).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM3", "tc": "TC71", "ma": "D1.3", "tm": "TM3", "muc": "Mức 1", "noidung": "Trong năm có xảy ra sự cố y khoa nghiêm trọng hoặc các vụ việc ngoài chuyên môn trong cung ứng dịch vụ của bệnh viện, gây ảnh hưởng lớn trên phạm vi toàn quốc đến hình ảnh và uy tín của ngành y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM4", "tc": "TC71", "ma": "D1.3", "tm": "TM4", "muc": "Mức 1", "noidung": "Bệnh viện tự quảng cáo/gắn sao không đúng với năng lực chuyên môn thực tế; hoặc quảng cáo/gắn sao cho các phạm trù/lĩnh vực khác ngoài chuyên môn có thể gây hiểu nhầm với chất lượng chuyên môn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM5", "tc": "TC71", "ma": "D1.3", "tm": "TM5", "muc": "Mức 2", "noidung": "Không xảy ra sự cố y khoa nghiêm trọng hoặc các vụ việc ngoài chuyên môn trong cung ứng dịch vụ của bệnh viện (có thể có sự cố y khoa hoặc sự cố ngoài chuyên môn nhưng chưa gây ảnh hưởng đến uy tín và hình ảnh của ngành y tế).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM6", "tc": "TC71", "ma": "D1.3", "tm": "TM6", "muc": "Mức 2", "noidung": "Có biểu trưng (lô-gô) mang ý nghĩa và đặc trưng của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM7", "tc": "TC71", "ma": "D1.3", "tm": "TM7", "muc": "Mức 3", "noidung": "Xây dựng khẩu hiệu (slogan) mang ý nghĩa và đặc trưng của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM8", "tc": "TC71", "ma": "D1.3", "tm": "TM8", "muc": "Mức 3", "noidung": "Có trang thông tin điện tử của bệnh viện; thông tin cập nhật thường xuyên ít nhất 1 tuần 1 lần.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM9", "tc": "TC71", "ma": "D1.3", "tm": "TM9", "muc": "Mức 3", "noidung": "Trang thông tin điện tử của bệnh viện cung cấp các thông tin chung về bệnh viện: lịch sử hình thành và phát triển; thành tích; sơ đồ tổ chức; bộ máy nhân sự, lãnh đạo; biểu trưng, khẩu hiệu, lịch làm việc, giá dịch vụ y tế, truyền thông giáo dục sức khỏe; ưu, nhược điểm về cải tiến chất lượng bệnh viện…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM10", "tc": "TC71", "ma": "D1.3", "tm": "TM10", "muc": "Mức 4", "noidung": "Xây dựng bộ nhận diện thương hiệu và quy định sử dụng bộ nhận diện thương hiệu.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM11", "tc": "TC71", "ma": "D1.3", "tm": "TM11", "muc": "Mức 4", "noidung": "Áp dụng bộ nhận diện thương hiệu trên toàn bộ các hoạt động chính thức của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM12", "tc": "TC71", "ma": "D1.3", "tm": "TM12", "muc": "Mức 4", "noidung": "Công bố bộ nhận diện thương hiệu và sử dụng thống nhất trên phạm vi toàn bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM13", "tc": "TC71", "ma": "D1.3", "tm": "TM13", "muc": "Mức 4", "noidung": "Có hình thức khuyến khích các khoa/phòng xây dựng các khẩu hiệu, mục tiêu chất lượng cụ thể của riêng từng khoa/phòng để nhân viên cùng phấn đấu và hướng tới các mục tiêu chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM14", "tc": "TC71", "ma": "D1.3", "tm": "TM14", "muc": "Mức 4", "noidung": "Có ít nhất 30% khoa/phòng đã xây dựng các khẩu hiệu, mục tiêu chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM15", "tc": "TC71", "ma": "D1.3", "tm": "TM15", "muc": "Mức 4", "noidung": "Có ít nhất 10% các khẩu hiệu, mục tiêu chất lượng của khoa/phòng mang ý nghĩa đặc trưng cho tính chất công việc của khoa/phòng đó.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM16", "tc": "TC71", "ma": "D1.3", "tm": "TM16", "muc": "Mức 4", "noidung": "Có hình thức khuyến khích, thúc đẩy nhân viên y tế cải tiến chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM17", "tc": "TC71", "ma": "D1.3", "tm": "TM17", "muc": "Mức 5", "noidung": "Có đoạn phim ngắn trong vòng 5-10 phút giới thiệu về bệnh viện, có lời bình bằng tiếng Việt, phụ đề tiếng Anh (hoặc ngược lại).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM18", "tc": "TC71", "ma": "D1.3", "tm": "TM18", "muc": "Mức 5", "noidung": "Có ít nhất 70% khoa/phòng đã xây dựng các khẩu hiệu, mục tiêu chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM19", "tc": "TC71", "ma": "D1.3", "tm": "TM19", "muc": "Mức 5", "noidung": "Có ít nhất 50% các khẩu hiệu, mục tiêu chất lượng của khoa/phòng mang ý nghĩa đặc trưng cho tính chất công việc của khoa/phòng đó.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM20", "tc": "TC71", "ma": "D1.3", "tm": "TM20", "muc": "Mức 5", "noidung": "Từng bước xây dựng “văn hóa chất lượng” thông qua các hình thức khuyến khích, thúc đẩy toàn bộ nhân viên y tế hướng tới các mục tiêu chất lượng của bệnh viện và của từng khoa/phòng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM21", "tc": "TC71", "ma": "D1.3", "tm": "TM21", "muc": "Mức 5", "noidung": "Người bệnh có ý kiến tích cực về phong cách và chất lượng dịch vụ khám, chữa bệnh (dựa trên các kênh phản hồi thông tin của người bệnh).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D1.3_TM22", "tc": "TC71", "ma": "D1.3", "tm": "TM22", "muc": "Mức 5", "noidung": "Là mô hình kiểu mẫu hoặc tấm gương, “điểm sáng” về cải tiến chất lượng cho các bệnh viện khác học tập.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "D2.1_TM1", "tc": "TC72", "ma": "D2.1", "tm": "TM1", "muc": "Mức 1", "noidung": "Có trường hợp người bệnh gặp diễn biến xấu nhưng không gọi được nhân viên y tế, gây hậu quả nghiêm trọng (tử vong hoặc tổn thương không hồi phục).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.1_TM2", "tc": "TC72", "ma": "D2.1", "tm": "TM2", "muc": "Mức 2", "noidung": "Có biển báo, hướng dẫn người bệnh cách gọi nhân viên y tế trong trường hợp khẩn cấp tại các vị trí dễ quan sát.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.1_TM3", "tc": "TC72", "ma": "D2.1", "tm": "TM3", "muc": "Mức 2", "noidung": "Có chuông (hoặc hình thức khác) để liên hệ hoặc báo gọi nhân viên y tế tại các khoa lâm sàng trong trường hợp cần thiết.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.1_TM4", "tc": "TC72", "ma": "D2.1", "tm": "TM4", "muc": "Mức 3", "noidung": "Giường chuyên dùng cho hồi sức cấp cứu có hệ thống báo gọi.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.1_TM5", "tc": "TC72", "ma": "D2.1", "tm": "TM5", "muc": "Mức 3", "noidung": "Có hệ thống chuông hoặc đèn báo đầu giường tại toàn bộ các giường bệnh cấp cứu và các giường có người bệnh chăm sóc cấp I.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.1_TM6", "tc": "TC72", "ma": "D2.1", "tm": "TM6", "muc": "Mức 4", "noidung": "Có hệ thống ô-xy trung tâm cho phòng cấp cứu của khoa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.1_TM7", "tc": "TC72", "ma": "D2.1", "tm": "TM7", "muc": "Mức 4", "noidung": "Các máy thở, máy theo dõi liên tục cho người bệnh, máy truyền dịch… tại giường cấp cứu có cảnh báo tự động nếu gặp tình huống nguy hiểm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.1_TM8", "tc": "TC72", "ma": "D2.1", "tm": "TM8", "muc": "Mức 4", "noidung": "Có cán bộ y tế trực theo dõi camera hoặc theo dõi trực tiếp buồng bệnh 24/24 giờ đối với các buồng bệnh cấp cứu, điều trị tích cực.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.1_TM9", "tc": "TC72", "ma": "D2.1", "tm": "TM9", "muc": "Mức 4", "noidung": "Định kỳ ít nhất 6 tháng 1 lần tiến hành rà soát và đánh giá dựa trên bảng kiểm việc thực hiện phòng ngừa các nguy cơ, diễn biến xấu xảy ra với người bệnh tại các khu vực có nguy cơ cao hoặc đã xảy ra các sự cố, trong đó có phát hiện những nhược điểm cần khắc phục, phân tích các sự cố y khoa đã xảy ra (nếu có).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.1_TM10", "tc": "TC72", "ma": "D2.1", "tm": "TM10", "muc": "Mức 5", "noidung": "Các máy thở, máy theo dõi liên tục cho người bệnh, máy truyền dịch… tại các giường bệnh đều có cảnh báo tự động nếu gặp tình huống nguy hiểm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.1_TM11", "tc": "TC72", "ma": "D2.1", "tm": "TM11", "muc": "Mức 5", "noidung": "Có hệ thống ô-xy trung tâm cho toàn bộ giường bệnh của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.1_TM12", "tc": "TC72", "ma": "D2.1", "tm": "TM12", "muc": "Mức 5", "noidung": "Có hệ thống chuông hoặc đèn báo đầu giường tại toàn bộ các giường bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.1_TM13", "tc": "TC72", "ma": "D2.1", "tm": "TM13", "muc": "Mức 5", "noidung": "Bên trong toàn bộ các buồng vệ sinh có chuông báo gọi trợ giúp trong trường hợp cần thiết (tỷ lệ 100% các buồng vệ sinh có chuông báo gọi).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.1_TM14", "tc": "TC72", "ma": "D2.1", "tm": "TM14", "muc": "Mức 5", "noidung": "Có camera theo dõi người bệnh theo yêu cầu của người nhà người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.1_TM15", "tc": "TC72", "ma": "D2.1", "tm": "TM15", "muc": "Mức 5", "noidung": "Tiến hành cải tiến chất lượng, phòng ngừa các nguy cơ, diễn biến xấu xảy ra với người bệnh dựa trên kết quả đánh giá theo bảng kiểm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.2_TM1", "tc": "TC73", "ma": "D2.2", "tm": "TM1", "muc": "Mức 1", "noidung": "Không triển khai hệ thống báo cáo sự cố y khoa (bằng sổ sách hoặc phần mềm máy tính).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM2", "tc": "TC73", "ma": "D2.2", "tm": "TM2", "muc": "Mức 1", "noidung": "Phát hiện thấy bệnh viện có sự cố y khoa đã xảy ra trong năm nhưng không được hệ thống báo cáo sự cố y khoa ghi nhận.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM3", "tc": "TC73", "ma": "D2.2", "tm": "TM3", "muc": "Mức 2", "noidung": "Có hệ thống báo cáo sự cố y khoa chung của toàn bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM4", "tc": "TC73", "ma": "D2.2", "tm": "TM4", "muc": "Mức 2", "noidung": "Hệ thống báo cáo sự cố y khoa có ghi nhận các sự cố xảy ra.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM5", "tc": "TC73", "ma": "D2.2", "tm": "TM5", "muc": "Mức 2", "noidung": "Toàn bộ các sự cố y khoa xảy ra trong năm được hệ thống báo cáo sự cố y khoa chung của bệnh viện ghi nhận đầy đủ, không bỏ sót các sự cố.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM6", "tc": "TC73", "ma": "D2.2", "tm": "TM6", "muc": "Mức 3", "noidung": "Bệnh viện có quy định về việc quản lý sự cố y khoa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM7", "tc": "TC73", "ma": "D2.2", "tm": "TM7", "muc": "Mức 3", "noidung": "100% các khoa lâm sàng, cận lâm sàng và các khoa/phòng triển khai hệ thống báo cáo sự cố y khoa theo quy định của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM8", "tc": "TC73", "ma": "D2.2", "tm": "TM8", "muc": "Mức 3", "noidung": "Hệ thống báo cáo sự cố y khoa có ghi đầy đủ, trung thực các thông tin, thời gian, diễn biến sự cố xảy ra; cung cấp được đủ thông tin cho việc phân tích sự cố để rút kinh nghiệm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM9", "tc": "TC73", "ma": "D2.2", "tm": "TM9", "muc": "Mức 3", "noidung": "Triển khai thực hiện phiếu báo cáo sự cố y khoa tự nguyện (hoặc hình thức báo cáo tự nguyện khác) cho nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM10", "tc": "TC73", "ma": "D2.2", "tm": "TM10", "muc": "Mức 3", "noidung": "Nhân viên có báo cáo sự cố y khoa đầy đủ theo phiếu báo cáo khi xảy ra sự cố y khoa (hoặc theo các hình thức báo cáo tự nguyện khác của bệnh viện).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM11", "tc": "TC73", "ma": "D2.2", "tm": "TM11", "muc": "Mức 3", "noidung": "Có điều tra, phân tích, tìm nguyên nhân gốc rễ và đề xuất giải pháp cải tiến tránh lặp lại các sự cố y khoa đã xảy ra.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM12", "tc": "TC73", "ma": "D2.2", "tm": "TM12", "muc": "Mức 4", "noidung": "Có phân tích sự cố y khoa theo định kỳ ít nhất 1 lần trong 6 tháng và phản hồi cho cá nhân và tập thể liên quan.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM13", "tc": "TC73", "ma": "D2.2", "tm": "TM13", "muc": "Mức 4", "noidung": "Có hình thức động viên, khuyến khích cho người tự giác, tự nguyện báo cáo sự cố y khoa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM14", "tc": "TC73", "ma": "D2.2", "tm": "TM14", "muc": "Mức 4", "noidung": "Có tổng hợp, phân tích số liệu về sự cố y khoa xảy ra tại bệnh viện định kỳ hằng năm và gửi báo cáo tới các khoa/phòng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM15", "tc": "TC73", "ma": "D2.2", "tm": "TM15", "muc": "Mức 4", "noidung": "Có xây dựng các giải pháp khắc phục sự cố y khoa đã được báo cáo.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM16", "tc": "TC73", "ma": "D2.2", "tm": "TM16", "muc": "Mức 4", "noidung": "Có tiến hành rà soát, đánh giá lại ít nhất 1 lần trong năm việc ghi chép, báo cáo về sự cố y khoa tại bệnh viện, trong đó xác định những việc đã làm, chưa làm được, hoặc chưa đạt yêu cầu và các mặt hạn chế cần khắc phục.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM17", "tc": "TC73", "ma": "D2.2", "tm": "TM17", "muc": "Mức 5", "noidung": "Áp dụng công nghệ thông tin để xây dựng hệ thống ghi nhận và quản lý các sự cố y khoa bằng phần mềm điện tử.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM18", "tc": "TC73", "ma": "D2.2", "tm": "TM18", "muc": "Mức 5", "noidung": "Phần mềm công nghệ thông tin tự động phân tích và chiết xuất kết quả dưới dạng hình vẽ, biểu đồ… các sự cố y khoa đã xảy ra theo địa điểm, thời gian, tần suất… xảy ra.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM19", "tc": "TC73", "ma": "D2.2", "tm": "TM19", "muc": "Mức 5", "noidung": "Các sự cố y khoa xảy ra được xem xét và tìm ra nguyên nhân gốc dựa vào các phương pháp, mô hình phân tích nguyên nhân gốc rễ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM20", "tc": "TC73", "ma": "D2.2", "tm": "TM20", "muc": "Mức 5", "noidung": "Tiến hành cải tiến chất lượng hệ thống báo cáo sự cố y khoa, đặc biệt hệ thống báo cáo sự cố tự nguyện và các phiếu báo cáo sự cố.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.2_TM21", "tc": "TC73", "ma": "D2.2", "tm": "TM21", "muc": "Mức 5", "noidung": "Xây dựng “văn hóa tự giác” báo cáo sự cố y khoa: không có nhân viên y tế che giấu các sự cố y khoa đã xảy ra và sự cố “gần như sắp xảy ra” (near miss).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM1", "tc": "TC74", "ma": "D2.3", "tm": "TM1", "muc": "Mức 1", "noidung": "Bệnh viện chưa triển khai các biện pháp phòng ngừa các sự cố y khoa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM2", "tc": "TC74", "ma": "D2.3", "tm": "TM2", "muc": "Mức 2", "noidung": "*Có các bảng kiểm an toàn phẫu thuật, thủ thuật trong phòng mổ và phòng làm thủ thuật hướng dẫn kiểm tra, rà soát quá trình làm thủ thuật, chống thực hiện phẫu thuật/thủ thuật sai vị trí, sai người bệnh, sai thuốc, sai đường/kỹ thuật thực hiện…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM3", "tc": "TC74", "ma": "D2.3", "tm": "TM3", "muc": "Mức 2", "noidung": "Có quy tắc, quy chế kiểm tra lại thuốc và dịch truyền trước khi đưa thuốc hoặc tiêm, truyền cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM4", "tc": "TC74", "ma": "D2.3", "tm": "TM4", "muc": "Mức 2", "noidung": "Có bản danh sách thống kê các sự cố y khoa thường xảy ra và các quy trình kỹ thuật có liên quan thường xảy ra các sự cố y khoa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM5", "tc": "TC74", "ma": "D2.3", "tm": "TM5", "muc": "Mức 3", "noidung": "*Triển khai áp dụng bảng kiểm an toàn phẫu thuật, thủ thuật tại phòng mổ cho ít nhất 50% số ca phẫu thuật trở lên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM6", "tc": "TC74", "ma": "D2.3", "tm": "TM6", "muc": "Mức 3", "noidung": "Có xây dựng bảng kiểm đánh giá việc tuân thủ cho ít nhất 5 quy trình kỹ thuật (ưu tiên các quy trình được thực hiện thường xuyên tại bệnh viện).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM7", "tc": "TC74", "ma": "D2.3", "tm": "TM7", "muc": "Mức 3", "noidung": "Có kiểm tra (định kỳ thường xuyên hoặc đột xuất) việc tuân thủ quy trình kỹ thuật theo các bảng kiểm đã xây dựng, có biên bản kiểm tra lưu trữ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM8", "tc": "TC74", "ma": "D2.3", "tm": "TM8", "muc": "Mức 3", "noidung": "Có ghi lại và có báo cáo các hành vi đã xảy ra trên thực tế, có thể gây ra hậu quả nhưng được phát hiện và ngăn chặn kịp thời (là các sự cố “gần như sắp xảy ra”.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM9", "tc": "TC74", "ma": "D2.3", "tm": "TM9", "muc": "Mức 4", "noidung": "Có xây dựng bảng kiểm đánh giá tình hình thực tế áp dụng bảng kiểm an toàn phẫu thuật, thủ thuật tại phòng phẫu thuật, phòng thủ thuật.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM10", "tc": "TC74", "ma": "D2.3", "tm": "TM10", "muc": "Mức 4", "noidung": "Có tiến hành giám sát việc áp dụng bảng kiểm an toàn phẫu thuật, thủ thuật theo hình thức kiểm tra ngẫu nhiên, không báo trước tại các phòng phẫu thuật, phòng thủ thuật (phòng quản lý chất lượng làm đầu mối giám sát hoặc do hội đồng chất lượng của bệnh viện phân công).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM11", "tc": "TC74", "ma": "D2.3", "tm": "TM11", "muc": "Mức 4", "noidung": "*Có báo cáo giám sát việc áp dụng bảng kiểm an toàn phẫu thuật, thủ thuật, trong đó có phân tích số liệu, biểu đồ, tính toán tỷ lệ tuân thủ áp dụng bảng kiểm chia theo kíp mổ (hoặc kíp làm thủ thuật); chia theo khoa lâm sàng (hoặc người thực hiện…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM12", "tc": "TC74", "ma": "D2.3", "tm": "TM12", "muc": "Mức 4", "noidung": "Xây dựng bảng kiểm đánh giá việc tuân thủ cho ít nhất 10 quy trình kỹ thuật (ưu tiên các quy trình được thực hiện thường xuyên tại bệnh viện).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM13", "tc": "TC74", "ma": "D2.3", "tm": "TM13", "muc": "Mức 4", "noidung": "Các sự cố “gần như sắp xảy ra” được thu thập, tổng hợp và rút kinh nghiệm trên toàn bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM14", "tc": "TC74", "ma": "D2.3", "tm": "TM14", "muc": "Mức 4", "noidung": "Có báo cáo đánh giá hoặc nghiên cứu về sự cố và phân tích xu hướng, nguyên nhân và đề xuất giải pháp hạn chế sự cố y khoa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM15", "tc": "TC74", "ma": "D2.3", "tm": "TM15", "muc": "Mức 5", "noidung": "Báo cáo đánh giá, nghiên cứu về sự cố y khoa có tỷ lệ sự cố y khoa cụ thể tại một số lĩnh vực, khoa/phòng và đề xuất giải pháp cải tiến chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM16", "tc": "TC74", "ma": "D2.3", "tm": "TM16", "muc": "Mức 5", "noidung": "Áp dụng các kết quả phân tích, đánh giá vào việc triển khai các biện pháp phòng ngừa để giảm thiểu các sự cố y khoa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM17", "tc": "TC74", "ma": "D2.3", "tm": "TM17", "muc": "Mức 5", "noidung": "Có bản tin an toàn y tế định kỳ, ít nhất 2 lần trong 1 năm; trong bản tin có thông tin sự cố y khoa, các hướng dẫn, giải pháp phòng ngừa...", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM18", "tc": "TC74", "ma": "D2.3", "tm": "TM18", "muc": "Mức 5", "noidung": "Khắc phục đầy đủ, không để lặp lại các sự cố y khoa do “lỗi hệ thống” đã được phát hiện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.3_TM19", "tc": "TC74", "ma": "D2.3", "tm": "TM19", "muc": "Mức 5", "noidung": "Triển khai các giải pháp cải tiến chất lượng, hạn chế không lặp lại các sự cố y khoa tương tự.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D2.4_TM1", "tc": "TC75", "ma": "D2.4", "tm": "TM1", "muc": "Mức 1", "noidung": "Phát hiện bệnh viện có nhầm lẫn người bệnh khi cung cấp dịch vụ, gây hậu quả nghiêm trọng đối với người bệnh về mặt thể chất hoặc tinh thần, ví dụ đưa nhầm con sau khi sinh, có di chứng, tổn thương không khắc phục được do phẫu thuật như phẫu thuật nhầm vị trí, cắt nhầm bộ phận cơ thể… hoặc người bệnh tử vong.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "D2.4_TM2", "tc": "TC75", "ma": "D2.4", "tm": "TM2", "muc": "Mức 2", "noidung": "Có xây dựng quy định/quy trình về xác nhận và khẳng định đúng người bệnh, đúng loại dịch vụ sẽ cung cấp cho người bệnh trước khi tiến hành các dịch vụ chẩn đoán, điều trị, phẫu thuật, thủ thuật...", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "D2.4_TM3", "tc": "TC75", "ma": "D2.4", "tm": "TM3", "muc": "Mức 2", "noidung": "Có bảng tóm tắt các bước cần khẳng định chính xác người bệnh và đặt tại các vị trí dễ thấy để nhắc nhở người cung cấp dịch vụ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "D2.4_TM4", "tc": "TC75", "ma": "D2.4", "tm": "TM4", "muc": "Mức 2", "noidung": "Có xây dựng quy định về việc xác nhận bàn giao đúng người bệnh giữa các nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "D2.4_TM5", "tc": "TC75", "ma": "D2.4", "tm": "TM5", "muc": "Mức 2", "noidung": "Phổ biến cho nhân viên y tế các quy định/quy trình về xác nhận đúng người bệnh và dịch vụ cung cấp.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "D2.4_TM6", "tc": "TC75", "ma": "D2.4", "tm": "TM6", "muc": "Mức 2", "noidung": "Có danh sách những người bệnh bị cung cấp nhầm dịch vụ đã xảy ra trong năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "D2.4_TM7", "tc": "TC75", "ma": "D2.4", "tm": "TM7", "muc": "Mức 3", "noidung": "Người cung cấp dịch vụ bảo đảm thực hiện đầy đủ các bước để khẳng định chính xác người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "D2.4_TM8", "tc": "TC75", "ma": "D2.4", "tm": "TM8", "muc": "Mức 3", "noidung": "Có xây dựng các bảng kiểm để thực hiện kiểm tra, đối chiếu người bệnh và dịch vụ cung cấp.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "D2.4_TM9", "tc": "TC75", "ma": "D2.4", "tm": "TM9", "muc": "Mức 3", "noidung": "Áp dụng bảng kiểm thực hiện tra, chiếu để xác nhận và khẳng định lại tên, năm sinh, đặc điểm bệnh tật… của người bệnh trước khi cung cấp dịch vụ (trong trường hợp người bệnh không thể trả lời cần xác nhận thông qua người nhà người bệnh).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "D2.4_TM10", "tc": "TC75", "ma": "D2.4", "tm": "TM10", "muc": "Mức 3", "noidung": "Áp dụng các hình thức thủ công (hoặc công nghệ thông tin) như ghi tên, ghi số, phát số… cho người bệnh và các mẫu bệnh phẩm, dụng cụ, thuốc, vật tư… có liên quan đến người bệnh để tránh nhầm lẫn khi cung cấp dịch vụ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "D2.4_TM11", "tc": "TC75", "ma": "D2.4", "tm": "TM11", "muc": "Mức 3", "noidung": "Thông tin ghi trên mẫu bệnh phẩm bảo đảm có ít nhất các thông tin cơ bản như họ và tên, năm sinh, giới của người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "D2.4_TM12", "tc": "TC75", "ma": "D2.4", "tm": "TM12", "muc": "Mức 4", "noidung": "Tất cả người bệnh được cung cấp mã số/mã vạch duy nhất trong quá trình khám và điều trị tại bệnh viện để bảo đảm không nhầm lẫn người bệnh khi cung cấp dịch vụ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "D2.4_TM13", "tc": "TC75", "ma": "D2.4", "tm": "TM13", "muc": "Mức 4", "noidung": "Áp dụng giải pháp công nghệ thông tin, các trang thiết bị điện tử và mã số/mã vạch để xác nhận tên và dịch vụ cung cấp cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "D2.4_TM14", "tc": "TC75", "ma": "D2.4", "tm": "TM14", "muc": "Mức 4", "noidung": "Không có trường hợp nhầm lẫn người bệnh trong xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng, phát thuốc cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "D2.4_TM15", "tc": "TC75", "ma": "D2.4", "tm": "TM15", "muc": "Mức 5", "noidung": "Trong năm không có nhầm lẫn khi cung cấp tất cả các dịch vụ cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "D2.4_TM16", "tc": "TC75", "ma": "D2.4", "tm": "TM16", "muc": "Mức 5", "noidung": "Tiến hành rà soát, đánh giá theo định kỳ (ít nhất 1 lần trong năm) việc triển khai thực hiện các biện pháp phòng chống nhầm lẫn người bệnh đang triển khai.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "D2.4_TM17", "tc": "TC75", "ma": "D2.4", "tm": "TM17", "muc": "Mức 5", "noidung": "Có báo cáo, đánh giá trong đó có xác định các yếu tố, hành vi, kỹ thuật… có nguy cơ gây nhầm lẫn và đề xuất giải pháp khắc phục.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "D2.4_TM18", "tc": "TC75", "ma": "D2.4", "tm": "TM18", "muc": "Mức 5", "noidung": "Tiến hành cải tiến chất lượng, chống nhầm lẫn người bệnh dựa trên kết quả rà soát, đánh giá.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "D2.5_TM1", "tc": "TC76", "ma": "D2.5", "tm": "TM1", "muc": "Mức 1", "noidung": "Có vụ việc người bệnh, nhân viên y tế bị trượt ngã, tai nạn trong khuôn viên bệnh viện, gây hậu quả cần điều trị và chăm sóc y khoa nhưng không được hệ thống báo cáo sự cố y khoa ghi nhận.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM2", "tc": "TC76", "ma": "D2.5", "tm": "TM2", "muc": "Mức 1", "noidung": "Có vụ việc người bệnh, nhân viên y tế, người đến thăm bị trượt ngã, tai nạn dẫn đến hậu quả nghiêm trọng như chấn thương sọ não, gãy chân tay… trong khuôn viên bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM3", "tc": "TC76", "ma": "D2.5", "tm": "TM3", "muc": "Mức 1", "noidung": "Có vụ việc người bệnh, trẻ em bị rơi khỏi xe hoặc cáng trong quá trình vận chuyển người bệnh trong khuôn viên bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM4", "tc": "TC76", "ma": "D2.5", "tm": "TM4", "muc": "Mức 2", "noidung": "Có bản danh sách thống kê những người bị trượt ngã (kể cả tự tử) tại bệnh viện trong năm, phân theo các mức độ hậu quả như tử vong; gãy chân, tay; chấn thương sọ não; chấn thương phủ tạng; chảy máu…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM5", "tc": "TC76", "ma": "D2.5", "tm": "TM5", "muc": "Mức 2", "noidung": "Không có vụ việc người bệnh bị rơi ra khỏi xe hoặc cáng trong quá trình vận chuyển trong khuôn viên bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM6", "tc": "TC76", "ma": "D2.5", "tm": "TM6", "muc": "Mức 2", "noidung": "Có tiến hành rà soát tổng thể ít nhất 1 lần trong 1 năm và lập danh sách các vị trí có nguy cơ trượt ngã do thiết kế, do cơ sở hạ tầng không đồng bộ hoặc xuống cấp hoặc do lý do bất kỳ khác dẫn tới nguy cơ trượt ngã.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM7", "tc": "TC76", "ma": "D2.5", "tm": "TM7", "muc": "Mức 2", "noidung": "Có cảnh báo nguy hiểm tại tất cả các vị trí có nguy cơ trượt, ngã như sàn trơn, nhà vệ sinh, cầu thang, vị trí không bằng phẳng...", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM8", "tc": "TC76", "ma": "D2.5", "tm": "TM8", "muc": "Mức 2", "noidung": "Các vị trí có nguy cơ trượt, vấp, ngã do cơ sở hạ tầng không đồng bộ, do thiết kế xây dựng hoặc xuống cấp được ưu tiên xử lý.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM9", "tc": "TC76", "ma": "D2.5", "tm": "TM9", "muc": "Mức 3", "noidung": "Chiều cao của lan can và chấn song cửa sổ được thiết kế đủ cao, bảo đảm từ 1m40 trở lên để không có người bị ngã xuống do vô ý (chấp nhận các khối nhà cũ xây trước 2016 có lan cao cao từ 1m35 trở lên).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM10", "tc": "TC76", "ma": "D2.5", "tm": "TM10", "muc": "Mức 3", "noidung": "Lan can và chấn song cửa sổ được thiết kế đủ hẹp không có lỗ hổng đút lọt quả cầu đường kính từ 10 cm trở lên để phòng chống trẻ em chui lọt qua.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM11", "tc": "TC76", "ma": "D2.5", "tm": "TM11", "muc": "Mức 3", "noidung": "Giường bệnh cho người bệnh có nguy cơ trượt ngã cao (trẻ em, người cao tuổi, người bị tổn thương thần kinh…) có thanh chắn phòng người bệnh trượt ngã.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM12", "tc": "TC76", "ma": "D2.5", "tm": "TM12", "muc": "Mức 4", "noidung": "Không có người bệnh bị rơi từ các bàn phẫu thuật, thủ thuật.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM13", "tc": "TC76", "ma": "D2.5", "tm": "TM13", "muc": "Mức 4", "noidung": "Không có vụ việc người bệnh bị trượt ngã, gặp hậu quả nghiêm trọng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM14", "tc": "TC76", "ma": "D2.5", "tm": "TM14", "muc": "Mức 4", "noidung": "Rà soát và đánh giá toàn bộ các trường hợp bị trượt ngã theo danh sách đã thống kê, trong đó có phân tích các nguyên nhân bị trượt ngã và đề xuất các giải pháp hạn chế trượt ngã.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM15", "tc": "TC76", "ma": "D2.5", "tm": "TM15", "muc": "Mức 4", "noidung": "Các giường bệnh được bệnh viện mua mới từ 2016 có thiết kế an toàn, có thành giường hoặc thanh chắn hạn chế nguy cơ bị rơi, ngã.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM16", "tc": "TC76", "ma": "D2.5", "tm": "TM16", "muc": "Mức 5", "noidung": "Có dán các vật liệu tăng ma sát tại các vị trí có nguy cơ trượt ngã như cầu thang, lối đi dốc…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM17", "tc": "TC76", "ma": "D2.5", "tm": "TM17", "muc": "Mức 5", "noidung": "Tại các vị trí chuyển tiếp không bằng phẳng của sàn nhà có dán các vật liệu thay đổi màu sắc để dễ nhận biết, tránh vấp, ngã (hoặc sử dụng vật liệu xây dựng cố định có màu sắc khác nhau) hoặc bổ sung tay vịn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM18", "tc": "TC76", "ma": "D2.5", "tm": "TM18", "muc": "Mức 5", "noidung": "Có giải pháp phòng chống tự tử tại các vị trí đã có người tự tử hoặc vị trí có nguy cơ cao (lắp lưới an toàn bảo vệ khi rơi, camera quan sát…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM19", "tc": "TC76", "ma": "D2.5", "tm": "TM19", "muc": "Mức 5", "noidung": "Toàn bộ các giường bệnh được thiết kế an toàn, có thành giường hoặc thanh chắn hạn chế nguy cơ bị rơi, ngã và được nhân viên y tế hướng dẫn cho các đối tượng có nguy cơ sử dụng thường xuyên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM20", "tc": "TC76", "ma": "D2.5", "tm": "TM20", "muc": "Mức 5", "noidung": "Triển khai thực hiện các giải pháp khắc phục toàn bộ những nguyên nhân dẫn đến các trường hợp trượt ngã đã xảy ra trong danh sách thống kê.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D2.5_TM21", "tc": "TC76", "ma": "D2.5", "tm": "TM21", "muc": "Mức 5", "noidung": "Không có người bệnh bị trượt ngã vì lí do cơ sở hạ tầng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "D3.1_TM1", "tc": "TC77", "ma": "D3.1", "tm": "TM1", "muc": "Mức 1", "noidung": "Bệnh viện không tiến hành đánh giá chất lượng bệnh viện theo hướng dẫn của Bộ Y tế, hoặc không có “Báo cáo kiểm tra, đánh giá bệnh viện hàng năm”.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.1_TM2", "tc": "TC77", "ma": "D3.1", "tm": "TM2", "muc": "Mức 2", "noidung": "Tổ chức tự tiến hành đánh giá chất lượng bệnh viện theo các tiêu chí và gửi/nộp “Báo cáo đánh giá chất lượng bệnh viện” cho cơ quan quản lý đầy đủ theo quy định.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.1_TM3", "tc": "TC77", "ma": "D3.1", "tm": "TM3", "muc": "Mức 2", "noidung": "*Tỷ lệ các tiêu chí có điểm do bệnh viện tự đánh giá cao hơn điểm của đoàn bên ngoài đánh giá (cơ quan quản lý hoặc tổ chức độc lập) dưới 10%.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.1_TM4", "tc": "TC77", "ma": "D3.1", "tm": "TM4", "muc": "Mức 3", "noidung": "Có tổ chức đánh giá chất lượng bệnh viện 6 tháng đầu năm vào thời điểm giữa năm; có quyết định, biên bản kiểm tra, trong đó có chỉ ra những vấn đề cần ưu tiên khắc phục, cải tiến.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.1_TM5", "tc": "TC77", "ma": "D3.1", "tm": "TM5", "muc": "Mức 3", "noidung": "Có bảng thống kê các tiểu mục theo từng tiêu chí trong “Bộ tiêu chí chất lượng bệnh viện” chưa đạt yêu cầu. và lý do chưa đạt.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.1_TM6", "tc": "TC77", "ma": "D3.1", "tm": "TM6", "muc": "Mức 3", "noidung": "Công bố và phổ biến kết quả “Báo cáo đánh giá chất lượng bệnh viện” cho các khoa/phòng, nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.1_TM7", "tc": "TC77", "ma": "D3.1", "tm": "TM7", "muc": "Mức 3", "noidung": "Công bố công khai tóm tắt kết quả đánh giá chất lượng bệnh viện cho người bệnh và người nhà người bệnh được biết tại các bảng tin/góc truyền thông… của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.1_TM8", "tc": "TC77", "ma": "D3.1", "tm": "TM8", "muc": "Mức 3", "noidung": "Trong báo cáo có phân tích rõ mặt mạnh, mặt yếu, khó khăn về chất lượng bệnh viện, những tồn tại và biện pháp khắc phục.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.1_TM9", "tc": "TC77", "ma": "D3.1", "tm": "TM9", "muc": "Mức 3", "noidung": "*Tỷ lệ các tiêu chí có điểm do bệnh viện tự đánh giá cao hơn điểm của đoàn bên ngoài đánh giá (cơ quan quản lý hoặc tổ chức độc lập) dưới 7%.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.1_TM10", "tc": "TC77", "ma": "D3.1", "tm": "TM10", "muc": "Mức 4", "noidung": "Có bảng thống kê các tiểu mục theo từng tiêu chí trong “Bộ tiêu chí chất lượng bệnh viện” chưa đạt yêu cầu, lý do chư
