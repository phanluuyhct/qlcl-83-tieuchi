<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ thống đánh giá 83 tiêu chí chất lượng bệnh viện</title>
<style>
:root{color-scheme:light;
  --page:#f4f5f7;--surface:#fff;--surface-2:#f8f9fb;--sidebar:#0f2540;--sidebar-2:#16324f;
  --ink:#0f1b2d;--ink-2:#5a6572;--muted:#95a0ad;--line:#e6e9ee;--border:rgba(15,27,45,.09);
  --brand:#1e6fd6;--brand-d:#1657ad;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;
  --good:#16a34a;--warn:#f59e0b;--crit:#dc2626;
  --shadow:0 1px 2px rgba(15,27,45,.05),0 4px 14px rgba(15,27,45,.05);
}
:root[data-theme="dark"]{color-scheme:dark;
  --page:#0c1220;--surface:#141c2b;--surface-2:#1b2536;--sidebar:#080f1c;--sidebar-2:#111c30;
  --ink:#eef2f7;--ink-2:#aab4c2;--muted:#7d8798;--line:#243044;--border:rgba(255,255,255,.09);
  --brand:#3987e5;--brand-d:#2a78d6;--good:#22c55e;--warn:#fbbf24;--crit:#f05252;
  --shadow:0 2px 6px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums}
button,select,input,textarea{font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
button{cursor:pointer;transition:.12s}
button:hover{border-color:var(--muted)}
.btn-p{background:var(--brand);color:#fff;border-color:transparent;font-weight:600}
.btn-p:hover{background:var(--brand-d)}
.hidden{display:none!important}
.muted{color:var(--muted)}

/* Login */
#login{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#0f2540,#1657ad);display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{background:var(--surface);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(430px,96vw);padding:34px 30px}
.loginbox .logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#1e6fd6,#16a34a);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:16px}
.loginbox h1{font-size:19px}
.loginbox .sub{color:var(--muted);font-size:13px;margin:4px 0 22px}
.loginbox label{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em;display:block;margin:14px 0 5px}
.loginbox select,.loginbox input{width:100%}
.loginbox .btn-p{width:100%;margin-top:22px;padding:11px}
.demo-note{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}

/* Shell */
#app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside.side{background:var(--sidebar);color:#cdd7e4;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .head{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.side .head .t{color:#fff;font-weight:700;font-size:15px;line-height:1.3}
.side .head .s{color:#8fa0b4;font-size:11.5px;margin-top:3px}
.side nav{padding:10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.side nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;color:#cdd7e4;padding:10px 12px;border-radius:9px;font-weight:600;font-size:13.5px}
.side nav button:hover{background:var(--sidebar-2);color:#fff}
.side nav button.on{background:var(--brand);color:#fff}
.side nav .ico{font-size:16px;width:20px;text-align:center}
.side .foot{padding:12px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#8fa0b4}
main.content{min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:11px 22px;box-shadow:var(--shadow)}
.topbar h2{font-size:16px;flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.yearpick{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.yearpick button{border:0;background:transparent;border-radius:0;padding:7px 10px;font-weight:600;color:var(--ink-2)}
.yearpick button.on{background:var(--brand);color:#fff}
.wrap{padding:22px}
.synctag{font-size:12px;padding:5px 10px;border-radius:999px;font-weight:600}
.sync-off{background:rgba(148,160,173,.15);color:var(--muted)}
.sync-on{background:rgba(22,163,74,.12);color:var(--good)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.card.pad{padding:18px}
.grid{display:grid;gap:14px}.k5{grid-template-columns:repeat(5,1fr)}.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.k5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){#app{grid-template-columns:1fr}aside.side{position:fixed;z-index:60;transform:translateX(-100%);transition:.2s;width:236px}aside.side.open{transform:none}.k5,.k4,.k3,.k2{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.k5,.k4,.k3,.k2{grid-template-columns:1fr}}
.menuBtn{display:none}@media(max-width:820px){.menuBtn{display:block}}

.kpi{padding:16px;display:flex;flex-direction:column;gap:5px}
.kpi .lab{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.kpi .val{font-size:28px;font-weight:700;line-height:1}
.kpi .sub{font-size:12px;color:var(--ink-2)}
.kpi.clik{cursor:pointer}.kpi.clik:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,27,45,.1)}
.delta{font-size:12px;font-weight:600}.up{color:var(--good)}.down{color:var(--crit)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 12px}
.sec h3{font-size:15px}.sec .hint{font-size:12px;color:var(--muted)}
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
.axis-lab{fill:var(--muted);font-size:11px}.grid-line{stroke:var(--line)}.baseline{stroke:var(--muted);opacity:.5}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:10px;height:10px;border-radius:3px}
.clik{cursor:pointer}svg [data-nav]:hover{opacity:.8}

.tbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tbar input[type=search]{min-width:220px;flex:1}
.notice{background:rgba(30,111,214,.07);border:1px solid rgba(30,111,214,.18);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--ink-2);margin-bottom:14px}
.score{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;border-radius:6px;font-weight:700;font-size:13px;color:#fff}
.sc1{background:#dc2626}.sc2{background:#ea7a4e}.sc3{background:#eda100}.sc4{background:#3f83e8}.sc5{background:#1c7d4d}.sc0{background:var(--line);color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--border)}
.tag.dbl{background:rgba(235,104,52,.12);color:var(--s2);border-color:transparent}
.tag.auto{background:rgba(30,111,214,.12);color:var(--brand);border-color:transparent}
.pill-good{color:var(--good);font-weight:600}.pill-bad{color:var(--crit);font-weight:600}

/* Tree */
.tree{display:flex;flex-direction:column;gap:2px}
.nhead{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-radius:8px;user-select:none}
.nhead:hover{background:var(--surface-2)}
.chev{width:14px;text-align:center;color:var(--muted);transition:.15s;font-size:11px;flex:none}
.node.open>.nhead>.chev{transform:rotate(90deg)}
.nbody{display:none;margin-left:16px;border-left:1px solid var(--line);padding-left:6px}
.node.open>.nbody{display:block}
.ntitle{flex:1;min-width:0}
.lvl-part{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);margin-top:10px;border-radius:10px}
.lvl-part .ntitle{font-weight:700;font-size:14px}.lvl-chap .ntitle{font-weight:650;font-size:13px;color:var(--ink-2)}
.nmeta{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
.lvl-crit{align-items:flex-start}
.cma{font-weight:700;white-space:nowrap;min-width:52px;flex:none}
.ctext{flex:1;font-size:13px;color:var(--ink-2);min-width:120px}
.yrs{gap:3px}.yrs .score{min-width:20px;height:20px;font-size:11px}
.inl{padding:4px 6px;font-size:12px;border-radius:6px}.scoreSel{font-weight:700;min-width:70px}
.mini{padding:4px 7px}
.subwrap{padding:4px 0 10px}
.muchead{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:7px 8px 3px;display:flex;gap:8px;align-items:center}
.subrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:9px 8px;border-bottom:1px solid var(--line)}
.subrow:hover{background:var(--surface-2)}
.sctext{font-size:13px}
.submeta{font-size:12px;color:var(--ink-2);margin-top:3px}
.evstamp{font-size:11px;color:var(--muted);margin-top:3px}
.evctrl{display:flex;flex-direction:column;gap:4px;align-items:stretch;min-width:150px}
.mc-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.mc-toggle button{border:0;border-radius:0;background:var(--surface);padding:6px 8px;font-size:12px;font-weight:600;color:var(--ink-2);flex:1}
.mc-toggle button.yes{background:var(--good);color:#fff}
.mc-toggle button.no{background:var(--crit);color:#fff}
.autobox{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px dashed var(--border);border-radius:8px;padding:6px 10px;font-size:12px;margin-left:auto}

/* Drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:70;display:none}.overlay.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(760px,96vw);background:var(--page);z-index:71;box-shadow:-8px 0 30px rgba(0,0,0,.2);transform:translateX(100%);transition:.22s;overflow-y:auto}
.drawer.on{transform:none}
.dhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;gap:12px;align-items:flex-start}
.dbody{padding:20px}
.field{margin-bottom:14px}.field .fl{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;margin-bottom:4px}
.field select,.field input{width:100%}
.assign-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sub-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--surface)}
.miniyears{display:flex;gap:8px}.miniyears .yl{font-size:10px;color:var(--muted);text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.center{text-align:center}
@media print{aside.side,.topbar,.tbar,.overlay,.drawer,.noprint{display:none!important}#app{grid-template-columns:1fr}body{background:#fff}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="loginbox">
    <div class="logo">🏥</div>
    <h1>Hệ thống đánh giá 83 tiêu chí CLBV</h1>
    <div class="sub">Bộ tiêu chí chất lượng bệnh viện — QĐ 6858/QĐ-BYT</div>
    <label>Cán bộ đánh giá</label>
    <select id="loginUser"></select>
    <label>Mã PIN</label>
    <input type="password" id="loginPin" placeholder="Mặc định: 1234" value="">
    <button class="btn-p" id="loginBtn">Đăng nhập</button>
    <div class="demo-note" id="loginMode"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="side" id="side">
    <div class="head"><div class="t">Đánh giá 83 tiêu chí CLBV</div><div class="s">QĐ 6858/QĐ-BYT · Kỳ <span id="sideYear"></span></div></div>
    <nav id="nav"></nav>
    <div class="foot">Bệnh viện · Tổ QLCL<br><span id="footUser"></span></div>
  </aside>
  <main class="content">
    <div class="topbar">
      <button class="menuBtn" id="menuBtn">☰</button>
      <h2 id="pageTitle">Tổng quan</h2>
      <span class="synctag sync-off" id="syncTag">● Chưa kết nối Sheet</span>
      <select id="dotpick" title="Đợt đánh giá trong năm" style="font-weight:600"></select>
      <div class="yearpick" id="yearpick"></div>
      <div class="who"><span class="avatar" id="avatar">?</span><span id="whoName"></span></div>
      <button id="themeBtn" title="Sáng/tối">◐</button>
      <button id="logoutBtn" title="Đăng xuất">⏻</button>
    </div>
    <div class="wrap" id="main"></div>
  </main>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer"></aside>

const SUBS=[{"id": "ID01", "tc": "TC01", "ma": "A1.1", "tm": "TM1", "muc": "Mức 1", "noidung": "1. Thiếu biển hiệu bệnh viện hoặc biển hiệu bị mất chữ, mất nét, méo, xệ.", "minhchung": "Phương pháp kiểm tra đánh giá: Quan sát thực tế và kiểm tra biển hiệu, bật đèn nếu là dạng biển hộp đèn hoặc chữ điện tử Bằng chứng, kết quả: - Nhìn thấy biển hiệu bị mất chữ, mất nét, méo, xệ. - Đối với dạng biển hộp đèn không sáng hoặc có chữ hoặc dấu không sáng.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa có kế hoạch triển khai", "giaiphap": "Xây dựng kế hoạch triển khai", "han": "31/05/2024", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID002", "tc": "TC01", "ma": "A1.1", "tm": "TM2", "muc": "Mức 1", "noidung": "2. Chưa có bàn/quầy và nhân viên đón tiếp, hướng dẫn người bệnh.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế bàn/quầy và nhân viên đón tiếp. Bằng chứng, kết quả: - Không có bàn/quầy. - Không có nhân viên đón tiếp vào thời điểm trong giờ hành chính. - Có bàn/quầy nhưng không có đầy đủ theo hướng cổng nhận người bệnh.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Bệnh viện đang sửa chữa", "giaiphap": "Bổ sung bàn /quầy đón tiếp , nhân viên trực do P.Điều dưỡng phân người", "han": "01/05/2024", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID003", "tc": "TC01", "ma": "A1.1", "tm": "TM3", "muc": "Mức 1", "noidung": "3. Giá tiền trông xe ghi không rõ ràng hoặc có dấu hiệu tẩy xóa, thay đổi liên tục.", "minhchung": "Phương pháp kiểm tra, đánh giá: - Quan sát thực tế bảng giá tiền trông xe trong khuôn viên bệnh viện. Bằng chứng, kết quả: - Không có bảng giá. - Bảng “tạm bợ” bằng bìa, giấy in. - Có bảng bằng sắt, nhựa được sơn hoặc in, nhưng phần giá tiền bỏ trống hoặc viết tay hoặc", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Bệnh viện đang sửa chữa", "giaiphap": "Bổ sung bảng giá tiền xe", "han": "01/05/2024", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID004", "tc": "TC01", "ma": "A1.1", "tm": "TM4", "muc": "Mức 1", "noidung": "4. Giá tiền trông xe thu cao hơn giá theo các quy định hiện hành.", "minhchung": "Phương pháp kiểm tra, đánh giá: - Quan sát thực tế bảng giá tiền trông xe và so sánh, đối chiếu với phí trông giữ xe đạp, xe máy, ô tô theo qui định của Bộ Tài chính (Thông tư số  02/2014/TT-BTC) - Đóng vai người gửi xe máy, ô-tô và trả tiền thực tế. Bằng chứng, kết quả: - Giá thu thực tế bằng với giá ghi trên vé. - Mức thu phí lượt ban ngày đối với xe đạp không quá 2.000 đồng/lượt, đối với xe máy không quá 4.000 đồng/lượt, đối với ô tô thì tùy theo số ghế hoặc trọng tải của xe, nhưng không quá 20.000 đồng/lượt; riêng đối với đô thị loại đặc biệt, mức thu phí đối với ô tô có thể áp dụng mức thu cao hơn, nhưng không quá 40.000 đồng/lượt hoặc tính giá theo giờ không cao hơn quy định của địa phương. - Mức thu phí trông giữ ban đêm có thể cao hơn mức thu phí ban ngày, nhưng tối đa không quá hai lần mức thu phí ban ngày. Trường hợp trông giữ cả ngày và đêm thì mức thu phí cả ngày và đêm tối đa bằng mức thu phí ban ngày cộng với mức thu phí ban đêm.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID010", "tc": "TC01", "ma": "A1.1", "tm": "TM10", "muc": "Mức 2", "noidung": "10. Có bàn hoặc quầy đón tiếp, hướng dẫn người bệnh.", "minhchung": "Phương pháp kiểm tra, đánh giá: - Quan sát bàn hoặc quầy đón tiếp, hướng dẫn người bệnh. Bằng chứng, kết quả: - Có bàn hoặc quầy sạch sẽ, chắc chắn đón tiếp, hướng dẫn người bệnh.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID011", "tc": "TC01", "ma": "A1.1", "tm": "TM11", "muc": "Mức 2", "noidung": "11. Bàn tiếp đón ở vị trí thuận tiện cho người bệnh tiếp cận, có biển hiệu rõ ràng.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát bàn tiếp đón khi bước vào từ lối vào. Quan sát biển hiệu ở bàn tiếp đón hoặc khu vực tiếp đón. Bằng chứng, kết quả: - Bàn tiếp đón ở vị trí thuận tiện cho người bệnh khi bước vào từ lối vào. - Bàn hoặc khu vực đón tiếp có biển hiệu chỉ dẫn nơi đón tiếp người bệnh. - Có đầy đủ các bàn tại các cổng có đón tiếp NB, kể cả cổng phụ (hoặc có biển chỉ dẫn rõ ràng NB đi từ cổng phụ ra cổng chính nơi có bàn đón tiếp).", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID012", "tc": "TC01", "ma": "A1.1", "tm": "TM12", "muc": "Mức 2", "noidung": "12. Bàn tiếp đón có nhân viên y tế (mặc đồng phục và mang biển tên hoặc đeo băng vải để người bệnh dễ nhận biết) trực thường xuyên (trong giờ hành chính) tiếp đón, hướng dẫn và giải đáp cho người bệnh.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát nhân viên đón tiếp về đồng phục, bảng tên hoặc băng vải. Phỏng vấn nhân viên đón tiếp về thời gian làm việc, nội dung công việc. Lưu ý khi phỏng vấn cần phát hiện các dấu hiệu đối phó, điều nhân viên mới, tình nguyện viên ra đón tiếp phục vụ công tác kiểm tra. Bằng chứng, kết quả: - NVYT mặc đồng phục bệnh viện có dấu hiệu nhận biết là nhân viên đón tiếp, hướng dẫn (đồng phục đặc trưng, có biển tên hoặc đeo băng vải có ghi nội dung “tiếp đón, hướng dẫn”). Trường hợp bệnh viện khó khăn về kinh tế hoặc quy mô nhỏ có thể không có đồng phục nhưng trang phục cá nhân cần gọn gàng và có đầy đủ bảng tên hoặc băng vải. - Có nhân viên đón tiếp đầy đủ theo thời gian làm việc quy định. - Kết quả phỏng vấn nhân viên đạt yêu cầu, nắm được quy định, giao tiếp, thời gian đón tiếp...", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Bệnh viện đang sửa chữa", "giaiphap": "Có danh sách phân công nhân viên trực tại quầy tiếp đón", "han": "01/05/2024", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID013", "tc": "TC01", "ma": "A1.1", "tm": "TM", "muc": "Mức 2", "noidung": "13. Trong phạm vi từ 50 – 500m có biển báo bệnh viện tại đầy đủ các hướng đến bệnh viện hoặc tại các lối rẽ đến bệnh viện (đối với bệnh viện nằm trong thành phố có biển báo tại trục đường chính hướng đến bệnh viện).", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát, xác định trục đường chính và các hướng đến cổng số 1 của bệnh viện, quan sát biển báo trong phạm vi từ 50 - 500m kể từ bệnh viện. Bằng chứng, kết quả: - Có biển báo bệnh viện hoặc dấu hiệu bệnh viện (có thể có ghi rõ khoảng cách số mét từ biển đến bệnh viện). - Riêng bệnh viện tại khu vực nội thành (thành phố, thị xã) chỉ cần có biển tại trục đường chính. - BV tại các khu vực khác cần có đủ biển tại các hướng đến mới được tính là đạt.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID014", "tc": "TC01", "ma": "A1.1", "tm": "TM13", "muc": "Mức 2", "noidung": "14. Các điểm trông giữ xe nằm trong khuôn viên bệnh viện có biển báo rõ ràng.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát biển báo các điểm trông giữ xe trong khuôn viên bệnh viện. Bằng chứng, kết quả: - Có biển báo ở mỗi điểm trông giữ xe. - Biển báo đặt ở ở vị trí dễ quan sát.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID005", "tc": "TC01", "ma": "A1.1", "tm": "TM5", "muc": "Mức 2", "noidung": "5. Biển hiệu bệnh viện tại cổng chính và cổng đón người bệnh đầy đủ, rõ ràng, không bị mất chữ hoặc mất nét, méo, xệ.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế biển hiệu tại cổng chính. Quan sát thực tế biển hiệu tại cổng đón người bệnh. Bằng chứng, kết quả: - Có đầy đủ các thông tin tên bệnh viện, cơ quan chủ quản, địa chỉ, số điện thoại (và các thông tin khác nếu có) không bị mất chữ hoặc mất nét, méo, xệ.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID006", "tc": "TC01", "ma": "A1.1", "tm": "TM6", "muc": "Mức 2", "noidung": "6. Trong phạm vi từ 50 - 500m có biển báo bệnh viện tại trục đường chính hướng đến cổng chính (cổng số 1) của bệnh viện.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát, xác định trục đường chính hướng đến cổng số 1 của bệnh viện, quan sát biển báo trong phạm vi từ 50 - 500m kể từ bệnh viện. Bằng chứng, kết quả: - Tại trục đường chính hướng đến bệnh viện, có biển báo bệnh viện hoặc dấu hiệu bệnh viện (có thể ghi khoảng cách số mét từ biển đến bệnh viện). - Nếu thiếu biển báo, xếp ở mức 1, kể cả bệnh viện trong nội thành.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa rõ thủ tục gắn biển", "giaiphap": "Tìm hiểu thủ tục, gắn ở các trục đường lớn gần Bệnh viện", "han": "01/06/2024", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID007", "tc": "TC01", "ma": "A1.1", "tm": "TM7", "muc": "Mức 2", "noidung": "7. Trước các lối rẽ từ đường chính vào đường nhỏ có biển báo bệnh viện (trong trường hợp bệnh viện không nằm ở trục đường chính).", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát, xác định trục đường chính, các đường nhỏ, quan sát biển báo bệnh viện tại các lối rẽ. Bằng chứng, kết quả: - Tại các lối rẽ từ trục đường chính, có biển báo bệnh viện hoặc dấu hiệu bệnh viện để chuyển hướng đúng (có thể có ghi rõ khoảng cách số mét từ biển đến bệnh viện).", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID008", "tc": "TC01", "ma": "A1.1", "tm": "TM8", "muc": "Mức 2", "noidung": "8. Cổng bệnh viện được đánh số: nếu bệnh viện có một cổng không đánh số; nếu có từ 2 cổng trở lên thì cổng chính tiếp đón người bệnh ghi rõ “Cổng số 1”. Các cổng phụ ghi rõ từng số theo một chiều thống nhất từ trái sang phải hoặc từ phải sang trái. Đối với cổng nội bộ có chỉ dẫn rõ ràng “cổng nội bộ cho nhân viên bệnh viện”.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát, xác định số lượng cổng bệnh viện, cổng chính và cổng nội bộ (nếu bệnh viện có từ 02 cổng trở lên). Quan sát biển hiệu trên các cổng bệnh viện. Bằng chứng, kết quả: - Có đánh số đầy đủ từ 1 đến hết. - Đánh số theo một chiều thống nhất. - Nếu bệnh viện chỉ đánh số cổng theo số đường thì không được tính là đạt (ví dụ: cổng 18 Công Lý). - Nếu có cổng nội bộ thì có biển ghi rõ.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Bệnh viện đang sửa chữa", "giaiphap": "Đánh số theo hướng dẫn", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID009", "tc": "TC01", "ma": "A1.1", "tm": "TM9", "muc": "Mức 2", "noidung": "9. Có biển báo chỉ dẫn đến bãi trông giữ xe trong khuôn viên bệnh viện hoặc ngoài khuôn viên (nếu có); đồng thời có biển thông báo “đã đầy xe” hoặc “không nhận trông xe” rõ ràng ngay từ cổng bệnh viện, phù hợp với sức chứa của bãi trông giữ xe theo từng thời điểm.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát biển báo chỉ dẫn đến bãi trông giữ xe, bảo đảm chỉ dẫn rõ ràng. Phỏng vấn người trông giữ xe và bảo vệ về biển báo Bằng chứng, kết quả: - Có biển chỉ dẫn đến địa điểm trông giữ xe. - Có biển ghi rõ không nhận xe và hướng dẫn đến địa điểm khác để gửi nếu bệnh viện không nhận trông giữ xe. - Có biển báo đã đầy xe và không nhận tiếp hoặc ghi rõ số lượng xe có thể tiếp nhận thêm nếu áp dụng hệ thống trông xe điện tử.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Bệnh viện đang sửa chữa", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID015", "tc": "TC01", "ma": "A1.1", "tm": "TM15", "muc": "Mức 3", "noidung": "15. Địa điểm trông giữ xe máy và xe đạp có ranh giới phân khu vực riêng bằng hàng rào, dây chắn…", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát điểm trông giữ xe máy, xe đạp. Bằng chứng, kết quả: - Có ranh giới, dấu hiệu (ví dụ: rào chắn, dây, tường, vạch sơn…) để đánh dấu, phân khu vực riêng cho xe máy, xe đạp ngay ngắn, thẳng hàng.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Bệnh viện đang sửa chữa", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID016", "tc": "TC01", "ma": "A1.1", "tm": "TM16", "muc": "Mức 3", "noidung": "16. Địa điểm trông giữ ô tô có hướng dẫn trông giữ ô tô (nếu có cần hướng dẫn các chiều vào – ra hoặc lên – xuống bằng vạch sơn hoặc biển hướng dẫn).", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát điểm trông giữ ô tô Bằng chứng, kết quả: - Có biển hướng dẫn hoặc dấu hiệu hướng dẫn, ví dụ: vạch sơn trắng/vàng có mũi tên trên nền đường để chỉ chiều vào – ra.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Bệnh viện đang sửa chữa", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID017", "tc": "TC01", "ma": "A1.1", "tm": "TM17", "muc": "Mức 3", "noidung": "17. Thời gian trông giữ xe được ghi cụ thể.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát biển thông báo hoặc phiếu giữ xe. Bằng chứng, kết quả: - Trên biển thông báo trông giữ xe hoặc trên từng phiếu giữ xe có ghi thời gian trông giữ xe.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID018", "tc": "TC01", "ma": "A1.1", "tm": "TM18", "muc": "Mức 3", "noidung": "18. Giá tiền trông giữ xe được chia theo thời gian trong ngày (ngày-đêm hoặc giờ), được công bố rõ ràng, cụ thể (không gạch xóa) và không cao hơn giá theo các quy định hiện hành (của Chính phủ và chính quyền địa phương), hoặc miễn phí.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát biển thông báo hoặc phiếu giữ xe Bằng chứng, kết quả: - Trên biển thông báo trông giữ xe hoặc trên từng phiếu giữ xe có in giá tiền theo các thời gian cụ thể, không viết tay, không gạch xóa theo qui định của Thông tư số 02/2014/TT-BTC.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID019", "tc": "TC01", "ma": "A1.1", "tm": "TM19", "muc": "Mức 3", "noidung": "19. Biển báo giá tiền trông giữ xe (hoặc miễn phí) được treo, đặt ở vị trí cố định ở nơi dễ nhìn thấy.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát biển báo trông giữ xe trong khu vực giữ xe. Bằng chứng, kết quả: - Không có biển “tạm bợ” bằng giấy, bìa, miếng tôn, sắt… - Biển được in, sơn kẻ và treo hoặc đặt cố định.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Bệnh viện đang sửa chữa", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID020", "tc": "TC01", "ma": "A1.1", "tm": "TM20", "muc": "Mức 3", "noidung": "20. Bảo đảm thu tiền trông giữ xe không cao hơn giá đã niêm yết của bệnh viện.", "minhchung": "Phương pháp kiểm tra, đánh giá: - Phỏng vấn người gửi xe, nhân viên trông giữ xe. - Kiểm tra các kênh phản ánh của bệnh viện: đường dây nóng, hộp thư góp ý, tiếp dân … có ghi nhận các phản ánh về giá tiền trong giữ xe không? Bằng chứng, kết quả: - Kiểm tra giá thu không cao hơn theo hơn quy định. - Kết quả phỏng vấn người gửi xe, nhân viên trông giữ xe nếu phát hiện các bất thường hoặc có ghi nhận nội dung phản ánh giá tiền trông giữ xe trong các kênh phản ánh của bệnh viện thì tiểu mục này không đạt.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Có phản ảnh tại Google map BV", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID021", "tc": "TC01", "ma": "A1.1", "tm": "TM21", "muc": "Mức 3", "noidung": "21. Có sơ đồ bệnh viện cụ thể, chú thích, chỉ dẫn rõ ràng tại chỗ dễ quan sát ở khu vực cổng chính và khoa khám bệnh; có dấu hiệu hoặc chỉ dẫn vị trí người xem sơ đồ đang đứng ở vị trí nào trong sơ đồ; chữ viết đủ kích thước cho người có thị lực bình thường (2 mắt có thị lực từ 7/10 trở lên) đọc được ở khoảng cách 3 mét.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát sơ đồ bệnh viện tại khu vực cổng chính và các cổng tiếp nhận người bệnh. Trực tiếp xem sơ đồ Bằng chứng, kết quả: - Có sơ đồ bệnh viện tại khu vực cổng chính và các cổng tiếp nhận người bệnh. - Trong sơ đồ bệnh viện có đánh dấu vị trí người xem, rõ ràng, dễ xác định vị trí người xem. - Đứng cách xa 3m có thể đọc được chữ trong sơ đồ.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Bệnh viện đang sửa chữa", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID022", "tc": "TC01", "ma": "A1.1", "tm": "TM22", "muc": "Mức 3", "noidung": "22. Các tòa nhà được đánh dấu theo chữ viết hoa (A, B, C…), hoặc số 1, 2, 3… hoặc tên khoa (khoa Nội, khoa Ngoại…) rõ ràng, tối thiểu đầy đủ các mặt trước của tòa nhà và các mặt sau (nếu nhìn thấy được trong khuôn viên bệnh viện).", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát toàn bộ khuôn viên bệnh viện Bằng chứng, kết quả: - Các tòa nhà có đánh dấu bằng tên hoặc số đầy đủ (tốt nhất là đánh theo 1 chiều thống nhất theo chiều kim đồng hồ hoặc ngược lại, nhưng vẫn đạt nếu đánh dấu không theo thứ tự).", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Bệnh viện đang sửa chữa", "giaiphap": "Đánh số tòa nhà không sửa chữa", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID023", "tc": "TC01", "ma": "A1.1", "tm": "TM23", "muc": "Mức 3", "noidung": "23. Có đầy đủ bàn hoặc quầy đón tiếp, hướng dẫn người bệnh tại tất cả các cổng có tiếp nhận người bệnh.", "minhchung": "Phương pháp kiểm tra, đánh giá: - Quan sát toàn bộ các cổng có tiếp nhận người bệnh, bao gồm cổng chính và các cổng phụ - Xác định và đếm số lượng bàn hoặc quầy đón tiếp cần có tại các cổng Bằng chứng, kết quả: - Có đầy đủ bàn hoặc quầy đón tiếp tại các cổng.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID024", "tc": "TC01", "ma": "A1.1", "tm": "TM24", "muc": "Mức 3", "noidung": "24. Trước lối vào mỗi khoa/phòng có biển tên khoa rõ ràng và dễ nhìn, có sơ đồ khoa, thể hiện rõ số phòng, vị trí phòng trong khoa.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế biển tên khoa/phòng và sơ đồ trước lối vào các khoa/phòng. Bằng chứng, kết quả: - Biển tên khoa/phòng được gắn bên trên hoặc bên cạnh lối vào các khoa/phòng, trong tầm mắt người đọc, không gắn trên cửa ra vào (khi đóng/ mở có thể bị che khuất). - Sơ đồ khoa/phòng đặt ở vị trí dễ quan sát, trong tầm mắt người đọc, có chú thích, kí hiệu minh họa, thông tin rõ ràng, trực quan, thể hiện rõ số phòng, vị trí phòng theo hướng thống nhất.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID025", "tc": "TC01", "ma": "A1.1", "tm": "TM25", "muc": "Mức 3", "noidung": "25. Số buồng bệnh được đánh số theo quy tắc thống nhất do bệnh viện tự quy định, thuận tiện cho việc tìm kiếm.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế các các buồng bệnh trong hành lang. Đóng vai người bệnh tìm 01 buồng bệnh bất kì Bằng chứng, kết quả: - Biển chỉ dẫn số buồng bệnh được đánh số theo quy tắc thống nhất do bệnh viện tự quy định, thuận tiện cho việc tìm kiếm.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "Chưa có đầy đủ sơ đồ tại từng khoa/phòng (chỉ có khoa khám bệnh nhưng đánh số thứ tự không logic)", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID035", "tc": "TC01", "ma": "A1.1", "tm": "TM26", "muc": "Mức 4", "noidung": "26. Biển số buồng bệnh và biển chỉ dẫn số buồng bệnh ở vị trí dễ nhìn.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế biển số buồng bệnh và biển chỉ dẫn số buồng bệnh tại khu khám bệnh. Đóng vai người bệnh tìm 01 buồng bệnh bất kì và đi theo biển chỉ dẫn số buồng bệnh. Bằng chứng, kết quả: - Có đầy đủ biển số buồng bệnh và biển chỉ dẫn số buồng bệnh tại khu khám bệnh. - Biển số buồng bệnh và biển chỉ dẫn số buồng bệnh gắn ở tầm mắt người đọc, ở vị trí dễ nhìn, không bị che khuất.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa có đầy đủ sơ đồ tại từng khoa/phòng (chỉ có khoa khám bệnh nhưng đánh số thứ tự không logic)", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID026", "tc": "TC01", "ma": "A1.1", "tm": "TM27", "muc": "Mức 4", "noidung": "27. Ô tô, xe máy, xe đạp được đỗ đúng nơi quy định của bệnh viện.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế điểm trông giữ xe ô tô, xe máy, xe đạp. Bằng chứng, kết quả: - Ô tô, xe máy, xe đạp được đỗ đúng nơi quy định của bệnh viện, phía trong ranh giới của khu vực dành riêng cho ô tô, xe máy, xe đạp.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Bãi xe chưa kẻ phân luồng", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID027", "tc": "TC01", "ma": "A1.1", "tm": "TM28", "muc": "Mức 4", "noidung": "28. Cầu thang bộ và thang máy (nếu có) được đánh số rõ ràng, theo trình tự do bệnh viện tự quy định.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế cầu thang bộ và thang máy (nếu có). Bằng chứng, kết quả: - Cầu thang bộ và thang máy (nếu có) được đánh số theo quy tắc thống nhất do bệnh viện tự quy định, thuận tiện cho việc tìm kiếm.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa đánh số thang bộ, thang máy", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID028", "tc": "TC01", "ma": "A1.1", "tm": "TM29", "muc": "Mức 4", "noidung": "29. Trong thang máy có biển ghi thông tin các khoa, phòng của từng tầng và số thang máy để người bệnh thuận tiện, an toàn khi di chuyển (nếu bệnh viện không có thang máy được tính là đạt).", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế thang máy (nếu có). Bằng chứng, kết quả: - Có biển báo thông tin các khoa/phòng của từng tầng và số thang máy.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Thang máy chưa có biển báo thông tin cá khoa/phòng", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID029", "tc": "TC01", "ma": "A1.1", "tm": "TM30", "muc": "Mức 4", "noidung": "30. Trước mỗi cửa buồng khám, chữa bệnh có bảng tên các bác sỹ, điều dưỡng phụ trách.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế bảng tên các bác sỹ, điều dưỡng phụ trách trước mỗi cửa buồng khám. Kiểm tra đối chiếu tên các bác sỹ, điều dưỡng phụ trách trên bảng tên và thực tế. Bằng chứng, kết quả: - Có biển tên các bác sỹ, điều dưỡng phụ trách trước mỗi cửa buồng khám được cập nhật đúng thực tế vào thời điểm kiểm tra, đối chiếu tên bác sĩ, điều dưỡng trên bảng với thực tế.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa đồng bộ, đầy đủ thông tin biển tên", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID030", "tc": "TC01", "ma": "A1.1", "tm": "TM31", "muc": "Mức 4", "noidung": "31. Khoa khám bệnh có vạch màu hoặc dấu hiệu, chữ viết… được dán hoặc gắn, sơn kẻ dưới sàn nhà hướng dẫn người bệnh đến các địa điểm thực hiện các công việc khác nhau như đến phòng xét nghiệm, chụp X-Quang, siêu âm, điện tim, nộp viện phí, khu vệ sinh…(nếu các phòng xét nghiệm, chụp X-Quang, siêu âm, viện phí… nằm ở tòa nhà khác với khoa khám bệnh thì cần có chỉ dẫn bằng hình thức khác rõ ràng, cụ thể).", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế vạch màu/ dấu hiệu, chữ viết … hướng dẫn được dán hoặc gắn, sơn kẻ dưới sàn nhà. Đóng vai người bệnh tìm 01 địa điểm bất kì và đi theo vạch màu/ dấu hiệu, chữ viết… hướng dẫn. Bằng chứng, kết quả: - Có vạch màu hoặc dấu hiệu, chữ viết… được dán hoặc gắn, sơn kẻ dưới sàn nhà rõ ràng, không bị mờ, che khuất hướng dẫn người bệnh đến các địa điểm thực hiện các công việc khác nhau như đến phòng xét nghiệm, chụp X-Quang, siêu âm, điện tim, nộp viện phí, khu vệ sinh… - Các vạch màu đã cũ cần được vẽ lại hoặc dùng vật liệu chống mài mòn, bảo đảm dễ nhìn. - Đối với những bệnh viện có mặt sàn không phù hợp cho sơn hoặc dán vạch màu dưới sàn nhà có thể thay thế bằng hình thức treo biển hoặc sơn trên tường, bảo đảm chỉ dẫn rõ ràng cho người bệnh. - Bệnh viện nếu bố trí các phòng xét nghiệm, chụp X-Quang, siêu âm, viện phí… nằm ở tòa nhà khác với khoa khám bệnh thì không yêu cầu có vạch màu dán dưới sàn, nhưng cần có hình thức chỉ dẫn khác phù hợp như treo biển hướng dẫn.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa đồng bộ hệ thống biểu mẫu (kiểu dáng, màu sắc) đầy đủ tại các khu vực.", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID031", "tc": "TC01", "ma": "A1.1", "tm": "TM32", "muc": "Mức 5", "noidung": "32. Có đầy đủ sơ đồ bệnh viện tại các điểm giao cắt chính trong bệnh viện; có dấu hiệu hoặc chỉ dẫn vị trí người xem sơ đồ đang đứng ở vị trí nào trong sơ đồ.", "minhchung": "Phương pháp kiểm tra, đánh giá: - Xác định các điểm giao cắt chính trong bệnh viện. - Quan sát thực tế sơ đồ bệnh viện tại các điểm giao cắt chính trong bệnh viện. Bằng chứng, kết quả: - Có đầy đủ sơ đồ bệnh viện tại các điểm giao cắt chính trong bệnh viện; có chú thích, kí hiệu minh họa rõ ràng, mũi chỉ dẫn lối đi, thông tin dễ đọc, dễ hiểu, trực quan, có dấu hiệu hoặc chỉ dẫn vị trí người xem đang đứng ở vị trí ở đâu.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa đầy đủ sơ đồ bệnh viện tại các điểm giao cắt  - Lập thống kê lại biển sơ đồ bệnh viện hiện tại", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID032", "tc": "TC01", "ma": "A1.1", "tm": "TM33", "muc": "Mức 5", "noidung": "33. Cầu thang của tòa nhà ghi rõ phạm vi của khoa và phạm vi số phòng.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế biển báo ở cầu thang. Đóng vai người đi tìm phòng/buồng bệnh Bằng chứng, kết quả: - Có biển báo ở vị trí cầu thang ghi rõ tên, phạm vi khoa/phòng, số lượng buồng bệnh trong khoa.", "dg2024": "Không đạt", "dg2025": "Không đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID033", "tc": "TC01", "ma": "A1.1", "tm": "TM34", "muc": "Mức 5", "noidung": "34. Biển tên khoa/phòng được viết bằng tối thiểu hai thứ tiếng Việt, Anh trên phạm vi toàn bệnh viện (có thể thêm tiếng thứ ba tùy nhu cầu bệnh viện).", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế biển tên khoa/phòng. Bằng chứng, kết quả: - Có biển tên khoa/phòng được viết bằng tối thiểu hai thứ tiếng Việt, Anh trên phạm vi toàn bệnh viện; tiếng Việt ở trên, tiếng Anh hoặc tiếng thứ ba (tùy nhu cầu bệnh viện) ở dưới.", "dg2024": "Không đạt", "dg2025": "Không đạt", "nguyennhan": "Chưa có biển tên song ngữ", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID034", "tc": "TC01", "ma": "A1.1", "tm": "TM35", "muc": "Mức 5", "noidung": "35. Áp dụng thẻ điện tử và máy tính giá tiền trông giữ xe máy, ô tô hoặc bệnh viện trông xe miễn phí.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế điểm trông giữ xe máy, ô tô Bằng chứng, kết quả: - Có thẻ điện tử và sử dụng giải pháp công nghệ thông tin tính giá tiền trông giữ xe máy, ô tô. - Trường hợp hoặc bệnh viện trông xe miễn phí hoặc không nhận trông xe trong bệnh viện thì tiểu mục này được tính là đạt. - Nếu không nhận trông xe trong khuôn viên bệnh viện thì cần có hướng dẫn rõ ràng đến địa điểm khác có nhận trông xe.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Bệnh viện đang sửa chữa", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID036", "tc": "TC02", "ma": "A1.2", "tm": "TM1", "muc": "Mức 1", "noidung": "1. Không có phòng hoặc sảnh chờ cho người bệnh và người nhà người bệnh tại khu khám bệnh.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế phòng hoặc sảnh chờ cho người bệnh và người nhà người bệnh tại khu khám bệnh. Bằng chứng, kết quả: - Không có phòng hoặc sảnh chờ cho người bệnh và người nhà người bệnh tại khu khám bệnh, người bệnh, người nhà phải đứng chờ ngoài hiên.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID037", "tc": "TC02", "ma": "A1.2", "tm": "TM2", "muc": "Mức 1", "noidung": "2. Ghế hỏng hoặc không có ghế tại phòng hoặc sảnh chờ khu khám bệnh.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế ghế tại phòng hoặc sảnh chờ khu khám bệnh. Bằng chứng, kết quả: - Phát hiện có ghế chờ nhưng bị hỏng hoặc không có ghế tại phòng hoặc sảnh chờ khu khám bệnh.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID038", "tc": "TC02", "ma": "A1.2", "tm": "TM3", "muc": "Mức 2", "noidung": "3. Có phòng hoặc sảnh chờ cho người bệnh và người nhà người bệnh.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế phòng hoặc sảnh chờ cho người bệnh và người nhà người bệnh tại khu khám bệnh. Bằng chứng, kết quả: - Có phòng hoặc sảnh chờ cho người bệnh và người nhà người bệnh tại khu khám bệnh.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID039", "tc": "TC02", "ma": "A1.2", "tm": "TM4", "muc": "Mức 2", "noidung": "4. Mái nhà khu chờ khám bệnh bảo đảm cách nhiệt tốt giữa trong nhà và ngoài trời, nếu mái tôn hoặc tấm lợp xi-măng bảo đảm có từ 2 lớp trở lên.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế, cảm nhận nhiệt độ dưới mái nhà khu chờ khám bệnh. Đóng vai người bệnh/ người nhà chờ đợi trong khu chờ khám bệnh để cảm nhận nhiệt độ. Bằng chứng, kết quả: - Nhiệt độ dưới mái nhà khu chờ khám bệnh ở mức trung bình từ 28-30 độ C. - Có từ 2 lớp trở lên nếu lợp mái tôn hoặc tấm lợp xi-măng.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID040", "tc": "TC02", "ma": "A1.2", "tm": "TM5", "muc": "Mức 2", "noidung": "5. Sẵn có ít nhất một cáng hoặc giường di động có bánh xe tại khu vực khám bệnh để vận chuyển người bệnh.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế cáng hoặc giường di động có bánh xe tại khu vực khám bệnh Bằng chứng, kết quả: - Số lượng cáng hoặc giường di động có bánh xe tại khu vực khám bệnh có ít nhất từ một trở lên, còn sử dụng tốt.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID045", "tc": "TC02", "ma": "A1.2", "tm": "TM10", "muc": "Mức 3", "noidung": "10. Phòng chờ hoặc sảnh chờ có đủ số lượng quạt (hoặc điều hòa) hoạt động thường xuyên, hoặc bảo đảm nhiệt độ thích hợp cho người bệnh từ 22 đến 28 độ C.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế số lượng, tình trạng quạt (hoặc điều hòa) tại phòng chờ hoặc sảnh chờ. Đóng vai người bệnh/ người nhà chờ đợi trong khu chờ khám bệnh để cảm nhận nhiệt độ. Bằng chứng, kết quả: - Có quạt hoặc điều hòa tại phòng chờ khu khám bệnh (chụp ảnh bằng chứng). - Nhiệt độ phòng chờ hoặc sảnh chờ trong khoảng từ 22 đến 28 độ C.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID046", "tc": "TC02", "ma": "A1.2", "tm": "TM11", "muc": "Mức 3", "noidung": "11. Xây dựng và áp dụng quy trình sàng lọc, cách ly người bệnh truyền nhiễm trong các vụ dịch.", "minhchung": "Phương pháp kiểm tra, đánh giá: Kiểm tra văn bản (quy trình sàng lọc, cách ly người bệnh truyền nhiễm trong các vụ dịch.) Quan sát dấu hiệu/ bảng biểu hướng dẫn quy trình sàng lọc, cách ly người bệnh truyền nhiễm trong các vụ dịch.  Đóng vai người bệnh mắc bệnh truyển nhiễm bất kì để theo dõi phản ứng của nhân viên bệnh viện. Bằng chứng, kết quả: - Có quy trình sàng lọc, cách ly người bệnh truyền nhiễm trong các vụ dịch được phê duyệt, có ngày tháng năm áp dụng. - Có dấu hiệu/ bảng biểu hướng dẫn quy trình sàng lọc, cách ly người bệnh truyền nhiễm trong các vụ dịch.  - Kết quả phản ứng của nhân viên bệnh viện khi đoàn kiểm tra đóng vai người bệnh mắc bệnh truyển nhiễm bất kì theo qui trình đã xây dựng và áp dụng.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID047", "tc": "TC02", "ma": "A1.2", "tm": "TM12", "muc": "Mức 3", "noidung": "12. Trong thời điểm các vụ dịch, bệnh viện bố trí khu sàng lọc, phân loại và vận chuyển người bệnh truyền nhiễm ngay tại khu vực đón tiếp.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế khu sàng lọc, phân loại và vận chuyển người bệnh truyền nhiễm tại khu vực đón tiếp. Bằng chứng, kết quả: - Có khu sàng lọc, phân loại và vận chuyển người bệnh truyền nhiễm tại khu vực đón tiếp. (chụp ảnh bằng chứng)", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID048", "tc": "TC02", "ma": "A1.2", "tm": "TM13", "muc": "Mức 3", "noidung": "13. Người bệnh truyền nhiễm đường hô hấp sau khi sàng lọc được vào khu vực chờ riêng.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế buồng khám riêng cho người bệnh truyền nhiễm đường hô hấp sau khi đã được sàng lọc. Bằng chứng, kết quả: - Có buồng khám riêng cho người bệnh truyền nhiễm đường hô hấp sau khi đã được sàng lọc. (chụp ảnh bằng chứng)", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID050", "tc": "TC02", "ma": "A1.2", "tm": "TM14", "muc": "Mức 3", "noidung": "14. Có buồng khám riêng cho người  bệnh truyền nhiễm đường hô hấp sau khi đã được sàng lọc", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế buồng khám riêng cho người bệnh truyền nhiễm đường hô hấp sau khi đã được sàng lọc. Bằng chứng, kết quả: - Có buồng khám riêng cho người bệnh truyền nhiễm đường hô hấp sau khi đã được sàng lọc. (chụp ảnh bằng chứng)", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID041", "tc": "TC02", "ma": "A1.2", "tm": "TM6", "muc": "Mức 3", "noidung": "6. Phòng chờ hoặc sảnh chờ khám bệnh bảo đảm thoáng mát mùa hè; kín gió và ấm vào mùa đông.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế, cảm nhận nhiệt độ dưới mái nhà khu chờ khám bệnh. Đóng vai người bệnh/ người nhà chờ đợi trong khu chờ khám bệnh để cảm nhận nhiệt độ. Bằng chứng, kết quả: - Nhiệt độ dưới mái nhà phòng chờ hoặc sảnh chờ khám bệnh ở mức trung bình từ 28-30 độ C. - Có từ 2 lớp trở lên nếu lợp mái tôn hoặc tấm lợp xi-măng.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Bệnh viện đang sửa chữa", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID042", "tc": "TC02", "ma": "A1.2", "tm": "TM7", "muc": "Mức 3", "noidung": "7. Phòng chờ hoặc sảnh chờ đủ chỗ ngồi cho tối thiểu 10% số lượt người bệnh đến khám trung bình trong một ngày (dựa trên số liệu tổng lượt khám trung bình/ngày).", "minhchung": "Phương pháp kiểm tra, đánh giá: Xác định số lượt khám trung bình trong một ngày (dựa trên báo cáo thống kê số liệu tổng lượt khám trung bình/ngày). Quan sát thực tế và so sánh đối chiếu số lượng ghế chờ ở phòng chờ hoặc sảnh chờ. Bằng chứng, kết quả: - Đếm số lượng ghế chờ và đối chiếu với số lượt khám trung bình trong một ngày, nếu số lượng ghế chờ đảm bảo tối thiểu 10% số lượt người bệnh đến khám trung bình trong một ngày là đạt.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa có minh chứng", "giaiphap": "Lập thống kê số lượng chỗ ngồi và vị trí ghế di động - So sánh với lượt khám chữa bệnh trung bình một ngày, một buổi hoặc một khung giờ.", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID043", "tc": "TC02", "ma": "A1.2", "tm": "TM8", "muc": "Mức 3", "noidung": "8. Có ti-vi cho người bệnh xem tại phòng chờ hoặc sảnh chờ.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế ti-vi cho người bệnh xem tại phòng chờ hoặc sảnh chờ. Bằng chứng, kết quả: - Có lắp đặt cố định ti-vi cho người bệnh xem tại phòng chờ hoặc sảnh chờ.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa có minh chứng", "giaiphap": "Lập thống kê vị trí những khu vực NB chờ (khám bệnh, làm CLS), số ti vi đã có + Khảo sát nhu cầu sử dụng/bổ sung", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID044", "tc": "TC02", "ma": "A1.2", "tm": "TM9", "muc": "Mức 3", "noidung": "9. Người bệnh nặng được vận chuyển bằng các phương tiện vận chuyển và có nhân viên y tế đưa đi làm các xét nghiệm cận lâm sàng tại khoa khám bệnh.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế việc vận chuyển người bệnh nặng. Kiểm tra hồ sơ lưu tại bệnh viện và các thông tin ghi nhận từ các kênh góp ý. Phỏng vấn người bệnh nặng về việc vận chuyển Bằng chứng, kết quả: - Không có khiếu nại, phản ảnh từ các kênh góp ý về việc người bệnh nặng không được vận chuyển bằng các phương tiện vận chuyển và không có nhân viên y tế đưa đi làm các xét nghiệm cận lâm sàng tại khoa khám bệnh. - Có phương tiện vận chuyển để sẵn tại khoa khám bệnh - Kết quả phỏng vấn người bệnh nặng về việc vận chuyển có sử dụng phương tiện vận chuyển và được nhân viên y tế đưa đi đi làm các xét nghiệm cận lâm sàng.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID049", "tc": "TC02", "ma": "A1.2", "tm": "TM15", "muc": "Mức 4", "noidung": "15. Có khảo sát lại và mua bổ sung, sửa chữa ghế chờ cho người bệnh tại khu vực chờ mỗi năm một lần (nếu cần thiết).", "minhchung": "Phương pháp kiểm tra, đánh giá: Kiểm tra hóa đơn/chứng từ/ hợp đồng mua sắm ghế (nếu cần bổ sung) Bằng chứng, kết quả: - Kết quả đối chiếu hóa đơn /chứng từ/ hợp đồng mua sắm ghế với báo cáo thống kê thống kê số liệu tổng lượt khám trung bình/ngày trong trường hợp cần bổ sung hàng năm.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa có minh chứng", "giaiphap": "Tương tự TM2", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID057", "tc": "TC02", "ma": "A1.2", "tm": "TM16", "muc": "Mức 4", "noidung": "16. Phòng chờ đủ chỗ cho tối thiểu 20% số lượt người bệnh đến khám trung bình trong một ngày (dựa trên số liệu tổng lượt khám trung bình trong ngày).", "minhchung": "Phương pháp kiểm tra, đánh giá: Xác định số lượt khám trung bình trong một ngày (dựa trên báo cáo thống kê số liệu tổng lượt khám trung bình/ngày). Quan sát thực tế và so sánh đố chiếu số lượng ghế chờ ở phòng chờ hoặc sảnh chờ. Bằng chứng, kết quả: - Đếm số lượng ghế chờ và đối chiếu với số lượt khám trung bình trong một ngày, nếu số lượng ghế chờ đảm bảo tối thiểu 20% số lượt người bệnh đến khám trung bình trong một ngày là đạt.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa có minh chứng", "giaiphap": "Tương tự TM7", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID051", "tc": "TC02", "ma": "A1.2", "tm": "TM17", "muc": "Mức 4", "noidung": "17. Tiến hành khảo sát theo định kỳ trên phạm vi toàn bệnh viện và lập danh sách các vị trí, tính toán nhu cầu (ước tính số lượt người bệnh chờ và số lượng cần đặt ghế chờ dự kiến) tại những nơi có người bệnh và người nhà người bệnh phải chờ đợi (nơi trả kết quả xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng, nộp tiền, hành lang, sảnh chờ…).", "minhchung": "Phương pháp kiểm tra, đánh giá: Kiểm tra văn bản khảo sát số lượng ghế chờ dự kiến hàng năm Bằng chứng, kết quả: - Biên bản/ báo cáo khảo sát các vị trí, tính toán nhu cầu (ước tính số lượt người bệnh chờ và số lượng cần đặt ghế chờ dự kiến), tình trạng các ghế chờ thực tế tại những nơi có người bệnh và người nhà người bệnh phải chờ đợi.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa có minh chứng", "giaiphap": "Tương tự TM 7, 16 Lập khảo sát hàng năm tính trung bình lượng ghế sử dụng cho NB ngồi chờ (đáp ứng được 20%)", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID052", "tc": "TC02", "ma": "A1.2", "tm": "TM18", "muc": "Mức 4", "noidung": "18. Toàn bộ lối đi giữa các khối nhà trong bệnh viện có mái hiên che nắng, mưa.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế lối đi giữa các khối nhà trong bệnh viện Bằng chứng, kết quả: - Có mái hiên che nắng, mưa trong toàn bộ lối đi giữa các khối nhà trong bệnh viện (chụp ảnh bằng chứng). - Phát hiện 1 lối đi giữa các khối nhà trong bệnh viện không có mái hiên che nắng, mưa là không đạt.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID053", "tc": "TC02", "ma": "A1.2", "tm": "TM19", "muc": "Mức 4", "noidung": "19. Người bệnh nặng được nhân viên y tế đưa đi làm các xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng trên phạm vi toàn bệnh viện.", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế việc vận chuyển người bệnh nặng. Kiểm tra hồ sơ lưu tại bệnh viện và các thông tin ghi nhận từ các kênh góp ý. Phỏng vấn người nhà người bệnh nặng về việc vận chuyển. Bằng chứng, kết quả: - Không có khiếu nại, phản ảnh từ các kênh góp ý về việc người bệnh nặng không được vận chuyển bằng các phương tiện vận chuyển và không có nhân viên y tế đưa đi làm các xét nghiệm cận lâm sàng trên phạm vi toàn bệnh viện. - Có phương tiện vận chuyển để sẵn tại các điểm trong bệnh viện. - Kết quả phỏng vấn người nhà người bệnh nặng về việc vận chuyển có sử dụng phương tiện vận chuyển và được nhân viên y tế đưa đi làm các xét nghiệm cận lâm sàng trên phạm vi toàn bệnh viện.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID054", "tc": "TC02", "ma": "A1.2", "tm": "TM20", "muc": "Mức 5", "noidung": "20. Phòng chờ khu khám bệnh có điều hòa hoạt động thường xuyên, bảo đảm nhiệt độ thích hợp cho người bệnh (từ 22 đến 28 độ C).", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế điều hòa tại phòng chờ khu khám bệnh. Đóng vai người bệnh/ người nhà chờ đợi trong phòng chờ khu khám bệnh để cảm nhận nhiệt độ. Bằng chứng, kết quả: Có điều hòa tại phòng chờ khu khám bệnh (chụp ảnh bằng chứng). Nhiệt độ điều hòa trong khoảng từ 22 đến 28 độ C.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "Chưa có minh chứng", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID055", "tc": "TC02", "ma": "A1.2", "tm": "TM21", "muc": "Mức 5", "noidung": "21. Hàng năm  khảo sát, lập kế hoạch và đầu tư bổ sung kịp thời: ghế chờ, quạt, điều hòa và các phương tiện truyền thông cho người bệnh (nếu cần thiết) tại các khu vực chờ trong bệnh viện.", "minhchung": "Phương pháp kiểm tra, đánh giá: Kiểm tra văn bản về ghế chờ, quạt, điều hòa và các phương tiện truyền thông cho người bệnh (nếu cần thiết) hàng năm Bằng chứng, kết quả: - Biên bản/báo cáo khảo sát các vị trí, nhu cầu, tình trạng các ghế chờ, quạt, điều hòa và các phương tiện truyền thông cho người bệnh (nếu cần thiết) tại các khu vực chờ trong bệnh viện. - Kế hoạch đầu tư, bổ sung ghế chờ, quạt, điều hòa và các phương tiện truyền thông cho người bệnh (nếu cần thiết) dựa trên biên bản/ báo cáo khảo sát.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa có minh chứng", "giaiphap": "Tương tự TM 7,16,17", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID056", "tc": "TC02", "ma": "A1.2", "tm": "TM22", "muc": "Mức 5", "noidung": "22. Toàn bộ lối đi giữa các khối nhà trong bệnh viện được thiết kế, sửa chữa kịp thời, các địa điểm tiếp nối có giải pháp vật lý để xe lăn, xe vận chuyển người bệnh được dễ dàng (bảo đảm không gồ ghề khi đẩy xe, chống vấp ngã).", "minhchung": "Phương pháp kiểm tra, đánh giá: Quan sát thực tế toàn bộ lối đi giữa các khối nhà trong bệnh viện Bằng chứng, kết quả: - Các lối đi giữa các khối nhà trong bệnh viện được thiết kế, sửa chữa kịp thời, không có tình trạng mấp mô, gồ ghề hoặc vật chắn; các địa điểm tiếp nối có giải pháp vật lý để xe lăn, xe vận chuyển người bệnh được dễ dàng (bảo đảm không gồ ghề khi đẩy xe, chống vấp ngã).", "dg2024": "Không đạt", "dg2025": "Không đạt", "nguyennhan": "Bệnh viện đang sửa chữa", "giaiphap": "Khu vực khám tai mũi họng, RHM bất tiện cho NB vận chuyển xe lăn, xe vận chuyển, dễ té ngã.", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "ID069", "tc": "TC03", "ma": "A1.3", "tm": "TM12", "muc": "Mức 4", "noidung": "12. Có tiến hành đánh giá định kỳ (ít nhất 6 tháng 1 lần) thời gian chờ đợi của người bệnh và phát hiện được các vấn đề cần cải tiến.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn bản đánh giá định kỳ (ít nhất 6 tháng 1 lần) thời gian chờ đợi của người bệnh  Bằng chứng, kết quả:  - Có biên bản/ báo cáo đánh giá định kỳ (ít nhất 6 tháng 1 lần) thời gian chờ đợi của người bệnh và có đưa ra những vấn đề cần cải tiến được phê duyệt, ngày tháng năm trong thời gian đánh giá.", "dg2024": "Không đạt", "dg2025": "Không đạt", "nguyennhan": "Chưa có minh chứng", "giaiphap": "Chưa có cần xây dựng kế hoạch đánh giá thời gian chờ đợi của NB tại khoa khám bệnh  (Mẫu khoảng 3-4NB)", "han": "01/04/2024", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID077", "tc": "TC03", "ma": "A1.3", "tm": "TM20", "muc": "Mức 5", "noidung": "20. Có biểu đồ theo dõi thời gian chờ đợi và khám bệnh cho các đối tượng người bệnh, được in và công khai tại khu khám bệnh (cập nhật theo tuần, tháng).", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn bản và quan sát thực tế biểu đồ theo dõi thời gian chờ đợi và khám bệnh cho các đối tượng người bệnh  Bằng chứng, kết quả:  - Có biểu đồ theo dõi thời gian chờ đợi và khám bệnh cho các đối tượng người bệnh được in và dán công khai trên các bảng thông báo, bảng truyền thông của bệnh viện. (cập nhật theo tuần, tháng).", "dg2024": "Không đạt", "dg2025": "Không đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID058", "tc": "TC03", "ma": "A1.3", "tm": "TM1", "muc": "Mức 1", "noidung": "1. Không tiến hành đánh giá thực trạng, phân tích những điểm còn hạn chế trong công tác khám bệnh.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn bản đánh giá thực trạng, phân tích những điểm còn hạn chế trong công tác khám bệnh.  Bằng chứng, kết quả:  - Không có biên bản/ báo cáo đánh giá thực trạng, phân tích những điểm còn hạn chế trong công tác khám bệnh.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "Chưa có minh chứng đúng", "giaiphap": "Làm lại báo cáo có lãnh đạo ký duyệt, (ngày tháng năm ban hành) + Thực trạng (số lượng NVYT, lượt KCB, công tác KCB, điểm hạn chế) + 1 số phòng khám chuyên khoa còn rải rác (Sản, TMH, RHM, Nội thận, TTK, YHCT) + Phân tích nội dung còn tồn tại - Ban hành quy chuẩn biểu mẫu văn bản", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID059", "tc": "TC03", "ma": "A1.3", "tm": "TM2", "muc": "Mức 1", "noidung": "2. Chưa tiến hành cải tiến quy trình khám bệnh.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn bản cải tiến quy trình khám bệnh so với Quyết định số 1313/QĐ-BYT ngày 22/4/2013 về việc ban hành hướng dẫn quy trình khám bệnh tại khoa khám bệnh của bệnh viện.  Bằng chứng, kết quả:  - Không có biên bản/ qui trình khám bệnh được cải tiến so với Quyết định số 1313/QĐ-BYT ngày 22/4/2013 về việc ban hành hướng dẫn quy trình khám bệnh tại khoa khám bệnh của bệnh viện hoặc có nhưng dài, phức tạp hơn.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa có minh chứng", "giaiphap": "Bổ sung biên bản họp/quy trình ban hành quy trình mới đã ban hành so với quy trình cũ", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID060", "tc": "TC03", "ma": "A1.3", "tm": "TM3", "muc": "Mức 2", "noidung": "3. Có đánh giá thực trạng, phân tích những điểm còn hạn chế trong công tác khám bệnh.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn bản đánh giá thực trạng, phân tích những điểm còn hạn chế trong công tác khám bệnh.  Bằng chứng, kết quả:  - Có biên bản/ báo cáo đánh giá thực trạng, phân tích những điểm còn hạn chế trong công tác khám bệnh.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa có minh chứng", "giaiphap": "Làm lại báo cáo có lãnh đạo ký duyệt, (ngày tháng năm ban hành) + Thực trạng (số lượng NVYT, lượt KCB, công tác KCB, điểm hạn chế) + 1 số phòng khám chuyên khoa còn rải rác (Sản, TMH, RHM, Nội thận, TTK, YHCT) + Phân tích nội dung còn tồn tại - Ban hành quy chuẩn biểu mẫu văn bản", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID061", "tc": "TC03", "ma": "A1.3", "tm": "TM4", "muc": "Mức 2", "noidung": "4. Có bản kế hoạch nâng cao chất lượng phục vụ tại khoa khám bệnh dựa trên đánh giá thực trạng.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn vản nâng cao chất lượng phục vụ tại khoa khám bệnh  Bằng chứng, kết quả:  - Có bản kế hoạch nâng cao chất lượng phục vụ tại khoa khám bệnh dựa trên đánh giá thực trạng được phê duyệt, thể hiện rõ ngày tháng năm trong thời gian đánh giá.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa có minh chứng đúng", "giaiphap": "Làm lại kế hoạch theo đúng biểu mẫu (nội dung, thời gian, phân công ai, tiến độ, kinh phí, đơn vị phối hợp)", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID062", "tc": "TC03", "ma": "A1.3", "tm": "TM5", "muc": "Mức 2", "noidung": "5. Có sơ đồ chỉ dẫn các quy trình khám, chữa bệnh cho người bệnh tại khu khám bệnh, được trình bày rõ ràng, dễ hiểu, được đặt hoặc treo ở vị trí dễ nhìn, dễ đọc tại khu khám bệnh (có chú thích rõ ràng hoặc vẽ hai quy trình riêng nếu có sự khác nhau giữa khám bảo hiểm y tế và không có bảo hiểm y tế).", "minhchung": "Phương pháp kiểm tra, đánh giá:  Quan sát thực tế sơ đồ chỉ dẫn các quy trình khám, chữa bệnh cho người bệnh tại khu khám bệnh.  Bằng chứng, kết quả:  - Có sơ đồ chỉ dẫn các quy trình khám, chữa bệnh cho người bệnh tại khu khám bệnh thể hiện rõ từng giai đoạn, dễ hiểu, được đặt hoặc treo ở vị trí dễ nhìn, dễ đọc trong tầm mắt người đọc, không bị che khuất tại khu khám bệnh (có chú thích rõ ràng hoặc vẽ hai quy trình riêng nếu có sự khác nhau giữa khám bảo hiểm y tế và không có bảo hiểm y tế).", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa đồng bộ hệ thống biểu mẫu (kiểu dáng, màu sắc) đầy đủ tại các khu vực.", "giaiphap": "Làm lại sơ đồ chỉ dẫn (đối tượng BHYT và Dịch vụ)", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID063", "tc": "TC03", "ma": "A1.3", "tm": "TM6", "muc": "Mức 2", "noidung": "6. Có bảng phân công cụ thể nhân sự cho từng phòng khám.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn bản phân công nhân sự phòng khám.  Bằng chứng, kết quả:  - Lịch phân công nhân sự cho phòng khám ngoại trú toàn bệnh viện.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa có minh chứng đúng", "giaiphap": "Làm lại bảng phân có chữ ký và sổ lưu trữ tại từng phòng khám (gồm BS, ĐD) + Phân công cụ thể (thời gian từng ngày, số phòng, số lượng nhân sự BS, DD)  - Làm thông báo đến các khoa về phân công nhân sự (triển khai ngay)", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID067", "tc": "TC03", "ma": "A1.3", "tm": "TM10", "muc": "Mức 3", "noidung": "10. Có bố trí bàn, buồng khám bệnh dự phòng tăng cường trong những thời gian cao điểm.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Quan sát thực tế bàn, buồng khám bệnh dự phòng tăng cường trong những thời gian cao điểm.  Phỏng vấn ngẫu nhiên nhân viên phòng khám.  Bằng chứng, kết quả:  - Có bố trí bàn, buồng khám bệnh dự phòng tăng cường trong những thời gian cao điểm (chụp ảnh bằng chứng).  - Kết quả phỏng vấn ngẫu nhiên nhân viên phòng khám về việc có bố trí bàn, buồng khám bệnh dự phòng tăng cường trong những thời gian cao điểm.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa có minh chứng", "giaiphap": "Minh chứng bằng công văn đề nghị tăng cường/ kế hoạch/ phương án cụ thể  Cần chụp hình bàn/buồng khám dự phòng", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID068", "tc": "TC03", "ma": "A1.3", "tm": "TM11", "muc": "Mức 3", "noidung": "11. Người bệnh có thẻ bảo hiểm y tế thuộc diện được chi trả 100% không phải tạm ứng tiền khi đăng ký khám bệnh.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Quan sát thực tế người bệnh có thẻ bảo hiểm y tế thuộc diện được chi trả 100%  Phỏng vấn ngẫu nhiên và đóng vai người bệnh người bệnh có thẻ bảo hiểm y tế thuộc diện được chi trả 100%  Bằng chứng, kết quả:  - Kết quả phỏng vấn ngẫu nhiên và đóng vai người bệnh có thẻ bảo hiểm y tế thuộc diện được chi trả 100% không phải tạm ứng tiền khi đăng ký khám bệnh.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID064", "tc": "TC03", "ma": "A1.3", "tm": "TM7", "muc": "Mức 3", "noidung": "7. Có niêm yết giờ khám, lịch làm việc của các buồng khám, cận lâm sàng rõ ràng.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Quan sát thực tế giờ khám, lịch làm việc của các buồng khám, cận lâm sàng  Bằng chứng, kết quả:  - Có bảng niêm yết giờ khám, lịch làm việc của các buồng khám, cận lâm sàng được in, sơn kẻ rõ ràng và treo hoặc đặt cố định; không có biển “tạm bợ” bằng giấy, bìa, miếng tôn, sắt…", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID065", "tc": "TC03", "ma": "A1.3", "tm": "TM8", "muc": "Mức 3", "noidung": "8. Có máy chụp tài liệu (photocopy hoặc scan) phục vụ người bệnh đặt tại khu vực đăng ký khám hoặc tại vị trí thuận lợi cho người bệnh, có người phục vụ thường xuyên trong giờ hành chính.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Quan sát thực tế máy chụp tài liệu (photocopy hoặc scan) và nhân viên phục trách tại khu vực đăng ký khám hoặc tại vị trí thuận lợi cho người bệnh.  Đóng vai người cần photocopy hoặc scan tài liệu.  Bằng chứng, kết quả:  Có máy chụp tài liệu (photocopy hoặc scan) phục vụ người bệnh đặt tại khu vực đăng ký khám hoặc tại vị trí thuận lợi cho người bệnh. (chụp ảnh bằng chứng).  - Có nhân viên phục vụ thường xuyên trong giờ hành chính. (chụp ảnh bằng chứng)  - Nếu có để máy chụp tài liệu nhưng đợi tối da 15 phút không có nhân viên thực hiện xem như không đạt", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "máy hư", "giaiphap": "Máy hư (đề xuất sửa 19/2/24) Lưu ý: Sửa ngay", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID066", "tc": "TC03", "ma": "A1.3", "tm": "TM9", "muc": "Mức 3", "noidung": "9. Có phương án và phân công cụ thể để tăng cường nhân lực trong giờ cao điểm của khoa khám bệnh.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Xác định thời gian cao điểm của bệnh viện  Kiểm tra văn vản phương án và phân công nhân sự tăng cường trong giờ cao điểm của khoa khám bệnh.  Bằng chứng, kết quả:  - Có phương án và phân công nhân sự tăng cường trong giờ cao điểm của khoa khám bệnh.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa có minh chứng đúng", "giaiphap": "Làm lại phương án và phân công tăng cường nhân lực trong giờ cao điểm", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID070", "tc": "TC03", "ma": "A1.3", "tm": "TM13", "muc": "Mức 4", "noidung": "13. Công khai cam kết về thời gian chờ theo từng phân đoạn trong quy trình khám bệnh: thời gian chờ khám, chờ kết quả cận lâm sàng và chờ lấy thuốc và các thời gian chờ khác.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Quan sát thực tế các bảng biểu công khai cam kết về thời gian chờ theo từng phân đoạn trong quy trình khám bệnh: thời gian chờ khám, chờ kết quả cận lâm sàng và chờ lấy thuốc và các thời gian chờ khác.  Bằng chứng, kết quả:  - Có các bảng biểu công khai cam kết về thời gian chờ theo từng phân đoạn trong quy trình khám bệnh: thời gian chờ khám, chờ kết quả cận lâm sàng và chờ lấy thuốc và các thời gian chờ khác. (chụp ảnh bằng chứng)", "dg2024": "Không đạt", "dg2025": "Không đạt", "nguyennhan": "Chưa có minh chứng", "giaiphap": "Thiết kế bảng biểu theo form mẫu (không tạm bợ các bảng)", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID071", "tc": "TC03", "ma": "A1.3", "tm": "TM14", "muc": "Mức 4", "noidung": "14. Có số liệu về thời gian chờ đợi và thời gian hoàn thành toàn bộ các thủ tục khám bệnh cho các đối tượng sau:  a. Khám lâm sàng  b. Khám lâm sàng + xét nghiệm (sinh hóa, huyết học…)  c. Khám lâm sàng + xét nghiệm + chẩn đoán hình ảnh  d. Khám lâm sàng + xét nghiệm + CĐHA + thăm dò chức năng + khác", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn vản về thời gian chờ đợi và thời gian hoàn thành toàn bộ các thủ tục khám bệnh.  Bằng chứng, kết quả:  - Có biên bản/ báo cáo số liệu về thời gian chờ đợi và thời gian hoàn thành toàn bộ các thủ tục khám bệnh cho các đối tượng sau được phê duyệt, ngày tháng năm trong thời điểm đánh giá:  a. Khám lâm sàng  b. Khám lâm sàng + xét nghiệm (sinh hóa, huyết học…)  c. Khám lâm sàng + xét nghiệm + chẩn đoán hình ảnh  d. Khám lâm sàng + xét nghiệm + CĐHA + thăm dò chức năng + khác", "dg2024": "Không đạt", "dg2025": "Không đạt", "nguyennhan": "Chưa có minh chứng", "giaiphap": "Ra báo cáo sau khảo sát thời gian chờ", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID072", "tc": "TC03", "ma": "A1.3", "tm": "TM15", "muc": "Mức 4", "noidung": "15. Có phương án bố trí thêm các ô, quầy thu viện phí, thanh toán bảo hiểm y tế và nhân viên trong giờ cao điểm và triển khai trên thực tế.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn bản phương án bố trí thêm các ô, quầy thu viện phí, thanh toán bảo hiểm y tế và nhân viên trong giờ cao điểm  Quan sát thực tế các ô, quầy thu viện phí, thanh toán bảo hiểm y tế và nhân viên trong giờ cao điểm.  Bằng chứng, kết quả:  - Có phương án/kế hoạch bố trí thêm các ô, quầy thu viện phí, thanh toán bảo hiểm y tế và nhân viên trong giờ cao điểm được giám đốc phê duyệt.  - Có bố trí thêm các ô, quầy thu viện phí, thanh toán bảo hiểm y tế và nhân viên trong giờ cao điểm (chụp hình bằng chứng).", "dg2024": "Không đạt", "dg2025": "Không đạt", "nguyennhan": "Chưa có minh chứng", "giaiphap": "Xây dựng phương án phối hợp với P.TCKT", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID073", "tc": "TC03", "ma": "A1.3", "tm": "TM16", "muc": "Mức 4", "noidung": "16. Có phương án điều phối lại người bệnh để giảm tải trong trường hợp có những bàn, buồng khám đông người bệnh.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn bản phương án điều phối lại người bệnh để giảm tải trong trường hợp có những bàn, buồng khám đông người bệnh.  Bằng chứng, kết quả:  - Có phương án/ kế hoạch điều phối lại người bệnh để giảm tải trong trường hợp có những bàn, buồng khám đông người bệnh được giám đốc phê duyệt.", "dg2024": "Không đạt", "dg2025": "Không đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID074", "tc": "TC03", "ma": "A1.3", "tm": "TM17", "muc": "Mức 4", "noidung": "17. Có phương án bố trí thêm quầy và nhân viên phát thuốc trong giờ cao điểm và triển khai trên thực tế.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn bản phương án bố trí thêm quầy và nhân viên phát thuốc trong giờ cao điểm Quan sát thực tế việc bố trí thêm quầy và nhân viên phát thuốc trong giờ cao điểm  Bằng chứng, kết quả:  - Có phương án/kế hoạch bố trí thêm quầy và nhân viên phát thuốc trong giờ cao điểm được giám đốc phê duyệt.  - Có bố trí thêm quầy và nhân viên phát thuốc trong giờ cao điểm (chụp hình bằng chứng).", "dg2024": "Không đạt", "dg2025": "Không đạt", "nguyennhan": "Chưa có minh chứng", "giaiphap": "Phối hợp với khoa Dược xây dựng phương án.", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID075", "tc": "TC03", "ma": "A1.3", "tm": "TM18", "muc": "Mức 5", "noidung": "18. Có áp dụng các giải pháp can thiệp làm giảm thời gian chờ đợi của người bệnh.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn bản giải pháp can thiệp làm giảm thời gian chờ đợi của người bệnh.  Quan sát thực tế giải pháp can thiệp làm giảm thời gian chờ đợi của người bệnh.  Bằng chứng, kết quả:  - Có kế hoạch triển khai giải pháp can thiệp làm giảm thời gian chờ đợi của người bệnh.  - Có áp dụng các giải pháp can thiệp làm giảm thời gian chờ đợi của người bệnh, có hình ảnh bằng chứng minh họa.", "dg2024": "Không đạt", "dg2025": "Không đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID076", "tc": "TC03", "ma": "A1.3", "tm": "TM19", "muc": "Mức 5", "noidung": "19. Bệnh viện áp dụng hệ thống công nghệ thông tin, tự động tính toán thời gian trung bình của một lượt khám bệnh theo ngày cho toàn bộ các người bệnh sau:   a. Khám lâm sàng   b. Khám lâm sàng + xét nghiệm (sinh hóa, huyết học…)   c. Khám lâm sàng + xét nghiệm + chẩn đoán hình ảnh   d. Khám lâm sàng + xét nghiệm + CĐHA + thăm dò chức năng   e. Khám lâm sàng + khác   g. Tổng thời gian khám trung bình cho một lượt khám.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Quan sát thực tế hệ thống công nghệ thông tin tự động tính toán thời gian trung bình của từng giai đoạn khám chữa bệnh.  Bằng chứng, kết quả:  - Có áp dụng hệ thống công nghệ thông tin, tự động xuất từ phần mềm tính toán thời gian trung bình của một lượt khám bệnh theo ngày cho toàn bộ các người bệnh sau:  a. Khám lâm sàng  b. Khám lâm sàng + xét nghiệm (sinh hóa, huyết học…)  c. Khám lâm sàng + xét nghiệm + chẩn đoán hình ảnh  d. Khám lâm sàng + xét nghiệm + CĐHA + thăm dò chức năng  e. Khám lâm sàng + khác  g. Tổng thời gian khám trung bình cho một lượt khám.", "dg2024": "Không đạt", "dg2025": "Không đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID078", "tc": "TC03", "ma": "A1.3", "tm": "TM21", "muc": "Mức 5", "noidung": "21. Kết quả đo lường về thời gian chờ của tất cả các phân đoạn trong quy trình khám bệnh không vượt quá các cam kết của bệnh viện.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn bản đo lường về thời gian chờ của tất cả các phân đoạn trong quy trình khám bệnh và đối chiếu với các cam kết của bệnh viện.  Bằng chứng, kết quả:  - Kết quả đo lường về thời gian chờ của tất cả các phân đoạn trong quy trình khám bệnh từ các báo cáo nằm trong giới hạn các cam kết của bệnh viện.", "dg2024": "Không đạt", "dg2025": "Không đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID079", "tc": "TC03", "ma": "A1.3", "tm": "TM22", "muc": "Mức 5", "noidung": "22. Tổng thời gian của quy trình khám bệnh không vượt quá quy định của Bộ Y tế.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn bản đo lường về thời gian chờ của quy trình khám bệnh và so sánh đối chiếu với Quyết định số 1313/QĐ-BYT ngày 22/4/2013 về việc ban hành hướng dẫn quy trình khám bệnh tại khoa khám bệnh của bệnh viện.  Bằng chứng, kết quả:  - Kết quả so sánh, đối chiếu giữa báo cáo đo lường về thời gian chờ của quy trình khám bệnh của bệnh viện với Quyết định số 1313/QĐ-BYT ngày 22/4/2013 về việc ban hành hướng dẫn quy trình khám bệnh tại khoa khám bệnh của bệnh viện nằm trong giới hạn cho phép.", "dg2024": "Không đạt", "dg2025": "Không đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "ID080", "tc": "TC04", "ma": "A1.4", "tm": "TM1", "muc": "Mức 1", "noidung": "1. Phát hiện thấy người bệnh cấp cứu nhưng không được cấp cứu kịp thời gây hậu quả nghiêm trọng như tử vong, các tổn thương không hồi phục (loại trừ các trường hợp do người bệnh đến muộn vượt quá khả năng xử lý).", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn bản, hồi cứu các thông tin phản ánh từ người dân, Sở y tế, Bộ y tế, báo đài …  Bằng chứng, kết quả:  - Kết quả từ các văn bản phát hiện thấy người bệnh cấp cứu nhưng không được cấp cứu kịp thời gây hậu quả nghiêm trọng như tử vong, các tổn
