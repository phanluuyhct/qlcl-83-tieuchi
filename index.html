 thương không hồi phục (loại trừ các trường hợp do người bệnh đến muộn vượt quá khả năng xử lý).", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Cấp cứu", "cb": "Ngô Thị Thúy Hiền"}, {"id": "ID081", "tc": "TC04", "ma": "A1.4", "tm": "TM2", "muc": "Mức 1", "noidung": "2. Bệnh viện không có giường cấp cứu.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Quan sát thực tế khoa cấp cứu của bệnh viện.  Bằng chứng, kết quả:  - Không có giường cấp cứu trong bệnh viện.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Cấp cứu", "cb": "Ngô Thị Thúy Hiền"}, {"id": "ID082", "tc": "TC04", "ma": "A1.4", "tm": "TM3", "muc": "Mức 2", "noidung": "3. Giường cấp cứu không sẵn sàng phục vụ ngay nếu có người bệnh đến cấp cứu.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Quan sát thực tế giường cấp cứu của bệnh viện.  Bằng chứng, kết quả:  - Giường cấp cứu không sẵn sàng phục vụ ngay nếu có người bệnh đến cấp cứu vì lí do hư hỏng, chưa đủ số lượng…", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Cấp cứu", "cb": "Ngô Thị Thúy Hiền"}, {"id": "ID083", "tc": "TC04", "ma": "A1.4", "tm": "TM4", "muc": "Mức 2", "noidung": "4. Có hướng dẫn/quy định về thứ tự ưu tiên khám và xử trí cho đối tượng người bệnh cấp cứu (nếu có đông người bệnh cấp cứu).      (Xem thêm nội dung A2.1.4)", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn bản về thứ tự ưu tiên khám và xử trí cho đối tượng người bệnh cấp cứu (nếu có đông người bệnh cấp cứu).  Bằng chứng, kết quả:  - Có hướng dẫn/quy định về thứ tự ưu tiên khám và xử trí cho đối tượng người bệnh cấp cứu (nếu có đông người bệnh cấp cứu) được bệnh viện phê duyệt.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa cập nhật mới (nếu có)  quy định thứ tự khám ưu tiên cc (khi có đông NB)", "giaiphap": "Đang hoàn thiện, bổ sung quy trình", "han": "", "uutien": "", "donvi": "K. Cấp cứu", "cb": "Ngô Thị Thúy Hiền"}, {"id": "ID084", "tc": "TC04", "ma": "A1.4", "tm": "TM5", "muc": "Mức 2", "noidung": "5. Có quy định cứu chữa ngay cho người bệnh cấp cứu trong trường hợp chưa kịp đóng viện phí hoặc không có người nhà người bệnh đi kèm.", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn bản quy định cứu chữa ngay cho người bệnh cấp cứu trong trường hợp chưa kịp đóng viện phí hoặc không có người nhà người bệnh đi kèm.  Bằng chứng, kết quả:  - Có quy định cứu chữa ngay cho người bệnh cấp cứu trong trường hợp chưa kịp đóng viện phí hoặc không có người nhà người bệnh đi kèm được bệnh viện phê duyệt", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Cấp cứu", "cb": "Ngô Thị Thúy Hiền"}, {"id": "ID085", "tc": "TC04", "ma": "A1.4", "tm": "TM6", "muc": "Mức 2", "noidung": "6. Có danh mục thuốc cấp cứu (theo quy định của Bộ Y tế).", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn bản danh mục thuốc cấp cứu  Bằng chứng, kết quả:  - Có danh mục thuốc cấp cứu (theo quy định của Bộ Y tế) được bệnh viện phê duyệt", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Cấp cứu", "cb": "Ngô Thị Thúy Hiền"}, {"id": "ID086", "tc": "TC04", "ma": "A1.4", "tm": "TM7", "muc": "Mức 2", "noidung": "7. Có danh mục trang thiết bị, phương tiện cấp cứu thiết yếu (theo quy định của Bộ Y tế).", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn bản trang thiết bị, phương tiện cấp cứu thiết yếu (theo quy định của Bộ Y tế).  Bằng chứng, kết quả:  - Có danh mục trang thiết bị, phương tiện cấp cứu thiết yếu (theo quy định của Bộ Y tế) được bệnh viện phê duyệt.", "dg2024": "Không đạt", "dg2025": "Đạt", "nguyennhan": "Chưa cập nhật lại danh mục, danh mục cũ năm 2021", "giaiphap": "Đã cập nhật lại, gửi đề xuất cho phòng VTTBYT rà soát lại và trình ký BGĐ ngày 28/3/2024. thời gian thực hiện trước 19/4/2024", "han": "", "uutien": "", "donvi": "K. Cấp cứu", "cb": "Ngô Thị Thúy Hiền"}, {"id": "ID087", "tc": "TC04", "ma": "A1.4", "tm": "TM8", "muc": "Mức 2", "noidung": "8. Có bảng phân công nhân viên y tế trực cấp cứu (bao gồm hành chính, tài chính, lái xe).", "minhchung": "Phương pháp kiểm tra, đánh giá:  Kiểm tra văn bản phân công nhân viên y tế trực cấp cứu (bao gồm hành chính, tài chính, lái xe).  Bằng chứng, kết quả:  - Có bảng phân công nhân viên y tế trực cấp cứu (bao gồm hành chính, tài chính, lái xe) được ban giám đốc/trưởng phòng Kế hoạch tổng hợp phê duyệt.", "dg2024": "Đạt", "dg2025": "Đạt", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Cấp cứu", "cb": "Ngô Thị Thúy Hiền"}, {"id": "A1.5_TM1", "tc": "TC05", "ma": "A1.5", "tm": "TM1", "muc": "Mức 1", "noidung": "Có tình trạng người bệnh chen lấn vào đăng ký khám hoặc vào khám tại khu khám bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.5_TM2", "tc": "TC05", "ma": "A1.5", "tm": "TM2", "muc": "Mức 2", "noidung": "Có hướng dẫn, quy trình tiếp đón người bệnh theo trật tự trước - sau.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.5_TM3", "tc": "TC05", "ma": "A1.5", "tm": "TM3", "muc": "Mức 2", "noidung": "Có hình thức yêu cầu người bệnh xếp hàng theo trật tự trước – sau như dải phân cách (cứng, mềm), lấy số (bằng máy hoặc thủ công) hoặc bằng các hình thức khác (kể cả với những bệnh viện có ít người bệnh đến).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.5_TM4", "tc": "TC05", "ma": "A1.5", "tm": "TM4", "muc": "Mức 3", "noidung": "Có bộ phận phát số (bằng máy hoặc thủ công đặt tại bộ phận tiếp đón khu khám bệnh) và hướng dẫn người bệnh xếp hàng, bảo đảm tính công bằng, trật tự trong việc khám bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.5_TM5", "tc": "TC05", "ma": "A1.5", "tm": "TM5", "muc": "Mức 3", "noidung": "Có biện pháp giám sát việc lấy số xếp hàng theo đúng thứ tự, do nhân viên trực tiếp thực hiện hoặc qua hệ thống camera tự động.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.5_TM6", "tc": "TC05", "ma": "A1.5", "tm": "TM6", "muc": "Mức 4", "noidung": "Bệnh viện có máy lấy số khám tự động chia theo đối tượng (có và không ưu tiên); theo mục đích đến khám (khám nội, ngoại, sản, nhi…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.5_TM7", "tc": "TC05", "ma": "A1.5", "tm": "TM7", "muc": "Mức 4", "noidung": "Có quy định rõ ràng về đối tượng người bệnh được ưu tiên (do bệnh viện tự quy định) và niêm yết công khai tại khu khám bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.5_TM8", "tc": "TC05", "ma": "A1.5", "tm": "TM8", "muc": "Mức 4", "noidung": "Có các ô làm thủ tục, bàn khám phân loại riêng cho từng đối tượng người bệnh: ưu tiên, khám thường (hoặc các đối tượng khác do bệnh viện tự quy định, phù hợp với đặc thù chuyên môn).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.5_TM9", "tc": "TC05", "ma": "A1.5", "tm": "TM9", "muc": "Mức 4", "noidung": "Có hình thức đăng ký chờ theo trình tự trước - sau tại các khu vực cận lâm sàng, thu viện phí, làm thủ tục bảo hiểm y tế…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.5_TM10", "tc": "TC05", "ma": "A1.5", "tm": "TM10", "muc": "Mức 5", "noidung": "Máy lấy số xếp hàng tự động có ghi thời điểm lấy số và ước tính thời gian đến lượt.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.5_TM11", "tc": "TC05", "ma": "A1.5", "tm": "TM11", "muc": "Mức 5", "noidung": "Có hệ thống đăng ký khám trước qua trang thông tin điện tử (website) hoặc điện thoại và có hệ thống giám sát thứ tự đặt lịch hẹn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.5_TM12", "tc": "TC05", "ma": "A1.5", "tm": "TM12", "muc": "Mức 5", "noidung": "Có ô đăng ký và buồng khám dành cho đối tượng đã đăng ký khám trước.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.5_TM13", "tc": "TC05", "ma": "A1.5", "tm": "TM13", "muc": "Mức 5", "noidung": "Có thể tính được thời gian chờ đợi và tổng thời gian khám bệnh của một người bệnh bất kỳ bằng phần mềm máy tính.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.5_TM14", "tc": "TC05", "ma": "A1.5", "tm": "TM14", "muc": "Mức 5", "noidung": "Thống kê thời gian chờ đợi và khám bệnh trung bình của các đối tượng người bệnh bằng phần mềm máy tính.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.5_TM15", "tc": "TC05", "ma": "A1.5", "tm": "TM15", "muc": "Mức 5", "noidung": "Kết quả thời gian chờ khám chung và thời gian khám bệnh trung bình chung của người bệnh được cập nhật cách 30 phút trong ngày (hoặc nhanh hơn) và công bố trên màn hình điện tử đặt tại khu khám bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM1", "tc": "TC06", "ma": "A1.6", "tm": "TM1", "muc": "Mức 1", "noidung": "Người bệnh không nhận được các hướng dẫn về quy trình xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM2", "tc": "TC06", "ma": "A1.6", "tm": "TM2", "muc": "Mức 1", "noidung": "Phát hiện có người bệnh thắc mắc về số loại và trình tự các xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng phải làm nhưng không được trả lời.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM3", "tc": "TC06", "ma": "A1.6", "tm": "TM3", "muc": "Mức 2", "noidung": "Người bệnh được liệt kê và hướng dẫn cụ thể trình tự các xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng cần làm bằng các hình thức như hướng dẫn miệng, phiếu hướng dẫn, nhân viên y tế trực tiếp đưa người bệnh đi...", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM4", "tc": "TC06", "ma": "A1.6", "tm": "TM4", "muc": "Mức 3", "noidung": "Có tờ giấy hướng dẫn trình tự làm các xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng và phát cho người bệnh (tờ giấy được in và phát riêng hoặc lồng ghép các thông tin hướng dẫn vào phiếu đăng ký khám, phiếu chỉ định các xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng hoặc các phiếu khác do bệnh viện tự quy định).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM5", "tc": "TC06", "ma": "A1.6", "tm": "TM5", "muc": "Mức 3", "noidung": "Trong tờ giấy hướng dẫn có ghi rõ địa điểm hoặc số phòng cần đến và những lưu ý cho người bệnh tuân thủ khi lấy bệnh phẩm hoặc làm các xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM6", "tc": "TC06", "ma": "A1.6", "tm": "TM6", "muc": "Mức 3", "noidung": "Có cung cấp thông tin địa điểm, thời gian trả kết quả hoặc ước tính thời gian trả kết quả cho người bệnh (kể cả những bệnh viện đã trả kết quả xét nghiệm qua mạng máy tính).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM7", "tc": "TC06", "ma": "A1.6", "tm": "TM7", "muc": "Mức 3", "noidung": "Người bệnh được hướng dẫn, giải thích rõ ràng việc thực hiện các quy trình chuyên môn, số loại và trình tự các xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng phải làm (nếu có thắc mắc).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM8", "tc": "TC06", "ma": "A1.6", "tm": "TM8", "muc": "Mức 3", "noidung": "Các xét nghiệm huyết học, hóa sinh máu được lấy một lần trong một ngày khám bệnh (trừ trường đặc biệt phải lấy máu nhiều hơn một lần trong ngày cần phải có giải thích rõ cho người bệnh về lý do chuyên môn).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM9", "tc": "TC06", "ma": "A1.6", "tm": "TM9", "muc": "Mức 3", "noidung": "Người bệnh được được bố trí làm các xét nghiệm theo các trình tự tiện lợi nhất để được lấy mẫu bệnh phẩm và làm xét nghiệm trong một ngày (trừ những xét nghiệm có quy trình trả lời kết quả trên một ngày như kháng sinh đồ; nếu có cần phải giải thích rõ ràng cho người bệnh).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM10", "tc": "TC06", "ma": "A1.6", "tm": "TM10", "muc": "Mức 4", "noidung": "Có phần mềm máy tính tự động chọn trình tự các xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng theo phương án tối ưu, khoa học nhất cho người bệnh, giảm thời gian chờ đợi, tránh quá tải cục bộ tại các phòng cận lâm sàng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM11", "tc": "TC06", "ma": "A1.6", "tm": "TM11", "muc": "Mức 4", "noidung": "Phần mềm tự điều tiết và phân bổ số lượng người bệnh cho các phòng xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng theo thuật toán hợp lý để giảm tối đa thời gian chờ đợi của người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM12", "tc": "TC06", "ma": "A1.6", "tm": "TM12", "muc": "Mức 4", "noidung": "Có hướng dẫn người bệnh bằng các hình thức truyền thông như màn hình điện tử, bảng thông báo, tờ rơi hoặc hình thức khác về những lưu ý cho người bệnh tuân thủ khi lấy bệnh phẩm và trình tự, quy trình làm các xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM13", "tc": "TC06", "ma": "A1.6", "tm": "TM13", "muc": "Mức 4", "noidung": "Sau khi có kết quả các xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng, người bệnh quay trở lại phòng khám gặp bác sỹ đã khám và được ưu tiên giải thích, trả lời kết quả, khám lại, chẩn đoán ngay (có xếp hàng trong số những người có kết quả).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM14", "tc": "TC06", "ma": "A1.6", "tm": "TM14", "muc": "Mức 4", "noidung": "Tiến hành đánh giá thời gian trả kết quả đúng hẹn hoặc sớm hơn và có số liệu tỷ lệ trả kết quả đúng hẹn cụ thể.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM15", "tc": "TC06", "ma": "A1.6", "tm": "TM15", "muc": "Mức 4", "noidung": "Xây dựng danh mục các xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng tối thiểu cần làm cho một số bệnh thường gặp (theo mô hình bệnh tật của bệnh viện) và thông tin công khai cho người bệnh bằng màn hình điện tử, bảng thông báo, tờ rơi hoặc hình thức khác.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM16", "tc": "TC06", "ma": "A1.6", "tm": "TM16", "muc": "Mức 5", "noidung": "Số lượng các bệnh thường gặp đã xây dựng được danh mục các xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng tối thiểu cần làm tăng dần theo thời gian.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM17", "tc": "TC06", "ma": "A1.6", "tm": "TM17", "muc": "Mức 5", "noidung": "Tỷ lệ trả kết quả đúng hẹn được theo dõi và tăng dần theo thời gian.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM18", "tc": "TC06", "ma": "A1.6", "tm": "TM18", "muc": "Mức 5", "noidung": "Công bố công khai tỷ lệ trả kết quả đúng hẹn bằng các kênh truyền thông tại khu khám bệnh hoặc khu làm các xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM19", "tc": "TC06", "ma": "A1.6", "tm": "TM19", "muc": "Mức 5", "noidung": "Tiến hành đánh giá, khảo sát việc hướng dẫn và quy trình làm xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A1.6_TM20", "tc": "TC06", "ma": "A1.6", "tm": "TM20", "muc": "Mức 5", "noidung": "Áp dụng kết quả đánh giá vào việc cải tiến chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Khám bệnh", "cb": "Bùi Thị Xoan"}, {"id": "A2.1_TM1", "tc": "TC07", "ma": "A2.1", "tm": "TM1", "muc": "Mức 1", "noidung": "Phát hiện trong năm có nằm ghép từ 3 người bệnh trở lên trên 1 giường bệnh (trừ trường hợp thiên tai, thảm họa và các vụ dịch truyền nhiễm).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.1_TM2", "tc": "TC07", "ma": "A2.1", "tm": "TM2", "muc": "Mức 2", "noidung": "Buồng bệnh bảo đảm không dột, nát; tường không bong tróc, ẩm mốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.1_TM3", "tc": "TC07", "ma": "A2.1", "tm": "TM3", "muc": "Mức 2", "noidung": "Người bệnh bị bệnh nặng ở khoa hồi sức tích cực, người bệnh sau phẫu thuật, người bệnh cần kết nối với trang thiết bị y tế, người bệnh bị bệnh truyền nhiễm, người bệnh bị nhiễm khuẩn bệnh viện và các người bệnh có nguy cơ bị lây nhiễm cao được bố trí nằm mỗi người một giường.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.1_TM4", "tc": "TC07", "ma": "A2.1", "tm": "TM4", "muc": "Mức 2", "noidung": "Người cao tuổi và các đối tượng ưu tiên khác được quan tâm, ưu tiên bố trí giường bệnh nằm riêng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.1_TM5", "tc": "TC07", "ma": "A2.1", "tm": "TM5", "muc": "Mức 2", "noidung": "Có sổ hoặc phần mềm theo dõi người bệnh nhập, xuất viện tại các khoa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.1_TM6", "tc": "TC07", "ma": "A2.1", "tm": "TM6", "muc": "Mức 2", "noidung": "Có số liệu thống kê số lượt người bệnh nội trú, số giường và “giường tạm” tại các khoa lâm sàng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.1_TM7", "tc": "TC07", "ma": "A2.1", "tm": "TM7", "muc": "Mức 3", "noidung": "Không có tình trạng nằm ghép 2 người bệnh trên 1 giường sau 24 giờ kể từ khi nhập viện (trừ các bệnh viện trực thuộc Bộ Y tế và bệnh viện tuyến cuối của TP. Hồ Chí Minh ký cam kết không nằm ghép sau 48 giờ).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.1_TM8", "tc": "TC07", "ma": "A2.1", "tm": "TM8", "muc": "Mức 3", "noidung": "Tất cả người bệnh được nằm mỗi người một giường kê trong buồng bệnh hoặc hành lang.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.1_TM9", "tc": "TC07", "ma": "A2.1", "tm": "TM9", "muc": "Mức 3", "noidung": "Toàn bộ các giường bệnh kê trong buồng bệnh hoặc hành lang bảo đảm không bị dột, hắt nước khi trời mưa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.1_TM10", "tc": "TC07", "ma": "A2.1", "tm": "TM10", "muc": "Mức 3", "noidung": "Người cao tuổi được quan tâm, ưu tiên bố trí giường bệnh ở các vị trí thuận tiện ra - vào, lên - xuống các tầng gác (nếu khối nhà có từ 2 tầng trở lên) hoặc đi vệ sinh (áp dụng cho các bệnh viện có điều trị cho người bệnh cao tuổi).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.1_TM11", "tc": "TC07", "ma": "A2.1", "tm": "TM11", "muc": "Mức 3", "noidung": "Người bệnh được quan tâm bố trí giường tại các khu vực nam và nữ riêng nếu trong cùng buồng bệnh hoặc trong các buồng bệnh nam và nữ riêng biệt.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.1_TM12", "tc": "TC07", "ma": "A2.1", "tm": "TM12", "muc": "Mức 3", "noidung": "Giường bệnh bảo đảm chắc chắn và được sửa chữa, thay thế kịp thời nếu bị hỏng, bong tróc sơn…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.1_TM13", "tc": "TC07", "ma": "A2.1", "tm": "TM13", "muc": "Mức 4", "noidung": "Tất cả người bệnh được nằm mỗi người một giường theo quy chuẩn giường y tế, kê trong phạm vi bên trong các buồng bệnh hoặc hành lang.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.1_TM14", "tc": "TC07", "ma": "A2.1", "tm": "TM14", "muc": "Mức 4", "noidung": "Người bệnh được điều trị trong buồng bệnh nam và nữ riêng biệt.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.1_TM15", "tc": "TC07", "ma": "A2.1", "tm": "TM15", "muc": "Mức 5", "noidung": "Tất cả người bệnh được nằm mỗi người một giường bệnh, kê trong buồng bệnh vào tất cả các thời điểm trong năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.1_TM16", "tc": "TC07", "ma": "A2.1", "tm": "TM16", "muc": "Mức 5", "noidung": "Các giường bệnh trong cùng một buồng bệnh thống nhất về kiểu dáng, kích thước, chất liệu.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.1_TM17", "tc": "TC07", "ma": "A2.1", "tm": "TM17", "muc": "Mức 5", "noidung": "Giường bệnh được thiết kế bảo đảm an toàn, tiện lợi cho người bệnh: có đầy đủ các tính năng tiện lợi phục vụ người bệnh như có tư thế nằm đầu cao, có bánh xe di chuyển, có bàn ăn, có tính năng điều khiển nâng lên, hạ xuống.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.2_TM1", "tc": "TC08", "ma": "A2.2", "tm": "TM1", "muc": "Mức 1", "noidung": "Trong nhà vệ sinh có nước đọng sàn nhà, rác bẩn, mùi khó chịu, hôi thối.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM2", "tc": "TC08", "ma": "A2.2", "tm": "TM2", "muc": "Mức 1", "noidung": "Có tình trạng một tầng nhà không có nhà vệ sinh cho người bệnh và người nhà người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM3", "tc": "TC08", "ma": "A2.2", "tm": "TM3", "muc": "Mức 1", "noidung": "Có tình trạng một khoa lâm sàng thiếu nhà vệ sinh cho người bệnh và người nhà người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM4", "tc": "TC08", "ma": "A2.2", "tm": "TM4", "muc": "Mức 2", "noidung": "Mỗi khoa lâm sàng và cận lâm sàng có ít nhất 1 khu vệ sinh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM5", "tc": "TC08", "ma": "A2.2", "tm": "TM5", "muc": "Mức 2", "noidung": "Tỷ số giường bệnh/buồng vệ sinh: có ít nhất 1 buồng vệ sinh cho 30 giường bệnh (tính riêng theo từng khoa lâm sàng).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM6", "tc": "TC08", "ma": "A2.2", "tm": "TM6", "muc": "Mức 3", "noidung": "Mỗi khu vệ sinh có ít nhất 2 buồng vệ sinh cho nam và nữ riêng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM7", "tc": "TC08", "ma": "A2.2", "tm": "TM7", "muc": "Mức 3", "noidung": "Tại các khoa cận lâm sàng bố trí buồng vệ sinh để người bệnh lấy nước tiểu xét nghiệm. Trong buồng vệ sinh có giá để bệnh phẩm và sẵn có nước, xà-phòng rửa tay.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM8", "tc": "TC08", "ma": "A2.2", "tm": "TM8", "muc": "Mức 3", "noidung": "Có quy định về thời gian làm vệ sinh trong ngày cho nhân viên vệ sinh, được lưu bằng văn bản, sổ sách.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM9", "tc": "TC08", "ma": "A2.2", "tm": "TM9", "muc": "Mức 3", "noidung": "Có nhân viên làm vệ sinh thường xuyên theo quy định đã đặt ra.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM10", "tc": "TC08", "ma": "A2.2", "tm": "TM10", "muc": "Mức 3", "noidung": "Buồng vệ sinh có đủ nước rửa tay thường xuyên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM11", "tc": "TC08", "ma": "A2.2", "tm": "TM11", "muc": "Mức 3", "noidung": "Buồng vệ sinh sạch sẽ, không có nước đọng, không có côn trùng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM12", "tc": "TC08", "ma": "A2.2", "tm": "TM12", "muc": "Mức 3", "noidung": "Tỷ số giường bệnh/buồng vệ sinh: có ít nhất 1 buồng vệ sinh cho 12 đến 29 giường bệnh (tính riêng theo từng khoa lâm sàng).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM13", "tc": "TC08", "ma": "A2.2", "tm": "TM13", "muc": "Mức 4", "noidung": "Buồng vệ sinh sẵn có giấy vệ sinh và móc treo quần áo sử dụng được.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM14", "tc": "TC08", "ma": "A2.2", "tm": "TM14", "muc": "Mức 4", "noidung": "Khu vệ sinh có bồn rửa tay và cung cấp đủ nước rửa tay thường xuyên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM15", "tc": "TC08", "ma": "A2.2", "tm": "TM15", "muc": "Mức 4", "noidung": "Khu vệ sinh có gương, xà-phòng hoặc dung dịch sát khuẩn rửa tay.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM16", "tc": "TC08", "ma": "A2.2", "tm": "TM16", "muc": "Mức 4", "noidung": "Khu vệ sinh khô ráo, có quạt hút mùi bảo đảm thông gió hoặc có thiết kế thông gió tự nhiên, bảo đảm sạch sẽ không có mùi hôi.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM17", "tc": "TC08", "ma": "A2.2", "tm": "TM17", "muc": "Mức 4", "noidung": "Nhân viên làm vệ sinh có ghi nhật ký các giờ làm vệ sinh theo quy định.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM18", "tc": "TC08", "ma": "A2.2", "tm": "TM18", "muc": "Mức 4", "noidung": "Tỷ số giường bệnh/buồng vệ sinh: có ít nhất 1 buồng vệ sinh cho 7 đến 11 giường bệnh (tính riêng theo từng khoa lâm sàng).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM19", "tc": "TC08", "ma": "A2.2", "tm": "TM19", "muc": "Mức 5", "noidung": "Mỗi buồng bệnh có buồng vệ sinh riêng khép kín; bảo đảm tỷ số giường bệnh/buồng vệ sinh: có ít nhất một buồng vệ sinh cho 6 giường bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM20", "tc": "TC08", "ma": "A2.2", "tm": "TM20", "muc": "Mức 5", "noidung": "Buồng vệ sinh có đầy đủ giấy vệ sinh, xà phòng, móc treo quần áo, gương.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM21", "tc": "TC08", "ma": "A2.2", "tm": "TM21", "muc": "Mức 5", "noidung": "Bồn rửa tay trong các nhà vệ sinh được trang bị vòi cảm ứng tự động mở nước, đóng nước, giảm nguy cơ nhiễm khuẩn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.2_TM22", "tc": "TC08", "ma": "A2.2", "tm": "TM22", "muc": "Mức 5", "noidung": "Toàn bộ các buồng vệ sinh có cánh cửa có chiều mở quay ra bên ngoài buồng vệ sinh (áp dụng với khối nhà xây mới hoặc cải tạo từ 2017 trở đi).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.3_TM1", "tc": "TC09", "ma": "A2.3", "tm": "TM1", "muc": "Mức 1", "noidung": "Phát hiện thấy hiện tượng người bệnh không được bệnh viện cung cấp quần áo đồng phục người bệnh khi nằm viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.3_TM2", "tc": "TC09", "ma": "A2.3", "tm": "TM2", "muc": "Mức 2", "noidung": "Người bệnh khi nhập viện được cung cấp một bộ quần áo đã được giặt sạch, không rách.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.3_TM3", "tc": "TC09", "ma": "A2.3", "tm": "TM3", "muc": "Mức 2", "noidung": "Người bệnh khi nhập viện được cung cấp đầy đủ các vật dụng cá nhân như vỏ chăn, vỏ gối, vải trải giường (hoặc chiếu nếu người bệnh có yêu cầu tại các khu vực nông thôn).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.3_TM4", "tc": "TC09", "ma": "A2.3", "tm": "TM4", "muc": "Mức 3", "noidung": "Giường bệnh có đệm chiếm tỷ lệ từ 70% trở lên (trừ trường hợp người bệnh yêu cầu được nằm chiếu hoặc chỉ định của bác sỹ không nằm đệm).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.3_TM5", "tc": "TC09", "ma": "A2.3", "tm": "TM5", "muc": "Mức 3", "noidung": "Vải trải giường, đệm, gối bảo đảm sạch sẽ và được thay khi bẩn (có chăn đối với các vùng có mùa đông hoặc miền núi khí hậu lạnh, có màn cho người bệnh nếu có yêu cầu ở vùng có nhiều côn trùng).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.3_TM6", "tc": "TC09", "ma": "A2.3", "tm": "TM6", "muc": "Mức 3", "noidung": "Có ghế cho người nhà ngồi chăm sóc người bệnh ở một số buồng bệnh cần người nhà chăm sóc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.3_TM7", "tc": "TC09", "ma": "A2.3", "tm": "TM7", "muc": "Mức 3", "noidung": "Bệnh viện cung cấp áo choàng cho người nhà người bệnh, màu sắc khác với áo người bệnh (tối thiểu tại các khu vực cách ly, cấp cứu, hồi sức tích cực, hồi sức sau phẫu thuật, buồng bệnh cần chăm sóc đặc biệt).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.3_TM8", "tc": "TC09", "ma": "A2.3", "tm": "TM8", "muc": "Mức 4", "noidung": "Giường bệnh có đệm chiếm tỷ lệ từ 90% trở lên (trừ trường hợp người bệnh yêu cầu được nằm chiếu hoặc chỉ định của bác sỹ không nằm đệm).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.3_TM9", "tc": "TC09", "ma": "A2.3", "tm": "TM9", "muc": "Mức 4", "noidung": "Quần áo, chăn màn người bệnh không bị hoen ố.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.3_TM10", "tc": "TC09", "ma": "A2.3", "tm": "TM10", "muc": "Mức 4", "noidung": "Quần áo người bệnh được thay cách nhật (hoặc hàng ngày) và thay khi cần.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.3_TM11", "tc": "TC09", "ma": "A2.3", "tm": "TM11", "muc": "Mức 4", "noidung": "Chăn, ga, gối, đệm được thay hàng tuần và thay khi bẩn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.3_TM12", "tc": "TC09", "ma": "A2.3", "tm": "TM12", "muc": "Mức 4", "noidung": "Quần áo cho người bệnh có ký hiệu về kích cỡ khác nhau để người bệnh có thể được lựa chọn kích cỡ phù hợp như các số 1, 2, 3 hoặc S, M, L hoặc ký hiệu khác dễ hiểu cho người bệnh lựa chọn phù hợp.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.3_TM13", "tc": "TC09", "ma": "A2.3", "tm": "TM13", "muc": "Mức 5", "noidung": "Giường bệnh có đệm chiếm tỷ lệ 99% (trừ trường hợp người bệnh yêu cầu được nằm chiếu hoặc chỉ định của bác sỹ không nằm đệm).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.3_TM14", "tc": "TC09", "ma": "A2.3", "tm": "TM14", "muc": "Mức 5", "noidung": "Người bệnh được cung cấp quần áo phù hợp với kích cỡ người bệnh (ví dụ trẻ em có quần áo riêng, không phải mặc chung quần áo với người lớn).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.3_TM15", "tc": "TC09", "ma": "A2.3", "tm": "TM15", "muc": "Mức 5", "noidung": "Người bệnh được cung cấp quần áo phù hợp với tính chất bệnh tật (ví dụ váy cho người bệnh nam phẫu thuật tiền liệt tuyến…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.3_TM16", "tc": "TC09", "ma": "A2.3", "tm": "TM16", "muc": "Mức 5", "noidung": "Người bệnh được cung cấp các loại quần áo, áo choàng, váy choàng.. có thiết kế riêng, bảo đảm thuận tiện, kín đáo cho người bệnh mặc và cởi khi làm các công việc như nội soi, chiếu chụp, phẫu thuật, thủ thuật…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.3_TM17", "tc": "TC09", "ma": "A2.3", "tm": "TM17", "muc": "Mức 5", "noidung": "Chất liệu của quần áo người bệnh thoáng mát, thấm mồ hôi, chống nhăn (đối với các quần áo được thay mới từ 2017 trở đi).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A2.4_TM1", "tc": "TC10", "ma": "A2.4", "tm": "TM1", "muc": "Mức 1", "noidung": "Phát hiện thấy tình trạng tắt đèn (do tiết kiệm điện hoặc không bật, đèn hỏng…) hoặc không đủ ánh sáng tại các hành lang, lối đi chung vào ban ngày và ban đêm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.4_TM2", "tc": "TC10", "ma": "A2.4", "tm": "TM2", "muc": "Mức 2", "noidung": "Hệ thống chiếu sáng chung bảo đảm hoạt động liên tục trong năm, được thay thế và sửa chữa kịp thời nếu có cháy/hỏng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.4_TM3", "tc": "TC10", "ma": "A2.4", "tm": "TM3", "muc": "Mức 2", "noidung": "Các bệnh phòng, hành lang, lối đi chung bảo đảm cung cấp đủ ánh sáng (tự nhiên hoặc ánh sáng đèn nếu khu vực không có ánh sáng tự nhiên).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.4_TM4", "tc": "TC10", "ma": "A2.4", "tm": "TM4", "muc": "Mức 3", "noidung": "Có máy sưởi ấm (hoặc điều hòa nóng) cho người bệnh vào mùa đông ở các buồng thủ thuật, kỹ thuật cần bộc lộ cơ thể người bệnh (áp dụng cho các tỉnh từ Huế trở ra và các tỉnh Tây Nguyên).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.4_TM5", "tc": "TC10", "ma": "A2.4", "tm": "TM5", "muc": "Mức 3", "noidung": "Khoa lâm sàng cung cấp nước uống cho người bệnh tại hành lang các khoa hoặc trong buồng bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.4_TM6", "tc": "TC10", "ma": "A2.4", "tm": "TM6", "muc": "Mức 3", "noidung": "Có phòng tắm dành cho người bệnh, vòi nước sử dụng tốt và được cung cấp nước thường xuyên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.4_TM7", "tc": "TC10", "ma": "A2.4", "tm": "TM7", "muc": "Mức 3", "noidung": "Bảo đảm thông khí và thoáng mát cho buồng bệnh vào thời tiết nóng, có đủ số lượng quạt tại các buồng bệnh, nếu hỏng được sửa chữa, thay thế kịp thời.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.4_TM8", "tc": "TC10", "ma": "A2.4", "tm": "TM8", "muc": "Mức 4", "noidung": "Có khoa hoặc phòng phục hồi chức năng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.4_TM9", "tc": "TC10", "ma": "A2.4", "tm": "TM9", "muc": "Mức 4", "noidung": "Phòng tập phục hồi chức năng đầy đủ các dụng cụ tập luyện thông thường cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.4_TM10", "tc": "TC10", "ma": "A2.4", "tm": "TM10", "muc": "Mức 4", "noidung": "Phòng tắm cho người bệnh có nước nóng và lạnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.4_TM11", "tc": "TC10", "ma": "A2.4", "tm": "TM11", "muc": "Mức 4", "noidung": "Khoa lâm sàng cung cấp nước uống, bao gồm nước nóng cho người bệnh tại hành lang (hoặc ngay tại buồng bệnh).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.4_TM12", "tc": "TC10", "ma": "A2.4", "tm": "TM12", "muc": "Mức 4", "noidung": "Có đầy đủ các phương tiện (quạt, máy sưởi hoặc máy điều hòa...) bảo đảm nhiệt độ thích hợp cho người bệnh tại các buồng bệnh, thoáng mát vào hè và ấm áp vào mùa đông.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.4_TM13", "tc": "TC10", "ma": "A2.4", "tm": "TM13", "muc": "Mức 4", "noidung": "Có mạng internet không dây phục vụ người bệnh và người nhà người bệnh tại các khu vực sảnh, hành lang (nơi thường tập trung đông người).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.4_TM14", "tc": "TC10", "ma": "A2.4", "tm": "TM14", "muc": "Mức 5", "noidung": "Có điều hòa trong toàn bộ các buồng bệnh (điều hòa hai chiều nóng và lạnh đối với các tỉnh từ Huế trở ra và các tỉnh Tây Nguyên).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.4_TM15", "tc": "TC10", "ma": "A2.4", "tm": "TM15", "muc": "Mức 5", "noidung": "Người bệnh và người nhà người bệnh có thể truy cập được mạng internet không dây ngay tại buồng bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.4_TM16", "tc": "TC10", "ma": "A2.4", "tm": "TM16", "muc": "Mức 5", "noidung": "Có cửa hàng tiện lợi hoặc siêu thị trong bệnh viện, cung cấp đủ các mặt hàng thiết yếu cho người bệnh và người nhà người bệnh, giá được niêm yết rõ ràng (giá của 20 mặt hàng bán chạy nhất không cao hơn giá siêu thị bên ngoài bệnh viện quá 10%).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.4_TM17", "tc": "TC10", "ma": "A2.4", "tm": "TM17", "muc": "Mức 5", "noidung": "Có các khu nhà khách (hoặc nhà trọ) phục vụ cho các đối tượng người bệnh, người nhà người bệnh nếu có nhu cầu được lưu trú trong hoặc gần khuôn viên bệnh viện (hoặc bảo đảm cung cấp giường tạm cho người nhà người bệnh nếu có nhu cầu lưu trú qua đêm).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.5_TM1", "tc": "TC11", "ma": "A2.5", "tm": "TM1", "muc": "Mức 1", "noidung": "Không có xe lăn sẵn sàng phục vụ người khuyết tật (hoặc người vận động khó khăn) tại khu khám bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.5_TM2", "tc": "TC11", "ma": "A2.5", "tm": "TM2", "muc": "Mức 2", "noidung": "Có ít nhất một xe lăn đặt thường trực tại khu khám bệnh phục vụ người tàn tật hoặc người khó vận động khi có nhu cầu.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.5_TM3", "tc": "TC11", "ma": "A2.5", "tm": "TM3", "muc": "Mức 3", "noidung": "Người đi xe lăn có thể tiếp cận với quầy đăng ký khám, phòng khám, phòng xét nghiệm, chẩn đoán hình ảnh, phục hồi chức năng và nộp viện phí.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.5_TM4", "tc": "TC11", "ma": "A2.5", "tm": "TM4", "muc": "Mức 3", "noidung": "Các vỉa hè, lối đi trong khuôn viên bệnh viện được thiết kế bảo đảm xe lăn có thể đi được, an toàn khi vận chuyển và độ dốc phù hợp.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.5_TM5", "tc": "TC11", "ma": "A2.5", "tm": "TM5", "muc": "Mức 4", "noidung": "Các khoa, phòng ở tầng trên cao có thang máy luôn hoạt động thường xuyên, người đi xe lăn có thể tiếp cận và sử dụng được (tự sử dụng hoặc được hỗ trợ).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.5_TM6", "tc": "TC11", "ma": "A2.5", "tm": "TM6", "muc": "Mức 4", "noidung": "Nhà vệ sinh khu khám bệnh có buồng vệ sinh dành riêng cho người tàn tật (được thiết kế đủ rộng và có lối đi để xe lăn tiếp cận được đến các bệ xí ngồi, có tay vịn tại vị trí bệ xí ngồi…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.5_TM7", "tc": "TC11", "ma": "A2.5", "tm": "TM7", "muc": "Mức 5", "noidung": "Người đi xe lăn có thể tự đến được tất cả các khoa lâm sàng, cận lâm sàng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.5_TM8", "tc": "TC11", "ma": "A2.5", "tm": "TM8", "muc": "Mức 5", "noidung": "Toàn bộ người Nhà vệ sinh của toàn bộ các khoa lâm sàng có buồng vệ sinh dành riêng cho người tàn tật (được thiết kế đủ rộng và có lối đi để xe lăn tiếp cận được đến các bệ xí ngồi, có tay vịn tại vị trí bệ xí ngồi…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.5_TM9", "tc": "TC11", "ma": "A2.5", "tm": "TM9", "muc": "Mức 5", "noidung": "khiếm thị (hoặc người mất thị lực tạm thời do phẫu thuật và các nguyên nhân khác) đến khám và chữa bệnh tại bệnh viện được nhân viên y tế dẫn đi khi có nhu cầu di chuyển.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.5_TM10", "tc": "TC11", "ma": "A2.5", "tm": "TM10", "muc": "Mức 5", "noidung": "Có nhân viên phiên dịch cho người bệnh khiếm thính hoặc có phương án hợp tác, ký hợp đồng với người phiên dịch trong trường hợp có người bệnh khiếm thính đến khám, chữa bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A2.5_TM11", "tc": "TC11", "ma": "A2.5", "tm": "TM11", "muc": "Mức 5", "noidung": "Bảo đảm đáp ứng được người phiên dịch cho người bệnh khiếm thính trong vòng 90 phút khi được yêu cầu.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Tô Hoài An"}, {"id": "A3.1_TM1", "tc": "TC12", "ma": "A3.1", "tm": "TM1", "muc": "Mức 1", "noidung": "Có vũng nước, hố nước tù đọng trong khuôn viên bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.1_TM2", "tc": "TC12", "ma": "A3.1", "tm": "TM2", "muc": "Mức 1", "noidung": "Không có khu vực trồng cây hoặc không có cây xanh trong bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.1_TM3", "tc": "TC12", "ma": "A3.1", "tm": "TM3", "muc": "Mức 2", "noidung": "Sử dụng các khoảng không gian ngoài trời để trồng cây xanh hoặc trong nhà, hành lang để đặt chậu cây cảnh, tạo không gian xanh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.1_TM4", "tc": "TC12", "ma": "A3.1", "tm": "TM4", "muc": "Mức 3", "noidung": "Có ít nhất 01 cây xanh thân gỗ lâu năm hoặc có bãi cỏ, vườn hoa khuôn viên bệnh viện (hoặc có giải pháp trồng các vườn treo, “mảng xanh” trên cơ sở tận dụng tối đa các khoảng trống, sân thượng, mái hiên, ban công, mảng tường… tạo cảnh quan xanh cho bệnh viện đối với các bệnh viện chỉ có các khối nhà mà không có sân và bãi cỏ).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.1_TM5", "tc": "TC12", "ma": "A3.1", "tm": "TM5", "muc": "Mức 3", "noidung": "Có bố trí ghế ngồi cố định trong công viên và ngoài sân, vỉa hè… dưới tán các cây xanh hoặc bên rìa bãi cỏ (hoặc trên sân thượng, ban công).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.1_TM6", "tc": "TC12", "ma": "A3.1", "tm": "TM6", "muc": "Mức 3", "noidung": "Các lối đi, ngoài sân, hành lang, sảnh chờ và các vị trí công cộng được bố trí thùng đựng rác sinh hoạt có nắp đậy.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.1_TM7", "tc": "TC12", "ma": "A3.1", "tm": "TM7", "muc": "Mức 3", "noidung": "Có nhân viên quét dọn và làm sạch môi trường bệnh viện thường xuyên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.1_TM8", "tc": "TC12", "ma": "A3.1", "tm": "TM8", "muc": "Mức 4", "noidung": "Có công viên hoặc bãi cỏ, vườn hoa chiếm diện tích từ 5% trở lên trên tổng diện tích bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.1_TM9", "tc": "TC12", "ma": "A3.1", "tm": "TM9", "muc": "Mức 4", "noidung": "Bãi cỏ, cây trồng làm hàng rào được cắt tỉa gọn gàng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.1_TM10", "tc": "TC12", "ma": "A3.1", "tm": "TM10", "muc": "Mức 4", "noidung": "Không có bãi cỏ dại mọc hoang trong khuôn viên bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.1_TM11", "tc": "TC12", "ma": "A3.1", "tm": "TM11", "muc": "Mức 4", "noidung": "Rác luôn được thu gom, quét dọn kịp thời.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.1_TM12", "tc": "TC12", "ma": "A3.1", "tm": "TM12", "muc": "Mức 5", "noidung": "Có công viên hoặc bãi cỏ, vườn hoa chiếm diện tích từ 10% trở lên trên tổng diện tích bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.1_TM13", "tc": "TC12", "ma": "A3.1", "tm": "TM13", "muc": "Mức 5", "noidung": "Trong khuôn viên bệnh viện có trồng ít nhất 5 cây thân gỗ, mỗi cây có tán lá đường kính từ 5m trở lên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.1_TM14", "tc": "TC12", "ma": "A3.1", "tm": "TM14", "muc": "Mức 5", "noidung": "Có đài phun nước (hoặc tiểu cảnh hòn non bộ, bể cá); hoặc hồ nước trong khuôn viên bệnh viện (hoặc bệnh viện tiếp giáp với rừng, hồ, sông, biển có cảnh quan đẹp).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.1_TM15", "tc": "TC12", "ma": "A3.1", "tm": "TM15", "muc": "Mức 5", "noidung": "Đài phun nước (và các địa điểm có nước) được vệ sinh thường xuyên, chống muỗi và côn trùng, ký sinh trùng, sinh vật nguy hại bằng giải pháp vật lý, hóa học, sinh học (lọc, phun thuốc, nuôi cá…)", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.2_TM1", "tc": "TC13", "ma": "A3.2", "tm": "TM1", "muc": "Mức 1", "noidung": "Có hiện tượng tài liệu, trang thiết bị, tài sản… của bệnh viện đang dùng hoặc cũ, hỏng để bừa bãi, gây cản trở lối đi chung.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.2_TM2", "tc": "TC13", "ma": "A3.2", "tm": "TM2", "muc": "Mức 2", "noidung": "Không có hiện tượng tài liệu, trang thiết bị, tài sản… của bệnh viện để lộn xộn, làm xấu cảnh quan chung.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.2_TM3", "tc": "TC13", "ma": "A3.2", "tm": "TM3", "muc": "Mức 2", "noidung": "Các tài sản chung của bệnh viện được xếp đặt vào kho, phòng lưu trữ gọn gàng nếu không sử dụng thường xuyên (tùy bệnh viện sắp xếp phù hợp).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.2_TM4", "tc": "TC13", "ma": "A3.2", "tm": "TM4", "muc": "Mức 2", "noidung": "Không có hiện tượng đồ đạc của nhân viên y tế để trên nóc tủ, hành lang, sảnh, lối đi hoặc để trong tủ giữ đồ, tủ đầu giường dành cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.2_TM5", "tc": "TC13", "ma": "A3.2", "tm": "TM5", "muc": "Mức 2", "noidung": "Người bệnh được thông báo bảo quản và xếp đặt đồ đạc cá nhân gọn gàng, không gây cản trở lối đi và làm xấu cảnh quan chung.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.2_TM6", "tc": "TC13", "ma": "A3.2", "tm": "TM6", "muc": "Mức 3", "noidung": "Đồ đạc của người bệnh và người nhà người bệnh để gọn gàng, không gây cản trở lối đi và làm xấu cảnh quan chung.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.2_TM7", "tc": "TC13", "ma": "A3.2", "tm": "TM7", "muc": "Mức 3", "noidung": "Có tủ giữ đồ hoặc dịch vụ trông giữ đồ cho người bệnh và người nhà người bệnh nếu có nhu cầu tại khu khám bệnh (bộ phận đón tiếp hướng dẫn việc trông giữ đồ hoặc giữ chìa khóa tủ giữ đồ).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.2_TM8", "tc": "TC13", "ma": "A3.2", "tm": "TM8", "muc": "Mức 3", "noidung": "Mỗi giường bệnh có một tủ đầu giường sử dụng tốt, không bị hoen gỉ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.2_TM9", "tc": "TC13", "ma": "A3.2", "tm": "TM9", "muc": "Mức 4", "noidung": "Bảo đảm mỗi người bệnh khi nằm viện có một tủ hoặc một ngăn tủ đựng đồ đạc cá nhân (kể cả người bệnh nằm giường tạm hoặc nằm ghép).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.2_TM10", "tc": "TC13", "ma": "A3.2", "tm": "TM10", "muc": "Mức 4", "noidung": "Ít nhất 50% các khoa lâm sàng được trang bị tủ giữ đồ có khóa (hoặc có dịch vụ trông giữ đồ cho người bệnh và người nhà người bệnh).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.2_TM11", "tc": "TC13", "ma": "A3.2", "tm": "TM11", "muc": "Mức 4", "noidung": "Trong năm có tổ chức giới thiệu và tập huấn phương pháp 5S cho nhân viên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.2_TM12", "tc": "TC13", "ma": "A3.2", "tm": "TM12", "muc": "Mức 4", "noidung": "Áp dụng phương pháp 5S cho tất cả các khu vực tại khoa khám bệnh và ít nhất 1 khoa cận lâm sàng, 2 khoa lâm sàng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.2_TM13", "tc": "TC13", "ma": "A3.2", "tm": "TM13", "muc": "Mức 5", "noidung": "Tủ giữ đồ có khóa được trang bị tại tất cả các khoa lâm sàng (hoặc có dịch vụ trông giữ đồ cho người bệnh và người nhà người bệnh tại tất cả các khoa lâm sàng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.2_TM14", "tc": "TC13", "ma": "A3.2", "tm": "TM14", "muc": "Mức 5", "noidung": "Chìa khóa tủ có dây đeo cổ tay cho người bệnh hoặc các tủ được khóa bằng mã số, hoặc có két an toàn dành cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.2_TM15", "tc": "TC13", "ma": "A3.2", "tm": "TM15", "muc": "Mức 5", "noidung": "Áp dụng phương pháp 5S để cải tiến chất lượng trên phạm vi toàn bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.2_TM16", "tc": "TC13", "ma": "A3.2", "tm": "TM16", "muc": "Mức 5", "noidung": "Có báo cáo đánh giá việc áp dụng phương pháp 5S.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A3.2_TM17", "tc": "TC13", "ma": "A3.2", "tm": "TM17", "muc": "Mức 5", "noidung": "Sử dụng kết quả đánh giá để tiếp tục cải tiến chất lượng, gọn gàng, ngăn nắp.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "A4.1_TM1", "tc": "TC14", "ma": "A4.1", "tm": "TM1", "muc": "Mức 1", "noidung": "Có tình trạng người bệnh không được cung cấp thông tin về tình hình bệnh, kết quả chẩn đoán và dự kiến phương pháp điều trị khi nhập viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM2", "tc": "TC14", "ma": "A4.1", "tm": "TM2", "muc": "Mức 2", "noidung": "Có nội quy hoặc bản hướng dẫn các quy định cho người bệnh và người nhà người bệnh, được treo/dán tại các vị trí dễ nhìn ở sảnh, phòng chờ và các khoa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM3", "tc": "TC14", "ma": "A4.1", "tm": "TM3", "muc": "Mức 2", "noidung": "Người bệnh được cung cấp thông tin về chẩn đoán, nguy cơ, tiên lượng, dự kiến phương pháp và thời gian điều trị khi nhập viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM4", "tc": "TC14", "ma": "A4.1", "tm": "TM4", "muc": "Mức 2", "noidung": "Người bệnh được cung cấp thông tin, giải thích, tư vấn đầy đủ về tình trạng bệnh, kết quả, rủi ro có thể xảy ra để lựa chọn phương pháp chẩn đoán và điều trị.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM5", "tc": "TC14", "ma": "A4.1", "tm": "TM5", "muc": "Mức 2", "noidung": "Người bệnh được giải thích rõ ràng về các thủ thuật, phẫu thuật trước khi thực hiện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM6", "tc": "TC14", "ma": "A4.1", "tm": "TM6", "muc": "Mức 2", "noidung": "Người bệnh được thông báo, giải thích rõ ràng về tính chất, giá cả và lựa chọn về thuốc, vật tư tiêu hao cần thiết cho việc điều trị của người bệnh trước khi sử dụng dịch vụ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM7", "tc": "TC14", "ma": "A4.1", "tm": "TM7", "muc": "Mức 2", "noidung": "Người bệnh được giải thích rõ ràng nếu có thắc mắc trước khi ký các loại giấy tờ như giấy cam đoan, cam kết…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM8", "tc": "TC14", "ma": "A4.1", "tm": "TM8", "muc": "Mức 2", "noidung": "Người bệnh được thông báo lựa chọn vào đối tượng nghiên cứu và có quyền chấp nhận hoặc từ chối tham gia nghiên cứu y sinh học (nếu có).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM9", "tc": "TC14", "ma": "A4.1", "tm": "TM9", "muc": "Mức 3", "noidung": "Người bệnh được cung cấp thông tin về giá dịch vụ khám bệnh, chữa bệnh, các kỹ thuật cao, chi phí lớn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM10", "tc": "TC14", "ma": "A4.1", "tm": "TM10", "muc": "Mức 3", "noidung": "Người bệnh sử dụng thẻ bảo hiểm y tế được nhân viên y tế giải thích trực tiếp về thuốc điều trị, vật tư tiêu hao được bảo hiểm y tế chi trả toàn bộ, một phần hoặc tự túc khi có thắc mắc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM11", "tc": "TC14", "ma": "A4.1", "tm": "TM11", "muc": "Mức 3", "noidung": "Người bệnh được nhân viên y tế giải thích rõ ràng nếu có thắc mắc về các khoản chi trong hóa đơn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM12", "tc": "TC14", "ma": "A4.1", "tm": "TM12", "muc": "Mức 3", "noidung": "Người bệnh được thông báo công khai số lượng thuốc và vật tư tiêu hao sử dụng hàng ngày.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM13", "tc": "TC14", "ma": "A4.1", "tm": "TM13", "muc": "Mức 3", "noidung": "Người bệnh được cung cấp thông tin về chi phí điều trị hàng ngày hoặc khi có yêu cầu.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM14", "tc": "TC14", "ma": "A4.1", "tm": "TM14", "muc": "Mức 3", "noidung": "Người bệnh được cung cấp thông tin tóm tắt về hồ sơ bệnh án nếu có yêu cầu", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM15", "tc": "TC14", "ma": "A4.1", "tm": "TM15", "muc": "Mức 4", "noidung": "Có ít nhất 50% tổng số các khoa lâm sàng xây dựng “Phiếu tóm tắt thông tin điều trị”* cho một bệnh thường gặp tại khoa, sử dụng từ dễ hiểu cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM16", "tc": "TC14", "ma": "A4.1", "tm": "TM16", "muc": "Mức 4", "noidung": "Nhân viên y tế in, phát và tư vấn các “Phiếu tóm tắt thông tin điều trị” cho người bệnh theo dõi và cùng tham gia vào quá trình điều trị.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM17", "tc": "TC14", "ma": "A4.1", "tm": "TM17", "muc": "Mức 5", "noidung": "Mỗi khoa lâm sàng xây dựng “Phiếu tóm tắt thông tin điều trị”* cho ít nhất năm bệnh thường gặp tại khoa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM18", "tc": "TC14", "ma": "A4.1", "tm": "TM18", "muc": "Mức 5", "noidung": "Tiến hành rà soát, cập nhật, chỉnh sửa lại các “Phiếu tóm tắt thông tin điều trị” theo định kỳ thời gian 1, 2 năm một lần hoặc khi hướng dẫn chẩn đoán và điều trị có sự thay đổi.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM19", "tc": "TC14", "ma": "A4.1", "tm": "TM19", "muc": "Mức 5", "noidung": "Có nghiên cứu đánh giá hiệu quả áp dụng “Phiếu tóm tắt thông tin điều trị”.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.1_TM20", "tc": "TC14", "ma": "A4.1", "tm": "TM20", "muc": "Mức 5", "noidung": "Áp dụng kết quả nghiên cứu vào việc cải tiến chất lượng điều trị.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.2_TM1", "tc": "TC15", "ma": "A4.2", "tm": "TM1", "muc": "Mức 1", "noidung": "Phát hiện thấy hiện tượng vi phạm về quyền riêng tư của người bệnh như cung cấp thông tin về bệnh cho không đúng đối tượng, gây khiếu kiện và sau khi xác minh có sai phạm của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.2_TM2", "tc": "TC15", "ma": "A4.2", "tm": "TM2", "muc": "Mức 2", "noidung": "Có quy định về quản lý và lưu trữ bệnh án chặt chẽ tại khoa lâm sàng và các phòng chức năng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.2_TM3", "tc": "TC15", "ma": "A4.2", "tm": "TM3", "muc": "Mức 2", "noidung": "Bệnh án tại các khoa lâm sàng được sắp xếp gọn gàng, không cho người không có thẩm quyền tiếp cận tự do.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.2_TM4", "tc": "TC15", "ma": "A4.2", "tm": "TM4", "muc": "Mức 2", "noidung": "Khoa lâm sàng có trách nhiệm phân công nhân viên trực lưu giữ, bảo quản bệnh án chặt chẽ trong thời gian trực.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.2_TM5", "tc": "TC15", "ma": "A4.2", "tm": "TM5", "muc": "Mức 2", "noidung": "Người bệnh có quyền lưu giữ thông tin về kết quả cận lâm sàng mang tính “nhạy cảm”, có thể gây bất lợi về mặt tâm lý, uy tín, công việc của người bệnh (như nhiễm bệnh lây qua đường máu, da và niêm mạc…). Bệnh viện chỉ được cung cấp thông tin cho người nhà người bệnh (hoặc người khác có yêu cầu) khi được chính người bệnh cho phép (trừ trường hợp theo yêu cầu của cơ quan có thẩm quyền bằng văn bản).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.2_TM6", "tc": "TC15", "ma": "A4.2", "tm": "TM6", "muc": "Mức 2", "noidung": "Người bệnh có quyền từ chối chụp ảnh trong quá trình khám và điều trị (trừ các yêu cầu về chuyên môn).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.2_TM7", "tc": "TC15", "ma": "A4.2", "tm": "TM7", "muc": "Mức 2", "noidung": "Nhân viên y tế, sinh viên y trước khi thực tập, trình diễn (thị phạm) trên cơ thể người bệnh cần xin phép và được sự đồng ý của người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.2_TM8", "tc": "TC15", "ma": "A4.2", "tm": "TM8", "muc": "Mức 2", "noidung": "Nhân viên y tế có trách nhiệm bảo vệ quyền riêng tư người bệnh ngăn không cho người ngoài vào chụp ảnh tự do người bệnh và bảo mật hình ảnh người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.2_TM9", "tc": "TC15", "ma": "A4.2", "tm": "TM9", "muc": "Mức 3", "noidung": "Không có trường hợp người bệnh bị lộ thông tin cá nhân (tên, tuổi, ảnh, nơi công tác...) trên các phương tiện thông tin đại chúng về quá trình điều trị (trừ các trường hợp được sự đồng ý của người bệnh).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.2_TM10", "tc": "TC15", "ma": "A4.2", "tm": "TM10", "muc": "Mức 3", "noidung": "Các phòng khám bệnh, chẩn đoán hình ảnh, thăm dò chức năng, tiểu phẫu, thủ thuật… có vách ngăn hoặc rèm che kín đáo ngăn cách với người không có phận sự ra vào trong khi bác sỹ, điều dưỡng thực hiện thăm khám, thủ thuật, chăm sóc và các công việc khác cần phải bộc lộ cơ thể người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.2_TM11", "tc": "TC15", "ma": "A4.2", "tm": "TM11", "muc": "Mức 3", "noidung": "Sẵn có vách ngăn hoặc rèm che di động tại các khoa lâm sàng để phục vụ người bệnh trong các trường hợp thăm khám tại chỗ, làm thủ thuật hoặc thay đổi quần áo, vệ sinh tại giường.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.2_TM12", "tc": "TC15", "ma": "A4.2", "tm": "TM12", "muc": "Mức 3", "noidung": "Phiếu thông tin treo đầu giường không ghi chi tiết đặc điểm bệnh đối với một số bệnh có thể gây bất lợi về mặt tâm lý, uy tín, công việc của người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.2_TM13", "tc": "TC15", "ma": "A4.2", "tm": "TM13", "muc": "Mức 4", "noidung": "Buồng bệnh chia hai khu vực riêng biệt cho người bệnh nam và nữ trên 13 tuổi, có vách ngăn, rèm che di động hoặc cố định ở giữa hai khu nam và nữ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.2_TM14", "tc": "TC15", "ma": "A4.2", "tm": "TM14", "muc": "Mức 4", "noidung": "Có khu vực thay đồ được che chắn kín đáo khi thực hiện thủ thuật, chẩn đoán hình ảnh, thăm dò chức năng có yêu cầu phải thay quần áo.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.2_TM15", "tc": "TC15", "ma": "A4.2", "tm": "TM15", "muc": "Mức 5", "noidung": "Người bệnh khi tiến hành siêu âm sản phụ khoa, thăm khám bộ phận sinh dục… được cung cấp khăn để che chắn cơ thể (hoặc áo choàng, váy choàng được thiết kế riêng), bảo đảm kín đáo cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.2_TM16", "tc": "TC15", "ma": "A4.2", "tm": "TM16", "muc": "Mức 5", "noidung": "Mỗi giường bệnh được trang bị rèm che, có thể đóng mở khi cần.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.2_TM17", "tc": "TC15", "ma": "A4.2", "tm": "TM17", "muc": "Mức 5", "noidung": "Người bệnh trên 13 tuổi được nằm trong các buồng nam và nữ riêng biệt.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.2_TM18", "tc": "TC15", "ma": "A4.2", "tm": "TM18", "muc": "Mức 5", "noidung": "Khoảng cách giữa 2 giường bệnh tối thiểu 1 mét nếu trong một buồng bệnh có từ 2 giường trở lên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Nhung"}, {"id": "A4.3_TM1", "tc": "TC16", "ma": "A4.3", "tm": "TM1", "muc": "Mức 1", "noidung": "Phát hiện thấy có người bệnh nộp viện phí trực tiếp cho nhân viên tài vụ hoặc nhân viên y tế mà không có hóa đơn của hệ thống tài chính bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM2", "tc": "TC16", "ma": "A4.3", "tm": "TM2", "muc": "Mức 2", "noidung": "Bệnh viện có công bố giá viện phí và các dịch vụ tại các khu vực khám, điều trị và nơi thu viện phí.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM3", "tc": "TC16", "ma": "A4.3", "tm": "TM3", "muc": "Mức 2", "noidung": "Bảng giá viện phí trình bày rõ ràng, dễ nhìn, bố trí tại vị trí dễ quan sát, thuận tiện cho người bệnh tra cứu.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM4", "tc": "TC16", "ma": "A4.3", "tm": "TM4", "muc": "Mức 2", "noidung": "Bảng giá được cập nhật theo quy định và gỡ bỏ bảng giá đã hết hiệu lực.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM5", "tc": "TC16", "ma": "A4.3", "tm": "TM5", "muc": "Mức 2", "noidung": "Bảng giá được chia rõ ràng theo từng đối tượng người bệnh và khám chữa bệnh theo yêu cầu.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM6", "tc": "TC16", "ma": "A4.3", "tm": "TM6", "muc": "Mức 2", "noidung": "Chữ in trong bảng giá với người có thị lực bình thường có thể đọc được rõ ràng ở khoảng cách 3 mét đối với bảng treo, hoặc in chữ có kích cỡ phông từ 14 trở lên đối với bảng giá in dạng quyển (khổ giấy A4) để tra cứu.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM7", "tc": "TC16", "ma": "A4.3", "tm": "TM7", "muc": "Mức 2", "noidung": "Người bệnh nộp viện phí tại các địa điểm thu nộp do bệnh viện quy định, có hóa đơn theo đúng quy định của tài chính hoặc quy định của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM8", "tc": "TC16", "ma": "A4.3", "tm": "TM8", "muc": "Mức 3", "noidung": "Bệnh vi
