": "C7.2_TM19", "tc": "TC55", "ma": "C7.2", "tm": "TM19", "muc": "Mức 4", "noidung": "Khu nhà ăn bố trí riêng biệt với khu khám và điều trị.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.2_TM20", "tc": "TC55", "ma": "C7.2", "tm": "TM20", "muc": "Mức 4", "noidung": "Bếp ăn có đủ nhân viên phục vụ có khả năng cung cấp các suất ăn cho trên 70% người bệnh (tính theo số giường bệnh).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.2_TM21", "tc": "TC55", "ma": "C7.2", "tm": "TM21", "muc": "Mức 5", "noidung": "Có phòng tư vấn, truyền thông về dinh dưỡng riêng biệt.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.2_TM22", "tc": "TC55", "ma": "C7.2", "tm": "TM22", "muc": "Mức 5", "noidung": "Bàn ăn được thiết kế bằng vật liệu chống bám dính, dễ cọ rửa, bảo đảm vệ sinh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.2_TM23", "tc": "TC55", "ma": "C7.2", "tm": "TM23", "muc": "Mức 5", "noidung": "Phương tiện vận chuyển suất ăn tới người bệnh có khả năng giữ nhiệt độ thức ăn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.2_TM24", "tc": "TC55", "ma": "C7.2", "tm": "TM24", "muc": "Mức 5", "noidung": "Bếp ăn có đủ nhân viên phục vụ có khả năng cung cấp các suất ăn trên 90% người bệnh (tính theo số giường bệnh), nhân viên y tế và người nhà người bệnh khi có nhu cầu.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.2_TM25", "tc": "TC55", "ma": "C7.2", "tm": "TM25", "muc": "Mức 5", "noidung": "Có đủ trang thiết bị, hóa chất hoặc phương tiện khác phòng chống ruồi, gián, côn trùng, chuột và động vật có nguy cơ gây bệnh tại khu vực kho thực phẩm, bếp và nhà ăn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.2_TM26", "tc": "TC55", "ma": "C7.2", "tm": "TM26", "muc": "Mức 5", "noidung": "Bảo đảm không có ruồi, gián, côn trùng, chuột và động vật có nguy cơ gây bệnh tại khu vực nhà ăn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.3_TM1", "tc": "TC56", "ma": "C7.3", "tm": "TM1", "muc": "Mức 1", "noidung": "Người bệnh không được cân trọng lượng cơ thể, đo chiều cao, tính chỉ số khối cơ thể khi nhập viện và không được ghi nhận vào hồ sơ bệnh án.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.3_TM2", "tc": "TC56", "ma": "C7.3", "tm": "TM2", "muc": "Mức 2", "noidung": "Tỷ lệ người bệnh được cân trọng lượng cơ thể, đo chiều cao, tính chỉ số khối cơ thể khi nhập viện chiếm từ 50% trở lên và được ghi vào hồ sơ bệnh án.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.3_TM3", "tc": "TC56", "ma": "C7.3", "tm": "TM3", "muc": "Mức 3", "noidung": "Có mẫu phiếu đánh giá, sàng lọc tình trạng dinh dưỡng người bệnh (bệnh viện tự xây dựng hoặc tham khảo từ tổ chức khác).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.3_TM4", "tc": "TC56", "ma": "C7.3", "tm": "TM4", "muc": "Mức 3", "noidung": "Người bệnh được phân loại và xác định chính xác nguy cơ suy dinh dưỡng khi nhập viện không quá 36 giờ kể từ khi nhập viện (hoặc được phân loại trong hồ sơ theo dõi người bệnh trong vòng 1 tháng trước kể từ ngày nhập viện).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.3_TM5", "tc": "TC56", "ma": "C7.3", "tm": "TM5", "muc": "Mức 3", "noidung": "Bác sỹ điều trị khám, đánh giá tình trạng dinh dưỡng, tư vấn và chỉ định chế độ ăn bệnh lý cho người bệnh theo mã của Bộ Y tế cho những người bệnh bắt buộc ăn theo chế độ ăn bệnh lý (đái đường, tăng huyết áp, suy thận…) hoặc người bệnh có nhu cầu.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.3_TM6", "tc": "TC56", "ma": "C7.3", "tm": "TM6", "muc": "Mức 3", "noidung": "Hồ sơ bệnh án có ghi các thông tin liên quan đến dinh dưỡng như kết quả đánh giá tình trạng dinh dưỡng, chế độ ăn (nếu cần thiết) và các thông tin cần lưu ý về dinh dưỡng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.3_TM7", "tc": "TC56", "ma": "C7.3", "tm": "TM7", "muc": "Mức 4", "noidung": "Người bệnh có nguy cơ hoặc bị suy dinh dưỡng, mắc các bệnh lý có liên quan đến dinh dưỡng khi nhập viện được lập kế hoạch theo dõi, đánh giá tình trạng dinh dưỡng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.3_TM8", "tc": "TC56", "ma": "C7.3", "tm": "TM8", "muc": "Mức 4", "noidung": "Người bệnh được can thiệp dinh dưỡng dựa trên kết quả đánh giá tình trạng dinh dưỡng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.3_TM9", "tc": "TC56", "ma": "C7.3", "tm": "TM9", "muc": "Mức 4", "noidung": "Người bệnh suy dinh dưỡng nặng được hội chẩn với khoa dinh dưỡng-tiết chế, đánh giá tình trạng dinh dưỡng, lập kế hoạch và can thiệp dinh dưỡng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.3_TM10", "tc": "TC56", "ma": "C7.3", "tm": "TM10", "muc": "Mức 5", "noidung": "Người bệnh có chỉ định can thiệp dinh dưỡng được theo dõi, đánh giá lại tình trạng dinh dưỡng, tư vấn và điều chỉnh chế độ dinh dưỡng phù hợp.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.3_TM11", "tc": "TC56", "ma": "C7.3", "tm": "TM11", "muc": "Mức 5", "noidung": "Có tiến hành khảo sát (hoặc nghiên cứu) về việc đánh giá, theo dõi tình trạng dinh dưỡng của người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.3_TM12", "tc": "TC56", "ma": "C7.3", "tm": "TM12", "muc": "Mức 5", "noidung": "Có báo cáo đánh giá, trong đó có chỉ ra những khó khăn, hạn chế, nhược điểm cần khắc phục và đề xuất giải pháp can thiệp.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.3_TM13", "tc": "TC56", "ma": "C7.3", "tm": "TM13", "muc": "Mức 5", "noidung": "Áp dụng kết quả khảo sát (hoặc nghiên cứu) vào cải tiến chất lượng đánh giá và theo dõi tình trạng dinh dưỡng người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.4_TM1", "tc": "TC57", "ma": "C7.4", "tm": "TM1", "muc": "Mức 1", "noidung": "Không thực hiện hướng dẫn, tư vấn chế độ ăn cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.4_TM2", "tc": "TC57", "ma": "C7.4", "tm": "TM2", "muc": "Mức 2", "noidung": "Nhân viên y tế có tư vấn chế độ ăn phù hợp cho người bệnh mắc các bệnh cần có lưu ý đặc biệt về chế độ ăn như đái tháo đường, tăng huyết áp, bệnh thận…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.4_TM3", "tc": "TC57", "ma": "C7.4", "tm": "TM3", "muc": "Mức 3", "noidung": "Có góc truyền thông, tranh ảnh về dinh dưỡng ở các khoa lâm sàng và những nơi tập trung nhiều người bệnh và người nhà người bệnh, ví dụ thông tin về dinh dưỡng hợp lý, chế độ ăn cho các bệnh lý, trẻ em, người cao tuổi, phụ nữ mang thai, phụ nữ cho con bú…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.4_TM4", "tc": "TC57", "ma": "C7.4", "tm": "TM4", "muc": "Mức 3", "noidung": "Có hướng dẫn, tư vấn chế độ ăn cho người bệnh bằng tranh ảnh, tờ rơi hoặc băng hình… cho ít nhất 3 bệnh (hoặc 3 vấn đề sức khỏe) thường gặp tại bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.4_TM5", "tc": "TC57", "ma": "C7.4", "tm": "TM5", "muc": "Mức 4", "noidung": "Có ít nhất 50% tổng số các khoa lâm sàng có tài liệu tư vấn, truyền thông về dinh dưỡng cho ít nhất một bệnh hoặc một vấn đề sức khỏe cần tư vấn về dinh dưỡng thường gặp của mỗi khoa. Thông tin về dinh dưỡng có thể trình bày dưới dạng tài liệu riêng, tờ rơi hoặc lồng ghép vào các tài liệu khác (như “Phiếu tóm tắt thông tin điều trị” trong tiêu chí A4.1", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.4_TM6", "tc": "TC57", "ma": "C7.4", "tm": "TM6", "muc": "Mức 4", "noidung": "Nhân viên y tế in, phát và tư vấn các tài liệu truyền thông về dinh dưỡng cho người bệnh (hoặc có hình thức cung cấp thông tin khác như phát trên màn hình).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.4_TM7", "tc": "TC57", "ma": "C7.4", "tm": "TM7", "muc": "Mức 4", "noidung": "Tổ chức truyền thông, giáo dục về dinh dưỡng cho người bệnh tại khoa điều trị hoặc hội trường.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.4_TM8", "tc": "TC57", "ma": "C7.4", "tm": "TM8", "muc": "Mức 5", "noidung": "Khoa/tổ dinh dưỡng-tiết chế hướng dẫn, hỗ trợ, kiểm tra, giám sát chế độ dinh dưỡng tại các khoa/phòng điều trị (bao gồm việc thực hiện nuôi con bằng sữa mẹ, thực hành nuôi con hợp lý…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.4_TM9", "tc": "TC57", "ma": "C7.4", "tm": "TM9", "muc": "Mức 5", "noidung": "Có phòng tư vấn về dinh dưỡng cho người bệnh, trong đó có cung cấp dịch vụ khám và tư vấn cho người bệnh về dinh dưỡng và chế độ ăn bệnh lý.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.4_TM10", "tc": "TC57", "ma": "C7.4", "tm": "TM10", "muc": "Mức 5", "noidung": "Tiến hành khảo sát, đánh giá (hoặc nghiên cứu) việc hướng dẫn, tư vấn chế độ ăn phù hợp với bệnh lý cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.4_TM11", "tc": "TC57", "ma": "C7.4", "tm": "TM11", "muc": "Mức 5", "noidung": "Có báo cáo đánh giá, trong đó có chỉ ra những nhược điểm, khó khăn cần khắc phục và đề xuất giải pháp cải tiến chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.4_TM12", "tc": "TC57", "ma": "C7.4", "tm": "TM12", "muc": "Mức 5", "noidung": "Tiến hành cải tiến chất lượng tư vấn dinh dưỡng cho người bệnh dựa trên kết quả khảo sát, đánh giá (hoặc nghiên cứu).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.5_TM1", "tc": "TC58", "ma": "C7.5", "tm": "TM1", "muc": "Mức 1", "noidung": "Không có tài liệu xây dựng suất ăn bệnh lý hoặc khẩu phần dinh dưỡng cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.5_TM2", "tc": "TC58", "ma": "C7.5", "tm": "TM2", "muc": "Mức 2", "noidung": "Có văn bản quy định về việc hội chẩn giữa nhân viên khoa dinh dưỡng tiết chế với bác sỹ điều trị về chế độ dinh dưỡng cho người bệnh trong trường hợp người bệnh mắc các bệnh liên quan đến dinh dưỡng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.5_TM3", "tc": "TC58", "ma": "C7.5", "tm": "TM3", "muc": "Mức 2", "noidung": "Người mắc các bệnh liên quan đến dinh dưỡng được hội chẩn giữa nhân viên khoa/tổ dinh dưỡng tiết chế với bác sỹ lâm sàng về chế độ dinh dưỡng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.5_TM4", "tc": "TC58", "ma": "C7.5", "tm": "TM4", "muc": "Mức 3", "noidung": "Khoa/tổ dinh dưỡng-tiết chế xây dựng các khẩu phần ăn bệnh lý khác nhau cho từng đối tượng người bệnh (tối thiểu cho các bệnh đái tháo đường, tăng huyết áp, suy thận…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.5_TM5", "tc": "TC58", "ma": "C7.5", "tm": "TM5", "muc": "Mức 3", "noidung": "Khoa/tổ dinh dưỡng tổ chức cung cấp suất ăn bệnh lý cho từng đối tượng người bệnh được bác sỹ điều trị chỉ định khẩu phần ăn bệnh lý (tối thiểu cho các bệnh đái tháo đường, tăng huyết áp, suy thận…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.5_TM6", "tc": "TC58", "ma": "C7.5", "tm": "TM6", "muc": "Mức 3", "noidung": "Người mắc các bệnh liên quan đến dinh dưỡng được cung cấp bữa ăn bảo đảm vệ sinh an toàn thực phẩm, phù hợp với tình trạng bệnh theo chỉ định của bác sỹ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.5_TM7", "tc": "TC58", "ma": "C7.5", "tm": "TM7", "muc": "Mức 3", "noidung": "Khoa dinh dưỡng -tiết chế quản lý được chất lượng vệ sinh an toàn thực phẩm của cơ sở cung cấp suất ăn cho bệnh viện (bao gồm cả nhà ăn/căng-tin trong bệnh viện): có mẫu thực phẩm lưu, kiểm tra thường xuyên, giám sát vệ sinh nhà bếp (kể cả các bếp ăn do tổ chức hoặc cá nhân điều hành cung cấp suất ăn cho bệnh viện).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.5_TM8", "tc": "TC58", "ma": "C7.5", "tm": "TM8", "muc": "Mức 3", "noidung": "Trẻ em bị suy dinh dưỡng nặng cấp tính được điều trị theo hướng dẫn chẩn đoán và điều trị bệnh suy dinh dưỡng cấp tính ở trẻ em từ 0-72 tháng tuổi theo quy định của Bộ Y tế (nếu bệnh viện không điều trị cho đối tượng trẻ em suy dinh dưỡng nặng cấp tính thì tiểu mục này được tính là đạt).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.5_TM9", "tc": "TC58", "ma": "C7.5", "tm": "TM9", "muc": "Mức 4", "noidung": "Khoa dinh dưỡng-tiết chế (hoặc cơ sở cung cấp suất ăn) phục vụ suất ăn cho trên 70% đối tượng người bệnh (không bao gồm trẻ dưới 6 tháng tuổi).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.5_TM10", "tc": "TC58", "ma": "C7.5", "tm": "TM10", "muc": "Mức 4", "noidung": "Tiến hành khảo sát, đánh giá (hoặc nghiên cứu) việc cung cấp chế độ ăn phù hợp với bệnh lý cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.5_TM11", "tc": "TC58", "ma": "C7.5", "tm": "TM11", "muc": "Mức 4", "noidung": "Có báo cáo đánh giá, trong đó có chỉ ra những nhược điểm, khó khăn cần khắc phục và đề xuất giải pháp cải tiến chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.5_TM12", "tc": "TC58", "ma": "C7.5", "tm": "TM12", "muc": "Mức 5", "noidung": "Các suất ăn được tính toán tổng giá trị năng lượng calori và có cung cấp thông tin và calori trực tiếp đến người bệnh bằng các hình thức như dán nhãn bên ngoài suất ăn, có tranh, ảnh về suất ăn và tổng lượng calori…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.5_TM13", "tc": "TC58", "ma": "C7.5", "tm": "TM13", "muc": "Mức 5", "noidung": "Người bệnh suy dinh dưỡng nặng được hỗ trợ dinh dưỡng (bổ sung dinh dưỡng/dinh dưỡng đường tĩnh mạch) để cải thiện tình trạng dinh dưỡng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.5_TM14", "tc": "TC58", "ma": "C7.5", "tm": "TM14", "muc": "Mức 5", "noidung": "Khoa dinh dưỡng-tiết chế (hoặc cơ sở cung cấp suất ăn) phục vụ suất ăn cho trên 90% đối tượng người bệnh (không bao gồm trẻ dưới 6 tháng tuổi).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.5_TM15", "tc": "TC58", "ma": "C7.5", "tm": "TM15", "muc": "Mức 5", "noidung": "Tiến hành cải tiến chất lượng cung cấp chế độ ăn phù hợp với bệnh lý cho người bệnh dựa trên kết quả khảo sát, đánh giá (hoặc nghiên cứu).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C8.1_TM1", "tc": "TC59", "ma": "C8.1", "tm": "TM1", "muc": "Mức 1", "noidung": "Khoa/phòng xét nghiệm được bố trí chung (phòng hoặc không gian) với các khoa lâm sàng hoặc các phòng khác.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM2", "tc": "TC59", "ma": "C8.1", "tm": "TM2", "muc": "Mức 1", "noidung": "Phát hiện thấy bệnh viện không cung cấp được một (hoặc nhiều) kỹ thuật xét nghiệm từ 3 ngày trở lên do các máy đều hỏng cùng thời điểm mà không có cơ chế chuyển gửi.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM3", "tc": "TC59", "ma": "C8.1", "tm": "TM3", "muc": "Mức 2", "noidung": "Khoa/phòng xét nghiệm được bố trí riêng biệt với các khoa lâm sàng và các phòng khác.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM4", "tc": "TC59", "ma": "C8.1", "tm": "TM4", "muc": "Mức 2", "noidung": "Khoa/phòng xét nghiệm có nhân sự trình độ trung cấp/cao đẳng trở lên đúng chuyên ngành.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM5", "tc": "TC59", "ma": "C8.1", "tm": "TM5", "muc": "Mức 2", "noidung": "Có đầy đủ trang thiết bị, vật tư phục vụ cho các xét nghiệm huyết học, hóa sinh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM6", "tc": "TC59", "ma": "C8.1", "tm": "TM6", "muc": "Mức 2", "noidung": "Bảo đảm năng lực thực hiện được đầy đủ các xét nghiệm huyết học, hóa sinh cơ bản (theo danh mục kỹ thuật).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM7", "tc": "TC59", "ma": "C8.1", "tm": "TM7", "muc": "Mức 2", "noidung": "Có hướng dẫn sử dụng, bảo dưỡng, vệ sinh máy xét nghiệm; được treo tại máy hoặc đặt tại vị trí tập trung dễ lấy trong phòng xét nghiệm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM8", "tc": "TC59", "ma": "C8.1", "tm": "TM8", "muc": "Mức 2", "noidung": "Các trang thiết bị khoa xét nghiệm có sổ nhật ký hoạt động và được theo dõi thường xuyên, có ghi rõ số lượt sử dụng, thời gian hỏng hóc, sửa chữa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM9", "tc": "TC59", "ma": "C8.1", "tm": "TM9", "muc": "Mức 2", "noidung": "Tổng thời gian của một loại kỹ thuật xét nghiệm bị tạm dừng do trang thiết bị không hoạt động được do hỏng hóc, sửa chữa… không quá 14 ngày trong năm (chấp nhận hình thức gửi mẫu sang cơ sở y tế khác nếu không có máy thay thế).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM10", "tc": "TC59", "ma": "C8.1", "tm": "TM10", "muc": "Mức 2", "noidung": "Có các hình thức như trao đổi, phản hồi thông tin liên quan đến xét nghiệm cho các khoa lâm sàng (khách hàng của khoa xét nghiệm) khi cần thiết.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM11", "tc": "TC59", "ma": "C8.1", "tm": "TM11", "muc": "Mức 3", "noidung": "Khoa/phòng xét nghiệm có nhân sự có trình độ đại học đúng chuyên ngành.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM12", "tc": "TC59", "ma": "C8.1", "tm": "TM12", "muc": "Mức 3", "noidung": "Có các trang thiết bị và đủ khả năng thực hiện các xét nghiệm sinh hóa, huyết học, miễn dịch (theo danh mục kỹ thuật).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM13", "tc": "TC59", "ma": "C8.1", "tm": "TM13", "muc": "Mức 3", "noidung": "Khoa/phòng xét nghiệm có điều hòa nhiệt độ và hoạt động thường xuyên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM14", "tc": "TC59", "ma": "C8.1", "tm": "TM14", "muc": "Mức 3", "noidung": "Có khu vực lấy bệnh phẩm xét nghiệm (kể cả phân và nước tiểu) thuận tiện cho người bệnh: có móc treo quần áo, đồ dùng; có giá để bệnh phẩm và xà phòng, nước rửa tay cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM15", "tc": "TC59", "ma": "C8.1", "tm": "TM15", "muc": "Mức 3", "noidung": "Tổng thời gian của một loại kỹ thuật xét nghiệm bị tạm dừng do trang thiết bị không hoạt động được do hỏng hóc, sửa chữa… không quá 7 ngày trong năm (chấp nhận hình thức gửi mẫu sang cơ sở y tế khác nếu không có máy thay thế).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM16", "tc": "TC59", "ma": "C8.1", "tm": "TM16", "muc": "Mức 4", "noidung": "Phụ trách khối xét nghiệm có trình độ sau đại học đúng chuyên ngành.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM17", "tc": "TC59", "ma": "C8.1", "tm": "TM17", "muc": "Mức 4", "noidung": "Khoa xét nghiệm có các trang thiết bị và thực hiện được đầy đủ các hoạt động xét nghiệm huyết học, hóa sinh, miễn dịch, vi sinh hoặc giải phẫu bệnh (theo danh mục kỹ thuật).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM18", "tc": "TC59", "ma": "C8.1", "tm": "TM18", "muc": "Mức 4", "noidung": "Có khả năng thực hiện và đọc được các xét nghiệm huyết học, hóa sinh, miễn dịch, vi sinh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM19", "tc": "TC59", "ma": "C8.1", "tm": "TM19", "muc": "Mức 4", "noidung": "Có tham gia tư vấn, hỗ trợ, đào tạo về quản lý chất lượng phòng xét nghiệm cho các đơn vị khác (nếu bệnh viện có được giao chức năng chỉ đạo tuyến, hỗ trợ, đào tạo).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM20", "tc": "TC59", "ma": "C8.1", "tm": "TM20", "muc": "Mức 5", "noidung": "Khối xét nghiệm có nhân sự có trình độ tiến sỹ y học hoặc các chuyên ngành liên quan đến xét nghiệm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM21", "tc": "TC59", "ma": "C8.1", "tm": "TM21", "muc": "Mức 5", "noidung": "Thiết lập hệ thống quản lý chất lượng chung cho tất cả các phòng xét nghiệm tại bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM22", "tc": "TC59", "ma": "C8.1", "tm": "TM22", "muc": "Mức 5", "noidung": "Có phần mềm quản lý thông tin phòng xét nghiệm, bao gồm quản lý người bệnh, chỉ định, mẫu, thời gian, nhân viên, phương tiện thực hiện và trả kết quả.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM23", "tc": "TC59", "ma": "C8.1", "tm": "TM23", "muc": "Mức 5", "noidung": "Thực hiện trả kết quả xét nghiệm cho các khoa lâm sàng và cho người bệnh bằng phần mềm công nghệ thông tin.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.1_TM24", "tc": "TC59", "ma": "C8.1", "tm": "TM24", "muc": "Mức 5", "noidung": "Trong năm có thực hiện ít nhất một nghiên cứu liên quan đến xét nghiệm và công bố kết quả nghiên cứu.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Trần Thị Bé Bảy - Vi Sinh: Vũ Hồng Nguyên, Võ Minh Tuấn - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.2_TM1", "tc": "TC60", "ma": "C8.2", "tm": "TM1", "muc": "Mức 1", "noidung": "Bệnh viện chưa thực hiện nội kiểm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Nguyễn Thị Việt - Vi Sinh: Đinh Minh Ngọc, Vũ Văn Đạt - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.2_TM2", "tc": "TC60", "ma": "C8.2", "tm": "TM2", "muc": "Mức 1", "noidung": "Phát hiện thấy máy báo lỗi nhưng vẫn tiến hành trả kết quả xét nghiệm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Nguyễn Thị Việt - Vi Sinh: Đinh Minh Ngọc, Vũ Văn Đạt - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.2_TM3", "tc": "TC60", "ma": "C8.2", "tm": "TM3", "muc": "Mức 1", "noidung": "Phát hiện có trường hợp trả kết quả không đúng người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Nguyễn Thị Việt - Vi Sinh: Đinh Minh Ngọc, Vũ Văn Đạt - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.2_TM4", "tc": "TC60", "ma": "C8.2", "tm": "TM4", "muc": "Mức 2", "noidung": "Bệnh viện có quy định bằng văn bản và thực hiện nội kiểm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Nguyễn Thị Việt - Vi Sinh: Đinh Minh Ngọc, Vũ Văn Đạt - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.2_TM5", "tc": "TC60", "ma": "C8.2", "tm": "TM5", "muc": "Mức 2", "noidung": "Các hoạt động kiểm tra có ghi lại trong sổ nhật ký nội kiểm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Nguyễn Thị Việt - Vi Sinh: Đinh Minh Ngọc, Vũ Văn Đạt - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.2_TM6", "tc": "TC60", "ma": "C8.2", "tm": "TM6", "muc": "Mức 3", "noidung": "Bảo đảm chạy mẫu nội kiểm trước khi thực hiện xét nghiệm cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Nguyễn Thị Việt - Vi Sinh: Đinh Minh Ngọc, Vũ Văn Đạt - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.2_TM7", "tc": "TC60", "ma": "C8.2", "tm": "TM7", "muc": "Mức 3", "noidung": "Kết quả chạy mẫu nội kiểm được ghi lại trong sổ nhật ký.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Nguyễn Thị Việt - Vi Sinh: Đinh Minh Ngọc, Vũ Văn Đạt - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.2_TM8", "tc": "TC60", "ma": "C8.2", "tm": "TM8", "muc": "Mức 3", "noidung": "Bệnh viện có quy định bằng văn bản và thực hiện ngoại kiểm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Nguyễn Thị Việt - Vi Sinh: Đinh Minh Ngọc, Vũ Văn Đạt - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.2_TM9", "tc": "TC60", "ma": "C8.2", "tm": "TM9", "muc": "Mức 3", "noidung": "Có hoạt động thống kê, phân tích và tính độ lệch chuẩn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Nguyễn Thị Việt - Vi Sinh: Đinh Minh Ngọc, Vũ Văn Đạt - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.2_TM10", "tc": "TC60", "ma": "C8.2", "tm": "TM10", "muc": "Mức 3", "noidung": "Đã thiết lập hệ thống quản lý chất lượng xét nghiệm (tổ chức, phân công nhiệm vụ, xây dựng quy trình, tài liệu hướng dẫn, đào tạo…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Nguyễn Thị Việt - Vi Sinh: Đinh Minh Ngọc, Vũ Văn Đạt - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.2_TM11", "tc": "TC60", "ma": "C8.2", "tm": "TM11", "muc": "Mức 3", "noidung": "Có đăng ký tham gia và thực hiện chương trình ngoại kiểm với trung tâm kiểm chuẩn đã được cấp phép hoạt động.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Nguyễn Thị Việt - Vi Sinh: Đinh Minh Ngọc, Vũ Văn Đạt - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.2_TM12", "tc": "TC60", "ma": "C8.2", "tm": "TM12", "muc": "Mức 3", "noidung": "Có thực hiện hiệu chuẩn thiết bị xét nghiệm theo định kỳ và đột xuất nếu có phát hiện sai lệch.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Nguyễn Thị Việt - Vi Sinh: Đinh Minh Ngọc, Vũ Văn Đạt - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.2_TM13", "tc": "TC60", "ma": "C8.2", "tm": "TM13", "muc": "Mức 3", "noidung": "Nếu phát hiện máy có sai lệch, bệnh viện có hiệu chỉnh hoặc có hình thức/biện pháp xử lý khắc phục ngay để bảo đảm chất lượng xét nghiệm và ghi hồ sơ đầy đủ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Nguyễn Thị Việt - Vi Sinh: Đinh Minh Ngọc, Vũ Văn Đạt - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.2_TM14", "tc": "TC60", "ma": "C8.2", "tm": "TM14", "muc": "Mức 3", "noidung": "Có nhân viên chuyên trách/kiêm nhiệm về chất lượng xét nghiệm được đào tạo về quản lý chất lượng xét nghiệm (có chứng chỉ).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Nguyễn Thị Việt - Vi Sinh: Đinh Minh Ngọc, Vũ Văn Đạt - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.2_TM15", "tc": "TC60", "ma": "C8.2", "tm": "TM15", "muc": "Mức 3", "noidung": "Nhân viên khoa xét nghiệm tham gia đào tạo liên tục đầy đủ theo quy định của Bộ Y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Nguyễn Thị Việt - Vi Sinh: Đinh Minh Ngọc, Vũ Văn Đạt - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.2_TM16", "tc": "TC60", "ma": "C8.2", "tm": "TM16", "muc": "Mức 3", "noidung": "Tiến hành đào tạo và đào tạo liên tục cho nhân viên xét nghiệm về các kỹ thuật mới triển khai tại bệnh viện (nếu có).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Nguyễn Thị Việt - Vi Sinh: Đinh Minh Ngọc, Vũ Văn Đạt - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.2_TM17", "tc": "TC60", "ma": "C8.2", "tm": "TM17", "muc": "Mức 4", "noidung": "Đã tham gia ngoại kiểm cho các loại xét nghiệm theo định kỳ, đầy đủ (dựa trên các quy định của cơ quan quản lý).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Nguyễn Thị Việt - Vi Sinh: Đinh Minh Ngọc, Vũ Văn Đạt - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C8.2_TM18", "tc": "TC60", "ma": "C8.2", "tm": "TM18", "muc": "Mức 4", "noidung": "Có đăng ký tham gia và thực hiện chương trình ngoại : "", "giaiphap": "", "han": "", "uutien": "", "donvi": "Khối Xét nghiệm", "cb": "\\- Huyết học: Nguyễn Thị Việt - Vi Sinh: Đinh Minh Ngọc, Vũ Văn Đạt - Hóa sinh: Nguyễn Văn Chính"}, {"id": "C9.1_TM1", "tc": "TC61", "ma": "C9.1", "tm": "TM1", "muc": "Mức 1", "noidung": "Bệnh viện chưa có khoa dược.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.1_TM2", "tc": "TC61", "ma": "C9.1", "tm": "TM2", "muc": "Mức 2", "noidung": "Bệnh viện đã thành lập khoa dược.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.1_TM3", "tc": "TC61", "ma": "C9.1", "tm": "TM3", "muc": "Mức 2", "noidung": "Phụ trách khoa dược có trình độ cao đẳng về dược trở lên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.1_TM4", "tc": "TC61", "ma": "C9.1", "tm": "TM4", "muc": "Mức 2", "noidung": "Khoa dược có các bộ phận: nghiệp vụ dược, kho và cấp phát, thống kê dược.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.1_TM5", "tc": "TC61", "ma": "C9.1", "tm": "TM5", "muc": "Mức 2", "noidung": "Các văn bằng, chứng chỉ (bản sao) của nhân viên khoa dược được tập hợp thành một bộ và lưu tại khoa dược.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.1_TM6", "tc": "TC61", "ma": "C9.1", "tm": "TM6", "muc": "Mức 3", "noidung": "Có bản mô tả vị trí việc làm cho các vị trí trong khoa dược và xác định nhu cầu nhân lực khoa dược.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.1_TM7", "tc": "TC61", "ma": "C9.1", "tm": "TM7", "muc": "Mức 3", "noidung": "Khoa dược bảo đảm đầy đủ nhân lực cho các chức danh nghề nghiệp trong các bộ phận khoa dược.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.1_TM8", "tc": "TC61", "ma": "C9.1", "tm": "TM8", "muc": "Mức 3", "noidung": "Khoa dược có nhân viên làm công tác dược lâm sàng và thông tin thuốc (kiêm nhiệm hoặc chuyên trách).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.1_TM9", "tc": "TC61", "ma": "C9.1", "tm": "TM9", "muc": "Mức 3", "noidung": "Khoa dược có phân công nhân viên phụ trách theo dõi và báo cáo phản ứng có hại của thuốc (ADR).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.1_TM10", "tc": "TC61", "ma": "C9.1", "tm": "TM10", "muc": "Mức 3", "noidung": "Lãnh đạo khoa dược có chuyên môn dược trình độ đại học trở lên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.1_TM11", "tc": "TC61", "ma": "C9.1", "tm": "TM11", "muc": "Mức 3", "noidung": "Các nhân viên khoa dược được đào tạo, tập huấn về chuyên môn dược.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.1_TM12", "tc": "TC61", "ma": "C9.1", "tm": "TM12", "muc": "Mức 4", "noidung": "Khoa dược có đầy đủ số lượng nhân lực cho các vị trí việc làm trong các bộ phận của khoa dược (theo đề án vị trí việc làm hoặc kế hoạch nhân lực).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.1_TM13", "tc": "TC61", "ma": "C9.1", "tm": "TM13", "muc": "Mức 4", "noidung": "Khoa dược có cán bộ chuyên trách làm công tác dược lâm sàng và thông tin thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.1_TM14", "tc": "TC61", "ma": "C9.1", "tm": "TM14", "muc": "Mức 4", "noidung": "Toàn bộ nhân viên khoa dược bảo đảm được đào tạo liên tục đầy đủ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.1_TM15", "tc": "TC61", "ma": "C9.1", "tm": "TM15", "muc": "Mức 4", "noidung": "Lãnh đạo khoa dược có trình độ sau đại học chuyên ngành dược (hoặc là dược sỹ chính).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.1_TM16", "tc": "TC61", "ma": "C9.1", "tm": "TM16", "muc": "Mức 5", "noidung": "Theo dõi, rà soát tình hình nhân lực khoa dược và điều chuyển, tuyển dụng bổ sung nhân lực phù hợp với quy mô và sự phát triển khoa dược, bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.1_TM17", "tc": "TC61", "ma": "C9.1", "tm": "TM17", "muc": "Mức 5", "noidung": "Lãnh đạo khoa dược có trình độ tiến sỹ, chuyên khoa II trở lên chuyên ngành dược (hoặc là dược sỹ cao cấp).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.1_TM18", "tc": "TC61", "ma": "C9.1", "tm": "TM18", "muc": "Mức 5", "noidung": "Có kế hoạch và cử nhân viên đào tạo đội ngũ lãnh đạo khoa dược kế cận.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM1", "tc": "TC62", "ma": "C9.2", "tm": "TM1", "muc": "Mức 1", "noidung": "Khoa dược chưa có phòng làm việc riêng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM2", "tc": "TC62", "ma": "C9.2", "tm": "TM2", "muc": "Mức 1", "noidung": "Không có nhà thuốc hoặc cơ sở bán lẻ thuốc trong khuôn viên bệnh viện (trừ trường hợp bệnh viện bảo đảm cung ứng đầy đủ thuốc 100% cho người bệnh nội trú và ngoại trú).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM3", "tc": "TC62", "ma": "C9.2", "tm": "TM3", "muc": "Mức 1", "noidung": "Phát hiện thấy trong kho thuốc có tổ mối.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM4", "tc": "TC62", "ma": "C9.2", "tm": "TM4", "muc": "Mức 2", "noidung": "Khoa dược có phòng làm việc riêng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM5", "tc": "TC62", "ma": "C9.2", "tm": "TM5", "muc": "Mức 2", "noidung": "Khoa dược được nối mạng internet để tra cứu thông tin về thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM6", "tc": "TC62", "ma": "C9.2", "tm": "TM6", "muc": "Mức 2", "noidung": "Có quy định về bảo quản thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM7", "tc": "TC62", "ma": "C9.2", "tm": "TM7", "muc": "Mức 2", "noidung": "Kho thuốc được bố trí thoáng, mát, thuận tiện cho việc xuất, nhập thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM8", "tc": "TC62", "ma": "C9.2", "tm": "TM8", "muc": "Mức 2", "noidung": "Kho thuốc có trang thiết bị việc theo dõi, bảo quản thuốc: giá kệ, nhiệt kế, ẩm kế, quạt thông gió, điều hòa nhiệt độ, tủ lạnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM9", "tc": "TC62", "ma": "C9.2", "tm": "TM9", "muc": "Mức 2", "noidung": "Kho thuốc bảo đảm ánh sáng mặt trời không chiếu trực tiếp vào thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM10", "tc": "TC62", "ma": "C9.2", "tm": "TM10", "muc": "Mức 2", "noidung": "Theo dõi, quản lý xuất, nhập, tồn thuốc đầy đủ bằng sổ sách, ghi chép rõ ràng (hoặc bằng máy tính và phần mềm quản lý thuốc).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM11", "tc": "TC62", "ma": "C9.2", "tm": "TM11", "muc": "Mức 2", "noidung": "Có nhà thuốc hoặc cơ sở bán lẻ thuốc trong khuôn viên bệnh viện (trừ trường hợp bệnh viện bảo đảm cung ứng đầy đủ thuốc 100% cho người bệnh nội trú và ngoại trú).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM12", "tc": "TC62", "ma": "C9.2", "tm": "TM12", "muc": "Mức 3", "noidung": "Khoa dược bố trí kho hóa chất, cồn tách biệt với kho thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM13", "tc": "TC62", "ma": "C9.2", "tm": "TM13", "muc": "Mức 3", "noidung": "Bảo đảm đầy đủ các trang thiết bị, phương tiện chống ẩm, mốc tại kho thuốc, cơ sở bán lẻ thuốc cho các thuốc có nguồn gốc thực vật, động vật (thuốc đông y) và các thuốc, hóa chất có nguy cơ ẩm mốc cao.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM14", "tc": "TC62", "ma": "C9.2", "tm": "TM14", "muc": "Mức 3", "noidung": "Bảo đảm phòng tránh côn trùng, mối mọt và động vật nguy hại (như chuột) tại kho thuốc, cơ sở bán lẻ thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM15", "tc": "TC62", "ma": "C9.2", "tm": "TM15", "muc": "Mức 3", "noidung": "*Hệ thống kho dược liệu, vị thuốc y học cổ truyền được bảo quản ở nơi tách biệt, sạch sẽ, đạt các tiêu chuẩn về ánh sáng, nhiệt độ, độ ẩm, độ thông thoáng; phòng tránh côn trùng, mối mọt; phòng chống cháy, nổ; đầy đủ trang thiết bị bảo đảm an toàn vệ sinh khi lưu trữ và chia thang thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM16", "tc": "TC62", "ma": "C9.2", "tm": "TM16", "muc": "Mức 3", "noidung": "*Khu vực sơ chế dược liệu, bào chế vị thuốc y học cổ truyền, nơi sắc thuốc, cấp phát thuốc được bố trí ở vị trí phù hợp cho việc vận chuyển và cấp phát thuốc; có đầy đủ trang thiết bị phục vụ công tác sơ chế dược liệu, bào chế vị thuốc y học cổ truyền.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM17", "tc": "TC62", "ma": "C9.2", "tm": "TM17", "muc": "Mức 3", "noidung": "Khoa dược bố trí các bộ phận liên quan đến cấp phát thuốc (kho, quầy, phòng) cho người bệnh ngoại trú thuận tiện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM18", "tc": "TC62", "ma": "C9.2", "tm": "TM18", "muc": "Mức 3", "noidung": "Kho thuốc và toàn bộ địa điểm cấp phát thuốc có trang thiết bị việc theo dõi, bảo quản thuốc: giá kệ, nhiệt kế, ẩm kế, quạt thông gió, điều hòa nhiệt độ, tủ lạnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM19", "tc": "TC62", "ma": "C9.2", "tm": "TM19", "muc": "Mức 3", "noidung": "Đơn vị thông tin thuốc được trang thiết bị đầy đủ: máy tính, mạng internet, tài liệu có liên quan.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM20", "tc": "TC62", "ma": "C9.2", "tm": "TM20", "muc": "Mức 3", "noidung": "Có sổ và theo dõi thường xuyên nhiệt độ, độ ẩm của các kho thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM21", "tc": "TC62", "ma": "C9.2", "tm": "TM21", "muc": "Mức 3", "noidung": "Có phần mềm quản lý được xuất, nhập, tồn thuốc trong khoa dược.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM22", "tc": "TC62", "ma": "C9.2", "tm": "TM22", "muc": "Mức 3", "noidung": "Khoa dược có xây dựng quy trình chuẩn cho các hoạt động chuyên môn về xuất – nhập, bảo quản thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM23", "tc": "TC62", "ma": "C9.2", "tm": "TM23", "muc": "Mức 4", "noidung": "Hệ thống kho thuốc xây dựng theo nguyên tắc “Thực hành tốt bảo quản thuốc”.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM24", "tc": "TC62", "ma": "C9.2", "tm": "TM24", "muc": "Mức 4", "noidung": "Tiến hành đánh giá về thực hành và bảo quản thuốc tại kho dược hằng năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM25", "tc": "TC62", "ma": "C9.2", "tm": "TM25", "muc": "Mức 4", "noidung": "Tiến hành đánh giá chất lượng nhà thuốc hoặc cơ sở bán lẻ thuốc trong khuôn viên bệnh viện hằng năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM26", "tc": "TC62", "ma": "C9.2", "tm": "TM26", "muc": "Mức 4", "noidung": "Khoa Dược kiểm soát được số lượng thuốc thông qua hệ thống phần mềm quản lý của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM27", "tc": "TC62", "ma": "C9.2", "tm": "TM27", "muc": "Mức 4", "noidung": "Thực hiện đúng quy trình chuẩn cho các hoạt động chuyên môn dược.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM28", "tc": "TC62", "ma": "C9.2", "tm": "TM28", "muc": "Mức 5", "noidung": "Tiến hành cải tiến chất lượng và khắc phục các nhược điểm để nhà thuốc bệnh viện đạt các tiêu chuẩn chất lượng (như đạt tiêu chuẩn GPP hoặc các tiêu chuẩn chất lượng khác mang tính đặc thù nếu có, ví dụ cho bệnh viện chuyên khoa y dược học cổ truyền, bệnh viện quân đội…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM29", "tc": "TC62", "ma": "C9.2", "tm": "TM29", "muc": "Mức 5", "noidung": "Khoa dược có trang bị phần mềm tra cứu thông tin thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM30", "tc": "TC62", "ma": "C9.2", "tm": "TM30", "muc": "Mức 5", "noidung": "Khoa dược có trang bị phần mềm lưu trữ thông tin thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM31", "tc": "TC62", "ma": "C9.2", "tm": "TM31", "muc": "Mức 5", "noidung": "Có quy trình và hệ thống vận chuyển thuốc khép kín trong bệnh viện (bán tự động hoặc tự động hoàn toàn), bảo đảm an toàn, chất lượng và tiện lợi.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.2_TM32", "tc": "TC62", "ma": "C9.2", "tm": "TM32", "muc": "Mức 5", "noidung": "**Khoa dược có trang bị hệ thống và phòng pha chế sạch, bảo đảm cho pha chế các dung dịch vô khuẩn dùng trong tiêm, truyền và nuôi dưỡng qua đường tĩnh mạch.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.3_TM1", "tc": "TC63", "ma": "C9.3", "tm": "TM1", "muc": "Mức 1", "noidung": "Phát hiện thấy trong bệnh viện có thuốc, vật tư y tế tiêu hao quá hạn hoặc thuốc không đạt chất lượng về mặt cảm quan nhưng không được để ở khu vực riêng chờ xử lý.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.3_TM2", "tc": "TC63", "ma": "C9.3", "tm": "TM2", "muc": "Mức 1", "noidung": "Không cung cấp được số liệu về xuất, nhập thuốc ngay khi được yêu cầu.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.3_TM3", "tc": "TC63", "ma": "C9.3", "tm": "TM3", "muc": "Mức 1", "noidung": "Có vụ việc thiếu thuốc trong danh mục dẫn đến hậu quả người bệnh tử vong hoặc tổn thương không hồi phục.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.3_TM4", "tc": "TC63", "ma": "C9.3", "tm": "TM4", "muc": "Mức 2", "noidung": "Có tiến hành lựa chọn và xây dựng danh mục thuốc bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.3_TM5", "tc": "TC63", "ma": "C9.3", "tm": "TM5", "muc": "Mức 2", "noidung": "Bảo đảm mua thuốc theo đúng quy định, không phát hiện có sai phạm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.3_TM6", "tc": "TC63", "ma": "C9.3", "tm": "TM6", "muc": "Mức 3", "noidung": "Có quy trình cấp phát thuốc trong bệnh viện từ khoa dược đến người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.3_TM7", "tc": "TC63", "ma": "C9.3", "tm": "TM7", "muc": "Mức 3", "noidung": "Có quy trình kiểm soát chất lượng thuốc tại khoa Dược.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.3_TM8", "tc": "TC63", "ma": "C9.3", "tm": "TM8", "muc": "Mức 3", "noidung": "Có quy trình xử lý các thuốc chất lượng không đảm bảo tại bệnh viện", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.3_TM9", "tc": "TC63", "ma": "C9.3", "tm": "TM9", "muc": "Mức 3", "noidung": "Có xây dựng và quản lý danh mục thuốc cấp cứu (danh mục thuốc tủ trực) tại các khoa lâm sàng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.3_TM10", "tc": "TC63", "ma": "C9.3", "tm": "TM10", "muc": "Mức 3", "noidung": "Thực hiện báo cáo thường xuyên, đầy đủ các số liệu về sử dụng thuốc: báo cáo sử dụng thuốc, báo cáo sử dụng thuốc kháng sinh, báo cáo công tác khoa dược bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.3_TM11", "tc": "TC63", "ma": "C9.3", "tm": "TM11", "muc": "Mức 3", "noidung": "Bảo đảm cung cấp đầy đủ thuốc, hóa chất và vật tư y tế tiêu hao trong danh mục của bệnh viện cho người bệnh nội trú.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.3_TM12", "tc": "TC63", "ma": "C9.3", "tm": "TM12", "muc": "Mức 4", "noidung": "Bảo đảm cung cấp đầy đủ thuốc, vật tư y tế tiêu hao trong và ngoài danh mục cho người bệnh nội trú.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.3_TM13", "tc": "TC63", "ma": "C9.3", "tm": "TM13", "muc": "Mức 4", "noidung": "Bảo đảm cung ứng thuốc, vật tư y tế tiêu hao liên tục, không gián đoạn (không có tình trạng thiếu thuốc vào cuối tháng, cuối năm hoặc đầu năm).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.3_TM14", "tc": "TC63", "ma": "C9.3", "tm": "TM14", "muc": "Mức 4", "noidung": "Có quy trình và phương án tổ chức cung ứng các thuốc hiếm theo yêu cầu điều trị và thuốc điều trị các bệnh hiếm gặp (trong trường hợp cần điều trị người bệnh tại bệnh viện, không chuyển tuyến).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.3_TM15", "tc": "TC63", "ma": "C9.3", "tm": "TM15", "muc": "Mức 5", "noidung": "Tiến hành khảo sát, đánh giá (hoặc nghiên cứu) việc cung ứng thuốc và vật tư y tế tại bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.3_TM16", "tc": "TC63", "ma": "C9.3", "tm": "TM16", "muc": "Mức 5", "noidung": "Có báo cáo đánh giá, trong đó có chỉ ra những nhược điểm, khó khăn cần khắc phục trong cung ứng thuốc, vật tư và đề xuất giải pháp cải tiến.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.3_TM17", "tc": "TC63", "ma": "C9.3", "tm": "TM17", "muc": "Mức 5", "noidung": "Tiến hành cải tiến chất lượng cung ứng thuốc và vật tư y tế dựa trên kết quả khảo sát, đánh giá (hoặc nghiên cứu).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.3_TM18", "tc": "TC63", "ma": "C9.3", "tm": "TM18", "muc": "Mức 5", "noidung": "Áp dụng thành tựu khoa học, kỹ thuật mới trong việc cung ứng thuốc và vật tư y tế tiêu hao kịp thời, chất lượng (ví dụ triển khai hệ thống chia thuốc tự động, máy tự động dán nhãn thuốc, liều dùng, tên người bệnh… vào các túi thuốc được chia cho người bệnh).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Phan Như Ngọc"}, {"id": "C9.4_TM1", "tc": "TC64", "ma": "C9.4", "tm": "TM1", "muc": "Mức 1", "noidung": "Phát hiện thấy sử dụng thuốc sai đường dùng, sai tên thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM2", "tc": "TC64", "ma": "C9.4", "tm": "TM2", "muc": "Mức 1", "noidung": "Phát hiện đơn thuốc kê hai thuốc cùng hoạt chất.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM3", "tc": "TC64", "ma": "C9.4", "tm": "TM3", "muc": "Mức 2", "noidung": "Triển khai, thực hiện 5 đúng khi sử dụng thuốc tại các khoa/phòng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM4", "tc": "TC64", "ma": "C9.4", "tm": "TM4", "muc": "Mức 2", "noidung": "Bảo đảm thực hiện các quy định về kê đơn thuốc ngoại trú tại bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM5", "tc": "TC64", "ma": "C9.4", "tm": "TM5", "muc": "Mức 2", "noidung": "Có hướng dẫn về sử dụng thuốc cho điều dưỡng, nhân viên y tế ít nhất 1 buổi/năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM6", "tc": "TC64", "ma": "C9.4", "tm": "TM6", "muc": "Mức 3", "noidung": "Có xây dựng các quy trình chuyên môn liên quan đến sử dụng thuốc: cấp phát thuốc, pha chế thuốc, giám sát sự cố trong sử dụng thuốc…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM7", "tc": "TC64", "ma": "C9.4", "tm": "TM7", "muc": "Mức 3", "noidung": "Bảo đảm thực hiện kê đơn thuốc phù hợp với diễn biến của bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM8", "tc": "TC64", "ma": "C9.4", "tm": "TM8", "muc": "Mức 3", "noidung": "Bảo đảm thực hiện kê đơn thuốc theo đúng các quy chế kê đơn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM9", "tc": "TC64", "ma": "C9.4", "tm": "TM9", "muc": "Mức 3", "noidung": "Bảo đảm thực hiện không kê thực phẩm chức năng trong đơn thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM10", "tc": "TC64", "ma": "C9.4", "tm": "TM10", "muc": "Mức 3", "noidung": "Bảo đảm 5 đúng khi sử dụng thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM11", "tc": "TC64", "ma": "C9.4", "tm": "TM11", "muc": "Mức 3", "noidung": "Có xây dựng danh mục thuốc nhìn giống nhau, đọc giống nhau (LASA).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM12", "tc": "TC64", "ma": "C9.4", "tm": "TM12", "muc": "Mức 4", "noidung": "Có hướng dẫn bằng hình ảnh danh mục LASA và phổ biến cho các nhân viên y tế, khoa khám bệnh và các khoa lâm sàng áp dụng thực hiện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM13", "tc": "TC64", "ma": "C9.4", "tm": "TM13", "muc": "Mức 4", "noidung": "Thực hiện được việc ra lẻ thuốc cho từng người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM14", "tc": "TC64", "ma": "C9.4", "tm": "TM14", "muc": "Mức 4", "noidung": "Xây dựng quy trình hướng dẫn và giám sát sử dụng các thuốc có nguy cơ cao xuất hiện ADR và các sự cố trong sử dụng thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM15", "tc": "TC64", "ma": "C9.4", "tm": "TM15", "muc": "Mức 4", "noidung": "Chỉ định thuốc theo đúng phác đồ điều trị của bệnh viện, hướng dẫn chẩn đoán và điều trị của Bộ Y tế/bệnh viện hoặc khuyến cáo của Tổ chức y tế thế giới.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM16", "tc": "TC64", "ma": "C9.4", "tm": "TM16", "muc": "Mức 4", "noidung": "Theo dõi và quản lý các thuốc cần chia liều khi sử dụng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM17", "tc": "TC64", "ma": "C9.4", "tm": "TM17", "muc": "Mức 4", "noidung": "Khoa dược tổ chức tập huấn, thông tin cho nhân viên y tế về hiệu quả và độ an toàn khi sử dụng thuốc (có tài liệu và chương trình đào tạo) ít nhất 1 lần/năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM18", "tc": "TC64", "ma": "C9.4", "tm": "TM18", "muc": "Mức 4", "noidung": "Tiến hành khảo sát, đánh giá (nghiên cứu) việc sử dụng thuốc an toàn, hợp lý.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM19", "tc": "TC64", "ma": "C9.4", "tm": "TM19", "muc": "Mức 4", "noidung": "Có báo cáo đánh giá việc sử dụng thuốc, trong đó có chỉ ra những nhược điểm, hạn chế cần khắc phục và đề xuất giải pháp cải tiến chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM20", "tc": "TC64", "ma": "C9.4", "tm": "TM20", "muc": "Mức 5", "noidung": "Thực hiện được việc ra lẻ thuốc cho từng người bệnh và cung cấp đủ các thông tin như tên, tuổi người bệnh; tên thuốc, đường dùng, liều dùng, thời gian dùng thuốc (ví dụ có nhãn in các thông tin trên dán vào túi thuốc lẻ của người bệnh).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM21", "tc": "TC64", "ma": "C9.4", "tm": "TM21", "muc": "Mức 5", "noidung": "Sử dụng thông tin về hiệu quả và độ an toàn của thuốc để khuyến cáo thay đổi, bổ sung danh mục thuốc dùng trong bệnh viện, chỉ định dùng thuốc của thầy thuốc, hướng dẫn điều trị và các quy trình chuyên môn khác trong bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM22", "tc": "TC64", "ma": "C9.4", "tm": "TM22", "muc": "Mức 5", "noidung": "Có áp dụng phần mềm cảnh báo tương tác thuốc tích hợp khi kê đơn trên phạm vi toàn bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM23", "tc": "TC64", "ma": "C9.4", "tm": "TM23", "muc": "Mức 5", "noidung": "Xây dựng và thực hiện quy trình giám sát điều trị thông qua việc theo dõi nồng độ thuốc trong máu.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM24", "tc": "TC64", "ma": "C9.4", "tm": "TM24", "muc": "Mức 5", "noidung": "Có phần mềm theo dõi và quản lý lịch sử dùng thuốc của người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.4_TM25", "tc": "TC64", "ma": "C9.4", "tm": "TM25", "muc": "Mức 5", "noidung": "Tiến hành cải tiến chất lượng dựa trên kết quả khảo sát, đánh giá (nghiên cứu).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM1", "tc": "TC65", "ma": "C9.5", "tm": "TM1", "muc": "Mức 1", "noidung": "Chưa triển khai hoạt động thông tin thuốc tại bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM2", "tc": "TC65", "ma": "C9.5", "tm": "TM2", "muc": "Mức 1", "noidung": "Chưa sẵn có mẫu báo cáo ADR tại các khoa/phòng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM3", "tc": "TC65", "ma": "C9.5", "tm": "TM3", "muc": "Mức 2", "noidung": "Đã thành lập đơn vị thông tin thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM4", "tc": "TC65", "ma": "C9.5", "tm": "TM4", "muc": "Mức 2", "noidung": "Có xây dựng kế hoạch hoạt động và phân công nhiệm vụ đơn vị thông tin thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM5", "tc": "TC65", "ma": "C9.5", "tm": "TM5", "muc": "Mức 2", "noidung": "Có xây dựng quy trình thông tin thuốc tại bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM6", "tc": "TC65", "ma": "C9.5", "tm": "TM6", "muc": "Mức 2", "noidung": "Có xây dựng quy trình giám sát ADR tại bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM7", "tc": "TC65", "ma": "C9.5", "tm": "TM7", "muc": "Mức 3", "noidung": "Có thực hiện việc thông tin thuốc tại bệnh viện theo quy trình đã xây dựng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM8", "tc": "TC65", "ma": "C9.5", "tm": "TM8", "muc": "Mức 3", "noidung": "Có thực hiện việc giám sát ADR tại bệnh viện theo quy trình đã xây dựng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM9", "tc": "TC65", "ma": "C9.5", "tm": "TM9", "muc": "Mức 3", "noidung": "Có tổ chức hoạt động thông tin thuốc cho bác sĩ, điều dưỡng về thuốc, thuốc mới, chất lượng thuốc, phản ứng có hại của thuốc, sự cố trong sử dụng thuốc, các khuyến cáo về thuốc của cơ quan quản lý… bằng các hình thức khác nhau (như thông báo tại bảng tin bệnh viện, thông báo đến khoa/phòng, tại buổi giao ban bệnh viện, tại các buổi họp thường xuyên/đột xuất, tại các buổi sinh hoạt/hội thảo khoa học của bệnh viện).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM10", "tc": "TC65", "ma": "C9.5", "tm": "TM10", "muc": "Mức 3", "noidung": "Các bản báo cáo ADR có các thông tin tối thiểu cần thiết bao gồm: thông tin về người bệnh, thông tin về ADR, thông tin về thuốc nghi ngờ gây ADR và thông tin về người báo cáo.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM11", "tc": "TC65", "ma": "C9.5", "tm": "TM11", "muc": "Mức 3", "noidung": "Có gửi báo cáo ADR tới trung tâm quốc gia/khu vực về thông tin thuốc và theo dõi phản ứng có hại của thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM12", "tc": "TC65", "ma": "C9.5", "tm": "TM12", "muc": "Mức 3", "noidung": "Tỷ lệ báo cáo có đầy đủ các thông tin tối thiểu cần thiết chiếm từ 50% trở lên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM13", "tc": "TC65", "ma": "C9.5", "tm": "TM13", "muc": "Mức 4", "noidung": "Tỷ lệ các báo cáo ADR có đầy đủ các thông tin tối thiểu chiếm từ 80% trở lên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM14", "tc": "TC65", "ma": "C9.5", "tm": "TM14", "muc": "Mức 4", "noidung": "Có hệ thống lưu trữ thông tin thuốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM15", "tc": "TC65", "ma": "C9.5", "tm": "TM15", "muc": "Mức 4", "noidung": "Xây dựng và phát hành bản thông tin thuốc, lưu hành nội bộ trong bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM16", "tc": "TC65", "ma": "C9.5", "tm": "TM16", "muc": "Mức 4", "noidung": "Đơn vị thông tin thuốc đáp ứng trả lời đầy đủ các câu hỏi thông tin thuốc cho bác sỹ, điều dưỡng, nhân viên y tế và người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM17", "tc": "TC65", "ma": "C9.5", "tm": "TM17", "muc": "Mức 4", "noidung": "Tiến hành khảo sát, đánh giá (hoặc nghiên cứu) về tình hình thực hiện thông tin thuốc, theo dõi và báo cáo phản ứng có hại của thuốc tại bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM18", "tc": "TC65", "ma": "C9.5", "tm": "TM18", "muc": "Mức 4", "noidung": "Có báo cáo đánh giá, trong đó có chỉ ra những nhược điểm, hạn chế cần khắc phục và đề xuất các khuyến cáo, giải pháp cải tiến chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM19", "tc": "TC65", "ma": "C9.5", "tm": "TM19", "muc": "Mức 5", "noidung": "Toàn bộ các báo cáo ADR được gửi tới trung tâm quốc gia/khu vực về thông tin thuốc và theo dõi phản ứng có hại của thuốc có đầy đủ các thông tin cần thiết và đúng thời gian quy định.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM20", "tc": "TC65", "ma": "C9.5", "tm": "TM20", "muc": "Mức 5", "noidung": "Phát hành bản tin thông tin thuốc ít nhất 2 số/năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM21", "tc": "TC65", "ma": "C9.5", "tm": "TM21", "muc": "Mức 5", "noidung": "Tiến hành cải tiến chất lượng thông tin thuốc và ADR dựa trên kết quả đánh giá.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Dược", "cb": "Nguyễn Thanh Hằng"}, {"id": "C9.5_TM22", "tc": "TC65", "ma": "C9.5", "tm": "TM22", "muc": "Mức 5", "noidung": "Sử dụng thông tin về hiệu quả và độ an toàn của thuốc để khuyến cáo thay đổi, bổ sung danh mục thuốc dùng trong bệnh viện, chỉ định dùng thuốc của bác sỹ, hướng dẫn điều trị và các quy trình chuyên môn khác trong bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "don
