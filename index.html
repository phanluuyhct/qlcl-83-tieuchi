Minh, Hoàng Thị Thu Hằng"}, {"id": "C4.2_TM16", "tc": "TC41", "ma": "C4.2", "tm": "TM16", "muc": "Mức 5", "noidung": "Áp dụng kết quả nghiên cứu, đánh giá hoặc giám sát vào việc cải tiến chất lượng thực hiện các quy trình và hướng dẫn phòng ngừa kiểm soát nhiễm khuẩn trong bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh, Hoàng Thị Thu Hằng"}, {"id": "C4.3_TM1", "tc": "TC42", "ma": "C4.3", "tm": "TM1", "muc": "Mức 1", "noidung": "Chưa xây dựng chương trình vệ sinh tay.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM2", "tc": "TC42", "ma": "C4.3", "tm": "TM2", "muc": "Mức 1", "noidung": "Không có hệ thống nước máy.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM3", "tc": "TC42", "ma": "C4.3", "tm": "TM3", "muc": "Mức 2", "noidung": "Đã xây dựng chương trình rửa tay (dựa trên văn bản của lãnh đạo bệnh viện hoặc kế hoạch hoạt động…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM4", "tc": "TC42", "ma": "C4.3", "tm": "TM4", "muc": "Mức 2", "noidung": "Đã tổ chức lớp hướng dẫn/tập huấn về vệ sinh tay cho nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM5", "tc": "TC42", "ma": "C4.3", "tm": "TM5", "muc": "Mức 2", "noidung": "Có hệ thống cung cấp nước sạch cho toàn bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM6", "tc": "TC42", "ma": "C4.3", "tm": "TM6", "muc": "Mức 3", "noidung": "Bệnh viện đã triển khai thực hiện chương trình vệ sinh tay.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM7", "tc": "TC42", "ma": "C4.3", "tm": "TM7", "muc": "Mức 3", "noidung": "Thiết lập hệ thống bồn vệ sinh tay đầy đủ cho nhân viên y tế tại các khoa/phòng/buồng có thực hiện các kỹ thuật, thủ thuật.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM8", "tc": "TC42", "ma": "C4.3", "tm": "TM8", "muc": "Mức 3", "noidung": "Nước rửa tay tại buồng có thực hiện các kỹ thuật, thủ thuật bảo đảm vô khuẩn được xử lý qua hệ thống máy lọc nước hoặc bầu lọc nước (thay định kỳ).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM9", "tc": "TC42", "ma": "C4.3", "tm": "TM9", "muc": "Mức 3", "noidung": "Có các hướng dẫn vệ sinh tay tại các bồn rửa tay.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM10", "tc": "TC42", "ma": "C4.3", "tm": "TM10", "muc": "Mức 3", "noidung": "Sẵn có dung dịch sát khuẩn tay nhanh tại các bàn/buồng tiêm và buồng thực hiện các kỹ thuật, thủ thuật.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM11", "tc": "TC42", "ma": "C4.3", "tm": "TM11", "muc": "Mức 3", "noidung": "Đã xây dựng các công cụ (câu hỏi, bảng kiểm…) đánh giá việc tuân thủ vệ sinh tay của nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM12", "tc": "TC42", "ma": "C4.3", "tm": "TM12", "muc": "Mức 4", "noidung": "Có hệ thống bồn rửa tay cho nhân viên, người bệnh, người nhà người bệnh và khách đến thăm tại tất cả các khoa/phòng trong bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM13", "tc": "TC42", "ma": "C4.3", "tm": "TM13", "muc": "Mức 4", "noidung": "Các vòi nước rửa tay dành cho nhân viên y tế tại các buồng thực hiện phẫu thuật, thủ thuật được thiết kế điều khiển bằng chân hoặc tự động (tay rửa xong không tiếp xúc với vòi nước để khóa).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM14", "tc": "TC42", "ma": "C4.3", "tm": "TM14", "muc": "Mức 4", "noidung": "Sẵn có dung dịch sát khuẩn tay nhanh tại các vị trí (hành lang, trước cửa phòng/buồng…) có nhiều người tiếp xúc chung với vật dụng (tay nắm cửa…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM15", "tc": "TC42", "ma": "C4.3", "tm": "TM15", "muc": "Mức 4", "noidung": "Phát động phong trào vệ sinh tay và duy trình phong trào thường xuyên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM16", "tc": "TC42", "ma": "C4.3", "tm": "TM16", "muc": "Mức 4", "noidung": "Có triển khai đánh giá giám sát tuân thủ vệ sinh tay của nhân viên y tế dựa trên các công cụ đã được xây dựng của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM17", "tc": "TC42", "ma": "C4.3", "tm": "TM17", "muc": "Mức 4", "noidung": "Có nghiên cứu (hoặc khảo sát, đánh giá) việc thực hiện vệ sinh tay của nhân viên các khoa/phòng trong bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM18", "tc": "TC42", "ma": "C4.3", "tm": "TM18", "muc": "Mức 5", "noidung": "Công bố kết quả khảo sát, đánh giá về việc thực hiện vệ sinh tay của nhân viên các khoa/phòng trong bệnh viện và đề xuất giải pháp can thiệp.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM19", "tc": "TC42", "ma": "C4.3", "tm": "TM19", "muc": "Mức 5", "noidung": "Tiến hành biện pháp can thiệp tăng cường tuân thủ vệ sinh tay.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM20", "tc": "TC42", "ma": "C4.3", "tm": "TM20", "muc": "Mức 5", "noidung": "Tỷ lệ tuân thủ vệ sinh tay của nhân viên y tế trong bệnh viện có xu hướng tăng dần theo thời gian (hoặc giữ ổn định ở mức cao trên 95%).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.3_TM21", "tc": "TC42", "ma": "C4.3", "tm": "TM21", "muc": "Mức 5", "noidung": "Tiến hành nuôi cấy vi khuẩn trong nước tại một số vị trí trọng điểm như vòi nước ở buồng thực hiện phẫu thuật, thủ thuật, cận lâm sàng; vòi nước uống trực tiếp từ các máy lọc nước (và các vị trí khác nếu có điều kiện thực hiện).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM1", "tc": "TC43", "ma": "C4.4", "tm": "TM1", "muc": "Mức 1", "noidung": "Không có nhân viên đầu mối chịu trách nhiệm giám sát việc triển khai kiểm soát nhiễm khuẩn (KSNK).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM2", "tc": "TC43", "ma": "C4.4", "tm": "TM2", "muc": "Mức 2", "noidung": "Bệnh viện có phân công nhân viên giám sát kiểm soát nhiễm khuẩn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM3", "tc": "TC43", "ma": "C4.4", "tm": "TM3", "muc": "Mức 2", "noidung": "Đã xây dựng chương trình giám sát KSNK trên phạm vi bệnh viện; trong đó có đề cập nội dung cụ thể giám sát khoa trọng điểm, người trọng điểm…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM4", "tc": "TC43", "ma": "C4.4", "tm": "TM4", "muc": "Mức 3", "noidung": "Đã xây dựng các công cụ (câu hỏi, bảng kiểm…) đánh giá việc tuân thủ của nhân viên y tế về KSNK huyết, tuân thủ phòng ngừa viêm phổi bệnh viện…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM5", "tc": "TC43", "ma": "C4.4", "tm": "TM5", "muc": "Mức 3", "noidung": "Có thực hiện giám sát khoa trọng điểm, nhóm người bệnh trọng điểm/các đối tượng có nguy cơ nhiễm khuẩn cao nhưngười bệnh thở máy; người bệnh phẫu thuật; người bệnh suy giảm miễn dịch; người bệnh làm các thủ thuật/can thiệp như thông tiểu, đặt catheter, đặt đường truyền tĩnh mạch trung tâm, đặt kim luồn tĩnh mạch ngoại vi v.v.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM6", "tc": "TC43", "ma": "C4.4", "tm": "TM6", "muc": "Mức 3", "noidung": "Có thực hiện các biện pháp phòng ngừa chủ động theo đường lây (không khí, giọt bắn, tiếp xúc, đường tiêu hóa…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM7", "tc": "TC43", "ma": "C4.4", "tm": "TM7", "muc": "Mức 3", "noidung": "Có thực hiện các biện pháp phòng ngừa làm giảm lây nhiễm cho người bệnh và nhân viên y tế (như rửa tay, mang găng, mang phương tiện phòng hộ, xử lý dụng cụ, tiêm an toàn…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM8", "tc": "TC43", "ma": "C4.4", "tm": "TM8", "muc": "Mức 3", "noidung": "Có thực hiện phòng ngừa chủ động cho nhân viên y tế (như tiêm phòng cho nhân viên có nguy cơ cao, phòng chống một số bệnh dịch theo mùa hoặc theo mô hình bệnh tật của bệnh viện…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM9", "tc": "TC43", "ma": "C4.4", "tm": "TM9", "muc": "Mức 4", "noidung": "Tiến hành theo dõi tình hình vi khuẩn kháng thuốc và báo cáo theo quy định.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM10", "tc": "TC43", "ma": "C4.4", "tm": "TM10", "muc": "Mức 4", "noidung": "Có triển khai đánh giá, giám sát tỷ lệ tuân thủ của nhân viên y tế về kiểm soát  nhiễm khuẩn dựa trên các công cụ đã được xây dựng của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM11", "tc": "TC43", "ma": "C4.4", "tm": "TM11", "muc": "Mức 4", "noidung": "Có tiến hành nghiên cứu về kiểm soát nhiễm khuẩn bệnh viện (NKBV).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM12", "tc": "TC43", "ma": "C4.4", "tm": "TM12", "muc": "Mức 4", "noidung": "Có báo cáo kết quả nghiên cứu về kiểm soát nhiễm khuẩn bệnh viện, có đề xuất các giải pháp can thiệp và phổ biến cho các khoa/phòng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM13", "tc": "TC43", "ma": "C4.4", "tm": "TM13", "muc": "Mức 4", "noidung": "Có danh sách người bệnh bị nhiễm khuẩn bệnh viện và thống kê tỷ lệ NKBV.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM14", "tc": "TC43", "ma": "C4.4", "tm": "TM14", "muc": "Mức 5", "noidung": "Có kết quả giám sát việc tuân thủ KSNK các khoa/phòng tại khoa KSNK.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM15", "tc": "TC43", "ma": "C4.4", "tm": "TM15", "muc": "Mức 5", "noidung": "Công bố tỷ lệ tuân thủ KSNK của các khoa/phòng cho các khoa/phòng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM16", "tc": "TC43", "ma": "C4.4", "tm": "TM16", "muc": "Mức 5", "noidung": "Công bố tỷ lệ nhiễm khuẩn bệnh viện tại các báo cáo (như tỷ lệ nhiễm khuẩn vết mổ trong tổng số phẫu thuật, tỷ lệ viêm phổi bệnh viện trên 1000 ngày thở máy, tỷ lệ nhiễm khuẩn tiết niệu trên 1000 ngày mang xông tiểu (sonde), nhiễm khuẩn huyết trên 1000 ca-te (catheter) tĩnh mạch trung tâm).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM17", "tc": "TC43", "ma": "C4.4", "tm": "TM17", "muc": "Mức 5", "noidung": "Có cơ sở dữ liệu về nhiễm khuẩn bệnh viện, có thể truy xuất các thông tin có liên quan như số người bị nhiễm khuẩn bệnh viện, địa điểm, thời gian…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM18", "tc": "TC43", "ma": "C4.4", "tm": "TM18", "muc": "Mức 5", "noidung": "Ứng dụng các kết quả nghiên cứu vào hoạt động thực tiễn, tiến hành biện pháp can thiệp tăng cường KSNK, làm giảm tỷ lệ nhiễm khuẩn bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM19", "tc": "TC43", "ma": "C4.4", "tm": "TM19", "muc": "Mức 5", "noidung": "Tỷ lệ tuân thủ KSNK của nhân viên y tế đối với một số chương trình có xu hướng tăng dần hàng năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.4_TM20", "tc": "TC43", "ma": "C4.4", "tm": "TM20", "muc": "Mức 5", "noidung": "Tỷ lệ nhiễm khuẩn bệnh viện được theo dõi và giảm hàng năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Trần Thị Mỹ Thanh"}, {"id": "C4.5_TM1", "tc": "TC44", "ma": "C4.5", "tm": "TM1", "muc": "Mức 1", "noidung": "Không phân loại, không thu gom chất thải y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM2", "tc": "TC44", "ma": "C4.5", "tm": "TM2", "muc": "Mức 1", "noidung": "Phát hiện thấy bệnh viện có hình thức xử lý rác gây ô nhiễm nghiêm trọng như chôn chất thải y tế ngay trong hoặc ngoài khuôn viên bệnh viện, hoặc đốt chất thải y tế trực tiếp không sử dụng lò đốt.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM3", "tc": "TC44", "ma": "C4.5", "tm": "TM3", "muc": "Mức 1", "noidung": "Phát hiện thấy bệnh viện có hình thức thu gom chất thải rắn gây ô nhiễm môi trường, không bảo đảm vệ sinh hoặc có nguy cơ phát tán vi khuẩn, chất thải nguy hại ra môi trường.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM4", "tc": "TC44", "ma": "C4.5", "tm": "TM4", "muc": "Mức 1", "noidung": "Bị cảnh sát môi trường phạt về hành vi vi phạm xử lý chất thải rắn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM5", "tc": "TC44", "ma": "C4.5", "tm": "TM5", "muc": "Mức 1", "noidung": "Phát hiện thấy tình trạng ô nhiễm môi trường đất, nước, không khí do chất thải rắn của bệnh viện gây ra (có mùi hôi thối, ruồi nhặng, chuột, kim loại nặng… xuất phát từ nơi chứa chất thải rắn).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM6", "tc": "TC44", "ma": "C4.5", "tm": "TM6", "muc": "Mức 2", "noidung": "Bệnh viện có thực hiện phân loại chất thải y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM7", "tc": "TC44", "ma": "C4.5", "tm": "TM7", "muc": "Mức 2", "noidung": "Chất thải rắn y tế được phân thành tối thiểu 2 loại: chất thải rắn y tế nguy hại và chất thải rắn thông thường.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM8", "tc": "TC44", "ma": "C4.5", "tm": "TM8", "muc": "Mức 2", "noidung": "Có bố trí thùng rác có nắp đậy đựng chất thải sinh hoạt ngoài sân và ở đầu và cuối hành lang của các tầng (và bố trí thêm ở giữa nếu hành lang dài, do bệnh viện tự quyết định). Thùng rác được đặt ở vị trí thuận tiện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM9", "tc": "TC44", "ma": "C4.5", "tm": "TM9", "muc": "Mức 2", "noidung": "Bệnh viện có trang bị các túi, thùng để thu gom chất thải y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM10", "tc": "TC44", "ma": "C4.5", "tm": "TM10", "muc": "Mức 2", "noidung": "Có trang bị đủ hộp đựng chất thải vật sắc nhọn và quản lý chất thải vật sắc nhọn bảo đảm an toàn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM11", "tc": "TC44", "ma": "C4.5", "tm": "TM11", "muc": "Mức 2", "noidung": "Có quy định của bệnh viện về việc phân loại, thu gom, vận chuyển, lưu giữ và xử lý chất thải rắn y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM12", "tc": "TC44", "ma": "C4.5", "tm": "TM12", "muc": "Mức 3", "noidung": "Có trang bị đủ về số lượng và đúng về chất lượng, màu sắc các túi, thùng để thu gom chất thải y tế (tối thiểu 2 loại túi hoặc thùng đựng chất thải rắn y tế được phân biệt bằng hai màu là màu vàng và màu xanh).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM13", "tc": "TC44", "ma": "C4.5", "tm": "TM13", "muc": "Mức 3", "noidung": "Có quy định phân loại rác, được dán hoặc treo ở những vị trí dễ đọc và ngay tại nơi đặt thùng rác.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM14", "tc": "TC44", "ma": "C4.5", "tm": "TM14", "muc": "Mức 3", "noidung": "Nhân viên y tế được phân công tiếp nhận đồ bẩn có các trang bị bảo hộ lao động phù hợp.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM15", "tc": "TC44", "ma": "C4.5", "tm": "TM15", "muc": "Mức 3", "noidung": "Bệnh viện có nhà lưu trữ tạm thời chất thải y tế theo quy định.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM16", "tc": "TC44", "ma": "C4.5", "tm": "TM16", "muc": "Mức 3", "noidung": "Có nhà kho (hoặc khu riêng biệt) để chứa các dụng cụ làm vệ sinh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM17", "tc": "TC44", "ma": "C4.5", "tm": "TM17", "muc": "Mức 3", "noidung": "Bệnh viện thực hiện xử lý chất thải rắn y tế theo quy định (có hệ thống xử lý chất thải rắn vận hành theo quy định hoặc ký hợp đồng với đơn vị chức năng khác xử lý chất thải rắn y tế theo đúng quy trình an toàn, vệ sinh).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM18", "tc": "TC44", "ma": "C4.5", "tm": "TM18", "muc": "Mức 4", "noidung": "Có thực hiện phân loại chất thải rắn y tế tại nguồn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM19", "tc": "TC44", "ma": "C4.5", "tm": "TM19", "muc": "Mức 4", "noidung": "Thùng rác có các màu khác nhau, có in biểu tượng cho từng loại chất thải rắn: chất thải lây nhiễm, chất thải thông thường, chất thải tái chế...", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM20", "tc": "TC44", "ma": "C4.5", "tm": "TM20", "muc": "Mức 4", "noidung": "Có nhà lưu trữ chất thải rắn đạt chuẩn quy định: có phòng lưu trữ chất thải lây nhiễm, chất thải nguy hại riêng…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM21", "tc": "TC44", "ma": "C4.5", "tm": "TM21", "muc": "Mức 4", "noidung": "Có hướng dẫn rõ ràng (bằng chữ viết hoặc hình ảnh, tranh vẽ…) về phân loại chất thải cho người bệnh, người nhà và nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM22", "tc": "TC44", "ma": "C4.5", "tm": "TM22", "muc": "Mức 5", "noidung": "Có thực hiện các biện pháp can thiệp để giảm thiểu chất thải rắn y tế nguy hại.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM23", "tc": "TC44", "ma": "C4.5", "tm": "TM23", "muc": "Mức 5", "noidung": "Có thực hiện giảm thiểu chất thải rắn y tế nguy hại ngay từ khi mua sắm các trang thiết bị, vật tư y tế mới.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM24", "tc": "TC44", "ma": "C4.5", "tm": "TM24", "muc": "Mức 5", "noidung": "Áp dụng các giải pháp để giảm thiểu phát sinh chất thải rắn y tế tại nguồn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM25", "tc": "TC44", "ma": "C4.5", "tm": "TM25", "muc": "Mức 5", "noidung": "Có thu gom chất thải tái chế riêng để giao cho đơn vị có tư cách pháp nhân thực hiện việc tái chế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM26", "tc": "TC44", "ma": "C4.5", "tm": "TM26", "muc": "Mức 5", "noidung": "Có sáng kiến hoặc cải tiến về kỹ thuật nhằm giảm chi phí trong xử lý chất thải rắn y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM27", "tc": "TC44", "ma": "C4.5", "tm": "TM27", "muc": "Mức 5", "noidung": "Các chỉ tiêu về xử lý chất thải bảo đảm các quy chuẩn quốc gia về môi trường.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM28", "tc": "TC44", "ma": "C4.5", "tm": "TM28", "muc": "Mức 5", "noidung": "Có nghiên cứu hoặc đánh giá về thực trạng quản lý chất thải rắn y tế của bệnh viện, trong đó có chỉ ra các nhược điểm, khiếm khuyết cần khắc phục.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.5_TM29", "tc": "TC44", "ma": "C4.5", "tm": "TM29", "muc": "Mức 5", "noidung": "Áp dụng kết quả nghiên cứu hoặc đánh giá vào việc cải tiến chất lượng quản lý chất thải rắn y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Hoàng Thị Thu Hằng"}, {"id": "C4.6_TM1", "tc": "TC45", "ma": "C4.6", "tm": "TM1", "muc": "Mức 1", "noidung": "Phát hiện thấy bệnh viện thiếu hệ thống xử lý chất thải lỏng, xả thẳng ra môi trường gây ô nhiễm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM2", "tc": "TC45", "ma": "C4.6", "tm": "TM2", "muc": "Mức 1", "noidung": "Phát hiện thấy đường dẫn chất thải lỏng hoặc hệ thống chất thải lỏng bị vỡ hoặc rò rỉ, gây ô nhiễm môi trường đất, nước, không khí (có mùi hôi thối hoặc phát sinh ruồi nhặng, muỗi, côn trùng do chất thải lỏng của bệnh viện gây ra).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM3", "tc": "TC45", "ma": "C4.6", "tm": "TM3", "muc": "Mức 1", "noidung": "Phát hiện thấy bệnh viện có hình thức thu gom chất thải lỏng gây ô nhiễm môi trường, không bảo đảm vệ sinh hoặc có nguy cơ phát tán vi khuẩn, chất thải nguy hại ra môi trường.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM4", "tc": "TC45", "ma": "C4.6", "tm": "TM4", "muc": "Mức 1", "noidung": "Bị cảnh sát môi trường phạt về hành vi vi phạm xử lý chất thải lỏng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM5", "tc": "TC45", "ma": "C4.6", "tm": "TM5", "muc": "Mức 2", "noidung": "Có hệ thống xử lý chất thải lỏng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM6", "tc": "TC45", "ma": "C4.6", "tm": "TM6", "muc": "Mức 2", "noidung": "Có xây dựng hướng dẫn hoặc quy trình quản lý, vận hành hệ thống xử lý chất thải lỏng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM7", "tc": "TC45", "ma": "C4.6", "tm": "TM7", "muc": "Mức 2", "noidung": "Thực hiện một số biện pháp lưu giữ các loại dung môi thải, dung dịch hóa chất thải nguy hại theo quy định.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM8", "tc": "TC45", "ma": "C4.6", "tm": "TM8", "muc": "Mức 3", "noidung": "Có hệ thống xử lý chất thải lỏng và hoạt động thường xuyên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM9", "tc": "TC45", "ma": "C4.6", "tm": "TM9", "muc": "Mức 3", "noidung": "Có đo đạc và so sánh khối lượng nước đầu vào và chất thải lỏng đầu ra sau khi xử lý xong (nếu phát hiện chênh lệch quá mức cho phép có biện pháp giải quyết kịp thời).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM10", "tc": "TC45", "ma": "C4.6", "tm": "TM10", "muc": "Mức 3", "noidung": "Có văn bản đánh giá của cơ quan môi trường có thẩm quyền đánh giá các chỉ tiêu đầu ra (về lý, hóa, vi sinh vật) sau khi xử lý chất thải lỏng ít nhất 1 lần trong 6 tháng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM11", "tc": "TC45", "ma": "C4.6", "tm": "TM11", "muc": "Mức 3", "noidung": "Các chỉ tiêu đầu ra của nước thải đạt quy chuẩn về môi trường.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM12", "tc": "TC45", "ma": "C4.6", "tm": "TM12", "muc": "Mức 3", "noidung": "Có tổ chức tập huấn, đào tạo (hoặc cử nhân viên tham dự tập huấn, đào tạo) về công tác quản lý chất thải lỏng y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM13", "tc": "TC45", "ma": "C4.6", "tm": "TM13", "muc": "Mức 4", "noidung": "Có thực hiện việc phân định và thu gom chất thải lỏng riêng biệt bao gồm nước thải, dung dịch và dung môi thải phát sinh từ các hoạt động chuyên môn, chất thải lỏng phóng xạ, nước mưa chảy tràn trong bệnh viện theo quy định.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM14", "tc": "TC45", "ma": "C4.6", "tm": "TM14", "muc": "Mức 4", "noidung": "Định kỳ đánh giá chỉ tiêu về môi trường đối với nước thải bệnh viện (căn cứ theo báo cáo đánh giá tác động môi trường, đề án bảo vệ môi trường).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM15", "tc": "TC45", "ma": "C4.6", "tm": "TM15", "muc": "Mức 4", "noidung": "Có kế hoạch duy trì hệ thống xử lý chất thải lỏng hoạt động ổn định, bảo đảm các chỉ tiêu đầu ra và sẵn sàng các giải pháp khắc phục sự cố hệ thống xử lý chất thải lỏng (nếu có).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM16", "tc": "TC45", "ma": "C4.6", "tm": "TM16", "muc": "Mức 4", "noidung": "Thực hiện bảo trì, bảo dưỡng hệ thống xử lý nước thải định kì hàng năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM17", "tc": "TC45", "ma": "C4.6", "tm": "TM17", "muc": "Mức 5", "noidung": "Chất thải lỏng sau khi xử lý đạt loại A QCVN 28:2010/BTNMT và được bệnh viện tái sử dụng cho một số hoạt động như tưới cây, vệ sinh sân, vườn, rửa xe...", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM18", "tc": "TC45", "ma": "C4.6", "tm": "TM18", "muc": "Mức 5", "noidung": "Áp dụng các giải pháp để giảm thiểu phát sinh chất thải lỏng tại nguồn (hạn chế sử dụng nước sinh hoạt tại bệnh viện để tắm giặt, khắc phục rò rỉ đường nước, đầu tư máy móc, công nghệ hiện đại tiết kiệm nước và giảm thiểu chất thải lỏng).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM19", "tc": "TC45", "ma": "C4.6", "tm": "TM19", "muc": "Mức 5", "noidung": "Trong năm có nghiên cứu hoặc đánh giá về thực trạng quản lý chất thải lỏng y tế của bệnh viện, trong đó có chỉ ra các nhược điểm, khiếm khuyết cần khắc phục.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C4.6_TM20", "tc": "TC45", "ma": "C4.6", "tm": "TM20", "muc": "Mức 5", "noidung": "Áp dụng ít nhất một khuyến nghị từ kết quả nghiên cứu hoặc đánh giá vào việc cải tiến chất lượng quản lý chất thải lỏng y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Kiểm soát nhiễm khuẩn", "cb": "Bùi Hồng Minh"}, {"id": "C5.1_TM1", "tc": "TC46", "ma": "C5.1", "tm": "TM1", "muc": "Mức 1", "noidung": "Bệnh viện không có bản danh mục kỹ thuật theo các thông tư, văn bản do Bộ Y tế quy định*.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Kim Hương"}, {"id": "C5.1_TM2", "tc": "TC46", "ma": "C5.1", "tm": "TM2", "muc": "Mức 2", "noidung": "Đã xây dựng danh mục kỹ thuật theo các Thông tư, văn bản do Bộ Y tế quy định*.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Kim Hương"}, {"id": "C5.1_TM3", "tc": "TC46", "ma": "C5.1", "tm": "TM3", "muc": "Mức 2", "noidung": "Trong danh mục kỹ thuật của bệnh viện có chia theo các nhóm: (1) các kỹ thuật theo đúng phân tuyến kỹ thuật của bệnh viện; (2) các kỹ thuật được phân cho tuyến trên và (3) các kỹ thuật được phân cho tuyến dưới.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Võ Thị Kim Hương"}, {"id": "C5.1_TM4", "tc": "TC46", "ma": "C5.1", "tm": "TM4", "muc": "Mức 2", "noidung": "Bảng tổng hợp danh mục kỹ thuật có tính tỷ lệ các nhóm nêu 3", "tm": "TM9", "muc": "Mức 4", "noidung": "Hoàn thành bộ tài liệu “Hướng dẫn quy trình kỹ thuật khám bệnh, chữa bệnh” phù hợp với điều kiện bệnh viện và đặc thù hoạt động chuyên môn, dựa trên hướng dẫn của Bộ Y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Vũ Duy Nhất"}, {"id": "C5.3_TM10", "tc": "TC48", "ma": "C5.3", "tm": "TM10", "muc": "Mức 4", "noidung": "Bộ tài liệu “Hướng dẫn quy trình kỹ thuật khám bệnh, chữa bệnh” do bệnh viện xây dựng được Hội đồng khoa học kỹ thuật thẩm định và thông qua. (Hội đồng khoa học do bệnh viện hoặc cơ quan quản lý trực tiếp thành lập, có mời thành viên là các chuyên gia, giảng viên, bác sỹ, điều dưỡng trong, ngoài bệnh viện và các cơ quan khác như đại diện cơ quan quản lý y tế, cơ quan bảo hiểm xã hội…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Vũ Duy Nhất"}, {"id": "C5.3_TM11", "tc": "TC48", "ma": "C5.3", "tm": "TM11", "muc": "Mức 4", "noidung": "Bộ tài liệu “Hướng dẫn quy trình kỹ thuật khám bệnh, chữa bệnh” do bệnh viện xây dựng được hướng dẫn và áp dụng thống nhất trên phạm vi toàn bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Vũ Duy Nhất"}, {"id": "C5.3_TM12", "tc": "TC48", "ma": "C5.3", "tm": "TM12", "muc": "Mức 4", "noidung": "Xây dựng bảng kiểm giám sát việc tuân thủ các quy trình kỹ thuật cho một số quy trình quan trọng (theo đánh giá của bệnh viện, căn cứ trên phạm vi tác động, ảnh hưởng tới hoạt động chuyên môn…) tại một số khoa lâm sàng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "BS Vũ Duy Nhất"}, {"id": "C5.3_TM13", "tc": "TC48", "ma": "C5.3", "tm": "TM13", "muc": "Mức 4", "noidung": "Tiến h c điều dưỡng trưởng có chứng chỉ quản lý điều dưỡng* (hoặc tương đương, hoặc có bằng thạc sĩ quản lý bệnh viện) chiếm từ 50% trở lên (trên tổng số điều dưỡng trưởng).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "C6.1_TM19", "tc": "TC51", "ma": "C6.1", "tm": "TM19", "muc": "Mức 4", "noidung": "Hội đồng điều dưỡng xây dựng và cập nhật các quy trình chăm sóc người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "C6.1_TM20", "tc": "TC51", "ma": "C6.1", "tm": "TM20", "muc": "Mức 4", "noidung": "Phòng điều dưỡng xây dựng ít nhất 10 chỉ số đánh giá chất lượng chăm sóc người bệnh và công tác điều dưỡng, trong đó có 5 chỉ số cụ thể như tỷ lệ loét do tỳ đè, tỷ lệ tuân thủ quy trình kỹ thuật, tỷ lệ sự cố y khoa do dùng thuốc cho người bệnh, tỷ lệ điều dưỡng tham gia đào tạo liên tục, tỷ số điều dưỡng/giường bệnh…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "C6.1_TM21", "tc": "TC51", "ma": "C6.1", "tm": "TM21", "muc": "Mức 4", "noidung": "Tiến hành đo lường, đánh giá định kỳ (do bệnh viện tự quy định) kết quả thực hiện các chỉ số hàng tháng, hàng quý hoặc hàng năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "C6.1_TM22", "tc": "TC51", "ma": "C6.1", "tm": "TM22", "muc": "Mức 4", "noidung": "Tiến hành theo dõi sự thay đổi các chỉ số theo thời gian, có biểu đồ theo dõi, phân tích xu hướng biến động các chỉ số.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "C6.1_TM23", "tc": "TC51", "ma": "C6.1", "tm": "TM23", "muc": "Mức 4", "noidung": "Phòng điều dưỡng đánh giá kết quả thực hiện kế hoạch hàng năm về hoạt động điều dưỡng và nâng cao chất lượng chăm sóc người bệnh, có báo cáo đánh giá, trong đó có chỉ ra những mặt hạn chế cần khắc phục.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "C6.1_TM24", "tc": "TC51", "ma": "C6.1", "tm": "TM24", "muc": "Mức 5", "noidung": "Tỷ lệ điều dưỡng trưởng có trình độ đại học chiếm từ 70% trở lên (trên tổng số điều dưỡng trưởng).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "C6.1_TM25", "tc": "TC51", "ma": "C6.1", "tm": "TM25", "muc": "Mức 5", "noidung": "Tỷ lệ điều dưỡng trưởng có chứng chỉ quản lý điều dưỡng* (hoặc tương đương, hoặc có bằng thạc sĩ quản lý bệnh viện) chiếm từ 70% trở lên (trên tổng số điều dưỡng trưởng).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "C6.1_TM26", "tc": "TC51", "ma": "C6.1", "tm": "TM26", "muc": "Mức 5", "noidung": "Áp dụng kết quả báo cáo đánh giá việc thực hiện kế hoạch vào việc cải tiến chất lượng chăm sóc người bệnh và công tác điều dưỡng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "C6.1_TM27", "tc": "TC51", "ma": "C6.1", "tm": "TM27", "muc": "Mức 5", "noidung": "Tiến hành nghiên cứu, đánh giá chất lượng chăm sóc người bệnh và công tác điều dưỡng dựa trên các chỉ số đã xây dựng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "C6.1_TM28", "tc": "TC51", "ma": "C6.1", "tm": "TM28", "muc": "Mức 5", "noidung": "Áp dụng kết quả nghiên cứu vào việc cải tiến chất lượng chăm sóc người bệnh và công tác điều dưỡng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "C6.1_TM29", "tc": "TC51", "ma": "C6.1", "tm": "TM29", "muc": "Mức 5", "noidung": "Phòng (hoặc tổ) điều dưỡng có ít nhất một sáng kiến mới về cải tiến chất lượng chăm sóc người bệnh, được giám đốc phê duyệt và áp dụng rộng rãi trên phạm vi bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "C6.1_TM30", "tc": "TC51", "ma": "C6.1", "tm": "TM30", "muc": "Mức 5", "noidung": "Đánh giá kết quả áp dụng các sáng kiến mới đã áp dụng và chỉnh sửa, bổ sung các sáng kiến cải tiến chất lượng chăm sóc người bệnh khác.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "C6.2_TM1", "tc": "TC52", "ma": "C6.2", "tm": "TM1", "muc": "Mức 1", "noidung": "Không có quy định cụ thể về việc tư vấn, giáo dục sức khỏe cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.2_TM2", "tc": "TC52", "ma": "C6.2", "tm": "TM2", "muc": "Mức 1", "noidung": "Không có các tài liệu truyền thông, giáo dục sức khỏe cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.2_TM3", "tc": "TC52", "ma": "C6.2", "tm": "TM3", "muc": "Mức 2", "noidung": "Sẵn có các tài liệu truyền thông, giáo dục sức khỏe cho người bệnh do các cơ quan có thẩm quyền ban hành (Bộ Y tế, Sở Y tế, trung tâm truyền thông..) theo định kỳ hoặc theo chiến dịch, chương trình truyền thông như tờ rơi, tranh, ảnh, băng hình…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.2_TM4", "tc": "TC52", "ma": "C6.2", "tm": "TM4", "muc": "Mức 3", "noidung": "Các tài liệu truyền thông, giáo dục sức khỏe người bệnh được phổ biến cho nhân viên y tế, người bệnh, người nhà người bệnh bằng các hình thức (như được treo, dán ở vị trí dễ thấy đối với tranh ảnh, dễ lấy đối với tờ rơi…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.2_TM5", "tc": "TC52", "ma": "C6.2", "tm": "TM5", "muc": "Mức 3", "noidung": "Có ban hành các quy định hoặc hướng dẫn cụ thể về việc tư vấn, giáo dục sức khỏe cho người bệnh (và người nhà người bệnh).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.2_TM6", "tc": "TC52", "ma": "C6.2", "tm": "TM6", "muc": "Mức 3", "noidung": "Tỷ lệ điều đưỡng, hộ sinh được đào tạo, tập huấn kỹ năng tư vấn, truyền thông, giáo dục sức khỏe cho người bệnh chiếm từ 50% trở lên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.2_TM7", "tc": "TC52", "ma": "C6.2", "tm": "TM7", "muc": "Mức 3", "noidung": "Nhân viên y tế tại các khoa/phòng thực hiện đầy đủ các quy định của bệnh viện về hoạt động truyền thông, giáo dục sức khỏe cho người bệnh trong quá trình khám và điều trị.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.2_TM8", "tc": "TC52", "ma": "C6.2", "tm": "TM8", "muc": "Mức 3", "noidung": "Tỷ lệ người bệnh nội trú được điều đưỡng, hộ sinh tư vấn, truyền thông, giáo dục sức khỏe chiếm từ 50% trở lên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.2_TM9", "tc": "TC52", "ma": "C6.2", "tm": "TM9", "muc": "Mức 3", "noidung": "Lập danh mục các bệnh hoặc vấn đề sức khỏe (theo mô hình bệnh tật của bệnh viện) và lộ trình cần ưu tiên xây dựng, cập nhật tài liệu truyền thông, giáo dục sức khỏe.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.2_TM10", "tc": "TC52", "ma": "C6.2", "tm": "TM10", "muc": "Mức 4", "noidung": "Phòng (hoặc tổ) điều dưỡng làm đầu mối hoặc tham gia xây dựng các nội dung, tài liệu truyền thông, giáo dục sức khỏe cho người bệnh theo lộ trình đã lập, có tham khảo các tài liệu khác (trong nước và nước ngoài).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.2_TM11", "tc": "TC52", "ma": "C6.2", "tm": "TM11", "muc": "Mức 4", "noidung": "Các tài liệu truyền thông, giáo dục sức khỏe do bệnh viện xây dựng được họp góp ý và được cấp có thẩm quyền (hội đồng điều dưỡng, hội đồng khoa học kỹ thuật hoặc ban giám đốc bệnh viện) phê duyệt, thông qua.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.2_TM12", "tc": "TC52", "ma": "C6.2", "tm": "TM12", "muc": "Mức 4", "noidung": "Tỷ lệ điều đưỡng, hộ sinh được đào tạo, tập huấn kỹ năng tư vấn, truyền thông, giáo dục sức khỏe cho người bệnh chiếm từ 70% trở lên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.2_TM13", "tc": "TC52", "ma": "C6.2", "tm": "TM13", "muc": "Mức 4", "noidung": "Người bệnh được tư vấn, giáo dục sức khỏe phù hợp với bệnh khi vào viện, trong quá trình điều trị và lúc ra viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.2_TM14", "tc": "TC52", "ma": "C6.2", "tm": "TM14", "muc": "Mức 4", "noidung": "Người bệnh có được các kiến thức, thực hành thiết yếu để tự theo dõi, chăm sóc, điều trị và phòng các biến chứng cho bản thân.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.2_TM15", "tc": "TC52", "ma": "C6.2", "tm": "TM15", "muc": "Mức 4", "noidung": "Người bệnh được điều đưỡng, hộ sinh nhận định nhu cầu tư vấn, giáo dục sức khỏe và ghi vào “Phiếu chăm sóc điều dưỡng”.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.2_TM16", "tc": "TC52", "ma": "C6.2", "tm": "TM16", "muc": "Mức 5", "noidung": "Tỷ lệ điều đưỡng, hộ sinh được đào tạo, tập huấn kỹ năng tư vấn, truyền thông, giáo dục sức khỏe cho người bệnh chiếm từ 90% trở lên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.2_TM17", "tc": "TC52", "ma": "C6.2", "tm": "TM17", "muc": "Mức 5", "noidung": "Tiến hành đánh giá (hoặc nghiên cứu) hiệu quả hoạt động truyền thông, giáo dục sức khỏe cho người bệnh; có báo cáo đánh giá, trong đó có chỉ ra những nhược điểm cần khắc phục và đề xuất giải pháp cải tiến chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.2_TM18", "tc": "TC52", "ma": "C6.2", "tm": "TM18", "muc": "Mức 5", "noidung": "Có hình thức công bố, thông báo hoặc phản hồi kết quả đánh giá tới các khoa liên quan bằng các hình thức như bản tin nội bộ, gửi báo cáo, thư điện tử….", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.2_TM19", "tc": "TC52", "ma": "C6.2", "tm": "TM19", "muc": "Mức 5", "noidung": "Thực hiện các giải pháp cải tiến chất lượng công tác tư vấn, truyền thông, giáo dục sức khỏe cho người bệnh dựa trên kết quả đánh giá.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM1", "tc": "TC53", "ma": "C6.3", "tm": "TM1", "muc": "Mức 1", "noidung": "Có xảy ra vụ việc theo dõi, chăm sóc người bệnh không đúng so với các hướng dẫn quy trình kỹ thuật chuyên môn, gây hậu quả người bệnh tử vong hoặc tổn thương không hồi phục nhưng không được tự nguyện báo cáo kịp thời (báo cáo về cơ quan quản lý trước khi phương tiện truyền thông đưa tin).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM2", "tc": "TC53", "ma": "C6.3", "tm": "TM2", "muc": "Mức 1", "noidung": "Bệnh viện chưa có quy định theo dõi, chăm sóc, vệ sinh, phục hồi chức năng cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM3", "tc": "TC53", "ma": "C6.3", "tm": "TM3", "muc": "Mức 2", "noidung": "Có quy định cụ thể về theo dõi, chăm sóc, vệ sinh cá nhân và phục hồi chức năng cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM4", "tc": "TC53", "ma": "C6.3", "tm": "TM4", "muc": "Mức 2", "noidung": "Điều dưỡng, hộ sinh, các nhân viên y tế có liên quan được phổ biến, tập huấn, đào tạo về các quy định theo dõi, chăm sóc, vệ sinh cá nhân và phục hồi chức năng cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM5", "tc": "TC53", "ma": "C6.3", "tm": "TM5", "muc": "Mức 2", "noidung": "Điều dưỡng và các nhân viên y tế có liên quan hướng dẫn người bệnh, người nhà người bệnh cách theo dõi, chăm sóc người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM6", "tc": "TC53", "ma": "C6.3", "tm": "TM6", "muc": "Mức 3", "noidung": "Có đầy đủ các phương tiện, dụng cụ cơ bản phục vụ cho việc chăm sóc thể chất và vệ sinh cá nhân cho người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM7", "tc": "TC53", "ma": "C6.3", "tm": "TM7", "muc": "Mức 3", "noidung": "Người nhà người bệnh được điều dưỡng tập huấn và làm mẫu thực hiện chăm sóc người bệnh theo đúng kỹ thuật chăm sóc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM8", "tc": "TC53", "ma": "C6.3", "tm": "TM8", "muc": "Mức 3", "noidung": "Người nhà người bệnh tham gia chăm sóc nhưng không làm các việc liên quan đến chuyên môn (như rửa vết thương, thay băng, thay dịch truyền…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM9", "tc": "TC53", "ma": "C6.3", "tm": "TM9", "muc": "Mức 3", "noidung": "Điều dưỡng, hộ sinh phối hợp với bác sĩ điều trị trong việc đánh giá phân cấp chăm sóc người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM10", "tc": "TC53", "ma": "C6.3", "tm": "TM10", "muc": "Mức 3", "noidung": "Điều dưỡng trưởng khoa thực hiện việc đi buồng kiểm tra, giám sát việc tuân thủ thực hiện quy trình kỹ thuật và chăm sóc người bệnh hằng ngày và khi cần thiết.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM11", "tc": "TC53", "ma": "C6.3", "tm": "TM11", "muc": "Mức 3", "noidung": "Người bệnh có chế độ ăn bệnh lý, có chỉ định ăn qua ống thông được điều dưỡng, hộ sinh kiểm soát thực hiện và ghi kết quả vào phiếu chăm sóc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM12", "tc": "TC53", "ma": "C6.3", "tm": "TM12", "muc": "Mức 3", "noidung": "Người bệnh có yêu cầu chăm sóc như cho ăn uống, vận động, phục hồi chức năng…được điều dưỡng (hoặc nhân viên y tế khác) thực hiện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM13", "tc": "TC53", "ma": "C6.3", "tm": "TM13", "muc": "Mức 3", "noidung": "Các can thiệp chăm sóc điều dưỡng được ghi lại trong hồ sơ bệnh án.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM14", "tc": "TC53", "ma": "C6.3", "tm": "TM14", "muc": "Mức 3", "noidung": "Người bệnh được điều dưỡng, hộ sinh hướng dẫn hỗ trợ và tập phục hồi chức năng (nếu có nhu cầu).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM15", "tc": "TC53", "ma": "C6.3", "tm": "TM15", "muc": "Mức 3", "noidung": "Toàn bộ người bệnh chăm sóc cấp I* được điều dưỡng, hộ sinh đánh giá, xác định nhu cầu và lập kế hoạch chăm sóc để thực hiện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM16", "tc": "TC53", "ma": "C6.3", "tm": "TM16", "muc": "Mức 3", "noidung": "Toàn bộ người bệnh cần chăm sóc cấp I* được các nhân viên y tế theo dõi, chăm sóc toàn diện, bao gồm chăm sóc thể chất và vệ sinh cá nhân.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM17", "tc": "TC53", "ma": "C6.3", "tm": "TM17", "muc": "Mức 3", "noidung": "Người bệnh có phẫu thuật* được điều dưỡng, hộ sinh hướng dẫn, hỗ trợ và thực hiện chuẩn bị trước phẫu thuật theo quy định của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM18", "tc": "TC53", "ma": "C6.3", "tm": "TM18", "muc": "Mức 3", "noidung": "Người bệnh“giai đoạn cuối”* được điều dưỡng chăm sóc hỗ trợ giảm đau, hỗ trợ thể chất và tinh thần.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM19", "tc": "TC53", "ma": "C6.3", "tm": "TM19", "muc": "Mức 4", "noidung": "Toàn bộ người bệnh chăm sóc cấp II* được điều dưỡng, hộ sinh đánh giá, xác định nhu cầu và lập kế hoạch chăm sóc để thực hiện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM20", "tc": "TC53", "ma": "C6.3", "tm": "TM20", "muc": "Mức 4", "noidung": "Toàn bộ người bệnh cần chăm sóc cấp II* được các nhân viên y tế theo dõi, chăm sóc toàn diện, bao gồm chăm sóc thể chất và vệ sinh cá nhân.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM21", "tc": "TC53", "ma": "C6.3", "tm": "TM21", "muc": "Mức 4", "noidung": "Có các phương tiện để phòng chống loét do tỳ đè.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM22", "tc": "TC53", "ma": "C6.3", "tm": "TM22", "muc": "Mức 4", "noidung": "Có nhân viên y tế hoặc dịch vụ hỗ trợ chăm sóc thể chất và vệ sinh cá nhân cho người bệnh (tắm, gội đầu, vệ sinh răng miệng, xoay trở, vỗ rung).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM23", "tc": "TC53", "ma": "C6.3", "tm": "TM23", "muc": "Mức 5", "noidung": "Xây dựng các chỉ số đánh giá chất lượng công tác theo dõi, chăm sóc người bệnh (như tỷ lệ người bệnh loét do tỳ đè, tỷ lệ người bệnh bị viêm phổi do ứ đọng…) và tiến hành đo lường, theo dõi các chỉ số đó.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM24", "tc": "TC53", "ma": "C6.3", "tm": "TM24", "muc": "Mức 5", "noidung": "Phòng điều dưỡng so sánh, theo dõi chất lượng công tác chăm sóc người bệnh giữa các khoa lâm sàng dựa trên vẽ biểu đồ so sánh các chỉ số của các khoa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM25", "tc": "TC53", "ma": "C6.3", "tm": "TM25", "muc": "Mức 5", "noidung": "Các khoa lâm sàng tự tiến hành theo dõi chất lượng công tác chăm sóc người bệnh dựa trên vẽ biểu đồ so sánh các chỉ số theo thời gian.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM26", "tc": "TC53", "ma": "C6.3", "tm": "TM26", "muc": "Mức 5", "noidung": "Tiến hành đánh giá (hoặc nghiên cứu) công tác theo dõi, chăm sóc người bệnh; có báo cáo đánh giá trên phạm vi bệnh viện, trong đó có chỉ ra những nhược điểm cần khắc phục và đề xuất giải pháp cải tiến chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM27", "tc": "TC53", "ma": "C6.3", "tm": "TM27", "muc": "Mức 5", "noidung": "Tỷ lệ người bệnh loét do tỳ đè giảm dần hàng năm (hoặc tỷ lệ này bằng 0%).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM28", "tc": "TC53", "ma": "C6.3", "tm": "TM28", "muc": "Mức 5", "noidung": "Tỷ lệ người bệnh bị viêm phổi do ứ đọng giảm dần hàng năm, tiến đến không có (hoặc tỷ lệ này bằng 0%).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C6.3_TM29", "tc": "TC53", "ma": "C6.3", "tm": "TM29", "muc": "Mức 5", "noidung": "Thực hiện các giải pháp cải tiến chất lượng công tác theo dõi, chăm sóc người bệnh dựa trên kết quả đánh giá và đo lường các chỉ số đã xây dựng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Trần Thị Thanh Nhàn"}, {"id": "C7.1_TM1", "tc": "TC54", "ma": "C7.1", "tm": "TM1", "muc": "Mức 1", "noidung": "Không có khoa/tổ dinh dưỡng - tiết chế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.1_TM2", "tc": "TC54", "ma": "C7.1", "tm": "TM2", "muc": "Mức 1", "noidung": "Không có nhân viên được đào tạo về dinh dưỡng làm công tác dinh dưỡng - tiết chế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.1_TM3", "tc": "TC54", "ma": "C7.1", "tm": "TM3", "muc": "Mức 2", "noidung": "Có khoa/tổ dinh dưỡng - tiết chế theo quy định và đang hoạt động.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.1_TM4", "tc": "TC54", "ma": "C7.1", "tm": "TM4", "muc": "Mức 2", "noidung": "Lãnh đạo khoa/tổ dinh dưỡng - tiết chế có bằng chuyên khoa về chuyên ngành dinh dưỡng hoặc có chứng chỉ dinh dưỡng lâm sàng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.1_TM5", "tc": "TC54", "ma": "C7.1", "tm": "TM5", "muc": "Mức 2", "noidung": "Các văn bằng, chứng chỉ (bản sao) của nhân viên khoa/tổ dinh dưỡng - tiết chế được tập hợp thành một bộ và lưu tại khoa/tổ dinh dưỡng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.1_TM6", "tc": "TC54", "ma": "C7.1", "tm": "TM6", "muc": "Mức 3", "noidung": "Có khoa/tổ dinh dưỡng - tiết chế theo quy định, bệnh viện từ hạng III trở lên đã thành lập khoa dinh dưỡng - tiết chế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.1_TM7", "tc": "TC54", "ma": "C7.1", "tm": "TM7", "muc": "Mức 3", "noidung": "Khoa/tổ dinh dưỡng - tiết chế có ít nhất một nhân viên chuyên trách dinh dưỡng, đã được đào tạo về dinh dưỡng - tiết chế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.1_TM8", "tc": "TC54", "ma": "C7.1", "tm": "TM8", "muc": "Mức 3", "noidung": "Có đề án vị trí việc làm và xác định số lượng nhân lực của khoa/tổ dinh dưỡng - tiết chế theo lộ trình thời gian.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.1_TM9", "tc": "TC54", "ma": "C7.1", "tm": "TM9", "muc": "Mức 3", "noidung": "Có bản mô tả vị trí việc làm của từng nhân viên trong khoa/tổ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.1_TM10", "tc": "TC54", "ma": "C7.1", "tm": "TM10", "muc": "Mức 3", "noidung": "Lãnh đạo khoa/tổ có trình độ đại học chuyên ngành y, dinh dưỡng, thực phẩm (hoặc có liên quan) trở lên và có bằng chuyên khoa chuyên ngành dinh dưỡng - tiết chế hoặc có chứng chỉ dinh dưỡng lâm sàng (từ 3 tháng trở lên).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.1_TM11", "tc": "TC54", "ma": "C7.1", "tm": "TM11", "muc": "Mức 3", "noidung": "Nhân viên bộ phận chế biến và cung cấp suất ăn được đào tạo, tập huấn về vệ sinh an toàn thực phẩm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Tiết chế dinh dưỡng", "cb": "Phạm Thị Ngọc Oanh"}, {"id": "C7.1_TM12", "tc": "TC54", "ma": "C7.1", "tm": "TM12", "muc": "Mức 4", "noidung": "Khoa/tổ dinh dưỡng - tiết chế
