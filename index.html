ện có bảng kê cụ thể danh mục các thuốc, vật tư tiêu hao… và giá tiền từng khoản thu cho các nhóm đối tượng người bệnh: có thẻ BHYT, không có thẻ BHYT và các trường hợp khám, chữa bệnh theo yêu cầu (nếu có).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM9", "tc": "TC16", "ma": "A4.3", "tm": "TM9", "muc": "Mức 3", "noidung": "Bảng kê được in đầy đủ, rõ ràng, chính xác các thông tin về chi phí điều trị; phần kinh phí phải đóng và phần được miễn, giảm hoặc BHYT thanh toán*.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM10", "tc": "TC16", "ma": "A4.3", "tm": "TM10", "muc": "Mức 3", "noidung": "Bảng kê được in và đưa cho người bệnh kiểm tra, xác nhận toàn bộ các mục chi thuốc, vật tư tiêu hao… trước khi ra viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM11", "tc": "TC16", "ma": "A4.3", "tm": "TM11", "muc": "Mức 3", "noidung": "Người bệnh không phải nộp bất kỳ khoản nào khác ngoài các chi phí phải nộp đã in trong phiếu thanh toán.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM12", "tc": "TC16", "ma": "A4.3", "tm": "TM12", "muc": "Mức 4", "noidung": "Bệnh viện đăng tải thông tin về giá dịch vụ y tế, giá thuốc, vật tư… trên trang thông tin điện tử của bệnh viện để người bệnh so sánh thuận tiện (không phân biệt bệnh viện Nhà nước và tư nhân).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM13", "tc": "TC16", "ma": "A4.3", "tm": "TM13", "muc": "Mức 4", "noidung": "Người bệnh được thông báo và tư vấn trước khi bác sỹ chỉ định các kỹ thuật cao, thuốc đặc trị, xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng đắt tiền hoặc có chi phí lớn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM14", "tc": "TC16", "ma": "A4.3", "tm": "TM14", "muc": "Mức 4", "noidung": "Bảng kê được in và cấp cho người bệnh khi nộp viện phí ra viện hoặc khám bệnh ngoại trú.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM15", "tc": "TC16", "ma": "A4.3", "tm": "TM15", "muc": "Mức 4", "noidung": "Người bệnh không phải nộp bất kỳ khoản viện phí nào trực tiếp tại các khoa/phòng ngoài các địa điểm thu nộp viện phí theo quy định của bệnh viện (kể cả cho các dịch vụ xã hội hóa hoặc khám chữa bệnh theo yêu cầu).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM16", "tc": "TC16", "ma": "A4.3", "tm": "TM16", "muc": "Mức 5", "noidung": "Người bệnh khi nhập viện được cung cấp thẻ thông minh hoặc thẻ thanh toán điện tử (gọi chung là thẻ từ) dùng để lưu trữ các thông tin cá nhân, mã người bệnh, tình hình sử dụng dịch vụ cận lâm sàng, thuốc, vật tư… và chi phí điều trị.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM17", "tc": "TC16", "ma": "A4.3", "tm": "TM17", "muc": "Mức 5", "noidung": "Người bệnh được cung cấp một tài khoản ảo trong thẻ từ, được nộp tiền tạm ứng 1 lần khi nhập viện hoặc được “tín chấp” bằng số thẻ tín dụng của người bệnh hoặc người nhà người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM18", "tc": "TC16", "ma": "A4.3", "tm": "TM18", "muc": "Mức 5", "noidung": "Bệnh viện đặt các đầu đọc thẻ tại toàn bộ các phòng xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng, khoa lâm sàng và các vị trí khác (có cung cấp dịch vụ) để ghi nhận việc sử dụng dịch vụ của người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM19", "tc": "TC16", "ma": "A4.3", "tm": "TM19", "muc": "Mức 5", "noidung": "Người bệnh sử dụng thẻ từ để thanh toán các chi phí điều trị và không phải trả tiền mặt cho bất kỳ khoản viện phí nào khác.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM20", "tc": "TC16", "ma": "A4.3", "tm": "TM20", "muc": "Mức 5", "noidung": "Người bệnh được nộp tiền 2 lần cho bệnh viện, lần đầu tạm ứng khi nhập viện (trừ người bệnh được BHYT chi trả 100%) và lần cuối khi thanh toán ra viện. Trong trường hợp chi phí lớn, người bệnh có thể nộp thêm vào giữa đợt điều trị nhưng bệnh viện cần thông báo trước ít nhất 1 ngày.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.3_TM21", "tc": "TC16", "ma": "A4.3", "tm": "TM21", "muc": "Mức 5", "noidung": "Các thông tin chi phí điều trị được lưu và in cho người bệnh trước khi hoàn thành việc thanh toán ra viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Tài chính kế toán", "cb": "Đỗ Thị Hương Giang"}, {"id": "A4.4_TM1", "tc": "TC17", "ma": "A4.4", "tm": "TM1", "muc": "Mức 1", "noidung": "Phát hiện thấy bệnh viện có trang thiết bị từ nguồn đầu tư của Nhà nước bị hỏng hoặc trục trặc từ 1 tháng trở lên trong bối cảnh bệnh viện có máy cùng chức năng tương tự từ nguồn đầu tư xã hội hóa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "", "cb": ""}, {"id": "A4.4_TM2", "tc": "TC17", "ma": "A4.4", "tm": "TM2", "muc": "Mức 1", "noidung": "Phát hiện thấy ban lãnh đạo bệnh viện hoặc lãnh đạo khoa phòng) có chỉ đạo (bằng lời nói, chủ trương, văn bản…) tạo áp lực cho nhân viên đưa ra chỉ định xét nghiệm, chẩn đoán hình ảnh, thăm dò chức năng mà không dựa trên nhu cầu về mặt chuyên môn (căn cứ vào đơn thư khiếu nại, tố cáo và khảo sát ý kiến của nhân viên y tế).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "", "cb": ""}, {"id": "A4.4_TM3", "tc": "TC17", "ma": "A4.4", "tm": "TM3", "muc": "Mức 1", "noidung": "Phát hiện thấy hiện tượng đề án liên doanh, liên kết chưa được tổ chức công đoàn thông qua.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "", "cb": ""}, {"id": "A4.4_TM4", "tc": "TC17", "ma": "A4.4", "tm": "TM4", "muc": "Mức 2", "noidung": "Có bản thống kê danh mục toàn bộ các dịch vụ bệnh viện ký hợp đồng với đơn vị bên ngoài như an ninh, bảo vệ, trông xe, vệ sinh, ăn uống, bán hàng…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "", "cb": ""}, {"id": "A4.4_TM5", "tc": "TC17", "ma": "A4.4", "tm": "TM5", "muc": "Mức 2", "noidung": "Niêm yết công khai giá toàn bộ các dịch vụ do đơn vị bên ngoài cung cấp cho người bệnh tại vị trí cung cấp dịch vụ (hoặc tại vị trí dễ thấy bên cạnh bảng công khai giá dịch vụ y tế tại khu khám bệnh).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "", "cb": ""}, {"id": "A4.4_TM6", "tc": "TC17", "ma": "A4.4", "tm": "TM6", "muc": "Mức 2", "noidung": "Người bệnh và người nhà người bệnh được quyền lựa chọn có hoặc không sử dụng các dịch vụ (do bệnh viện hoặc đơn vị liên kết với bên ngoài cung cấp tại bệnh viện) mà không bị ngăn cản hoặc gây khó khăn (ví dụ dịch vụ vận chuyển người bệnh).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "", "cb": ""}, {"id": "A4.4_TM7", "tc": "TC17", "ma": "A4.4", "tm": "TM7", "muc": "Mức 2", "noidung": "Có bản thống kê danh mục toàn bộ các trang thiết bị xã hội hóa và phân công cho một phòng chức năng có trách nhiệm cập nhật đầy đủ, kịp thời.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "", "cb": ""}, {"id": "A4.4_TM8", "tc": "TC17", "ma": "A4.4", "tm": "TM8", "muc": "Mức 2", "noidung": "Niêm yết công khai bảng giá các dịch vụ kỹ thuật sử dụng trang thiết bị xã hội hóa tại cùng vị trí công khai bảng giá  dịch vụ y tế chung của bệnh viện hoặc niêm yết công khai tại trước buồng thực hiện các dịch vụ kỹ thuật có sử dụng các trang thiết bị xã hội hóa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "", "cb": ""}, {"id": "A4.4_TM9", "tc": "TC17", "ma": "A4.4", "tm": "TM9", "muc": "Mức 3", "noidung": "Bệnh viện huy động được các nguồn vốn đầu tư xã hội hóa cho trang thiết bị kỹ thuật phục vụ công tác khám, chẩn đoán và điều trị.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "", "cb": ""}, {"id": "A4.4_TM10", "tc": "TC17", "ma": "A4.4", "tm": "TM10", "muc": "Mức 3", "noidung": "Bệnh viện không đặt chỉ tiêu số lượt chiếu, chụp, xét nghiệm, kỹ thuật cho các trang thiết bị y tế (có nguồn gốc xã hội hóa).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "", "cb": ""}, {"id": "A4.4_TM11", "tc": "TC17", "ma": "A4.4", "tm": "TM11", "muc": "Mức 3", "noidung": "Giá viện phí của các dịch vụ y tế sử dụng trang thiết bị từ nguồn xã hội hóa cao hơn giá do cơ quan BHYT chi trả tối đa 30%.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "", "cb": ""}, {"id": "A4.4_TM12", "tc": "TC17", "ma": "A4.4", "tm": "TM12", "muc": "Mức 4", "noidung": "Có ít nhất 1 trang thiết bị xã hội hóa (hiện đại, kỹ thuật phức tạp…) thực hiện các kỹ thuật chẩn đoán và điều trị mà các trang thiết bị từ nguồn đầu tư Nhà nước khó có khả năng đáp ứng cho bệnh viện như máy chụp MRI, PET-CT, máy xạ trị ung thư,  Gamma-Knife... (đối với bệnh viện hạng III, IV áp dụng máy CT-Scan).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "", "cb": ""}, {"id": "A4.4_TM13", "tc": "TC17", "ma": "A4.4", "tm": "TM13", "muc": "Mức 4", "noidung": "Giá viện phí của các dịch vụ y tế có trang thiết bị từ nguồn xã hội hóa cao hơn giá do cơ quan BHYT chi trả tối đa 15%.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "", "cb": ""}, {"id": "A4.4_TM14", "tc": "TC17", "ma": "A4.4", "tm": "TM14", "muc": "Mức 5", "noidung": "Có ít nhất 1 trang thiết bị xã hội hóa (hiện đại, kỹ thuật phức tạp…) thực hiện các kỹ thuật điều trị, can thiệp mà các trang thiết bị từ nguồn đầu tư Nhà nước khó có khả năng đáp ứng cho bệnh viện như máy xạ trị ung thư, Gamma-Knife, các trang thiết bị phục vụ tim mạch can thiệp...", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "", "cb": ""}, {"id": "A4.4_TM15", "tc": "TC17", "ma": "A4.4", "tm": "TM15", "muc": "Mức 5", "noidung": "Giá viện phí của toàn bộ các dịch vụ sử dụng trang thiết bị từ nguồn xã hội hóa không cao hơn giá do cơ quan BHYT chi trả.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "", "cb": ""}, {"id": "A4.5_TM1", "tc": "TC18", "ma": "A4.5", "tm": "TM1", "muc": "Mức 1", "noidung": "Bệnh viện không công khai số điện thoại đường dây nóng hoặc để tại các vị trí khó nhìn, khó tìm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM2", "tc": "TC18", "ma": "A4.5", "tm": "TM2", "muc": "Mức 2", "noidung": "Có số đường dây nóng rõ ràng, dễ thấy, công bố công khai tại các vị trí tập trung đông người (như phòng khám, cấp cứu, địa điểm trông xe, thu viện phí…)", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM3", "tc": "TC18", "ma": "A4.5", "tm": "TM3", "muc": "Mức 2", "noidung": "Những số điện thoại đường dây nóng không còn sử dụng được gỡ bỏ kịp thời ra khỏi các bảng hoặc biển thông báo.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM4", "tc": "TC18", "ma": "A4.5", "tm": "TM4", "muc": "Mức 2", "noidung": "Có kế hoạch và bản danh sách phân công người trực đường dây nóng trong và ngoài giờ hành chính (24/24 giờ).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM5", "tc": "TC18", "ma": "A4.5", "tm": "TM5", "muc": "Mức 3", "noidung": "Luôn có người trực đường dây nóng tiếp nhận các ý kiến phản ánh của người bệnh trong và ngoài giờ hành chính.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM6", "tc": "TC18", "ma": "A4.5", "tm": "TM6", "muc": "Mức 3", "noidung": "Không phát hiện thấy hiện tượng không liên lạc được với số đường dây nóng của bệnh viện trong vòng 30 phút.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM7", "tc": "TC18", "ma": "A4.5", "tm": "TM7", "muc": "Mức 3", "noidung": "Công khai số điện thoại đường dây nóng theo quy định của Bộ Y tế tại các vị trí dễ thấy.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM8", "tc": "TC18", "ma": "A4.5", "tm": "TM8", "muc": "Mức 3", "noidung": "Số điện thoại đường dây nóng được in, sơn rõ ràng và được treo, dán cố định.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM9", "tc": "TC18", "ma": "A4.5", "tm": "TM9", "muc": "Mức 3", "noidung": "Biển số điện thoại đường dây nóng không rách, nát, mất số.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM10", "tc": "TC18", "ma": "A4.5", "tm": "TM10", "muc": "Mức 3", "noidung": "Có hình thức ghi lại các ý kiến phản hồi của người bệnh và phương hướng, kết quả xử lý (ghi lại bằng sổ, máy tính, hoặc phần mềm quản lý theo dõi…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM11", "tc": "TC18", "ma": "A4.5", "tm": "TM11", "muc": "Mức 3", "noidung": "Có sổ (hoặc bản danh sách) thống kê theo thời gian trong năm đầy đủ, trung thực các ý kiến về bệnh viện đã được đăng tải trên các phương tiện thông tin đại chúng, mạng xã hội và các đơn kiện có liên quan đến bệnh viện, bao gồm ý kiến tích cực và tiêu cực.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM12", "tc": "TC18", "ma": "A4.5", "tm": "TM12", "muc": "Mức 4", "noidung": "Sổ (hoặc bản danh sách) ghi chép các ý kiến về bệnh viện đầy đủ, trung thực.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM13", "tc": "TC18", "ma": "A4.5", "tm": "TM13", "muc": "Mức 4", "noidung": "Các ý kiến của người bệnh được chuyển đến các cá nhân, bộ phận có liên quan và được phản hồi hoặc giải quyết kịp thời.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM14", "tc": "TC18", "ma": "A4.5", "tm": "TM14", "muc": "Mức 4", "noidung": "Có báo cáo thống kê, phân tích các vấn đề người bệnh thường xuyên phàn nàn, thắc mắc; tần số các khoa, phòng và nhân viên y tế có nhiều người bệnh phàn nàn, thắc mắc hoặc khen ngợi để có giải pháp xử lý và xác định vấn đề ưu tiên cải tiến.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM15", "tc": "TC18", "ma": "A4.5", "tm": "TM15", "muc": "Mức 4", "noidung": "Có báo cáo phân tích “nguyên nhân gốc rễ” các vấn đề người bệnh thường phàn nàn, thắc mắc xảy ra do lỗi của cá nhân (bác sỹ, điều dưỡng…) hoặc do lỗi chung của toàn bệnh viện, lỗi chung của ngành (lỗi hệ thống).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM16", "tc": "TC18", "ma": "A4.5", "tm": "TM16", "muc": "Mức 5", "noidung": "Áp dụng kết quả phân tích nguyên nhân gốc vào việc cải tiến chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM17", "tc": "TC18", "ma": "A4.5", "tm": "TM17", "muc": "Mức 5", "noidung": "Có sáng kiến xây dựng, áp dụng các hình thức khác để lấy ý kiến phản hồi người bệnh chủ động, phong phú và sát thực tế hơn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM18", "tc": "TC18", "ma": "A4.5", "tm": "TM18", "muc": "Mức 5", "noidung": "Có các hình thức và thực hiện khen thưởng, kỷ luật cho nhân viên y tế nếu làm tốt hoặc chưa tốt việc phản hồi ý kiến người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM19", "tc": "TC18", "ma": "A4.5", "tm": "TM19", "muc": "Mức 5", "noidung": "Có báo cáo đánh giá ưu, nhược điểm và kết quả triển khai các kênh thông tin khác (hộp thư góp ý, phần mềm phản hồi trực tuyến…) tiếp nhận ý kiến phản hồi người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.5_TM20", "tc": "TC18", "ma": "A4.5", "tm": "TM20", "muc": "Mức 5", "noidung": "Có sử dụng kết quả đánh giá vào việc cải tiến chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "A4.6_TM1", "tc": "TC19", "ma": "A4.6", "tm": "TM1", "muc": "Mức 1", "noidung": "Không tiến hành khảo sát sự hài lòng người bệnh nội trú.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "A4.6_TM2", "tc": "TC19", "ma": "A4.6", "tm": "TM2", "muc": "Mức 2", "noidung": "Trong năm có tiến hành khảo sát sự hài lòng người bệnh nội trú ít nhất một lần, số lượng người bệnh nội trú được khảo sát từ 100 người trở lên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "A4.6_TM3", "tc": "TC19", "ma": "A4.6", "tm": "TM3", "muc": "Mức 2", "noidung": "Bộ câu hỏi khảo sát sự hài lòng người bệnh thực hiện trên bộ câu hỏi do Bộ Y tế ban hành (Sở Y tế, bệnh viện có thể xây dựng thêm các bộ câu hỏi khác).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "A4.6_TM4", "tc": "TC19", "ma": "A4.6", "tm": "TM4", "muc": "Mức 3", "noidung": "Có tiến hành khảo sát sự hài lòng người bệnh nội trú ít nhất 03 tháng một lần, mỗi lần khảo sát từ 100 người bệnh nội trú trở lên (đối với bệnh viện có lượng người bệnh nội trú dưới 100 lượt/tháng hoặc dưới 50 giường bệnh: khảo sát toàn bộ người bệnh nội trú trong vòng 1 tháng ít nhất 2 lần trong năm).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "A4.6_TM5", "tc": "TC19", "ma": "A4.6", "tm": "TM5", "muc": "Mức 3", "noidung": "Có tài liệu hướng dẫn phương pháp khảo sát sự hài lòng người bệnh nội trú, trong đó có quy định về thời gian tiến hành, người thực hiện, cách lựa chọn đối tượng được khảo sát, địa điểm được khảo sát…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "A4.6_TM6", "tc": "TC19", "ma": "A4.6", "tm": "TM6", "muc": "Mức 3", "noidung": "Có phân tích số liệu và có báo cáo khảo sát sự hài lòng người bệnh nội trú.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "A4.6_TM7", "tc": "TC19", "ma": "A4.6", "tm": "TM7", "muc": "Mức 3", "noidung": "Trong năm có tiến hành khảo sát sự hài lòng người bệnh ngoại trú và có bản báo cáo kết quả khảo sát.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "A4.6_TM8", "tc": "TC19", "ma": "A4.6", "tm": "TM8", "muc": "Mức 3", "noidung": "Công bố kết quả khảo sát cho các nhân viên y tế bằng cách hình thức khác nhau như báo cáo chung bệnh viện, thông báo tóm tắt tới các khoa/phòng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "A4.6_TM9", "tc": "TC19", "ma": "A4.6", "tm": "TM9", "muc": "Mức 4", "noidung": "Có tiến hành khảo sát sự hài lòng người bệnh ngoại trú ít nhất 02 lần trong năm và có bản báo cáo kết quả khảo sát.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "A4.6_TM10", "tc": "TC19", "ma": "A4.6", "tm": "TM10", "muc": "Mức 4", "noidung": "Kết quả khảo sát sự hài lòng phản ánh đúng thực tế, giúp bệnh viện xác định được những vấn đề người bệnh chưa hài lòng để cải tiến.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "A4.6_TM11", "tc": "TC19", "ma": "A4.6", "tm": "TM11", "muc": "Mức 4", "noidung": "Lập danh sách và có bản danh sách xác định các vấn đề ưu tiên cần giải quyết sau mỗi đợt khảo sát hài lòng người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "A4.6_TM12", "tc": "TC19", "ma": "A4.6", "tm": "TM12", "muc": "Mức 4", "noidung": "Xây dựng kế hoạch cải tiến chất lượng dựa trên bản danh sách xác định các vấn đề ưu tiên cần giải quyết.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "A4.6_TM13", "tc": "TC19", "ma": "A4.6", "tm": "TM13", "muc": "Mức 4", "noidung": "Tiến hành phân tích sự hài lòng người bệnh nội trú chia theo các khoa lâm sàng, người bệnh có sử dụng và không sử dụng thẻ bảo hiểm y tế hoặc các nhóm khác.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "A4.6_TM14", "tc": "TC19", "ma": "A4.6", "tm": "TM14", "muc": "Mức 5", "noidung": "Có bảng tổng hợp hoặc biểu đồ so sánh sự hài lòng người bệnh nội trú giữa các khoa lâm sàng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "A4.6_TM15", "tc": "TC19", "ma": "A4.6", "tm": "TM15", "muc": "Mức 5", "noidung": "Tổ khảo sát sự hài lòng người bệnh tiến hành họp nội bộ với những khoa lâm sàng có tỷ lệ hài lòng thấp nhất để bàn giải pháp cải tiến chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "A4.6_TM16", "tc": "TC19", "ma": "A4.6", "tm": "TM16", "muc": "Mức 5", "noidung": "Có bản kế hoạch cải tiến chất lượng chung của bệnh viện, trong đó có xác định ưu tiên đầu tư, cải tiến chất lượng tại những khoa có tỷ lệ hài lòng thấp.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "A4.6_TM17", "tc": "TC19", "ma": "A4.6", "tm": "TM17", "muc": "Mức 5", "noidung": "Tiến hành cải tiến chất lượng theo kế hoạch và có bằng chứng cho sự thay đổi.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Điều dưỡng", "cb": "Nguyễn Thị Xuân"}, {"id": "B1.1_TM1", "tc": "TC20", "ma": "B1.1", "tm": "TM1", "muc": "Mức 1", "noidung": "Không có bản kế hoạch phát triển nhân lực y tế tổng thể và hàng năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.1_TM2", "tc": "TC20", "ma": "B1.1", "tm": "TM2", "muc": "Mức 2", "noidung": "Có bản kế hoạch phát triển nhân lực y tế tổng thể và hàng năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.1_TM3", "tc": "TC20", "ma": "B1.1", "tm": "TM3", "muc": "Mức 2", "noidung": "Bản kế hoạch phát triển nhân lực y tế phù hợp với quy hoạch phát triển tổng thể của bệnh viện (đã được cấp có thẩm quyền phê duyệt).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.1_TM4", "tc": "TC20", "ma": "B1.1", "tm": "TM4", "muc": "Mức 2", "noidung": "Bản kế hoạch có mục tiêu chung, mục tiêu cụ thể, các hoạt động triển khai, người chịu trách nhiệm, thời gian, lộ trình triển khai và nguồn kinh phí thực hiện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.1_TM5", "tc": "TC20", "ma": "B1.1", "tm": "TM5", "muc": "Mức 2", "noidung": "Bản kế hoạch có đề cập đầy đủ các nội dung liên quan đến tuyển dụng, sử dụng, đào tạo liên tục và duy trì, phát triển nguồn nhân lực.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.1_TM6", "tc": "TC20", "ma": "B1.1", "tm": "TM6", "muc": "Mức 3", "noidung": "Mỗi mục tiêu cụ thể trong bản kế hoạch có ít nhất một chỉ số để đánh giá việc thực hiện và kết quả đạt được.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.1_TM7", "tc": "TC20", "ma": "B1.1", "tm": "TM7", "muc": "Mức 3", "noidung": "Triển khai các nội dung trong bản kế hoạch phát triển nhân lực y tế theo lộ trình đã đề ra.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.1_TM8", "tc": "TC20", "ma": "B1.1", "tm": "TM8", "muc": "Mức 3", "noidung": "Có ít nhất 50% chỉ số đạt được theo kế hoạch.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.1_TM9", "tc": "TC20", "ma": "B1.1", "tm": "TM9", "muc": "Mức 3", "noidung": "Có quy định cụ thể tuyển dụng, ưu đãi nguồn nhân lực y tế có chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.1_TM10", "tc": "TC20", "ma": "B1.1", "tm": "TM10", "muc": "Mức 4", "noidung": "Tiến hành đánh giá việc thực hiện kế hoạch phát triển nhân lực y tế hàng năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.1_TM11", "tc": "TC20", "ma": "B1.1", "tm": "TM11", "muc": "Mức 4", "noidung": "Xây dựng và triển khai các giải pháp để khắc phục những mục tiêu chưa hoàn thành (nếu có).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.1_TM12", "tc": "TC20", "ma": "B1.1", "tm": "TM12", "muc": "Mức 4", "noidung": "Có ít nhất 75% chỉ số đạt được theo kế hoạch phát triển nhân lực y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uu 025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM5", "tc": "TC21", "ma": "B1.2", "tm": "TM5", "muc": "Mức 2", "noidung": "Tỷ số “điều dưỡng/giường bệnh” của toàn bệnh viện (kế hoạch và thực kê)", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM6", "tc": "TC21", "ma": "B1.2", "tm": "TM6", "muc": "Mức 2", "noidung": "Tỷ số “điều dưỡng/giường bệnh” của từng khoa lâm sàng", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM7", "tc": "TC21", "ma": "B1.2", "tm": "TM7", "muc": "Mức 2", "noidung": "Tỷ số “bác sỹ/điều dưỡng” của toàn bệnh viện", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM8", "tc": "TC21", "ma": "B1.2", "tm": "TM8", "muc": "Mức 2", "noidung": "Tỷ số “bác sỹ/điều dưỡng” của từng khoa", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM9", "tc": "TC21", "ma": "B1.2", "tm": "TM9", "muc": "Mức 2", "noidung": "Tỷ số “dược sỹ/giường bệnh” của toàn bệnh viện", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM10", "tc": "TC21", "ma": "B1.2", "tm": "TM10", "muc": "Mức 2", "noidung": "Tỷ số “nhân viên dinh dưỡng/giường bệnh” của toàn bệnh viện", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM11", "tc": "TC21", "ma": "B1.2", "tm": "TM11", "muc": "Mức 2", "noidung": "Theo dõi, cập nhật tình hình nhân lực các khoa lâm sàng và cận lâm sàng bằng cách lập bảng so sánh các tỷ số trên của các khoa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM12", "tc": "TC21", "ma": "B1.2", "tm": "TM12", "muc": "Mức 3", "noidung": "Có đặt ra các chỉ tiêu cần đạt cho các tỷ số trong mức 2 theo từng năm và được quy định trong văn bản do bệnh viện đã ban hành (nghị quyết, kế hoạch, đề án phát triển nhân lực…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM13", "tc": "TC21", "ma": "B1.2", "tm": "TM13", "muc": "Mức 3", "noidung": "Các chỉ tiêu do bệnh viện đặt ra bảo đảm đủ nhân lực thực hiện hoạt động khám, chữa bệnh và chăm sóc người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM14", "tc": "TC21", "ma": "B1.2", "tm": "TM14", "muc": "Mức 3", "noidung": "Tính toán, dự báo được nhu cầu nhân lực cần bổ sung, thay thế số người sẽ về hưu và có kế hoạch bổ sung, tuyển dụng cụ thể cho các vị trí đó.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM15", "tc": "TC21", "ma": "B1.2", "tm": "TM15", "muc": "Mức 3", "noidung": "Điều chuyển, tuyển dụng, bổ sung bác sỹ, điều dưỡng cho các khoa có bác sỹ, điều dưỡng thấp trong bảng theo dõi, cập nhật tình hình nhân lực các khoa lâm sàng và cận lâm sàng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM16", "tc": "TC21", "ma": "B1.2", "tm": "TM16", "muc": "Mức 3", "noidung": "Không phát hiện thấy có phân công cho nhân viên y tế trực đêm tại bệnh viện với tần suất trong vòng 3 ngày trực một lần (không tính ngày trực bù hoặc trực trong vụ dịch, thiên tai, thảm họa).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM17", "tc": "TC21", "ma": "B1.2", "tm": "TM17", "muc": "Mức 3", "noidung": "Không phát hiện thấy có nhân viên y tế phải trực 24/24 giờ tại khoa hồi sức cấp cứu, phẫu thuật gây mê hồi sức, hồi sức cấp cứu, điều trị tích cực, sơ sinh (không tính thời gian trực bù).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM18", "tc": "TC21", "ma": "B1.2", "tm": "TM18", "muc": "Mức 4", "noidung": "Bảo đảm số lượng nhân lực cho điều trị và chăm sóc người bệnh 24 giờ trong ngày và 7 ngày trong tuần (hoặc 5, 6 ngày trong tuần với các bệnh viện không làm việc vào chủ nhật và/hoặc thứ 7).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM19", "tc": "TC21", "ma": "B1.2", "tm": "TM19", "muc": "Mức 4", "noidung": "Đã tuyển dụng và duy trì đầy đủ số bác sỹ để đạt chỉ tiêu “tỷ số bác sỹ/giường bệnh” (do bệnh viện đã đặt ra) tại thời điểm 1 năm trước và tại thời điểm đánh giá chất lượng bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM20", "tc": "TC21", "ma": "B1.2", "tm": "TM20", "muc": "Mức 4", "noidung": "Có phương án động viên, khuyến khích các bác sỹ có trình độ chuyên môn cao (so với đặc thù bệnh viện) sau khi nghỉ hưu tiếp tục tham gia, cống hiến cho các hoạt động chuyên môn đang thiếu hụt bác sỹ (hoặc thiếu hụt nguồn nhân lực có chất lượng cao).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM21", "tc": "TC21", "ma": "B1.2", "tm": "TM21", "muc": "Mức 4", "noidung": "Làm việc theo chế độ ca kíp ở tối thiểu các khoa/đơn nguyên: hồi sức cấp cứu, chống độc, điều trị tích cực, sơ sinh, phẫu thuật - gây mê hồi sức (không áp dụng mục này nếu bệnh viện không có các khoa/đơn nguyên trên).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM22", "tc": "TC21", "ma": "B1.2", "tm": "TM22", "muc": "Mức 5", "noidung": "Bảo đảm duy trì số lượng bác sỹ và điều dưỡng đạt được toàn bộ các chỉ tiêu cho các tỷ số từ “a đến g” (trong mức 2) tại thời điểm 1 năm trước và tại thời điểm đánh giá chất lượng bệnh viện*.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM23", "tc": "TC21", "ma": "B1.2", "tm": "TM23", "muc": "Mức 5", "noidung": "Có xây dựng thêm các chỉ số khác (phù hợp với đặc thù và khả năng của bệnh viện) để đo lường và theo dõi tình hình biến động nhân lực y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.2_TM24", "tc": "TC21", "ma": "B1.2", "tm": "TM24", "muc": "Mức 5", "noidung": "Có báo cáo đánh giá tình hình nhân lực bệnh viện và đề xuất, triển khai các giải pháp khắc phục những mặt hạn chế hàng năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.3_TM1", "tc": "TC22", "ma": "B1.3", "tm": "TM1", "muc": "Mức 1", "noidung": "Không có bản mô tả công việc cho các chức danh nghề nghiệp của ban giám đốc, các khoa, phòng và tương đương.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.3_TM2", "tc": "TC22", "ma": "B1.3", "tm": "TM2", "muc": "Mức 1", "noidung": "Phát hiện thấy bệnh viện tuyển dụng nhân viên y tế vào làm việc nhưng không có tiêu chí cụ thể cho các vị trí việc làm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.3_TM3", "tc": "TC22", "ma": "B1.3", "tm": "TM3", "muc": "Mức 2", "noidung": "Có quy định tiêu chí cụ thể khi tuyển dụng nhân viên cho các vị trí việc làm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.3_TM4", "tc": "TC22", "ma": "B1.3", "tm": "TM4", "muc": "Mức 2", "noidung": "Đã xây dựng xong dự thảo bản mô tả công việc cho đầy đủ các chức danh nghề nghiệp.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.3_TM5", "tc": "TC22", "ma": "B1.3", "tm": "TM5", "muc": "Mức 2", "noidung": "Bản mô tả công việc của các chức danh nghề nghiệp được cập nhật định kỳ ít nhất 2 năm 1 lần và khi cần.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.3_TM6", "tc": "TC22", "ma": "B1.3", "tm": "TM6", "muc": "Mức 3", "noidung": "Có đầy đủ bản mô tả công việc cho toàn bộ các chức danh nghề nghiệp, đã được Giám đốc phê duyệt.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.3_TM7", "tc": "TC22", "ma": "B1.3", "tm": "TM7", "muc": "Mức 3", "noidung": "Có “Đề án vị trí việc làm” dựa vào danh mục vị trí việc làm và cơ cấu chức danh nghề nghiệp, được Giám đốc phê duyệt.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.3_TM8", "tc": "TC22", "ma": "B1.3", "tm": "TM8", "muc": "Mức 3", "noidung": "Đã xây dựng được cơ cấu chức danh nghề nghiệp dựa vào vị trí việc làm trong đề án vị trí việc làm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.3_TM9", "tc": "TC22", "ma": "B1.3", "tm": "TM9", "muc": "Mức 3", "noidung": "Cơ cấu chức danh nghề nghiệp phù hợp với danh mục vị trí việc làm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.3_TM10", "tc": "TC22", "ma": "B1.3", "tm": "TM10", "muc": "Mức 3", "noidung": "Danh mục vị trí việc làm được xây dựng bảo đảm đầy đủ các lĩnh vực theo chức năng hoạt động của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.3_TM11", "tc": "TC22", "ma": "B1.3", "tm": "TM11", "muc": "Mức 3", "noidung": "Số lượng nhân lực dự kiến phù hợp với danh mục vị trí việc làm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.3_TM12", "tc": "TC22", "ma": "B1.3", "tm": "TM12", "muc": "Mức 3", "noidung": "Trong đề án vị trí việc làm không phát hiện thấy bất cập hoặc không khả thi trong việc xác định cơ cấu chức danh nghề nghiệp.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.3_TM13", "tc": "TC22", "ma": "B1.3", "tm": "TM13", "muc": "Mức 4", "noidung": "Đã tuyển dụng đầy đủ số bác sỹ theo đúng đề án vị trí việc làm đã xây dựng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.3_TM14", "tc": "TC22", "ma": "B1.3", "tm": "TM14", "muc": "Mức 4", "noidung": "Đã tuyển dụng đầy đủ số điều dưỡng theo đúng đề án vị trí việc làm đã xây dựng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.3_TM15", "tc": "TC22", "ma": "B1.3", "tm": "TM15", "muc": "Mức 4", "noidung": "Có đánh giá tính khả thi các bản mô tả công việc cho các chức danh nghề nghiệp và cập nhật, điều chỉnh bổ sung hàng năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.3_TM16", "tc": "TC22", "ma": "B1.3", "tm": "TM16", "muc": "Mức 5", "noidung": "Đã tuyển đầy đủ số lượng người làm việc và bảo đảm đầy đủ các cơ cấu chức danh nghề nghiệp theo vị trí việc làm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.3_TM17", "tc": "TC22", "ma": "B1.3", "tm": "TM17", "muc": "Mức 5", "noidung": "Mỗi năm có tiến hành đánh giá kết quả thực hiện công việc hàng năm của các vị trí việc làm và có bản báo cáo đánh giá.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B1.3_TM18", "tc": "TC22", "ma": "B1.3", "tm": "TM18", "muc": "Mức 5", "noidung": "Tiến hành chỉnh sửa, bổ sung các vị trí việc làm dựa trên kết quả đánh giá.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Nguyễn Hoài Hương"}, {"id": "B2.1_TM1", "tc": "TC23", "ma": "B2.1", "tm": "TM1", "muc": "Mức 1", "noidung": "Không có bản kế hoạch đào tạo cho nhân viên y tế của bệnh viện (hoặc không có nội dung đào tạo trong bản kế hoạch, đề án chung khác của bệnh viện).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM2", "tc": "TC23", "ma": "B2.1", "tm": "TM2", "muc": "Mức 1", "noidung": "Trong năm không có nhân viên y tế tham gia đào tạo liên tục.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM3", "tc": "TC23", "ma": "B2.1", "tm": "TM3", "muc": "Mức 2", "noidung": "Có bản kế hoạch đào tạo cho nhân viên y tế (hoặc trong bản kế hoạch, đề án chung khác của bệnh viện có nội dung đào tạo).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM4", "tc": "TC23", "ma": "B2.1", "tm": "TM4", "muc": "Mức 2", "noidung": "Kế hoạch đào tạo bao gồm đào tạo liên tục về cập nhật kiến thức, phát triển kỹ năng nghề nghiệp cho các đối tượng và lĩnh vực trong bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM5", "tc": "TC23", "ma": "B2.1", "tm": "TM5", "muc": "Mức 2", "noidung": "Kế hoạch đào tạo có đề cập nội dung đào tạo nâng cao trình độ chuyên môn (bằng cấp) cho nhân viên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM6", "tc": "TC23", "ma": "B2.1", "tm": "TM6", "muc": "Mức 3", "noidung": "Kế hoạch đào tạo phù hợp với kế hoạch phát triển chuyên môn của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM7", "tc": "TC23", "ma": "B2.1", "tm": "TM7", "muc": "Mức 3", "noidung": "Có tổ chức kiểm tra tay nghề, chuyên môn cho nhân viên y tế, đặc biệt là bác sỹ, y sỹ, điều dưỡng, hộ sinh, kỹ thuật viên, dược sỹ dưới 5 năm công tác bằng các hình thức (như thi sát hạch, tổ chức hội thi...)", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM8", "tc": "TC23", "ma": "B2.1", "tm": "TM8", "muc": "Mức 3", "noidung": "Hàng năm, bệnh viện cử được ít nhất 5% số lượng bác sỹ và 5% số lượng điều dưỡng đi bồi dưỡng chuyên môn, nâng cao kỹ năng làm việc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM9", "tc": "TC23", "ma": "B2.1", "tm": "TM9", "muc": "Mức 3", "noidung": "Có theo dõi số liệu tỷ lệ nhân viên y tế được đào tạo liên tục ít nhất 12 tiết học trở lên trong năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM10", "tc": "TC23", "ma": "B2.1", "tm": "TM10", "muc": "Mức 3", "noidung": "Hàng năm, bệnh viện cử các chức danh nghề nghiệp khác như dược sỹ, kỹ thuật y, kỹ sư, kế toán… đi bồi dưỡng chuyên môn, nâng cao kỹ năng làm việc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM11", "tc": "TC23", "ma": "B2.1", "tm": "TM11", "muc": "Mức 3", "noidung": "Cử các chức danh nghề nghiệp như bác sỹ, dược sỹ, điều dưỡng, kỹ thuật y, kỹ sư… đi đào tạo nâng cao trình độ chuyên môn nghiệp vụ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM12", "tc": "TC23", "ma": "B2.1", "tm": "TM12", "muc": "Mức 4", "noidung": "Có từ 20% nhân viên y tế trở lên được đào tạo liên tục ít nhất 12 tiết học trở lên trong năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM13", "tc": "TC23", "ma": "B2.1", "tm": "TM13", "muc": "Mức 4", "noidung": "Có các hình thức tập huấn, đào tạo, chia sẻ kinh nghiệm từ các nhân viên y tế có trình độ, chuyên gia (trong và ngoài bệnh viện) cho nhân viên bệnh viện nhằm nâng cao năng lực chuyên môn và kỹ năng nghề nghiệp như sinh hoạt khoa học, hội thảo xây dựng các hướng dẫn chẩn đoán điều trị, quy trình chuyên môn kỹ thuật, báo cáo chuyên đề…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM14", "tc": "TC23", "ma": "B2.1", "tm": "TM14", "muc": "Mức 4", "noidung": "Trong năm có tổ chức các hội thi tay nghề giỏi cho ít nhất hai chức danh trở lên: bác sỹ, điều dưỡng, hộ sinh, kỹ thuật viên, dược sỹ, quản lý...", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM15", "tc": "TC23", "ma": "B2.1", "tm": "TM15", "muc": "Mức 4", "noidung": "Có hình thức khuyến khích, thúc đẩy nhân viên y tế tham gia các hình thức kiểm tra tay nghề, hội thi tay nghề trong và ngoài bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM16", "tc": "TC23", "ma": "B2.1", "tm": "TM16", "muc": "Mức 5", "noidung": "Có phần mềm cập nhật và theo dõi tình hình nhân viên tham gia đào tạo liên tục, đào tạo nâng cao trình độ chuyên môn (ví dụ tính giờ, tính điểm tham gia đào tạo liên tục, tình trạng đang đi học).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM17", "tc": "TC23", "ma": "B2.1", "tm": "TM17", "muc": "Mức 5", "noidung": "Có từ 30% nhân viên y tế trở lên được đào tạo liên tục ít nhất 12 tiết học trở lên trong năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM18", "tc": "TC23", "ma": "B2.1", "tm": "TM18", "muc": "Mức 5", "noidung": "Có quy định và hình thức khuyến khích, khen thưởng, nhắc nhở, phê bình, kỷ luật nhằm thúc đẩy nhân viên tham gia đào tạo liên tục đầy đủ trong năm dựa trên số liệu phần mềm theo dõi.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM19", "tc": "TC23", "ma": "B2.1", "tm": "TM19", "muc": "Mức 5", "noidung": "Có đánh giá, nghiên cứu tình hình đào tạo liên tục và chỉ ra được những mặt hạn chế cần khắc phục.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.1_TM20", "tc": "TC23", "ma": "B2.1", "tm": "TM20", "muc": "Mức 5", "noidung": "Áp dụng các kết quả đánh giá, nghiên cứu vào việc cải tiến chất lượng đào tạo liên tục và phát triển kỹ năng nghề nghiệp.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.2_TM1", "tc": "TC24", "ma": "B2.2", "tm": "TM1", "muc": "Mức 1", "noidung": "Có vụ việc tập thể hoặc cá nhân vi phạm y đức, được đăng tải trên các phương tiện truyền thông, gây ảnh hưởng nghiêm trọng đến hình ảnh của bệnh viện và ngành y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "B2.2_TM2", "tc": "TC24", "ma": "B2.2", "tm": "TM2", "muc": "Mức 2", "noidung": "Bệnh viện đã xây dựng kế hoạch nâng cao kỹ năng ứng xử, giao tiếp, y đức cho nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "B2.2_TM3", "tc": "TC24", "ma": "B2.2", "tm": "TM3", "muc": "Mức 2", "noidung": "Bản kế hoạch có đặt ra các chỉ tiêu cụ thể liên quan đến ứng xử, giao tiếp, y đức để tập thể bệnh viện phấn đấu.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "B2.2_TM4", "tc": "TC24", "ma": "B2.2", "tm": "TM4", "muc": "Mức 2", "noidung": "Đã triển khai kế hoạch nâng cao kỹ năng ứng xử, giao tiếp, y đức.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "B2.2_TM5", "tc": "TC24", "ma": "B2.2", "tm": "TM5", "muc": "Mức 2", "noidung": "Trong năm đã tổ chức được ít nhất hai lớp tập huấn nâng cao kỹ năng ứng xử, giao tiếp, y đức tại bệnh viện cho nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "B2.2_TM6", "tc": "TC24", "ma": "B2.2", "tm": "TM6", "muc": "Mức 3", "noidung": "Tỷ lệ số nhân viên y tế tham gia các lớp tập huấn nâng cao kỹ năng ứng xử, giao tiếp, y đức chiếm trên 50% tổng số nhân viên y tế (căn cứ vào số lượng lớp mở và số học viên tham gia).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "B2.2_TM7", "tc": "TC24", "ma": "B2.2", "tm": "TM7", "muc": "Mức 3", "noidung": "Có cam kết giữa nhân viên y tế với lãnh đạo bệnh viện và giữa tập thể bệnh viện với các cơ quản lý về nâng cao tinh thần trách nhiệm, thái độ ứng xử, giao tiếp, y đức của nhân viên y tế với người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "B2.2_TM8", "tc": "TC24", "ma": "B2.2", "tm": "TM8", "muc": "Mức 3", "noidung": "Có tiến hành khảo sát hoặc đánh giá sơ bộ thái độ ứng xử của nhân viên y tế và sử dụng kết quả khảo sát, đánh giá để bố trí người phù hợp ở các vị trí việc làm thường tiếp xúc với người bệnh và người nhà người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "B2.2_TM9", "tc": "TC24", "ma": "B2.2", "tm": "TM9", "muc": "Mức 4", "noidung": "Tỷ lệ số nhân viên y tế tham gia các lớp tập huấn nâng cao kỹ năng ứng xử, giao tiếp, y đức chiếm trên 70% tổng số nhân viên y tế (căn cứ vào số lượng lớp mở và số học viên tham gia).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "B2.2_TM10", "tc": "TC24", "ma": "B2.2", "tm": "TM10", "muc": "Mức 4", "noidung": "Có nhiều hình thức triển khai đa dạng, phong phú kế hoạch nâng cao kỹ năng ứng xử, giao tiếp, y đức cho nhân viên y tế như tổ chức các cuộc thi, phong trào, cam kết thi đua, kịch, hội diễn văn nghệ…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "B2.2_TM11", "tc": "TC24", "ma": "B2.2", "tm": "TM11", "muc": "Mức 4", "noidung": "Có tiến hành đánh giá việc triển khai nâng cao thái độ ứng xử, giao tiếp, y đức theo định kỳ và có báo cáo về hình thức/phương pháp và kết quả đánh giá.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "B2.2_TM12", "tc": "TC24", "ma": "B2.2", "tm": "TM12", "muc": "Mức 4", "noidung": "Có thư cảm ơn/thư khen của người bệnh/người nhà người bệnh đánh giá cao về tinh thần trách nhiệm, thái độ ứng xử, giao tiếp, y đức của nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "B2.2_TM13", "tc": "TC24", "ma": "B2.2", "tm": "TM13", "muc": "Mức 5", "noidung": "Tỷ lệ số nhân viên y tế tham gia các lớp tập huấn nâng cao kỹ năng ứng xử, giao tiếp, y đức chiếm trên 80% tổng số nhân viên y tế (căn cứ vào số lượng lớp mở và số học viên tham gia).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "B2.2_TM14", "tc": "TC24", "ma": "B2.2", "tm": "TM14", "muc": "Mức 5", "noidung": "Đánh giá thực hiện kế hoạch nâng cao thái độ ứng xử, giao tiếp, y đức của nhân viên y tế có các chỉ số đạt kết quả tốt, xu hướng tăng dần theo thời gian.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "B2.2_TM15", "tc": "TC24", "ma": "B2.2", "tm": "TM15", "muc": "Mức 5", "noidung": "Khảo sát sự hài lòng người bệnh đạt kết quả tốt về thái độ ứng xử, giao tiếp, y đức của nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "B2.2_TM16", "tc": "TC24", "ma": "B2.2", "tm": "TM16", "muc": "Mức 5", "noidung": "Không có đơn thư khiếu nại, tố cáo về thái độ ứng xử, giao tiếp, y đức.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "B2.2_TM17", "tc": "TC24", "ma": "B2.2", "tm": "TM17", "muc": "Mức 5", "noidung": "Có cá nhân hoặc vụ việc tiêu biểu về y đức, giao tiếp, ứng xử, được các phương tiện truyền thông đăng tải ca ngợi, biểu dương; là tấm gương sáng cho các cá nhân, bệnh viện khác học tập.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Tống Văn Lực"}, {"id": "B2.3_TM1", "tc": "TC25", "ma": "B2.3", "tm": "TM1", "muc": "Mức 1", "noidung": "Trong năm không có nhân viên y tế tham gia đào tạo nâng cao trình độ chuyên môn (bằng cấp).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.3_TM2", "tc": "TC25", "ma": "B2.3", "tm": "TM2", "muc": "Mức 1", "noidung": "Bệnh viện không có bản kế hoạch đào tạo cho nhân viên y tế (hoặc không có nội dung đào tạo trong bản kế hoạch, đề án chung khác của bệnh viện).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.3_TM3", "tc": "TC25", "ma": "B2.3", "tm": "TM3", "muc": "Mức 2", "noidung": "Có bản kế hoạch đào tạo cho nhân viên y tế (hoặc trong bản kế hoạch, đề án chung khác của bệnh viện có nội dung đào tạo).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.3_TM4", "tc": "TC25", "ma": "B2.3", "tm": "TM4", "muc": "Mức 2", "noidung": "Kế hoạch đào tạo có đề cập nội dung đào tạo nâng cao trình độ chuyên môn (bằng cấp) cho nhân viên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.3_TM5", "tc": "TC25", "ma": "B2.3", "tm": "TM5", "muc": "Mức 2", "noidung": "Trong bản kế hoạch đào tạo hoặc quy chế chi tiêu nội bộ có quy định hỗ trợ (bằng các hình thức vật chất và phi vật chất như học phí, phương tiện, động viên, khen thưởng… cho nhân viên của bệnh viện được cử đi đào tạo.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.3_TM6", "tc": "TC25", "ma": "B2.3", "tm": "TM6", "muc": "Mức 3", "noidung": "Có quy định hỗ trợ (một phần hoặc toàn bộ) khoản học phí và sinh hoạt phí cho nhân viên được cử đi đào tạo nâng cao trình độ chuyên môn trong nước (hoặc nước ngoài) bằng nguồn của bệnh viện, trung ương, địa phương hoặc dự án và các nguồn kinh phí hợp pháp khác.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.3_TM7", "tc": "TC25", "ma": "B2.3", "tm": "TM7", "muc": "Mức 3", "noidung": "Nhân viên sau khi hoàn thành chương trình đào tạo nâng cao trình độ chuyên môn do bệnh viện cử đi được bố trí vị trí việc làm phù hợp với đào tạo.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.3_TM8", "tc": "TC25", "ma": "B2.3", "tm": "TM8", "muc": "Mức 3", "noidung": "Có văn bản quy định cụ thể về thu hút, tuyển dụng và duy trì nguồn nhân lực y tế có chất lượng làm việc ổn định, lâu dài tại bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.3_TM9", "tc": "TC25", "ma": "B2.3", "tm": "TM9", "muc": "Mức 3", "noidung": "Tổng số bác sỹ hiện đang làm việc có trình độ sau đại học được học trong thời gian đang làm việc tại bệnh viện chiếm ít nhất 30% tổng số bác sỹ có trình độ sau đại học của toàn bệnh viện (áp dụng không phân biệt bệnh viện Nhà nước và tư nhân, tuyến trên và dưới). (Nếu bệnh viện không có bác sỹ có trình độ sau đại học thì đánh giá không đạt mục này).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.3_TM10", "tc": "TC25", "ma": "B2.3", "tm": "TM10", "muc": "Mức 4", "noidung": "Tỷ lệ bác sỹ xin chuyển sang bệnh viện khác trong năm chiếm dưới 5%.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.3_TM11", "tc": "TC25", "ma": "B2.3", "tm": "TM11", "muc": "Mức 4", "noidung": "Trong năm có tuyển dụng mới bác sỹ được đào tạo chính quy vào làm việc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.3_TM12", "tc": "TC25", "ma": "B2.3", "tm": "TM12", "muc": "Mức 4", "noidung": "Tổng số bác sỹ hiện đang làm việc có trình độ sau đại học (tính cả số bác sỹ đang đi học nhưng chưa có bằng) được học trong khoảng thời gian làm việc tại bệnh viện chiếm ít nhất 40% tổng số bác sỹ có trình độ sau đại học của toàn bệnh viện (áp dụng không phân biệt bệnh viện Nhà nước và tư nhân, tuyến trên và dưới).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.3_TM13", "tc": "TC25", "ma": "B2.3", "tm": "TM13", "muc": "Mức 4", "noidung": "Toàn bộ số bác sỹ được tuyển dụng mới trong năm được đào tạo chính quy.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Đặng Văn Nhanh"}, {"id": "B2.3_TM14", "tc": "TC25", "ma": "B2.3", "tm": "TM14", "muc":  thức trả lương, thu nhập tăng thêm cho nhân viên y tế, góp phần nâng cao chất lượng dịch vụ y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Trần Thanh Hải"}, {"id": "B3.2_TM1", "tc": "TC27", "ma": "B3.2", "tm": "TM1", "muc": "Mức 1", "noidung": "Có nhân viên y tế không được trang bị trang phục và phương tiện làm việc (hoặc hỏng không sử dụng được).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "B3.2_TM2", "tc": "TC27", "ma": "B3.2", "tm": "TM2", "muc": "Mức 1", "noidung": "Phòng làm việc không bảo đảm điều kiện về cơ sở vật chất như nhà dột nát, bàn ghế hỏng…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "B3.2_TM3", "tc": "TC27", "ma": "B3.2", "tm": "TM3", "muc": "Mức 2", "noidung": "Bảo đảm điều kiện làm việc cơ sở vật chất, phòng ốc không dột, nát; tường không bong tróc; thoáng mát về mùa hè, ấm về mùa đông.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "B3.2_TM4", "tc": "TC27", "ma": "B3.2", "tm": "TM4", "muc": "Mức 2", "noidung": "Bảo đảm điều kiện về trang thiết bị văn phòng, bàn ghế làm việc đầy đủ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "B3.2_TM5", "tc": "TC27", "ma": "B3.2", "tm": "TM5", "muc": "Mức 2", "noidung": "Có đầy đủ các trang thiết bị y tế cơ bản cần thiết phục vụ công tác chuyên môn, trang thiết bị không bảo đảm các yêu cầu chuyên môn được thay thế kịp thời.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "B3.2_TM6", "tc": "TC27", "ma": "B3.2", "tm": "TM6", "muc": "Mức 2", "noidung": "Nhân viên y tế được cung cấp đầy đủ các phương tiện bảo hộ mang tính liên quan trực tiếp đến an toàn như khẩu trang, găng tay, trang phục bảo hộ dùng 1 lần dùng trong phòng mổ hoặc các dịch bệnh truyền nhiễm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "B3.2_TM7", "tc": "TC27", "ma": "B3.2", "tm": "TM7", "muc": "Mức 3", "noidung": "Cung cấp đầy đủ trang phục cho các đối tượng lãnh đạo, bác sỹ, điều dưỡng, kỹ thuật viên, nhân viên hành chính, thực tập, y công thuộc nhân viên hợp đồng tại bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "B3.2_TM8", "tc": "TC27", "ma": "B3.2", "tm": "TM8", "muc": "Mức 3", "noidung": "Nhân viên y tế không bị hạn chế sử dụng các phương tiện bảo hộ mang tính liên quan trực tiếp đến an toàn như khẩu trang, găng tay, trang phục bảo hộ dùng 1 lần...", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "B3.2_TM9", "tc": "TC27", "ma": "B3.2", "tm": "TM9", "muc": "Mức 3", "noidung": "Nhân viên y tế được cập nhật thông tin mới hoặc tập huấn về vệ sinh an toàn lao động, lưu ý phòng tránh các tình huống, vấn đề mới phát sinh như các bệnh truyền nhiễm nguy hiểm…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "B3.2_TM10", "tc": "TC27", "ma": "B3.2", "tm": "TM10", "muc": "Mức 3", "noidung": "Sẵn có các phương tiện, thuốc, hóa chất… để sơ cấp cứu kịp thời nhân viên y tế trong trường hợp bị phơi nhiễm nghề nghiệp (ví dụ có vòi nước rửa hóa chất bắn vào mắt; sẵn có thuốc, dịch truyền sơ cứu phơi nhiễm HIV…)", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "B3.2_TM11", "tc": "TC27", "ma": "B3.2", "tm": "TM11", "muc": "Mức 4", "noidung": "Trang phục cho các chức danh nghề nghiệp khác nhau về kiểu dáng, ký hiệu hoặc màu sắc để có thể phân biệt rõ ràng giữa các đối tượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "B3.2_TM12", "tc": "TC27", "ma": "B3.2", "tm": "TM12", "muc": "Mức 4", "noidung": "Bệnh viện lập hồ sơ vệ sinh lao động, đo kiểm tra môi trường lao động định kỳ (theo quy định của bệnh viện).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "B3.2_TM13", "tc": "TC27", "ma": "B3.2", "tm": "TM13", "muc": "Mức 4", "noidung": "Có tiến hành khảo sát sự hài lòng của nhân viên y tế với điều kiện làm việc, vệ sinh lao động… Bộ câu hỏi khảo sát sự hài lòng nhân viên y tế dựa trên bộ câu hỏi do Bộ Y tế, Sở Y tế ban hành hoặc bệnh viện tự xây dựng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "B3.2_TM14", "tc": "TC27", "ma": "B3.2", "tm": "TM14", "muc": "Mức 5", "noidung": "Có bản báo cáo khảo sát sự hài lòng của nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "B3.2_TM15", "tc": "TC27", "ma": "B3.2", "tm": "TM15", "muc": "Mức 5", "noidung": "Kết quả khảo sát xác định được những vấn đề nhân viên y tế chưa hài lòng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "B3.2_TM16", "tc": "TC27", "ma": "B3.2", "tm": "TM16", "muc": "Mức 5", "noidung": "Tiến hành can thiệp cải thiện điều kiện làm việc, vệ sinh lao động cho nhân viên y tế dựa trên các kết quả khảo sát.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "B3.2_TM17", "tc": "TC27", "ma": "B3.2", "tm": "TM17", "muc": "Mức 5", "noidung": "Bệnh viện tổ chức và hỗ trợ một phần cho nhân viên y tế mua bảo hiểm trách nhiệm nghề nghiệp.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Hành chính quản trị", "cb": "Hà Thanh Hải"}, {"id": "B3.3_TM1", "tc": "TC28", "ma": "B3.3", "tm": "TM1", "muc": "Mức 1", "noidung": "Bệnh viện không tiến hành khám sức khỏe định kỳ cho nhân viên y tế trong năm cho các đối tượng nhân viên y tế có nguy cơ cao như các chuyên khoa có phơi nhiễm bệnh lây truyền, hóa chất, phóng xạ….", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Vũ Đăng Trường, Hoàng Thị Hiền"}, {"id": "B3.3_TM2", "tc": "TC28", "ma": "B3.3", "tm": "TM2", "muc": "Mức 2", "noidung": "Có tiến hành khám sức khỏe định kỳ hàng năm cho các đối tượng nhân viên y tế có nguy cơ cao như các chuyên khoa có phơi nhiễm bệnh lây truyền, hóa chất, phóng xạ….", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Vũ Đăng Trường, Hoàng Thị Hiền"}, {"id": "B3.3_TM3", "tc": "TC28", "ma": "B3.3", "tm": "TM3", "muc": "Mức 2", "noidung": "Nhân viên y tế làm việc tại môi trường có yếu tố nguy cơ gây bệnh nghề nghiệp như lao, HIV/AIDS, viêm gan B… được xét nghiệm cận lâm sàng trước khi bố trí công việc để theo dõi tình trạng sức khỏe và phơi nhiễm nghề nghiệp.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Vũ Đăng Trường, Hoàng Thị Hiền"}, {"id": "B3.3_TM4", "tc": "TC28", "ma": "B3.3", "tm": "TM4", "muc": "Mức 3", "noidung": "Có tổ chức khám sức khỏe định kỳ hàng năm cho toàn bộ nhân viên bệnh viện và khám bệnh nghề nghiệp cho các nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Vũ Đăng Trường, Hoàng Thị Hiền"}, {"id": "B3.3_TM5", "tc": "TC28", "ma": "B3.3", "tm": "TM5", "muc": "Mức 3", "noidung": "Có lập hồ sơ quản lý sức khỏe cho nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Vũ Đăng Trường, Hoàng Thị Hiền"}, {"id": "B3.3_TM6", "tc": "TC28", "ma": "B3.3", "tm": "TM6", "muc": "Mức 3", "noidung": "Bảo đảm chế độ nghỉ dưỡng/nghỉ phép cho nhân viên theo đúng quy định.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Vũ Đăng Trường, Hoàng Thị Hiền"}, {"id": "B3.3_TM7", "tc": "TC28", "ma": "B3.3", "tm": "TM7", "muc": "Mức 3", "noidung": "Có các hình thức động viên tinh thần nhân viên y tế như tổ chức tham quan, nghỉ dưỡng, vui chơi tập thể cho nhân viên thường xuyên hàng năm và huy động được đa số nhân viên tham gia.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Vũ Đăng Trường, Hoàng Thị Hiền"}, {"id": "B3.3_TM8", "tc": "TC28", "ma": "B3.3", "tm": "TM8", "muc": "Mức 4", "noidung": "Quản lý và theo dõi hồ sơ sức khỏe của toàn bộ nhân viên bệnh viện theo thời gian.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Vũ Đăng Trường, Hoàng Thị Hiền"}, {"id": "B3.3_TM9", "tc": "TC28", "ma": "B3.3", "tm": "TM9", "muc": "Mức 4", "noidung": "Hồ sơ sức khỏe của toàn bộ nhân viên bệnh viện được nhập và quản lý bằng phần mềm máy tính.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Vũ Đăng Trường, Hoàng Thị Hiền"}, {"id": "B3.3_TM10", "tc": "TC28", "ma": "B3.3", "tm": "TM10", "muc": "Mức 4", "noidung": "Có các hình thức, phương tiện nâng cao sức khỏe thể chất và tinh thần cho nhân viên y tế như sân tập và dụng cụ thể thao hoặc khu thể thao.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Vũ Đăng Trường, Hoàng Thị Hiền"}, {"id": "B3.3_TM11", "tc": "TC28", "ma": "B3.3", "tm": "TM11", "muc": "Mức 4", "noidung": "Xây dựng các hoạt động hoặc phong trào thể thao và văn hóa văn nghệ, giải trí, động viên, khích lệ tinh thần cho nhân viên y tế, hoạt động thường xuyên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Vũ Đăng Trường, Hoàng Thị Hiền"}, {"id": "B3.3_TM12", "tc": "TC28", "ma": "B3.3", "tm": "TM12", "muc": "Mức 5", "noidung": "Có báo cáo về tình trạng sức khỏe nhân viên y tế của bệnh viện hàng năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Vũ Đăng Trường, Hoàng Thị Hiền"}, {"id": "B3.3_TM13", "tc": "TC28", "ma": "B3.3", "tm": "TM13", "muc": "Mức 5", "noidung": "Phần mềm quản lý hồ sơ sức khỏe của nhân viên có chiết xuất ra được các biểu đồ, diễn biến tình trạng sức khỏe, cơ cấu bệnh tật của nhân viên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Vũ Đăng Trường, Hoàng Thị Hiền"}, {"id": "B3.3_TM14", "tc": "TC28", "ma": "B3.3", "tm": "TM14", "muc": "Mức 5", "noidung": "Kết quả phân tích có đưa ra được các cảnh báo nguy cơ bệnh tật cho các nhóm đối tượng nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Vũ Đăng Trường, Hoàng Thị Hiền"}, {"id": "B3.3_TM15", "tc": "TC28", "ma": "B3.3", "tm": "TM15", "muc": "Mức 5", "noidung": "Áp dụng kết quả phân tích vào can thiệp nâng cao tình trạng sức khỏe cho nhân viên y tế của bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Vũ Đăng Trường, Hoàng Thị Hiền"}, {"id": "B3.4_TM1", "tc": "TC29", "ma": "B3.4", "tm": "TM1", "muc": "Mức 1", "noidung": "Có đơn thư khiếu nại, tố cáo của nhân viên y tế gửi các cơ quan quản lý về các hiện tượng mất dân chủ, mất đoàn kết, tiêu cực… và sau khi thanh tra, xác minh là đúng sự thật.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B3.4_TM2", "tc": "TC29", "ma": "B3.4", "tm": "TM2", "muc": "Mức 2", "noidung": "Bệnh viện đã xây dựng quy chế dân chủ cơ sở (hoặc quy định tương đương bảo đảm quyền lợi người lao động và quy trình giải quyết khiếu nại, tố cáo nội bộ đối với bệnh viện tư nhân).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B3.4_TM3", "tc": "TC29", "ma": "B3.4", "tm": "TM3", "muc": "Mức 2", "noidung": "Quy chế dân chủ cơ sở được lấy ý kiến rộng rãi tại hội nghị cán bộ viên chức/người lao động/nhân viên y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B3.4_TM4", "tc": "TC29", "ma": "B3.4", "tm": "TM4", "muc": "Mức 2", "noidung": "Các nhân viên y tế làm công tác chuyên môn được tham gia sinh hoạt khoa học định kỳ ít nhất 3 tháng/1 lần.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B3.4_TM5", "tc": "TC29", "ma": "B3.4", "tm": "TM5", "muc": "Mức 2", "noidung": "Có mời chuyên gia và nhân viên trẻ (trong và ngoài bệnh viện) báo cáo, trình bày chia sẻ kinh nghiệm trong các sinh hoạt khoa học định kỳ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B3.4_TM6", "tc": "TC29", "ma": "B3.4", "tm": "TM6", "muc": "Mức 3", "noidung": "Xây dựng môi trường học tập tạo điều kiện cho nhân viên cập nhật kiến thức, nâng cao trình độ như truy cập mạng internet, tiếp cận tra cứu thông tin y học, thư viện, phòng đọc…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B3.4_TM7", "tc": "TC29", "ma": "B3.4", "tm": "TM7", "muc": "Mức 3", "noidung": "Có các quy định và triển khai các hình thức thi đua, khen thưởng, động viên, khuyến khích các nhân viên y tế thực hiện tốt công việc/đạt chất lượng cao; không phân biệt vị trí công tác.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B3.4_TM8", "tc": "TC29", "ma": "B3.4", "tm": "TM8", "muc": "Mức 3", "noidung": "Hình thức động viên, khuyến khích nhân viên y tế đa dạng (bằng tiền, hiện vật, danh hiệu, cơ hội đi học, bổ nhiệm…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Chính trị", "cb": "Nguyễn Thị Cẩm Vân"}, {"id": "B3.4_TM9", "tc": "TC29", "ma": "B3
