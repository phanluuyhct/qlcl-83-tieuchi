g2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.3_TM1", "tc": "TC79", "ma": "D3.3", "tm": "TM1", "muc": "Mức 1", "noidung": "Không phản hồi thông tin hoặc không gửi báo cáo* liên quan đến hoạt động quản lý chất lượng bệnh viện cho Bộ Y tế hoặc các cơ quan quản lý trực tiếp theo như yêu cầu trong các văn bản chính thức.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.3_TM2", "tc": "TC79", "ma": "D3.3", "tm": "TM2", "muc": "Mức 2", "noidung": "Có gửi công văn, báo cáo liên quan đến hoạt động quản lý chất lượng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.3_TM3", "tc": "TC79", "ma": "D3.3", "tm": "TM3", "muc": "Mức 3", "noidung": "Phòng/tổ quản lý chất lượng có lưu trữ các công văn đến, đi, báo cáo phản hồi liên quan đến hoạt động quản lý chất lượng cho Bộ Y tế, Sở Y tế trong năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.3_TM4", "tc": "TC79", "ma": "D3.3", "tm": "TM4", "muc": "Mức 3", "noidung": "Gửi đầy đủ số lượng các báo cáo liên quan đến hoạt động quản lý chất lượng theo yêu cầu của cơ quan quản lý trong năm.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.3_TM5", "tc": "TC79", "ma": "D3.3", "tm": "TM5", "muc": "Mức 3", "noidung": "Các báo cáo liên quan đến hoạt động quản lý chất lượng đầy đủ thông tin và làm theo đúng hướng dẫn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.3_TM6", "tc": "TC79", "ma": "D3.3", "tm": "TM6", "muc": "Mức 3", "noidung": "Báo cáo bảo đảm chất lượng số liệu và các thông tin trung thực, chính xác.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.3_TM7", "tc": "TC79", "ma": "D3.3", "tm": "TM7", "muc": "Mức 4", "noidung": "Đáp ứng gửi các thông tin, đánh giá, báo cáo, góp ý, hình ảnh… liên quan đến quản lý chất lượng theo đúng thời hạn quy định trong công văn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.3_TM8", "tc": "TC79", "ma": "D3.3", "tm": "TM8", "muc": "Mức 4", "noidung": "Báo cáo có những thông tin giá trị, có độ tin cậy cao.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.3_TM9", "tc": "TC79", "ma": "D3.3", "tm": "TM9", "muc": "Mức 4", "noidung": "Có nhân viên y tế tích cực tham gia và có đóng góp cụ thể vào việc xây dựng các chính sách, tiêu chuẩn, tiêu chí quản lý chất lượng của Bộ Y tế (cung cấp các bằng chứng cụ thể minh họa các đóng góp).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.3_TM10", "tc": "TC79", "ma": "D3.3", "tm": "TM10", "muc": "Mức 5", "noidung": "Bệnh viện được mời và có bài trình bày chia sẻ kinh nghiệm cải tiến chất lượng tại diễn đàn hoặc hội nghị về quản lý chất lượng khám, chữa bệnh trong năm (cấp quốc gia như Bộ Y tế, Cục Quản lý Khám, chữa bệnh hoặc quốc tế).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "D3.3_TM11", "tc": "TC79", "ma": "D3.3", "tm": "TM11", "muc": "Mức 5", "noidung": "Chủ động xây dựng các công cụ, tài liệu, hướng dẫn, phần mềm… về quản lý chất lượng và báo cáo, chia sẻ với Bộ Y tế để tiếp tục chia sẻ rộng rãi cho các bệnh viện khác trên phạm vi toàn quốc.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "P. Kế hoạch tổng hợp", "cb": "Nguyễn Thị Thanh"}, {"id": "E1.1_TM1", "tc": "TC80", "ma": "E1.1", "tm": "TM1", "muc": "Mức 1", "noidung": "Không có bác sỹ chuyên khoa sản, kể cả chuyên khoa sơ bộ/định hướng.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.1_TM2", "tc": "TC80", "ma": "E1.1", "tm": "TM2", "muc": "Mức 1", "noidung": "Không có hộ sinh trung cấp trở lên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.1_TM3", "tc": "TC80", "ma": "E1.1", "tm": "TM3", "muc": "Mức 2", "noidung": "Có bác sỹ chuyên khoa sản (chuyên khoa sơ bộ/định hướng hoặc cao hơn).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.1_TM4", "tc": "TC80", "ma": "E1.1", "tm": "TM4", "muc": "Mức 2", "noidung": "Có hộ sinh trung cấp trở lên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.1_TM5", "tc": "TC80", "ma": "E1.1", "tm": "TM5", "muc": "Mức 2", "noidung": "Có phòng khám phụ khoa riêng với đầy đủ các trang thiết bị cơ bản (theo quy định của Bộ Y tế), có bục lên xuống bàn khám.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.1_TM6", "tc": "TC80", "ma": "E1.1", "tm": "TM6", "muc": "Mức 2", "noidung": "Có phòng thủ thuật riêng biệt.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.1_TM7", "tc": "TC80", "ma": "E1.1", "tm": "TM7", "muc": "Mức 3", "noidung": "Có bác sỹ chuyên khoa sản cấp I (hoặc thạc sỹ về chuyên khoa sản) trở lên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.1_TM8", "tc": "TC80", "ma": "E1.1", "tm": "TM8", "muc": "Mức 3", "noidung": "Tỷ lệ hộ sinh có trình độ cử nhân trở lên chiếm ít nhất 30% tổng số hộ sinh của khoa sản (hoặc của tổng các khoa sản trên toàn bệnh viện chuyên khoa)*.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.1_TM9", "tc": "TC80", "ma": "E1.1", "tm": "TM9", "muc": "Mức 3", "noidung": "Có triển khai thực hiện kỹ thuật mổ đẻ (mổ lấy thai) mang tính thường quy.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.1_TM10", "tc": "TC80", "ma": "E1.1", "tm": "TM10", "muc": "Mức 3", "noidung": "Có góc sơ sinh trong phòng đẻ (hoặc có đơn nguyên sơ sinh riêng biệt và cao hơn).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.1_TM11", "tc": "TC80", "ma": "E1.1", "tm": "TM11", "muc": "Mức 4", "noidung": "Có đơn nguyên/khoa sơ sinh riêng biệt trong bệnh viện, đầy đủ nhân lực, cơ sở vật chất, trang thiết bị theo quy định của Bộ Y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.1_TM12", "tc": "TC80", "ma": "E1.1", "tm": "TM12", "muc": "Mức 4", "noidung": "Có bác sỹ chuyên khoa sản cấp II (hoặc tiến sỹ về chuyên khoa sản) trở lên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.1_TM13", "tc": "TC80", "ma": "E1.1", "tm": "TM13", "muc": "Mức 4", "noidung": "Tỷ lệ hộ sinh có trình độ cử nhân trở lên chiếm ít nhất 40% tổng số hộ sinh của khoa sản (hoặc của tổng các khoa sản trên toàn bệnh viện chuyên khoa)*.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.1_TM14", "tc": "TC80", "ma": "E1.1", "tm": "TM14", "muc": "Mức 5", "noidung": "Tỷ lệ hộ sinh có trình độ cử nhân trở lên chiếm ít nhất 50% tổng số hộ sinh của khoa sản (hoặc của tổng các khoa sản trên toàn bệnh viện chuyên khoa)*.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.1_TM15", "tc": "TC80", "ma": "E1.1", "tm": "TM15", "muc": "Mức 5", "noidung": "Tỷ lệ bác sỹ sản khoa tham gia đầy đủ đào tạo liên tục trong năm chiếm từ 70% trở lên (trong số các bác sỹ sản khoa).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.1_TM16", "tc": "TC80", "ma": "E1.1", "tm": "TM16", "muc": "Mức 5", "noidung": "Trưởng hoặc phó khoa sản (hoặc có ít nhất 1 người trong ban giám đốc đối với bệnh viện chuyên khoa sản) có trình độ chuyên khoa II hoặc tiến sỹ về sản khoa.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.1_TM17", "tc": "TC80", "ma": "E1.1", "tm": "TM17", "muc": "Mức 5", "noidung": "Có khoa/trung tâm chuyên sâu về phụ sản (trung tâm sản bệnh, trung tâm hỗ trợ sinh sản…).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.2_TM1", "tc": "TC81", "ma": "E1.2", "tm": "TM1", "muc": "Mức 1", "noidung": "Không có tranh ảnh, tờ rơi, băng hình… tuyên truyền liên quan đến chăm sóc sức khỏe sinh sản, sức khỏe bà mẹ, trẻ em.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.2_TM2", "tc": "TC81", "ma": "E1.2", "tm": "TM2", "muc": "Mức 2", "noidung": "Có tranh ảnh, tờ rơi tuyên truyền về chăm sóc sức khỏe sinh sản, sức khỏe bà mẹ, trẻ em tại phòng khám và các khoa sản; đặt ở vị trí dễ quan sát cho người bệnh và người nhà người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.2_TM3", "tc": "TC81", "ma": "E1.2", "tm": "TM3", "muc": "Mức 3", "noidung": "Có thực hiện tư vấn về sức khỏe sinh sản và chăm sóc trước sinh, sau sinh, chăm sóc và nuôi dưỡng trẻ nhỏ cho phụ nữ mang thai.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.2_TM4", "tc": "TC81", "ma": "E1.2", "tm": "TM4", "muc": "Mức 3", "noidung": "Có bảng thông tin* và truyền thông về sức khỏe sinh sản và chăm sóc trước sinh, sau sinh đặt tại phòng khám, chỗ dễ quan sát cho người bệnh và người thăm/nuôi người bệnh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.2_TM5", "tc": "TC81", "ma": "E1.2", "tm": "TM5", "muc": "Mức 4", "noidung": "Có hộp phát tờ rơi miễn phí truyền thông về sức khỏe sinh sản và chăm sóc trước sinh, sau sinh…", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.2_TM6", "tc": "TC81", "ma": "E1.2", "tm": "TM6", "muc": "Mức 4", "noidung": "Có nhân viên tư vấn kiêm nhiệm/chuyên trách về sức khỏe sinh sản và chăm sóc trước sinh, sau sinh, trình độ từ cao đẳng/cử nhân điều dưỡng trở lên hoặc bác sỹ.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.2_TM7", "tc": "TC81", "ma": "E1.2", "tm": "TM7", "muc": "Mức 4", "noidung": "Có phòng tư vấn về sức khỏe sinh sản và chăm sóc trước sinh, sau sinh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.2_TM8", "tc": "TC81", "ma": "E1.2", "tm": "TM8", "muc": "Mức 4", "noidung": "Có tài liệu cho các lớp học tiền và hậu sản cung cấp cho các đối tượng phụ nữ, người nhà người bệnh (trong đó có nội dung hướng dẫn nuôi con bằng sữa mẹ).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.2_TM9", "tc": "TC81", "ma": "E1.2", "tm": "TM9", "muc": "Mức 4", "noidung": "Có tổ chức lớp học tiền sản định kỳ cho phụ nữ mang thai, bà mẹ cho con bú và các đối tượng khác mỗi tháng ít nhất 1 lần; nội dung về theo dõi, chăm sóc sức khỏe bà mẹ, thai nhi và sơ sinh; chế độ dinh dưỡng, nuôi con bằng sữa mẹ, ăn bổ sung hợp lý …", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.2_TM10", "tc": "TC81", "ma": "E1.2", "tm": "TM10", "muc": "Mức 5", "noidung": "Khu vực khoa/phòng khám bệnh, phòng chờ có ti-vi màn hình từ 40 inch trở lên, thường xuyên phát các băng hình về sức khỏe sinh sản, chăm sóc trước sinh; trong và ngay sau sinh; sau sinh.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.2_TM11", "tc": "TC81", "ma": "E1.2", "tm": "TM11", "muc": "Mức 5", "noidung": "Có cập nhật, bổ sung tài liệu cho các lớp học tiền sản định kỳ cho các đối tượng phụ nữ, người nhà người bệnh và phát cho học viên.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.2_TM12", "tc": "TC81", "ma": "E1.2", "tm": "TM12", "muc": "Mức 5", "noidung": "Các lớp học tiền sản được tổ chức theo lịch cố định ít nhất 1 lần trong tuần và công bố công khai cho người dân được biết.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.2_TM13", "tc": "TC81", "ma": "E1.2", "tm": "TM13", "muc": "Mức 5", "noidung": "Có tiến hành đánh giá kiến thức của các đối tượng học viên sau khi tập huấn.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.2_TM14", "tc": "TC81", "ma": "E1.2", "tm": "TM14", "muc": "Mức 5", "noidung": "Tiến hành cải tiến chất lượng các lớp dựa trên kết quả đánh giá.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.3_TM1", "tc": "TC82", "ma": "E1.3", "tm": "TM1", "muc": "Mức 1", "noidung": "Không triển khai các hướng dẫn NCBSM theo quy định của Bộ Y tế.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.3_TM2", "tc": "TC82", "ma": "E1.3", "tm": "TM2", "muc": "Mức 1", "noidung": "Phát hiện thấy có tranh, ảnh, tờ rơi, nhân viên tiếp thị, tài trợ hội nghị, hội thảo hoặc hình thức khác quảng cáo sữa công thức cho trẻ dưới 24 tháng tuổi trong khuôn viên hoặc hàng rào bệnh viện.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.3_TM3", "tc": "TC82", "ma": "E1.3", "tm": "TM3", "muc": "Mức 1", "noidung": "Trong năm bị phát hiện vi phạm các quy định của Nghị định 100/2014/NĐ-CP ngày 06/11/2014 hoặc Thông tư số 38/2016/TT-BYT ngày 31/10/2016 (bị xử phạt hoặc nêu trên các phương tiện thông tin đại chúng).", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.3_TM4", "tc": "TC82", "ma": "E1.3", "tm": "TM4", "muc": "Mức 2", "noidung": "Có bản quy định về việc thực hiện 10 điều kiện nuôi con bằng sữa mẹ, được viết bằng ngôn ngữ thông dụng, dễ hiểu, sẵn có cho nhân viên y tế tham gia chăm sóc bà mẹ và trẻ em; được treo ở những nơi dễ quan sát.", "minhchung": "", "dg2024": "", "dg2025": "", "nguyennhan": "", "giaiphap": "", "han": "", "uutien": "", "donvi": "K. Phụ Sản- KHHGĐ", "cb": "Phan Thị Thu Vân"}, {"id": "E1.3_TM5", "tc": "TC82", "ma": "E1.3", "tm": "TM5", "muc": "Mức 2", "noidung": "Khoa sản, nhi tuyên truyền, hướng dẫn các bà mẹ không sử dụng bình bú, sữa thay thế sữa mẹ cho trẻ dưới 24 tháng nếu không có chỉ định của bác s const subKQ=(s,y)=>s['dg'+y];               // 'Đạt' (có minh chứng) | 'Không đạt' | undefined
const setSubKQ=(s,y,v)=>{if(v==null||v==='')delete s['dg'+y];else s['dg'+y]=v; s['ev'+y]={u:USER?USER.ten:'',t:nowStr()};};

const critScore=(c,y)=>c[scoreKey(y)];
function setCritScore(c,y,v,auto){c[scoreKey(y)]=v; c['ev'+y]={u:USER?USER.ten:(auto?'Tự tính':''),t:nowStr(),auto:!!auto};}
const critMeta=(c,y)=>c['ev'+y];
const isApplied=c=>((c.trangthai||'Áp dụng').trim()==='Áp dụng');
const isDouble=c=>!!c.double; // theo QĐ 6858: toàn bộ chương C3 & C5 ×2
function weighted(c,y){const v=c[scoreKey(y)];return v==null?null:(isDouble(c)?v*2:v);}

/* Auto-calc criterion level from sub-items evidence */
function autoLevel(ma,y){
  const subs=SUBS.filter(s=>s.ma===ma);
  if(!subs.length)return {level:null,ok:false,reason:'no-sub'};
  const byL={1:[],2:[],3:[],4:[],5:[]};
  subs.forEach(s=>{const L=mucNum(s.muc);if(byL[L])byL[L].push(s);});
  let level=0, missing=false;
  for(let L=1;L<=5;L++){
    const items=byL[L];
    if(!items.length){missing=true;continue;}
    const evaluated=items.filter(s=>subKQ(s,y)!=null);
    if(evaluated.length<items.length){return {level:level||null,ok:false,reason:'incomplete',at:L};}
    const allDat=items.every(s=>subKQ(s,y)==='Đạt');
    if(allDat)level=L; else break;
  }
  return {level:level||1,ok:true,missing};
}

/* ===== Aggregations (chỉ tính tiêu chí ÁP DỤNG) ===== */
const APPLIED=()=>CRIT.filter(isApplied);
function yearAvg(y){const v=APPLIED().map(c=>critScore(c,y)).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0;}
function yearTotal(y){return APPLIED().reduce((a,c)=>a+(weighted(c,y)||0),0);}
/* Điểm chất lượng chung QĐ 6858: Σ điểm (C3,C5 ×2) / (số TC áp dụng + số TC C3&C5 áp dụng) */
function qualityScore(y){let num=0,den=0;APPLIED().forEach(c=>{const v=critScore(c,y);if(v==null)return;const d=isDouble(c);num+=d?v*2:v;den+=d?2:1;});return den?num/den:0;}
function qualityDen(y){let den=0;APPLIED().forEach(c=>{if(critScore(c,y)==null)return;den+=isDouble(c)?2:1;});return den;}
function dist(y){const d=[0,0,0,0,0];APPLIED().forEach(c=>{const v=critScore(c,y);if(v>=1&&v<=5)d[v-1]++;});return d;}
function partStats(y){return PARTS.map(p=>{const it=APPLIED().filter(c=>partLetter(c.part)===p.L&&critScore(c,y)!=null);const avg=it.length?it.reduce((a,c)=>a+critScore(c,y),0)/it.length:0;return {...p,n:it.length,avg};});}
function avgOf(items,y){const a=items.filter(c=>isApplied(c)&&critScore(c,y)!=null);return a.length?a.reduce((s,c)=>s+critScore(c,y),0)/a.length:0;}

/* ===== Charts ===== */
function barChart(data,{w=560,h=260,max=5,fmt=v=>v.toFixed(2)}={}){
  const ml=40,mr=12,mt=14,mb=44,iw=w-ml-mr,ih=h-mt-mb,n=data.length,gap=.32,bw=iw/n*(1-gap);let g='';
  for(let t=0;t<=max;t++){const y=mt+ih-t/max*ih;g+=`<line class="grid-line" x1="${ml}" y1="${y}" x2="${w-mr}" y2="${y}"/><text class="axis-lab" x="${ml-6}" y="${y+3}" text-anchor="end">${t}</text>`;}
  data.forEach((d,i)=>{const x=ml+iw/n*i+iw/n*gap/2,bh=d.v/max*ih,y=mt+ih-bh;
    g+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(bh,1)}" rx="4" fill="${d.color}" ${d.link?`data-nav="${d.link}" style="cursor:pointer"`:''}><title>${esc(d.full||d.label)}: ${fmt(d.v)}</title></rect>`;
    g+=`<text class="axis-lab" x="${x+bw/2}" y="${mt+ih+16}" text-anchor="middle" style="font-weight:600;fill:var(--ink-2)">${esc(d.label)}</text>`;
    g+=`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--ink)">${fmt(d.v)}</text>`;});
  g+=`<line class="baseline" x1="${ml}" y1="${mt+ih}" x2="${w-mr}" y2="${mt+ih}"/>`;
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}">${g}</svg>`;
}
function lineChart(series,labels,{w=560,h=240,max=5}={}){
  const ml=40,mr=16,mt=14,mb=30,iw=w-ml-mr,ih=h-mt-mb;let g='';
  for(let t=0;t<=max;t++){const y=mt+ih-t/max*ih;g+=`<line class="grid-line" x1="${ml}" y1="${y}" x2="${w-mr}" y2="${y}"/><text class="axis-lab" x="${ml-6}" y="${y+3}" text-anchor="end">${t}</text>`;}
  const X=i=>ml+iw/(labels.length-1)*i,Y=v=>mt+ih-v/max*ih;
  labels.forEach((l,i)=>g+=`<text class="axis-lab" x="${X(i)}" y="${mt+ih+18}" text-anchor="middle" style="font-weight:600;fill:var(--ink-2)">${esc(l)}</text>`);
  series.forEach(s=>{const pts=s.vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    g+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s.vals.forEach((v,i)=>{if(v==null)return;g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="var(--surface)" stroke="${s.color}" stroke-width="2.5"><title>${labels[i]}: ${v.toFixed(2)}</title></circle><text x="${X(i)}" y="${Y(v)-9}" text-anchor="middle" style="font-size:10px;font-weight:700;fill:${s.color}">${v.toFixed(2)}</text>`;});});
  g+=`<line class="baseline" x1="${ml}" y1="${mt+ih}" x2="${w-mr}" y2="${mt+ih}"/>`;
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}">${g}</svg>`;
}
function radarChart(axes,series,{size=380,max=5,levels=5}={}){
  const cx=size/2,cy=size/2+4,R=size/2-66,N=axes.length,ang=i=>-Math.PI/2+i*2*Math.PI/N,pt=(i,r)=>[cx+Math.cos(ang(i))*r,cy+Math.sin(ang(i))*r];let g='';
  for(let l=1;l<=levels;l++){const r=R*l/levels;g+=`<polygon points="${axes.map((_,i)=>pt(i,r).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`;}
  axes.forEach((a,i)=>{const[ex,ey]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="var(--line)"/>`;
    const[lx,ly]=pt(i,R+22),anc=Math.abs(lx-cx)<8?'middle':(lx>cx?'start':'end');
    g+=`<text x="${lx}" y="${ly}" text-anchor="${anc}" data-nav="${a.link||''}" style="cursor:${a.link?'pointer':'default'};font-size:12px;font-weight:700;fill:var(--ink)">${esc(a.L)}</text><text x="${lx}" y="${ly+13}" text-anchor="${anc}" style="font-size:10px;fill:var(--muted)">${esc(a.sub||'')}</text>`;});
  series.forEach(s=>{g+=`<polygon points="${s.vals.map((v,i)=>pt(i,R*(v||0)/max).join(',')).join(' ')}" fill="${s.fill||'none'}" stroke="${s.color}" stroke-width="2.5" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
    s.vals.forEach((v,i)=>{const[px,py]=pt(i,R*(v||0)/max);g+=`<circle cx="${px}" cy="${py}" r="4" fill="var(--surface)" stroke="${s.color}" stroke-width="2.5"><title>${esc(axes[i].label)}: ${(v||0).toFixed(2)}</title></circle>${s.dash?'':`<text x="${px}" y="${py-8}" text-anchor="middle" style="font-size:11px;font-weight:700;fill:${s.color}">${(v||0).toFixed(2)}</text>`}`;});});
  return `<svg class="chart-svg" viewBox="0 0 ${size} ${size}" style="max-width:${size}px;margin:0 auto">${g}</svg>`;
}

/* ===== PAGE: Tổng quan ===== */

    ${kpi('Còn mức 1–2',lo,'cần cải thiện','',`status:low`)}

  h+=`<div class="sec"><h3>Xu hướng điểm chất lượng chung 2022–${y}</h3><span class="hint">năm 2026 theo đợt đang chọn · QĐ 6858</span></div><div class="card pad">${lineChart([{name:'Điểm CL chung',color:'#2a78d6',vals:YEARS.map(yy=>(yy===CURRENT_YEAR?qualityScore(PS()):qualityScore(''+yy))||null)}],YEARS)}</div>`;
  const ps=partStats(cps);

  h+=`<div class="grid k2">
    <div><div class="sec"><h3>Biểu đồ nhện theo phần (${y})</h3><span class="hint">nhấp để xem</span></div>

    <div><div class="sec"><h3>Điểm TB theo phần</h3></div><div class="card pad">${barChart(ps.map(p=>({label:p.L,v:p.avg,color:p.color,full:'Phần '+p.L+' · '+p.name,link:'part:'+p.L})))}</div>

function chapterBars(y){const map={};CRIT.forEach(c=>{const cc=chapCode(c.chapter);if(!cc)return;(map[cc]=map[cc]||{items:[],name:c.chapter,part:partLetter(c.part)}).items.push(c);});

  const data=order.map(cc=>{const avg=avgOf(map[cc].items,y);const pi=PARTS.findIndex(p=>p.L===map[cc].part);return{label:cc,v:avg,color:PARTS[pi]?.color||'#2a78d6',full:map[cc].name,link:'chap:'+cc};});
  return barChart(data,{w:Math.max(760,data.length*46),h:280});}

function pageDG(){

function filteredCrit(){const q=(tcFilter.q||'').toLowerCase().trim();
  return CRIT.filter(c=>{if(tcFilter.part&&partLetter(c.part)!==tcFilter.part)return false;
    if(q){const inC=(c.ma+' '+c.ten).toLowerCase().includes(q);const inS=SUBS.some(s=>s.ma===c.ma&&((s.noidung||'')+(s.giaiphap||'')+(s.nguyennhan||'')).toLowerCase().includes(q));if(!inC&&!inS)return false;}
    const v=critScore(c,PS());
    if(tcFilter.status==='low'&&!(v<=2&&v!=null))return false;
    if(tcFilter.status==='mid'&&v!==3)return false;
    if(tcFilter.status==='high'&&!(v>=4))return false;
    if(tcFilter.status==='dbl'&&!isDouble(c))return false;return true;});}
function statusTag(c){const t=(c.trangthai||'Áp dụng').trim();if(t==='Áp dụng')return '';
  if(/bãi bỏ/i.test(t))return ' <span class="tag" style="background:rgba(22,163,74,.15);color:var(--good);border-color:transparent">Bộ Y tế bãi bỏ</span>';
  return ' <span class="tag" style="background:rgba(220,38,38,.12);color:var(--crit);border-color:transparent">Không áp dụng</span>';}
function buildTree(){
  const rows=filteredCrit();$('#count').textContent=rows.length+' tiêu chí';
  const q=(tcFilter.q||'').trim(),forceOpen=!!(q||tcFilter.status);
  const parts={};rows.forEach(c=>{const pl=partLetter(c.part),cc=chapCode(c.chapter);(parts[pl]=parts[pl]||{chaps:{}});(parts[pl].chaps[cc]=parts[pl].chaps[cc]||{name:c.chapter,items:[]}).items.push(c);});
  const sc=(v,cur)=>`<span class="score ${scClass(v)}" title="${v==null?'chưa ĐG':'Mức '+v}">${v??'–'}</span>`;
  let html='';
  PARTS.forEach(P=>{const pd=parts[P.L];if(!pd)return;const list=Object.values(pd.chaps).flatMap(ch=>ch.items);const pavg=avgOf(list,PS());
    const pkey='P:'+P.L,pOpen=forceOpen||expanded.has(pkey);
    html+=`<div class="node lvl-part ${pOpen?'open':''}"><div class="nhead" data-key="${pkey}" style="border-left:5px solid ${P.color};border-radius:10px"><span class="chev">▸</span><span class="ntitle">Phần ${P.L} · ${esc(P.name)}</span><span class="nmeta"><span class="tag">${list.length} TC</span><span class="score ${scClass(Math.round(pavg)||0)}">TB ${pavg.toFixed(2)}</span></span></div><div class="nbody">`;
    Object.keys(pd.chaps).sort((a,b)=>(+a.slice(1))-(+b.slice(1))).forEach(cc=>{const ch=pd.chaps[cc],cavg=avgOf(ch.items,PS()),ckey='C:'+cc,cOpen=forceOpen||expanded.has(ckey);
      html+=`<div class="node lvl-chap ${cOpen?'open':''}"><div class="nhead" data-key="${ckey}"><span class="chev">▸</span><span class="ntitle">${esc(ch.name)}</span><span class="nmeta"><span class="tag">${ch.items.length}</span><span class="score ${scClass(Math.round(cavg)||0)}">${cavg.toFixed(2)}</span></span></div><div class="nbody">`;
      ch.items.forEach(c=>{const subs=SUBS.filter(s=>s.ma===c.ma);const subMatch=q&&subs.some(s=>((s.noidung||'')+(s.giaiphap||'')+(s.nguyennhan||'')).toLowerCase().includes(q.toLowerCase()));
        const tkey='T:'+c.ma,tOpen=expanded.has(tkey)||subMatch;const meta=critMeta(c,PS());
        html+=`<div class="node crit ${tOpen?'open':''}"><div class="nhead lvl-crit" ${subs.length?`data-key="${tkey}"`:'data-nosub="1"'}><span class="chev">${subs.length?'▸':'·'}</span><span class="cma">${esc(c.ma)}${isDouble(c)&&isApplied(c)?' <span class="tag dbl">×2</span>':''}${statusTag(c)}</span><span class="ctext">${esc(c.ten)}${meta?`<div class="evstamp">ĐG: ${esc(meta.u||'—')} · ${esc(meta.t||'')}${meta.auto?' · tự tính':''}</div>`:''}</span><span class="nmeta yrs">${YEARS.map(y=>sc(yearScore(c,y),y===curYear)).join('')}<select class="inl scoreSel" data-ma="${esc(c.ma)}" title="Chấm điểm ${curYear}">${['','1','2','3','4','5'].map(v=>`<option value="${v}" ${String(critScore(c,PS())??'')===v?'selected':''}>${v===''?'–':'M'+v}</option>`).join('')}</select><button class="inl mini" data-detail="${esc(c.ma)}" title="Chi tiết & người phụ trách">⤢</button></span></div>`;
        if(subs.length){const al=autoLevel(c.ma,PS());const ap=isApplied(c);
          html+=`<div class="nbody subwrap"><div class="autobox">${ap?`<b>Tự tính:</b> ${al.ok?`Mức ${al.level}`:'<span class="muted">chưa đủ đánh giá</span>'} ${al.ok?`<button class="inl btn-p" data-apply="${esc(c.ma)}" data-lvl="${al.level}">Áp dụng vào điểm ${curYear}</button>`:''}`:'<span class="muted">Tiêu chí không áp dụng — không tính vào điểm chung.</span>'}</div>`;
          const bym={};subs.forEach(s=>{(bym[s.muc]=bym[s.muc]||[]).push(s);});
          MUCS.forEach(mk=>{if(!bym[mk])return;const isM1=mk==='Mức 1';const ok=bym[mk].filter(s=>subKQ(s,PS())==='Đạt').length;
            html+=`<div class="muchead">${mk} · <span class="tag">${ok}/${bym[mk].length} ${isM1?'không mắc lỗi':'có minh chứng'}</span></div>`;
            bym[mk].forEach(s=>{const cur=subKQ(s,PS())||'';const m=subMeta(s,PS());const lk=subLink(s,PS());
              html+=`<div class="subrow"><div class="sctext">${esc(s.noidung)}${(s.nguyennhan||s.giaiphap||s.han)?`<div class="submeta"><span class="muted">Nguyên nhân:</span> ${esc(s.nguyennhan)||'—'} · <span class="muted">Giải pháp:</span> ${esc(s.giaiphap)||'—'}${s.han?` · <span class="muted">Hạn:</span> ${esc(s.han)}`:''}</div>`:''}${lk?`<div class="submeta">🔗 <a href="${esc(lk)}" target="_blank" rel="noopener">Minh chứng</a></div>`:''}${m?`<div class="evstamp">✔ ${esc(m.u||'')} · ${esc(m.t||'')}</div>`:''}</div>
                <div class="evctrl"><div class="mc-toggle" data-id="${esc(s.id)}"><button class="mcY ${cur==='Đạt'?'yes':''}" data-v="Đạt">${isM1?'Không mắc lỗi':'Có minh chứng'}</button><button class="mcN ${cur==='Không đạt'?'no':''}" data-v="Không đạt">${isM1?'Có mắc lỗi':'Không'}</button></div>
                ${cur==='Đạt'?`<input class="inl mc-link" data-id="${esc(s.id)}" placeholder="🔗 Dán link minh chứng (Drive)" value="${esc(lk)}">`:''}
                ${cur==='Không đạt'?`<input class="inl mc-note" data-id="${esc(s.id)}" placeholder="✍ Vì sao không đạt?" value="${esc(subNote(s,curYear))}">`:''}</div></div>`;});
          });
          html+=`</div>`;}
        html+=`</div>`;});
      html+=`</div></div>`;});
    html+=`</div></div>`;});
  $('#tree').innerHTML=html||`<div class="card pad muted">Không có tiêu chí phù hợp.</div>`;
  $$('#tree .nhead').forEach(h=>h.onclick=e=>{if(e.target.closest('select')||e.target.closest('button'))return;if(h.dataset.nosub)return;const k=h.dataset.key;expanded.has(k)?expanded.delete(k):expanded.add(k);buildTree();});
  $$('#tree .scoreSel').forEach(sel=>sel.onchange=e=>{e.stopPropagation();const c=CRIT.find(x=>x.ma===sel.dataset.ma);setCritScore(c,PS(),sel.value===''?null:+sel.value,false);logEval('Tiêu chí',c.ma,sel.value);save();buildTree();});

    // auto-apply level
    const al=autoLevel(s.ma,PS());if(al.ok){const c=CRIT.find(x=>x.ma===s.ma);setCritScore(c,PS(),al.level,true);}

  $$('#tree .mc-link').forEach(inp=>{inp.onclick=e=>e.stopPropagation();inp.onchange=e=>{e.stopPropagation();const s=SUBS.find(x=>x.id===inp.dataset.id);setSubLink(s,PS(),inp.value);logEval('Minh chứng',s.ma+'/'+s.tm,inp.value?'(có link)':'(bỏ link)');save();buildTree();};});
  $$('#tree .mc-note').forEach(inp=>{inp.onclick=e=>e.stopPropagation();inp.onchange=e=>{e.stopPropagation();const s=SUBS.find(x=>x.id===inp.dataset.id);setSubNote(s,PS(),inp.value);logEval('Lý do',s.ma+'/'+s.tm,inp.value);save();buildTree();};});
  $$('#tree [data-apply]').forEach(b=>b.onclick=e=>{e.stopPropagation();const c=CRIT.find(x=>x.ma===b.dataset.apply);setCritScore(c,PS(),+b.dataset.lvl,true);logEval('Tiêu chí',c.ma,'Mức '+b.dataset.lvl+' (tự tính)');save();buildTree();});
  $$('#tree [data-detail]').forEach(b=>b.onclick=e=>{e.stopPropagation();openCrit(b.dataset.detail);});
}

/* ===== log ===== */
function logEval(type,key,value){LOG.unshift({type,key,value,nam:periodLabel(),user:USER?USER.ten:'',time:nowStr(),iso:nowISO()});if(LOG.length>2000)LOG.pop();}

/* ===== PAGE: Cải tiến ===== */
let ciFilter='open';
function quickWins(ps){
  const byMa={};SUBS.forEach(s=>{(byMa[s.ma]=byMa[s.ma]||[]).push(s);});
  const res=[];
  Object.keys(byMa).forEach(ma=>{const subs=byMa[ma];const byL={1:[],2:[],3:[],4:[],5:[]};
    subs.forEach(s=>{const L=mucNum(s.muc);if(byL[L])byL[L].push(s);});
    let cur=0;for(let L=1;L<=5;L++){const it=byL[L];if(!it.length)continue;if(it.every(s=>subKQ(s,ps)==='Đạt'))cur=L;else break;}
    let tgt=null;for(let L=cur+1;L<=5;L++){if(byL[L].length){tgt=L;break;}}
    if(!tgt)return;
    const missing=byL[tgt].filter(s=>subKQ(s,ps)!=='Đạt');
    if(missing.length>=1&&missing.length<=2){const c=CRIT.find(x=>x.ma===ma);res.push({ma,ten:c?c.ten:'',cur,tgt,missing});}
  });
  return res.sort((a,b)=>a.missing.length-b.missing.length);
}
function pageCI(){
  const qw=quickWins(PS());

  if(qw.length){qwHtml=`<div class="sec" style="margin-top:0"><h3>💡 Gợi ý cải tiến — tiêu chí dễ nâng mức</h3><span class="hint">${qw.length} tiêu chí chỉ cần bổ sung 1–2 minh chứng</span></div><div class="grid k2" style="margin-bottom:8px">`+
    qw.map(w=>`<div class="card pad" style="border-left:4px solid var(--good)"><div style="display:flex;align-items:center;gap:10px"><span class="cma clik" data-detail="${esc(w.ma)}">${esc(w.ma)}</span><span class="score ${scClass(w.cur)}">M${w.cur}</span><span>→</span><span class="score ${scClass(w.tgt)}">M${w.tgt}</span><span style="margin-left:auto" class="tag" style="background:rgba(22,163,74,.12)">Thiếu ${w.missing.length}</span></div>
      <div style="font-size:13px;margin:6px 0;color:var(--ink-2)">${esc(w.ten)}</div>
      <div class="fl">Cần bổ sung minh chứng cho:</div>${w.missing.map(s=>`<div class="submeta">• ${esc(s.noidung)}${s.giaiphap?` <span class="muted">(GP: ${esc(s.giaiphap)})</span>`:''}</div>`).join('')}
      <button class="inl btn-p clik" data-detail="${esc(w.ma)}" style="margin-top:8px">Mở tiêu chí</button></div>`).join('')+`</div>`;
  }
  return qwHtml+`<div class="notice">Các <b>tiểu mục chưa đạt</b> (không có minh chứng) kèm lý do, nguyên nhân, giải pháp, hạn — theo dõi tồn đọng và cải tiến.</div>
  <div class="tbar"><select id="cifilter"><option value="open">Chưa đạt (cần khắc phục)</option><option value="all">Tất cả tiểu mục</option></select><input type="search" id="ciq" placeholder="Tìm…"><span class="muted" id="cicount"></span></div><div id="cilist" class="grid" style="gap:12px"></div>`;}
function paintCI(){const q=($('#ciq').value||'').toLowerCase();let rows=SUBS.slice();
  if(ciFilter==='open')rows=rows.filter(s=>(subKQ(s,PS())||s.dg2025||s.dg2024||'').toLowerCase().includes('không'));
  if(q)rows=rows.filter(s=>((s.noidung||'')+(s.giaiphap||'')+(s.nguyennhan||'')+(s.ma||'')).toLowerCase().includes(q));
  $('#cicount').textContent=rows.length+' tiểu mục';

      <div class="field"><div class="fl">CB phụ trách chính</div>${selPeople(c.cb_chinh,'edCbC')}</div>
      <div class="field"><div class="fl">Đơn vị phối hợp</div>${selUnit(c.donvi_ph,'edDvP')}</div>
      <div class="field"><div class="fl">CB phối hợp</div>${selPeople(c.cb_ph,'edCbP')}</div>
    </div>
    <button class="btn-p" id="edSaveAssign">💾 Lưu người phụ trách</button>
    <span id="assignMsg" class="muted" style="margin-left:10px;font-size:13px"></span>`;
  if(subs.length){h+=`<div class="fl" style="margin:20px 0 8px">Tiểu mục (${subs.length}) — có minh chứng?</div>`;
    const bym={};subs.forEach(s=>{(bym[s.muc]=bym[s.muc]||[]).push(s);});
    MUCS.forEach(mk=>{if(!bym[mk])return;const isM1=mk==='Mức 1';h+=`<div class="muchead">${mk}${isM1?' · <span class="muted" style="text-transform:none;font-weight:400">(âm tính: mắc lỗi = không đạt)</span>':''}</div>`;bym[mk].forEach(s=>{const cur=subKQ(s,PS())||'';const lk=subLink(s,PS());h+=`<div class="sub-card"><div style="font-weight:600">${esc(s.tm)}. ${esc(s.noidung)}</div>${s.minhchung?`<div class="submeta" style="margin-top:6px"><span class="muted">Yêu cầu minh chứng:</span> ${esc(s.minhchung)}</div>`:''}<div class="mc-toggle" style="margin-top:8px;max-width:300px" data-id="${esc(s.id)}"><button class="${cur==='Đạt'?'yes':''}" data-v="Đạt">${isM1?'Không mắc lỗi':'Có minh chứng'}</button><button class="${cur==='Không đạt'?'no':''}" data-v="Không đạt">${isM1?'Có mắc lỗi':'Không'}</button></div>${cur==='Đạt'?`<div class="field" style="margin-top:8px;margin-bottom:0"><div class="fl">🔗 Link minh chứng (Drive)</div><input class="mc-link" data-id="${esc(s.id)}" placeholder="Dán link Google Drive…" value="${esc(lk)}">${lk?` <a href="${esc(lk)}" target="_blank" rel="noopener" style="font-size:12px">Mở</a>`:''}</div>`:''}${cur==='Không đạt'?`<div class="field" style="margin-top:8px;margin-bottom:0"><div class="fl">✍ Vì sao không đạt?</div><input class="mc-note" data-id="${esc(s.id)}" placeholder="Ghi lý do chưa đạt…" value="${esc(subNote(s,PS()))}"></div>`:''}</div>`;});});
  }else h+=`<div class="notice" style="margin-top:16px">Tiêu chí này chưa có tiểu mục chi tiết. Có thể chấm điểm trực tiếp ở trên.</div>`;
  h+=`</div>`;
  $('#drawer').innerHTML=h;
  $('#edScore').onchange=e=>{setCritScore(c,PS(),e.target.value===''?null:+e.target.value,false);logEval('Tiêu chí',c.ma,e.target.value);save();buildIfDG();};
  $('#edDbl').onchange=e=>{c.double=e.target.checked;save();buildIfDG();};
  $('#edApply')&&($('#edApply').onclick=()=>{setCritScore(c,PS(),al.level,true);logEval('Tiêu chí',c.ma,'Mức '+al.level+' (tự tính)');save();openCrit(ma);buildIfDG();});
  $('#edSaveAssign').onclick=()=>{c.bgd=$('#edBgd').value;c.qlcl=$('#edQlcl').value;c.donvi_chinh=$('#edDvC').value;c.cb_chinh=$('#edCbC').value;c.donvi_ph=$('#edDvP').value;c.cb_ph=$('#edCbP').value;logEval('Phân công',c.ma,c.donvi_chinh+' / '+c.cb_chinh);save();$('#assignMsg').textContent='✔ Đã lưu lúc '+nowStr();buildIfDG();};
  $$('#drawer .mc-toggle button').forEach(b=>b.onclick=()=>{const s=SUBS.find(x=>x.id===b.parentElement.dataset.id);const val=b.dataset.v;const cur=subKQ(s,PS());setSubKQ(s,PS(),cur===val?'':val);logEval('Tiểu mục',s.ma+'/'+s.tm,subKQ(s,PS())||'(bỏ)');const a2=autoLevel(s.ma,PS());if(a2.ok)setCritScore(c,PS(),a2.level,true);save();openCrit(ma);buildIfDG();});
  $$('#drawer .mc-link').forEach(inp=>inp.onchange=()=>{const s=SUBS.find(x=>x.id===inp.dataset.id);setSubLink(s,PS(),inp.value);logEval('Minh chứng',s.ma+'/'+s.tm,inp.value?'(có link)':'(bỏ link)');save();openCrit(ma);buildIfDG();});
  $$('#drawer .mc-note').forEach(inp=>inp.onchange=()=>{const s=SUBS.find(x=>x.id===inp.dataset.id);setSubNote(s,PS(),inp.value);logEval('Lý do',s.ma+'/'+s.tm,inp.value);save();openCrit(ma);buildIfDG();});
  $('#overlay').classList.add('on');$('#drawer').classList.add('on');}
function buildIfDG(){if(curNav==='dg')buildTree();}
function closeDrawer(){$('#overlay').classList.remove('on');$('#drawer').classList.remove('on');}

/* ===== Router ===== */
function render(){renderNav();renderYear();updateSyncTag();$('#pageTitle').textContent=NAVTITLE[curNav];const m=$('#main');
  if(curNav==='tq'){m.innerHTML=pageTQ();$$('#main [data-nav]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();goNav(el.getAttribute('data-nav'));}));}
  else if(curNav==='dg'){m.innerHTML=pageDG();wireDG();}
  else if(curNav==='ci'){m.innerHTML=pageCI();wireCI();}
  else if(curNav==='pc'){m.innerHTML=pagePC();wirePC();}
  else if(curNav==='ns'){m.innerHTML=pageNS();wireNS();}
  else if(curNav==='bc'){m.innerHTML=pageBC();$$('#main [data-detail]').forEach(b=>b.onclick=()=>openCrit(b.dataset.detail));}
  else if(curNav==='nk'){m.innerHTML=pageNK();}
  else if(curNav==='cd'){m.innerHTML=pageCD();wireCD();}
}

/* ===== Auth ===== */
const DEFAULT_USER='Nguyễn Thị Thanh';
const getPin=id=>(CFG.pins&&CFG.pins[String(id)])||'1234';
function fillLoginUsers(){const byK={};STAFF.forEach(s=>{(byK[s.khoa]=byK[s.khoa]||[]).push(s);});
  $('#loginUser').innerHTML=Object.keys(byK).map(k=>`<optgroup label="${esc(k)}">${byK[k].map(s=>`<option value="${esc(s.id)}">${esc(s.ten)}</option>`).join('')}</optgroup>`).join('');
  const def=STAFF.find(s=>s.ten===DEFAULT_USER);if(def)$('#loginUser').value=String(def.id);}
function doLogin(){const id=$('#loginUser').value;const u=STAFF.find(s=>String(s.id)===String(id));if(!u){alert('Chọn cán bộ');return;}
  const pin=$('#loginPin').value||'1234';
  if(pin!==getPin(id)){alert('Sai mã PIN (mặc định 1234). Có thể đổi PIN trong mục Cài đặt sau khi đăng nhập.');return;}
  USER={id:u.id,ten:u.ten,khoa:u.khoa};
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#whoName').textContent=u.ten;$('#footUser').textContent=u.ten+' · '+u.khoa;$('#avatar').textContent=(u.ten.split(' ').pop()||'?')[0];
  render();}
$('#loginBtn').onclick=doLogin;
$('#loginPin').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('#logoutBtn')&&($('#logoutBtn').onclick=()=>{USER=null;$('#app').classList.add('hidden');$('#login').classList.remove('hidden');});
$('#menuBtn')&&($('#menuBtn').onclick=()=>$('#side').classList.toggle('open'));
$('#themeBtn').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';};
$('#overlay').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

/* ===== Init ===== */
loadLocal();
fillLoginUsers();
$('#loginMode').textContent=CFG.appsUrl?'Đã kết nối Google Sheet':'Chế độ thử · PIN mặc định 1234';
</script>
</body>
</html>
